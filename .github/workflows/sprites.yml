name: Sprites

# Mette nel sito le immagini dei Pokémon della lega (docs/sprites/): si scaricano da Showdown una volta sola e poi arrivano dal sito, veloci.
# Ogni giorno (così i Pokémon nuovi arrivano da soli) e a mano (Actions > Sprites > Run workflow).
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install firebase-admin pokemon-showdown --no-save

      # Il motore dei replay (script e stili di Showdown) dentro il sito: subito e a parte, perché è veloce e serve più delle immagini
      - name: Scarica il motore dei replay
        run: node tools/sprites/motore.cjs

      - name: Salva il motore nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/motore-replay
          if git diff --cached --quiet; then echo "Niente di nuovo"; else
            git commit -m "Motore dei replay: file di Showdown aggiornati"
            for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && break; sleep $((i * 3)); done
          fi

      - name: Scarica le immagini che mancano
        run: node tools/sprites/scarica.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Il download può durare quasi venti minuti e nel frattempo il ramo si muove: prima di spingere si riparte dall'ultima versione (senza, il push veniva rifiutato e si perdeva tutto)
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sprites
          if git diff --cached --quiet; then echo "Niente di nuovo"; else
            git commit -m "Sprites: immagini dei Pokémon nuovi"
            for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && break; sleep $((i * 3)); done
            git diff --quiet origin/"$GITHUB_REF_NAME" HEAD -- docs/sprites || { echo "Push non riuscito"; exit 1; }
          fi

name: Sonda sprite (temporanea)

# Prova una tantum, da togliere subito: le GIF "showdown" di PokeAPI per le forme Mega esistono davvero (e si possono leggere dal browser)?
on:
  push:
    branches: [claude/affectionate-brown-t474uz]
    paths: [.github/workflows/sonda-sprite.yml]

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: GIF di PokeAPI per le Mega
        run: |
          python3 - <<'EOF'
          import json, struct, urllib.request
          def get(url, origin=True):
              req = urllib.request.Request(url, headers={'Origin': 'https://didi722.github.io', 'User-Agent': 'sonda'})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, dict(r.headers), r.read()
              except Exception as e:
                  return getattr(e, 'code', str(e)), {}, b''
          nomi = ['froslass-mega', 'clefable-mega', 'starmie-mega', 'meganium-mega', 'feraligatr-mega', 'emboar-mega', 'chandelure-mega', 'greninja-mega', 'dragalge-mega', 'scrafty-mega', 'falinks-mega', 'floette-mega', 'venusaur-mega', 'charizard-mega-x', 'gardevoir-mega', 'rayquaza-mega', 'lucario-mega', 'garchomp-mega']
          for n in nomi:
              st, h, b = get('https://pokeapi.co/api/v2/pokemon/' + n)
              if st != 200:
                  print(n, 'PokeAPI', st); continue
              j = json.loads(b)
              s = j['sprites']['other']['showdown']
              url = s.get('front_default')
              if not url:
                  print(n, 'altezza', j['height'], 'senza GIF showdown'); continue
              st2, h2, b2 = get(url)
              dim = struct.unpack('<HH', b2[6:10]) if b2[:3] == b'GIF' else None
              print(n, 'altezza', j['height'], url.split('/')[-1], 'raw:', st2, 'tipo', h2.get('Content-Type'), 'CORS', h2.get('Access-Control-Allow-Origin'), 'GIF', dim, len(b2), 'byte')
          EOF

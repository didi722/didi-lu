// Funzione per aprire/chiudere il modale
function toggleLoginModal() {
    const modal = document.getElementById('login-modal');
    modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
}

function handleAuthClick() {
    const user = auth.currentUser;
    if (!user) {
        toggleLoginModal();
    } else {
        const menu = document.getElementById('user-menu');
        const overlay = document.getElementById('menu-overlay');
        
        if (menu) {
            if (menu.style.display === 'block') {
                // Se è aperto, lo chiudiamo e togliamo il blur
                menu.style.display = 'none';
                if (overlay) {
                    overlay.classList.remove('active');
                    overlay.style.display = 'none';
                }
                console.log("Stato: Menu chiuso al click su auth-content");
            } else {
                // Se è chiuso, lo apriamo e attiviamo il blur dello schermo
                menu.style.display = 'block';
                if (overlay) {
                    overlay.style.display = 'block';
                    // Il piccolo timeout garantisce che la transizione CSS dell'opacity funzioni fluidamente
                    setTimeout(() => overlay.classList.add('active'), 10);
                }
                console.log("Stato: Menu aperto e schermo sfocato");
            }
        }
    }
}

function chiudiMenuConOverlay() {
    const menu = document.getElementById('user-menu');
    const overlay = document.getElementById('menu-overlay');
    
    if (menu) menu.style.display = 'none';
    
    if (overlay) {
        overlay.classList.remove('active');
        overlay.style.display = 'none';
    }
    console.log("Stato: Menu chiuso via overlay");
}

// Listener globale per i click esterni aggiornato
document.addEventListener('click', function(event) {
    const menu = document.getElementById('user-menu');
    const authBtn = document.getElementById('auth-content');

    // Se il menu è visibile (controllo basato su 'block')
    if (menu && menu.style.display === 'block') {
        // Se l'utente clicca fuori dal menu e fuori dal pulsante di login
        if (!menu.contains(event.target) && !authBtn.contains(event.target)) {
            chiudiMenuConOverlay();
        }
    }
});

function apriCreazioneFormato() {
    const modal = document.getElementById('format-modal');
    const closeBtn = document.getElementById('close-format-modal');
    const container = document.getElementById('dynamic-rules-container');

    if (!modal) return;

    const fName = document.getElementById('format-name');
    const fDesc = document.getElementById('format-desc');
    const fType = document.getElementById('format-type');
    
    if (fName) fName.value = "";
    if (fDesc) fDesc.value = "";
    if (fType) fType.value = "";
    
    const vgcGen = document.getElementById('vgc-gen');
    const vgcFormat = document.getElementById('vgc-format');
    if (vgcGen) vgcGen.selectedIndex = 0;
    if (vgcFormat) vgcFormat.selectedIndex = 0;

    const mStyle = document.getElementById('mandatory-battle-style');
    const mGenType = document.getElementById('mandatory-gen-type');
    const mGenVal = document.getElementById('mandatory-gen-value');
    const mTier = document.getElementById('mandatory-tier');
    
    if (mStyle) mStyle.selectedIndex = 0;
    if (mGenType) mGenType.selectedIndex = 0;
    if (mGenVal) mGenVal.selectedIndex = 0;
    if (mTier) mTier.selectedIndex = 0;

    const secVgc = document.getElementById('section-official-vgc');
    const secCustom = document.getElementById('section-custom-rules');
    if (secVgc) secVgc.style.display = 'none';
    if (secCustom) secCustom.style.display = 'none';

    if (container) container.innerHTML = ""; 

    // NASCONDI IL RIEPILOGO DEGLI ERRORI AL RESET DEL FORM
    const boxErrore = document.getElementById('rules-error-summary');
    if (boxErrore) boxErrore.style.display = 'none';

    modal.style.setProperty('display', 'flex', 'important');

    if (closeBtn) {
        closeBtn.onclick = () => modal.style.setProperty('display', 'none', 'important');
    }
    modal.onclick = (e) => { 
        if (e.target === modal) modal.style.setProperty('display', 'none', 'important'); 
    };
}

                left: 55%; /* Compensa il translateX(-55%) per apparire al centro del badge */

                border-style: solid;
                border-color: #000000 transparent transparent transparent;
            }
            #clause-badge:hover .nb-badge-tooltip {

    }
}
        
        if (containerRegole && containerRegole.children.length === 0) {
            aggiungiRigaRegola();
        }
    }
}

let ruleCounter = 0;

function aggiungiRigaRegola() {
    ruleCounter++;
    const container = document.getElementById('dynamic-rules-container');
    if (!container) return;
    
    // Aggancia l'ascolto degli input globali sul container se non è ancora stato fatto
    if (!container.dataset.listenerActive) {
        container.addEventListener('input', eseguiControlloConflitti);
        container.addEventListener('change', eseguiControlloConflitti);
        container.dataset.listenerActive = "true";
    }
    
    const row = document.createElement('div');
    row.className = 'format-rule-row';
    row.id = `rule-row-${ruleCounter}`;
    
    let categoryOptions = `<option value="">-- Choose category --</option>`;
    Object.keys(MAPPA_DEFINIZIONE_REGOLE).forEach(cat => {
        categoryOptions += `<option value="${cat}">${MAPPA_DEFINIZIONE_REGOLE[cat].label}</option>`;
    });

    row.innerHTML = `
        <select class="select-category" onchange="aggiornaCampiRegola(${ruleCounter}, this.value); eseguiControlloConflitti();">
            ${categoryOptions}
        </select>
        <div id="field-container-${ruleCounter}" class="inline-container"></div>
        <div id="value-container-${ruleCounter}" class="inline-container"></div>        
        <div id="operator-container-${ruleCounter}" class="inline-container"></div>
        <button type="button" class="btn-remove-rule" onclick="rimuoviRigaRegola(${ruleCounter})">&times;</button>
    `;
    
    container.appendChild(row);
    eseguiControlloConflitti(); // Esegui al volo
}

function rimuoviRigaRegola(id) {
    const row = document.getElementById(`rule-row-${id}`);
    if (row) {
        row.remove();
        eseguiControlloConflitti(); // Ricalcola i conflitti non appena una riga scompare
    }
}

function aggiornaCampiRegola(id, categoria) {
    const fieldContainer = document.getElementById(`field-container-${id}`);
    const operatorContainer = document.getElementById(`operator-container-${id}`);
    const valueContainer = document.getElementById(`value-container-${id}`);
    
    if (!fieldContainer || !operatorContainer || !valueContainer) return;

    fieldContainer.innerHTML = "";
    operatorContainer.innerHTML = "";
    valueContainer.innerHTML = "";

    if (!categoria || !MAPPA_DEFINIZIONE_REGOLE[categoria]) return;

    const fields = MAPPA_DEFINIZIONE_REGOLE[categoria].fields;
    let fieldOptions = `<option value="">-- Choose Restriction --</option>`;
    Object.keys(fields).forEach(fKey => {
        fieldOptions += `<option value="${fKey}">${fields[fKey].label}</option>`;
    });

    fieldContainer.innerHTML = `
        <select class="select-field" onchange="aggiornaInputValore(${id}, '${categoria}', this.value)">
            ${fieldOptions}
        </select>
    `;
}




function aggiornaInputValore(id, categoria, campo) {
    const operatorContainer = document.getElementById(`operator-container-${id}`);
    const valueContainer = document.getElementById(`value-container-${id}`);
    
    if (!operatorContainer || !valueContainer) return;
    
    // 1. RIPRISTINA L'ORDINE STANDARD DI DEFAULT SU OGNI CAMBIO
    operatorContainer.innerHTML = "";
    valueContainer.innerHTML = "";
    operatorContainer.style.order = "";
    valueContainer.style.order = "";

    if (!campo) {
        if (typeof eseguiControlloConflitti === "function") eseguiControlloConflitti();
        return;
    }

    const infoCampo = MAPPA_DEFINIZIONE_REGOLE[categoria].fields[campo];
    
    // 2. GENERAZIONE DELL'OPERATORE
    let opHtml = "";
    if (infoCampo.operators || infoCampo.type === "number" || infoCampo.type === "tier") {
        let ops = infoCampo.operators ? [...infoCampo.operators] : ["equals"];
        
        if ((infoCampo.type === "number" || infoCampo.type === "tier") && !ops.includes("between")) {
            ops.push("between");
        }
        
        let opOptions = "";
        ops.forEach(op => {
            let labelOp = op === "lt" ? "<" : 
                          op === "gt" ? ">" : 
                          op === "lte" ? "≤" : 
                          op === "gte" ? "≥" : 
                          op === "between" ? "Between" : "=";
            opOptions += `<option value="${op}">${labelOp}</option>`;
        });
        opHtml = `<select class="select-operator" id="operator-${id}" onchange="renderizzaInputNumerici(${id}, '${categoria}', '${campo}'); eseguiControlloConflitti();">${opOptions}</select>`;
    } else {
        opHtml = `<input type="hidden" class="select-operator" id="operator-${id}" value="equals">`;
    }
    operatorContainer.innerHTML = opHtml;

    // 3. LOGICA DI RENDERING UNIFICATA PER TIPO DI DATO
    if (infoCampo.type === "select") {
        // MENU A TENDINA (Tipi, Categorie Mosse, Sagome, Nature...)
        let selectOptions = `<option value="">-- Choose --</option>`;
        
        // CONTROLLO ESCLUSIONE "SAME": Non iniettiamo l'opzione se stiamo gestendo Leggendari o Misteriosi
        if (campo !== "is_legendary" && campo !== "is_mythical") {
            selectOptions += `<option value="SAME_ACROSS_TEAM" style="font-weight: 900; color: #22c55e;">Same</option>`;
        }
        
        infoCampo.options.forEach(opt => {
            selectOptions += `<option value="${opt}">${opt}</option>`;
        });
        
        valueContainer.innerHTML = `
            <select class="input-value" onchange="controllaOperatorePerTeam(${id}, this.value); eseguiControlloConflitti();">
                ${selectOptions}
            </select>
        `;
    } 
    else if (infoCampo.type === "number" || infoCampo.type === "text_length" || infoCampo.type === "tier") {
        valueContainer.style.order = "3";     
        operatorContainer.style.order = "4";  
        
        valueContainer.innerHTML = `
            <select class="select-mode" style="width: 100%;" onchange="gestisciCambioModalitaInput(${id}, this.value); eseguiControlloConflitti();">
                <option value="SPECIFIC">Is...</option>
                <option value="SAME_ACROSS_TEAM" style="font-weight: 900; color: #22c55e;">Same</option>
            </select>
        `;

        operatorContainer.insertAdjacentHTML('beforeend', `
            <span id="custom-field-box-${id}" style="display: inline-block;"></span>
        `);
        
        renderizzaInputNumerici(id, categoria, campo);
    } 
    else if (infoCampo.type === "boolean") {
        const labelVero = (categoria === "strumenti") ? "ONLY" : "YES";
        const labelFalso = "NO";

        valueContainer.innerHTML = `
            <select class="input-value" onchange="eseguiControlloConflitti();">
                <option value="true" style="font-weight: bold; color: #22c55e;">${labelVero}</option>
                <option value="false" style="font-weight: bold; color: #ef4444;">${labelFalso}</option>
            </select>
        `;
    }

    if (typeof eseguiControlloConflitti === "function") eseguiControlloConflitti();
}

function renderizzaInputNumerici(id, categoria, campo) {
    const infoCampo = MAPPA_DEFINIZIONE_REGOLE[categoria].fields[campo];
    const operatorSelect = document.getElementById(`operator-${id}`);
    const operatore = operatorSelect ? operatorSelect.value : "equals";
    
    const targetContainer = document.getElementById(`custom-field-box-${id}`);
    if (!targetContainer) return;
    
    let html = "";
    
    // Genera le opzioni per la tier se necessario
    const tierOptionsHtml = (infoCampo.type === "tier") 
        ? infoCampo.options.map(t => `<option value="${t}">${t}</option>`).join('') 
        : "";

    if (operatore === "between") {
        if (infoCampo.type === "tier") {
            // Doppia tendina selettiva per il range di Tier (Es: da NU a OU)
            html = `
                <select class="input-value range-min" style="margin-left: 10px; max-width: 90px; border: 2px solid #000; font-weight: bold; padding: 2px 5px;">${tierOptionsHtml}</select>
                <span style="margin: 0 4px; font-weight: 900; font-family: inherit;">to</span>
                <select class="input-value range-max" style="max-width: 90px; border: 2px solid #000; font-weight: bold; padding: 2px 5px;">${tierOptionsHtml}</select>
            `;
        } else {
            html = `
                <input type="number" class="input-value range-min" placeholder="Min" style="margin-left: 10px; max-width: 75px; border: 2px solid #000; font-weight: bold; padding: 2px 5px;">
                <span style="margin: 0 4px; font-weight: 900; font-family: inherit;">to</span>
                <input type="number" class="input-value range-max" placeholder="Max" style="max-width: 75px; border: 2px solid #000; font-weight: bold; padding: 2px 5px;">
            `;
        }
    } else {
        if (infoCampo.type === "number") {
            html = `<input type="number" class="input-value" placeholder="Value" style="margin-left: 10px; max-width: 120px;">`;
        } else if (infoCampo.type === "text_length") {
            html = `<input type="text" class="input-value" maxlength="1" placeholder="Letter" style="margin-left: 10px; max-width: 80px;">`;
        } 
        else if (infoCampo.type === "tier") {
            // Singola tendina selettiva per operatori singoli (< OU, = UU)
            html = `<select class="input-value" style="margin-left: 10px; max-width: 120px; border: 2px solid #000; font-weight: bold; padding: 2px 5px;">${tierOptionsHtml}</select>`;
        }
    }
    
    targetContainer.innerHTML = html;
}

function gestisciCambioModalitaInput(id, modalita) {
    const customFieldBox = document.getElementById(`custom-field-box-${id}`);
    const operatorSelect = document.getElementById(`operator-${id}`);
    
    if (!customFieldBox) return;

    if (modalita === "SAME_ACROSS_TEAM") {
        customFieldBox.style.display = "none"; 
        if (operatorSelect) {
            operatorSelect.value = "equals"; // Forza su "="
            operatorSelect.style.opacity = "0.5";
            operatorSelect.style.pointerEvents = "none"; 
        }
    } else {
        customFieldBox.style.display = "inline-block"; // Mantieni inline-block coerente
        if (operatorSelect) {
            operatorSelect.style.opacity = "1";
            operatorSelect.style.pointerEvents = "auto"; 
        }
    }
}

function controllaOperatorePerTeam(id, valore) {
    const operatorSelect = document.getElementById(`operator-${id}`);
    if (!operatorSelect) return;

    if (valore === "SAME_ACROSS_TEAM") {
        operatorSelect.value = "equals";
        operatorSelect.style.opacity = "0.5";
        operatorSelect.style.pointerEvents = "none";
    } else {
        operatorSelect.style.opacity = "1";
        operatorSelect.style.pointerEvents = "auto";
    }
}

// Funzione per raccogliere lo stato attuale di tutte le regole inserite nel DOM
function raccogliDatiRegole() {
    const rows = document.querySelectorAll('.format-rule-row');
    const data = [];
    
    rows.forEach(row => {
        const id = row.id.replace('rule-row-', '');
        const catSelect = row.querySelector('.select-category');
        const fieldSelect = row.querySelector('.select-field');
        
        if (!catSelect || !fieldSelect || !catSelect.value || !fieldSelect.value) return;

        const category = catSelect.value;
        const field = fieldSelect.value;
        
        // Recupera in sicurezza la definizione del campo dalla mappa delle regole
        const info = MAPPA_DEFINIZIONE_REGOLE[category]?.fields?.[field];
        if (!info) return;
        
        const modeSelect = row.querySelector('.select-mode');
        const mode = modeSelect ? modeSelect.value : "SPECIFIC";
        
        const opSelect = row.querySelector('.select-operator');
        const operator = opSelect ? opSelect.value : "equals";
        
        let value = null;
        let min = null;
        let max = null;
        
        const valSelect = row.querySelector('.input-value:not(.range-min):not(.range-max)');
        const minInput = row.querySelector('.range-min');
        const maxInput = row.querySelector('.range-max');
        
        // LOGICA DI ESTRAZIONE E CONVERSIONE VALORI COMPATIBILE CON I NUOVI TIPI DI DATO
        if (operator === "between") {
            if (info.type === "tier") {
                // Converte le stringhe delle due tier nei rispettivi indici di peso numerico
                const ottieniPesoTier = (valoreTier) => info.options.indexOf(valoreTier);
                min = minInput && minInput.value !== "" ? ottieniPesoTier(minInput.value) : null;
                max = maxInput && maxInput.value !== "" ? ottieniPesoTier(maxInput.value) : null;
            } else {
                // Fallback classico per i numeri reali/interi (es: altezze, pesi, BST)
                min = minInput && minInput.value !== "" ? parseFloat(minInput.value) : null;
                max = maxInput && maxInput.value !== "" ? parseFloat(maxInput.value) : null;
            }
        } else if (valSelect) {
            if (info.type === "number") {
                value = valSelect.value !== "" ? parseFloat(valSelect.value) : null;
            } else if (info.type === "tier") {
                // Converte la singola tier selezionata nel suo indice di peso numerico
                value = valSelect.value !== "" ? info.options.indexOf(valSelect.value) : null;
            } else {
                // Gestisce stringhe, valori booleani e le nuove select ("nature", "is_legendary", "is_mythical")
                value = valSelect.value;
            }
        }
        
        data.push({ id, rowElement: row, category, field, mode, operator, value, min, max });
    });
    return data;
}

// Funzione matematica per verificare se due vincoli numerici creano un intervallo impossibile
function verificaConflittoNumerico(a, b) {
    let minA = -Infinity, maxA = Infinity;
    let incMinA = true, incMaxA = true;
    
    if (a.operator === "equals") { minA = a.value; maxA = a.value; }
    else if (a.operator === "lt") { maxA = a.value; incMaxA = false; }
    else if (a.operator === "lte") { maxA = a.value; incMaxA = true; }
    else if (a.operator === "gt") { minA = a.value; incMinA = false; }
    else if (a.operator === "gte") { minA = a.value; incMinA = true; }
    else if (a.operator === "between") { minA = a.min !== null ? a.min : -Infinity; maxA = a.max !== null ? a.max : Infinity; }

    let minB = -Infinity, maxB = Infinity;
    let incMinB = true, incMaxB = true;
    
    if (b.operator === "equals") { minB = b.value; maxB = b.value; }
    else if (b.operator === "lt") { maxB = b.value; incMaxB = false; }
    else if (b.operator === "lte") { maxB = b.value; incMaxB = true; }
    else if (b.operator === "gt") { minB = b.value; incMinB = false; }
    else if (b.operator === "gte") { minB = b.value; incMinB = true; }
    else if (b.operator === "between") { minB = b.min !== null ? b.min : -Infinity; maxB = b.max !== null ? b.max : Infinity; }

    if (minA === -Infinity && maxA === Infinity || minB === -Infinity && maxB === Infinity) return false;

    // Se i due intervalli non si intersecano, c'è un conflitto logico
    if (minA > maxB || minB > maxA) return true;
    if (minA === maxB && (!incMinA || !incMaxB)) return true;
    if (minB === maxA && (!incMinB || !incMaxA)) return true;
    
    return false;
}

// Funzione principale di validazione ed evidenziazione errori
function eseguiControlloConflitti() {
    const regole = raccogliDatiRegole();
    const IDConflitti = new Set();
    const messaggiErrore = [];

    // Ripristina lo stato grafico di default per tutte le righe prima del controllo
    regole.forEach(r => {
        r.rowElement.style.border = "";
        r.rowElement.style.background = "";
    });

    // 1. Controllo di coerenza interna alla singola riga (es. Between Min > Max)
    regole.forEach(r => {
        if (r.operator === "between" && r.min !== null && r.max !== null && r.min > r.max) {
            IDConflitti.add(r.id);
            messaggiErrore.push(`Rule #${r.id}: Il valore Minimo non può essere maggiore del Massimo.`);
        }
    });

    // 2. Controllo incrociato combinatorio tra coppie di righe
    for (let i = 0; i < regole.length; i++) {
        for (let j = i + 1; j < regole.length; j++) {
            const rA = regole[i];
            const rB = regole[j];

            if (rA.category !== rB.category) continue;

            const labelCategoria = MAPPA_DEFINIZIONE_REGOLE[rA.category].label;
            const infoCampo = MAPPA_DEFINIZIONE_REGOLE[rA.category].fields[rA.field];

            // CASO A: Conflitto sullo stesso campo (es. Altezza, Tier, ecc...)
            if (rA.field === rB.field) {
                if (rA.mode === "SPECIFIC" && rB.mode === "SPECIFIC") {
                    
                    // CORREZIONE TIER: Esteso il controllo geometrico-numerico anche al tipo "tier"
                    if (infoCampo.type === "number" || infoCampo.type === "tier") {
                        if (verificaConflittoNumerico(rA, rB)) {
                            IDConflitti.add(rA.id);
                            IDConflitti.add(rB.id);
                            messaggiErrore.push(`Contradiction in ${labelCategoria} (${infoCampo.label}): Conflict in numerical/ordered restrictions.`);
                        }
                    } else if (infoCampo.type === "select" || infoCampo.type === "boolean") {
                        if (rA.value !== null && rB.value !== null && rA.value !== rB.value) {
                            IDConflitti.add(rA.id);
                            IDConflitti.add(rB.id);
                            messaggiErrore.push(`Contradiction in ${labelCategoria} (${infoCampo.label}): Conflictual restrictions.`);
                        }
                    }
                }
            }
            
            // CASO B: Conflitto logico incrociato su campi diversi della stessa categoria
            
            // CORREZIONE LEGENDARY / MYTHICAL
            if (rA.category === "pokemon") {
                if (
                    (rA.field === "is_legendary" && rA.value === "Only Legendary" && rB.field === "is_mythical" && rB.value === "Only Mythical") ||
                    (rB.field === "is_legendary" && rB.value === "Only Legendary" && rA.field === "is_mythical" && rA.value === "Only Mythical")
                ) {
                    IDConflitti.add(rA.id);
                    IDConflitti.add(rB.id);
                    messaggiErrore.push("Conflict in Pokémon selection restrictions.");
                }
            }

            // Conflitto incrociato Strumenti (Invariato)
            if (rA.category === "strumenti") {
                if (
                    (rA.field === "is_berry" && rA.value === "true" && rB.field === "has_negative_effect" && rB.value === "true") ||
                    (rB.field === "is_berry" && rB.value === "true" && rA.field === "has_negative_effect" && rA.value === "true")
                ) {
                    IDConflitti.add(rA.id);
                    IDConflitti.add(rB.id);
                    messaggiErrore.push("Conflict in items selection restrictions.");
                }
            }
        }
    }

    // 3. Output grafico degli errori nel DOM
    let boxErrore = document.getElementById('rules-error-summary');
    if (!boxErrore) {
        boxErrore = document.createElement('div');
        boxErrore.id = 'rules-error-summary';
        boxErrore.style.cssText = "margin: 15px 0; padding: 10px; border: 3px solid #000; background: #fca5a5; font-weight: bold; font-family: inherit; display: none; box-shadow: 4px 4px 0px #000;";
        const container = document.getElementById('dynamic-rules-container');
        if (container) container.parentNode.insertBefore(boxErrore, container);
    }

    if (IDConflitti.size > 0) {
        // Applica lo stile di errore alle righe incriminate
        IDConflitti.forEach(id => {
            const rElement = document.getElementById(`rule-row-${id}`);
            if (rElement) {
                rElement.style.border = "3px solid #ef4444";
                rElement.style.background = "#fee2e2";
            }
        });

        // Mostra il riepilogo testuale degli errori riscontrati
        boxErrore.innerHTML = `<span style="text-transform: uppercase; color: #b91c1c; display:block; margin-bottom: 5px;">⚠️ Invalid:</span>` + 
                              [...new Set(messaggiErrore)].map(msg => `• ${msg}`).join('<br>');
        boxErrore.style.display = "block";
    } else {
        boxErrore.style.display = "none";
    }
}

// FUNZIONE PRINCIPALE DI SALVATAGGIO
async function salvaNuovoFormato() {
    // 1. ESEGUI IL CONTROLLO CONFLITTI PRIMA DI SALVARE
    eseguiControlloConflitti();
    const boxErrore = document.getElementById('rules-error-summary');
    if (boxErrore && boxErrore.style.display === 'block') {
        alert("Impossibile salvare: ci sono dei conflitti o degli errori nelle regole inserite.");
        return;
    }

    // 2. RECUPERA GLI ELEMENTI DI BASE DEL DOM
    const fName = document.getElementById('format-name');
    const fDesc = document.getElementById('format-desc');
    const fType = document.getElementById('format-type');
    
    // VALIDAZIONE BASE ASSOLUTA
    if (!fName || !fName.value.trim()) {
        alert("Inserisci un nome per il formato.");
        return;
    }
    if (!fDesc || !fDesc.value.trim()) {
        alert("Inserisci una descrizione breve per il formato.");
        return;
    }
    // FIX: Blocca il salvataggio se il tipo formato è vuoto o non selezionato
    if (!fType || !fType.value || fType.value.trim() === "") {
        alert("Seleziona una tipologia di formato (VGC, Custom o Anything Goes).");
        return;
    }

    const tipoFormato = fType.value;

    // 3. COSTRUZIONE DEL PAYLOAD BASE
    const payload = {
        categoria: fName.value.trim(), 
        descrizioneBreve: fDesc.value.trim(),
        strutturaSito: tipoFormato, 
        createdAt: new Date().toISOString()
    };

    // 4. RACCOLTA DATI CONDIZIONALE + VALIDAZIONE RIGIDA DEI CAMPI OBBLIGATORI
    if (tipoFormato === 'vgc') {
        const vgcGen = document.getElementById('vgc-gen');
        const vgcFormat = document.getElementById('vgc-format');
        
        // CONTROLLO OBBLIGATORI VGC
        if (!vgcGen || !vgcGen.value) {
            alert("Seleziona la Generazione VGC.");
            return;
        }
        if (!vgcFormat || !vgcFormat.value) {
            alert("Seleziona il Formato Regolamento VGC.");
            return;
        }

        payload.vgcGen = vgcGen.value;
        payload.vgcFormat = vgcFormat.value;

    } else {
        // Campi fissi/mandatori del pannello Custom
        const mStyle = document.getElementById('mandatory-battle-style');
        const mGenType = document.getElementById('mandatory-gen-type');
        const mGenVal = document.getElementById('mandatory-gen-value');
        const mTier = document.getElementById('mandatory-tier');

        // CONTROLLO OBBLIGATORI CUSTOM
        if (!mStyle || !mStyle.value) {
            alert("Seleziona lo Stile di Lotta (Singolo/Doppio).");
            return;
        }
        if (!mGenType || !mGenType.value) {
            alert("Seleziona il Tipo di Regola per la Generazione.");
            return;
        }
        if (!mGenVal || !mGenVal.value) {
            alert("Seleziona il valore della Generazione.");
            return;
        }
        if (!mTier || !mTier.value) {
            alert("Seleziona la Tier di base (es. OU, Uber, UU).");
            return;
        }

        payload.battleStyle = mStyle.value;
        payload.genRuleType = mGenType.value;
        payload.genRuleValue = mGenVal.value;
        payload.baseTier = mTier.value;

        // 5. RACCOLTA DELLE REGOLE DINAMICHE (FACOLTATIVE)
        const regoleInserite = raccogliDatiRegole();
        
        if (regoleInserite.length > 0) {
            payload.restrizioni = {};

            regoleInserite.forEach(r => {
                if (!payload.restrizioni[r.category]) {
                    payload.restrizioni[r.category] = {};
                }

                const oggettoRegola = { mode: r.mode };

                if (r.mode === "SPECIFIC") {
                    oggettoRegola.operator = r.operator;
                    if (r.operator === "between") {
                        if (r.min !== null && r.min !== "") oggettoRegola.min = r.min;
                        if (r.max !== null && r.max !== "") oggettoRegola.max = r.max;
                    } else {
                        if (r.value !== null && r.value !== "") oggettoRegola.value = r.value;
                    }
                }

                payload.restrizioni[r.category][r.field] = oggettoRegola;
            });
        }
    }

    // 6. INVIO EFFETTIVO AL DATABASE (Sintassi Globale v8/Compat)
    try {
        const nuovoFormatoRef = firebase.database().ref('regolamenti').push();
        await nuovoFormatoRef.set(payload);

        console.log("Salvataggio completato con successo. ID generato:", nuovoFormatoRef.key, payload);
        alert("Formato salvato con successo!");
        
        const modal = document.getElementById('format-modal');
        if (modal) modal.style.setProperty('display', 'none', 'important');
        
    } catch (error) {
        console.error("Errore riscontrato durante la scrittura nel DB:", error);
        alert("Errore durante il salvataggio sul database: " + error.message);
    }
}

// Funzione per scurire o schiarire un colore HEX
function pSBC(p, c0, c1, l) {
    let r, g, b, P, f, t, h, i = parseInt, m = Math.round, a = typeof (c1) == "string";
    if (typeof (p) != "number" || p < -1 || p > 1 || typeof (c0) != "string" || (c0[0] != 'r' && c0[0] != '#') || (c1 && !a)) return null;
    if (!this.pSBCr) this.pSBCr = (d) => {
        let n = d.length, x = {};
        if (n > 9) {
            [r, g, b, a] = d = d.split(","), n = d.length;
            if (n < 3 || n > 4) return null;
            x.r = i(r[3] == "a" ? r.slice(5) : r.slice(4)), x.g = i(g), x.b = i(b), x.a = a ? parseFloat(a) : -1
        } else {
            if (n == 8 || n == 6 || n < 4) return null;
            if (n < 6) d = "#" + d[1] + d[1] + d[2] + d[2] + d[3] + d[3] + (n > 4 ? d[4] + d[4] : "");
            d = i(d.slice(1), 16);
            if (n == 9 || n == 5) x.r = d >> 24 & 255, x.g = d >> 16 & 255, x.b = d >> 8 & 255, x.a = m((d & 255) / 0.255) / 1000;
            else x.r = d >> 16, x.g = d >> 8 & 255, x.b = d & 255, x.a = -1
        } return x
    };
    h = c0.length > 9, f = this.pSBCr(c0);
    if (!f) return null;
    if (p < 0) p *= -1, t = { r: 0, g: 0, b: 0, a: f.a };
    else t = { r: 255, g: 255, b: 255, a: f.a };
    r = m((t.r - f.r) * p) + f.r, g = m((t.g - f.g) * p) + f.g, b = m((t.b - f.b) * p) + f.b;
    return "#" + (0x1000000 + (f.a != -1 ? m(f.a * 255) : 0) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function getPlayerPalette(baseColor) {

function toggleMusic() {
    // 1. Identifica il player (usa l'ID presente in questa pagina, es. bg-music-home)
    const player = document.getElementById('bg-music-home');
    const musicBtn = document.getElementById('music-control');

    if (!player || !musicBtn) {
        console.error("Elementi audio o tasto non trovati in questa pagina.");
        return;
    }

    if (player.paused) {
        player.play().then(() => {
            // Se parte, rimuoviamo la sbarra e salviamo la preferenza 'on'
            musicBtn.classList.remove('muted');
            localStorage.setItem('userMusicPref', 'on');
        }).catch(error => {
            console.warn("Autoplay bloccato o errore riproduzione:", error);
        });
        
    } else {
        player.pause();
        // Aggiungiamo la sbarra e salviamo la preferenza 'off'
        musicBtn.classList.add('muted');
        localStorage.setItem('userMusicPref', 'off');
    }
}

async function caricaEVisualizzaFormati() {
  try {
    // 1. RECUPERA SIA I REGOLAMENTI CHE I GIOCATORI DA FIREBASE
    const formatsSnap = await db.ref('regolamenti').once('value');
    const formatsData = formatsSnap.val() || {};

    const playersSnap = await db.ref('players').once('value');
    const players = playersSnap.val() || {};

    const allFormats = {};

    // 2. INIZIALIZZA LA MAPPA CON TUTTI I FORMATI REALI PRESENTI NEL DB
    Object.entries(formatsData).forEach(([fId, fData]) => {
      const formatName = fData.categoria; // Il nome è salvato sotto 'categoria'
      if (formatName) {
        allFormats[formatName] = {
          formatName: formatName,
          maxPoints: -1, // Inizializzato a -1 per intercettare anche leader con 0 punti
          avatar: "", 
          color: "#e2e8f0", // Grigio neutro di default se non ci sono ancora leader
          hasLeader: false
        };
      }
    });

    // 3. AGGIORNA I LEADER IN BASE AI PUNTI FATTI DAI GIOCATORI
    Object.entries(players).forEach(([pId, pData]) => {
      const formatsStats = pData.stats?.['formats-stats'] || {};
      const info = pData.info || {};
      
      const playerAvatar = info.avatar || "https://via.placeholder.com/150"; 
      const playerColor = info.color || "#ffffff"; 

      Object.entries(formatsStats).forEach(([formatName, stats]) => {
        const points = Number(stats.points || 0);

        // Se il formato non esiste nel DB dei regolamenti (es. vecchi formati), lo aggiungiamo comunque per retrocompatibilità
        if (!allFormats[formatName]) {
          allFormats[formatName] = {
            formatName: formatName,
            maxPoints: points,
            avatar: playerAvatar,
            color: playerColor,
            hasLeader: true
          };
        } 
        // Se esiste ed è il punteggio più alto trovato finora, aggiorna il leader
        else if (points > allFormats[formatName].maxPoints) {
          allFormats[formatName].maxPoints = points;
          allFormats[formatName].avatar = playerAvatar;
          allFormats[formatName].color = playerColor;
          allFormats[formatName].hasLeader = true;
        }
      });
    });

    const gridContainer = document.getElementById('formats-grid-container');
    if (!gridContainer) return;

    gridContainer.innerHTML = '';

    // Serializzazione sicura dei giocatori per la modale
    const playersEscaped = btoa(unescape(encodeURIComponent(JSON.stringify(players))));

    // 4. STAMPA DELLE CARD NEUBRUTALIST
    Object.values(allFormats).forEach(format => {
      const formatEscaped = format.formatName.replace(/'/g, "\\'");
      
      // Gestione dinamica del Box Leader: se c'è mostra l'avatar, altrimenti una corona placeholder
      const leaderContent = format.hasLeader 
        ? `<img src="${format.avatar}" alt="Avatar Leader" style="width: 100%; height: 100%; object-fit: cover; transform: rotate(-6deg);" />`
        : `<span style="font-size: 20px; transform: rotate(-6deg); filter: grayscale(1);">👑</span>`;

      const cardHtml = `
        <div class="format-card-nb" 
             style="
               background-color: #ffffff !important; 
               cursor: pointer; 
               position: relative; 
               min-height: 180px; 
               min-width: 150px !important;
               padding: 30px !important;
               display: flex;
               flex-direction: column;
               justify-content: flex-start;
               align-items: flex-start;
             " 
             onclick="apriModaleFormato('${formatEscaped}', '${playersEscaped}')">
          
          <div class="format-nb-title-badge" style="margin-bottom: auto;">
            ${format.formatName}
          </div>
          
          <div class="format-nb-leader-box" 
               style="
                 position: absolute;
                 bottom: 12px;
                 right: 12px;
                 width: 50px;
                 height: 50px;
                 background-color: ${format.color} !important;
                 border: 3px solid #000;
                 box-shadow: 4px 4px 0px #000;
                 transform: rotate(6deg);
                 display: flex;
                 align-items: center;
                 justify-content: center;
                 overflow: hidden;
                 padding: ${format.hasLeader ? '10px !important' : '0 !important'};
                 transition: transform 0.2s ease;
               "
               title="${format.hasLeader ? 'Leader attuale' : 'Nessun leader - Gioca per primo!'}">
            ${leaderContent}
          </div>

        </div>
      `;
      gridContainer.innerHTML += cardHtml;
    });

  } catch (error) {
    console.error("Errore nel caricamento della griglia:", error);
  }
}

async function apriModaleFormato(formatName, playersEncoded) {
    const players = JSON.parse(decodeURIComponent(escape(atob(playersEncoded))));
    
    let modalOverlay = document.getElementById('format-modal-overlay');
    if (!modalOverlay) {
        modalOverlay = document.createElement('div');
        modalOverlay.id = 'format-modal-overlay';
        
        modalOverlay.onclick = (e) => {
            if (!e.target.closest('.format-modal-card-right') && 
                !e.target.closest('.format-modal-card-left') && 
                !e.target.closest('.format-modal-title-tag')) {
                chiudiModaleFormato();
            }
        };
        document.body.appendChild(modalOverlay);
    }

    modalOverlay.innerHTML = `
        <div class="format-modal-wrapper">
            
            <div class="format-modal-title-tag" onclick="event.stopPropagation();">
                <h2>${formatName}</h2>
            </div>
            
            <div class="format-modal-container">
                <div class="format-modal-card-left neubrutal-card" onclick="event.stopPropagation();">
                    <div class="format-info-placeholder">
                        <p style="font-style: italic; color: #666; margin: 0;">Info sul formato appena stabiliamo i parametri con Luca</p>
                    </div>
                </div>

                <div class="format-modal-card-right" onclick="event.stopPropagation();">
                    <div id="format-participants-list" class="simple-player-list">
                        <p style="font-size: 0.8rem; color: #fff; padding: 10px; font-style: italic;">Calcolo classifica in corso...</p>
                    </div>
                </div>
            </div>

        </div>
    `;

    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    await renderRankingsDelFormato(formatName, players);
}

async function renderRankingsDelFormato(formatName, players) {
    const listContainer = document.getElementById('format-participants-list');
    if (!listContainer) return;

    let sortedPlayers = [];

    // Mappiamo i giocatori estraendo le statistiche relative al formato selezionato
    Object.entries(players).forEach(([pId, pData]) => {
        const formatsStats = pData.stats?.['formats-stats'] || {};
        const specificStats = formatsStats[formatName];
        
        // Se il giocatore ha giocato almeno un match in questo formato, lo inseriamo in classifica
        if (specificStats) {
            sortedPlayers.push({
                name: pData.info?.name || pId,
                color: pData.info?.color || "#31c489",
                points: Number(specificStats.points || 0),
                won: Number(specificStats.won || 0),
                lost: Number(specificStats.lost || 0),
                setW: Number(specificStats.setW || 0),
                setL: Number(specificStats.setL || 0),
                // 🔥 CORREZIONE: Agganciati alle chiavi esatte create nel database da ricalcolaStatisticheGlobali
                showdownsPlayed: Number(specificStats.showdownsPlayed || 0),
                showdownsWon: Number(specificStats.showdownsWon || 0),
                showdownsLost: Number(specificStats.showdownsLost || 0)
            });
        }
    });

    // Ordiniamo con i criteri della classifica globale: Punti -> Vittorie Single Match -> Set Vinti
    sortedPlayers.sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        if (b.won !== a.won) return b.won - a.won;
        return (b.setW || 0) - (a.setW || 0);
    });

    if (sortedPlayers.length === 0) {
        // Testo virato al bianco (#fff) poiché adesso si trova sullo sfondo scuro del modale
        listContainer.innerHTML = '<p style="font-size: 0.8rem; color: #fff; font-style: italic; padding: 10px;">Nessun match registrato in questo formato</p>';
        return;
    }

    // Generiamo le righe HTML mantenendo lo stile grafico fluttuante neubrutalist
    const htmlRows = sortedPlayers.map((player, index) => {
        const playerUrlParam = encodeURIComponent(player.name.trim());

        return `
            <div class="player-rank-row" 
                onclick="window.location.href='public.html?player=${playerUrlParam}'"
                style="
                    display: flex; 
                    align-items: center; 
                    gap: 8px; 
                    margin-bottom: 12px; 
                    padding: 10px; 
                    background: ${player.color}; 
                    border: 2px solid #000;
                    box-shadow: 4px 4px 0px #000;
                    transition: transform 0.1s ease, box-shadow 0.1s ease;
                    transform: rotate(-1deg);
                    cursor: pointer;
                "
                onmouseenter="this.style.transform='translate(-2px, -2px) rotate(-1deg)'; this.style.boxShadow='6px 6px 0px #000';"
                onmouseleave="this.style.transform='rotate(-1deg)'; this.style.boxShadow='4px 4px 0px #000';"
            >
                <div style="font-weight: 900; font-size: 1.1rem; min-width: 25px;">#${index + 1}</div>
                
                <div style="flex-grow: 1;">
                    <div style="font-weight: 800; text-transform: uppercase; font-size: 0.9rem; color: #1a1a1a; font-family: 'Josefin Sans';">
                        ${player.name}
                    </div>
                    <div style="font-size: 0.75rem; color: #333; font-weight: 700; letter-spacing: -0.2px;">
                        P: ${player.showdownsPlayed}, S: ${player.showdownsWon}/${player.showdownsLost}, W/L: ${player.won}/${player.lost}
                    </div>
                </div>

                <div style="background: white; color: black; padding: 4px 10px; font-weight: 900; text-align: center; min-width: 45px; border: 2px solid #000; box-shadow: 3px 3px 0 #000; transform: rotate(1deg);">
                    ${player.points}
                </div>
            </div>
        `;
    });

    listContainer.innerHTML = htmlRows.join('');
}

function chiudiModaleFormato() {
    const modalOverlay = document.getElementById('format-modal-overlay');
    if (modalOverlay) {
        modalOverlay.classList.remove('active');
    }
    document.body.style.overflow = '';
}

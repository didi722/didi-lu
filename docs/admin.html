// --- NOVITÀ: CARICAMENTO TABELLA ---
async function caricaStagioni() {
    const tbody = document.getElementById('lista-stagioni-admin');
    
    try {
        const snap = await db.ref('seasons').once('value');
        const seasonsData = snap.val();

        if (!seasonsData) {
            tbody.innerHTML = '<tr><td colspan="5">Nessuna stagione trovata.</td></tr>';
            return;
        }

        // 1. Convertiamo l'oggetto in array
        const seasonsArray = Object.keys(seasonsData).map(id => {
            return {
                id: id,
                info: seasonsData[id].info || seasonsData[id]
            };
        });

        // 2. Ordinamento basato sull'ID (Numerico decrescente)
        seasonsArray.sort((a, b) => {
            // Gestione sbeta: gli diamo un valore molto basso (-1)
            const getNum = (id) => {
                if (id === 'sbeta') return -1;
                const n = parseInt(id.replace('s', ''));
                return isNaN(n) ? -2 : n;
            };

            return getNum(b.id) - getNum(a.id); // Numero più alto in cima
        });

        // 3. Icone Status
        const statusIcons = {
            'open': '🟢',
            'playing': '⚔️',
            'closed': '🔴',
            'coming soon': '⏳'
        };

        // 4. Renderizziamo
        let htmlAccumulator = "";
        seasonsArray.forEach(item => {
            const id = item.id;
            const info = item.info;
            const statusAttuale = info.status || 'open';
            const statusClass = statusAttuale.replace(/\s+/g, '-');

            htmlAccumulator += `
                <tr>
                    <td>${id}</td>
                    <td>${info.name || 'Senza nome'}</td>
                    <td><span class="status-badge ${statusClass}">${statusAttuale}</span></td>
                    <td>${info.created_at ? new Date(info.created_at).toLocaleDateString() : '-'}</td>
                    <td>
                        <button class="btn-small btn-status-toggle" title="Cambia Stato" onclick="ciclaStatoStagione('${id}', '${statusAttuale}')">
                            ${statusIcons[statusAttuale] || '🔄'}
                        </button>
                        ${String(statusAttuale).toLowerCase() === 'closed' ? `<button class="btn-small" title="Recalculate standings and winner" onclick="ricalcolaVincitoreStagione('${id}')">🏆</button>` : ''}
                        <button class="btn-small" onclick="apriModaleEdit('${id}')">✏️</button>
                        <button class="btn-small" onclick="eliminaStagioneCorrente('${id}')">🗑️</button>
                    </td>
                </tr>
            `;
        });
        
        tbody.innerHTML = htmlAccumulator;

    } catch (e) {
        console.error(e);
        tbody.innerHTML = '<tr><td colspan="5">Errore nel caricamento.</td></tr>';
    }
}

async function ciclaStatoStagione(idStagione, statoCorrente) {
    const stati = ['open', 'playing', 'closed', 'coming soon'];
    let indiceAttuale = stati.indexOf(statoCorrente);
    let prossimoIndice = (indiceAttuale + 1) % stati.length;
    const nuovoStato = stati[prossimoIndice];

    try {
        // 1. Aggiorna lo stato nel database
        await db.ref(`seasons/${idStagione}/info/status`).set(nuovoStato);
        console.log(`Stagione ${idStagione} passata a: ${nuovoStato}`);

        // 2. SE IL NUOVO STATO È "CLOSED", CALCOLA E SALVA IL VINCITORE (con la classifica rifatta da capo)
        if (nuovoStato === 'closed') {
            console.log(`CLOSED state detected for ${idStagione}. Calculating winner...`);
            await aggiornaLeaderboard(idStagione);
            const vincitore = await salvaVincitoreStagione(idStagione);
            alert(`Season Closed! Winner saved: ${vincitore}`);
        } else if (String(statoCorrente).toLowerCase() === 'closed') {
            // la stagione non è più chiusa: niente vincitore, e niente stagione vinta nei profili
            await ritiraVincitoreStagione(idStagione);
            await db.ref(`seasons/${idStagione}/info`).update({ winner: null, chiusuraAutomatica: null, chiusaIl: null });
        }
        
        caricaStagioni(); 
    } catch (e) {
        console.error("Error during status change:", e);
        alert("Unable to update the status.");
    }
}

// Rifà l'Elo di tutti dai match ufficiali rimasti (senza match ufficiali: unranked, 0). Serve se un valore vecchio è rimasto.
async function ricalcolaEloAdmin() {
    if (!confirm("Recalculate the Elo of ALL trainers from the official matches?\n\nTrainers without an official match go back to unranked (0).")) return;
    try {
        const risultato = await ricalcolaEloGiocatori();
        alert("Elo recalculated:\n" + Object.entries(risultato).map(([id, elo]) => `${id}: ${elo || 'unranked'}`).join('\n'));
    } catch (e) {
        console.error("Error recalculating Elo:", e);
        alert("Unable to recalculate the Elo.");
    }
}

// Rifà da zero, dai match salvati, la classifica di ogni stagione e le statistiche di TUTTI gli allenatori (punti, vittorie, badge, Elo).
// Serve se un salvataggio si è fermato a metà (i punti restano a 0 pur avendo giocato) o dopo aver corretto un errore del server.
async function ricalcolaStatisticheAdmin() {
    if (!confirm("Rebuild the standings of every season and the statistics of ALL trainers (points, wins, badges, Elo) from the saved matches?\n\nIt can take a minute.")) return;
    const bottone = document.querySelector('[onclick="ricalcolaStatisticheAdmin()"]');
    if (bottone) bottone.disabled = true;
    try {
        const stagioni = Object.keys((await db.ref('seasons').once('value')).val() || {});
        const giocatori = Object.keys((await db.ref('players').once('value')).val() || {});
        for (let i = 0; i < stagioni.length; i++) {
            if (bottone) bottone.textContent = `Standings ${i + 1}/${stagioni.length}...`;
            await aggiornaLeaderboard(stagioni[i]);
        }
        if (bottone) bottone.textContent = 'Elo...';
        await ricalcolaEloGiocatori();
        for (let i = 0; i < giocatori.length; i++) {
            if (bottone) bottone.textContent = `Stats ${i + 1}/${giocatori.length}...`;
            await ricalcolaStatisticheGlobali(giocatori[i]);
        }
        alert(`Done: standings of ${stagioni.length} season(s) and statistics of ${giocatori.length} trainer(s) rebuilt.\n\nIf something still looks wrong, check the browser console for errors.`);
    } catch (e) {
        console.error("Error recalculating statistics:", e);
        alert("Unable to recalculate everything: " + (e && e.message ? e.message : e));
    } finally {
        if (bottone) { bottone.disabled = false; bottone.textContent = '↻ Recalculate stats'; }
    }
}

// Riallinea i team iscritti alle stagioni (in iscrizione e in corso) con quelli del Box di ogni allenatore: nome e Pokémon.
// I match già salvati con il vecchio nome di un team rinominato prendono il nuovo; poi si rifanno classifica e statistiche di chi è coinvolto.
async function sincronizzaIscrizioniAdmin() {
    const [stagioniSnap, giocatoriSnap] = await Promise.all([db.ref('seasons').once('value'), db.ref('players').once('value')]);
    const p = IscrizioniTeam.piano(stagioniSnap.val() || {}, giocatoriSnap.val() || {});
    const n = Object.keys(p.iscrizioni).length;
    if (!n) { alert("All enrolled teams already match the teams in the Boxes. Nothing to do."); return; }
    const righe = p.rinomine.map(r => `- ${r.giocatore}, ${r.stagione}: "${r.da}" → "${r.a}"`);
    if (!confirm(`${n} enrolled team(s) differ from the Box.\n${righe.length ? '\nRenamed:\n' + righe.join('\n') + '\n' : ''}\nMatches already saved: ${Object.keys(p.match).length} will take the new team name.\n\nProceed?`)) return;
    const bottone = document.querySelector('[onclick="sincronizzaIscrizioniAdmin()"]');
    if (bottone) bottone.disabled = true;
    try {
        await IscrizioniTeam.applica(db, p);
        // classifiche e statistiche di chi ha avuto match rinominati
        const stagioni = [...new Set(p.rinomine.map(r => r.stagione))];
        const giocatori = [...new Set(p.rinomine.map(r => r.giocatore))];
        if (Object.keys(p.match).length) {
            for (const sid of stagioni) await aggiornaLeaderboard(sid);
            for (const g of giocatori) await ricalcolaStatisticheGlobali(g);
        }
        alert(`Done: ${n} enrolled team(s) updated, ${Object.keys(p.match).length} match(es) renamed.`);
    } catch (e) {
        console.error("Error syncing enrolled teams:", e);
        alert("Unable to sync: " + (e && e.message ? e.message : e));
    } finally {
        if (bottone) bottone.disabled = false;
    }
}

// Rifà la classifica e il vincitore di una stagione già chiusa (utile se era stata chiusa prima dell'ultimo showdown)
async function ricalcolaVincitoreStagione(idStagione) {
    try {
        await aggiornaLeaderboard(idStagione);
        const vincitore = await salvaVincitoreStagione(idStagione);
        alert(`Standings recalculated. Winner: ${vincitore}`);
        caricaStagioni();
    } catch (e) {
        console.error("Error recalculating the winner:", e);
        alert("Unable to recalculate the standings.");
    }
}

// 1. Carica i formati nel menù a tendina (con il filtro del tipo di stagione: la Randomize usa solo formati Random, la Monoformat nessuno)
async function popolaFormatiDaRegolamenti() {
    try {
        const snap = await db.ref('regolamenti').once('value');
        regolamentiCache = snap.val() || {};
    } catch (e) { console.error("Errore select:", e); }
    disegnaOpzioniFormati();
}

function disegnaOpzioniFormati() {
    const select = document.getElementById('select-regolamenti');
    const tipo = document.getElementById('tipo-stagione').value;
    const regole = TipoStagione.regoleDi(tipo);
    select.innerHTML = '<option value="">Choose formats...</option>';
    Object.keys(regolamentiCache).forEach(idReg => {
        const reg = regolamentiCache[idReg];
        const nomeCat = reg && reg.categoria;
        if (!nomeCat) return;
        const random = FormatoRandom.eRandom(reg);
        if (regole.formatoRandom === true && !random) return;
        if (regole.formatoRandom === false && random) return;
        // un formato Random può essere una categoria di stagione: nessun team da iscrivere, Showdown ne dà uno nuovo a ogni set
        select.innerHTML += `<option value="${nomeCat}">${nomeCat}${random ? ' (Random)' : ''}</option>`;
    });
}

    // Icona della cup caricata dal computer: ridotta a 192px e salvata nelle info della stagione come data URL
    function mostraAnteprimaIconaCup() {
        const v = document.getElementById('icona-cup').value.trim();
        const img = document.getElementById('anteprima-icona-cup');
        img.style.display = v ? 'block' : 'none';
        if (v) img.src = v;
    }
    document.getElementById('file-icona-cup').addEventListener('change', function () {
        const file = this.files && this.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const im = new Image();
        im.onload = () => {
            const k = Math.min(1, 192 / Math.max(im.width, im.height));
            const c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(im.width * k));
            c.height = Math.max(1, Math.round(im.height * k));
            c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
            document.getElementById('icona-cup').value = c.toDataURL('image/png');
            URL.revokeObjectURL(url);
            mostraAnteprimaIconaCup();
        };
        im.onerror = () => { URL.revokeObjectURL(url); alert('Image not readable.'); };
        im.src = url;
    });
    document.getElementById('icona-cup').addEventListener('input', mostraAnteprimaIconaCup);

async function cambiaTipoStagione(conservaNome) {
    const tipo = document.getElementById('tipo-stagione').value;
    const regole = TipoStagione.regoleDi(tipo);
    const nome = document.getElementById('new-season-name');
    const nota = document.getElementById('nota-tipo-stagione');
    document.getElementById('gruppo-icona-cup').style.display = tipo === 'cup' ? 'block' : 'none';
    mostraAnteprimaIconaCup();

    if (regole.nomeAutomatico) {
        if (!conservaNome) {
            try { stagioniInfoCache = await TipoStagione.leggiInfo(db); } catch (e) { /* senza, il nome si riscrive al salvataggio */ }
            nome.value = TipoStagione.nomeProgressivo(tipo, stagioniInfoCache);
        }
        nome.readOnly = !editingSeasonId;
        nota.innerText = 'The name is progressive: it is set automatically.';
        document.getElementById('etichetta-nome-stagione').innerText = 'Season Name (automatic):';
    } else {
        nome.readOnly = false;
        if (!conservaNome) nome.value = '';
        nota.innerText = 'A cup does not count for statistics: it only gives a trophy. Give it a name.';
        document.getElementById('etichetta-nome-stagione').innerText = 'Cup Name:';
    }

    const formati = document.getElementById('num-formati-target');
    if (regole.formati) scegliNumero(formati, regole.formati);
    formati.disabled = !!regole.formati;
    const showdown = document.getElementById('num-showdowns-per-format');
    if (regole.showdowns) scegliNumero(showdown, regole.showdowns);
    showdown.disabled = !!regole.showdowns;

    // il numero di squadre iscrivibili segue gli showdown per formato (solo creando: in modifica restano quelli salvati)
    if (!conservaNome) aggiornaSquadreMax();

    // Friuli DOC: il formato è il Random, scelto in automatico e non modificabile
    const fisso = !!regole.formatoFisso;
    if (fisso) {
        const random = Object.values(regolamentiCache).find(r => r && r.categoria && FormatoRandom.eRandom(r));
        if (random && !conservaNome) formatiSelezionati = [random.categoria];
    }
    document.getElementById('select-regolamenti').disabled = fisso;
    formatoBloccato = fisso;

    // con un formato solo non ha senso sorteggiarlo: lo sceglie l'admin
    const metodo = document.getElementById('metodo-selezione-tendina');
    if (regole.formati === 1) { metodo.value = 'manuale'; metodo.disabled = true; } else metodo.disabled = false;
    toggleMetodoFormati();
    // i formati già scelti che il nuovo tipo non ammette si tolgono
    formatiSelezionati = formatiSelezionati.filter(f => {
        const reg = Object.values(regolamentiCache).find(r => r && r.categoria === f);
        const random = !!reg && FormatoRandom.eRandom(reg);
        return !((regole.formatoRandom === true && !random) || (regole.formatoRandom === false && random));
    });
    if (regole.formati && formatiSelezionati.length > regole.formati) formatiSelezionati = formatiSelezionati.slice(0, regole.formati);
    renderTags();
    disegnaOpzioniFormati();
    aggiornaCalcoloDinamico();
    aggiornaStatoConferma();
}

// 2. Aggiunge un tag quando selezioni dal menù
function aggiungiFormatoTag() {
    const select = document.getElementById('select-regolamenti');
    const nomeFormato = select.value;
    const target = parseInt(document.getElementById('num-formati-target').value);

    if (!nomeFormato) return;
    
    // Controlli: non duplicati e non oltre il limite
    if (formatiSelezionati.includes(nomeFormato)) {
        alert("This format is already added!");
        select.value = "";
        return;
    }
    
    if (formatiSelezionati.length >= target) {
        alert(`You have already selected the required ${target} formats!`);
        select.value = "";
        return;
    }

    formatiSelezionati.push(nomeFormato);
    renderTags();
    select.value = ""; // Reset tendina
    aggiornaStatoConferma();
}

// 3. Disegna i tag con la "X"
let formatoBloccato = false; // Friuli DOC: il formato Random non si toglie
function renderTags() {
    const container = document.getElementById('container-tags-formati');
    container.innerHTML = "";
    
    formatiSelezionati.forEach((formato, index) => {
        const tag = document.createElement('div');
        tag.className = 'format-tag';
        tag.innerHTML = `
            ${formato}
            ${formatoBloccato ? '' : `<span class="remove-tag" onclick="rimuoviTag(${index})">&times;</span>`}
        `;
        container.appendChild(tag);
    });
}

function rimuoviTag(index) {
    formatiSelezionati.splice(index, 1);
    renderTags();
    aggiornaStatoConferma();
}


// I numeri del pannello si scelgono da elenchi a tendina (niente freccine): se un valore salvato è fuori elenco, si aggiunge
function riempiNumeri(id, da, a, predefinito, testo0) {
    const el = document.getElementById(id);
    for (let n = da; n <= a; n++) el.add(new Option(n === 0 && testo0 ? testo0 : String(n), String(n)));
    el.value = String(predefinito);
}
function scegliNumero(el, valore) {
    const v = String(parseInt(valore, 10) || 0);
    if (![...el.options].some(o => o.value === v)) {
        el.add(new Option(v, v));
        [...el.options].sort((x, y) => x.value - y.value).forEach(o => el.add(o));
    }
    el.value = v;
}
riempiNumeri('num-showdowns-per-format', 1, 12, 2);
riempiNumeri('teams-per-formato', 0, 20, 3, '0 (no limit)');

async function apriModaleEdit(idStagione) {
    try {
        const snapshot = await db.ref(`seasons/${idStagione}`).once('value');
        const data = snapshot.val();
        if (!data) return alert("Season not found!");

        const season = data.info ? data.info : data;
        editingSeasonId = idStagione;

        // 1. COMPILAZIONE CAMPI BASE
        document.getElementById('new-season-name').value = season.name || "";
        scegliNumero(document.getElementById('num-showdowns-per-format'), season.showdowns_per_format || 2);
        scegliNumero(document.getElementById('num-formati-target'), season.num_formats || 3);
        document.getElementById('new-season-open-sheet').checked = season.open_sheet || false;
        
        // Carica il valore di Best Of (se non presente default a 3)
        const bestOfInput = document.getElementById('best-of-format');
        if (bestOfInput) bestOfInput.value = season.best_of || 3;

        // 2. FIX DEADLINE (datetime-local richiede formato YYYY-MM-DDTHH:MM)
        const deadlineInput = document.getElementById('deadline-iscrizioni');
        if (season.deadline) {
            try {
                // Convertiamo la stringa del DB in un oggetto Date
                const d = new Date(season.deadline);
                // Formattiamo per l'input (YYYY-MM-DDTHH:mm)
                const formattedDate = d.toISOString().slice(0, 16);
                deadlineInput.value = formattedDate;
            } catch (err) {
                console.error("Errore formattazione data:", err);
                deadlineInput.value = "";
            }
        } else {
            deadlineInput.value = "";
        }

        // 3. FIX TEAMS PER FORMAT (Gestione "No Limit" -> 0)
        const teamsInput = document.getElementById('teams-per-formato');
        const badgeNoLimit = document.getElementById('badge-no-limit');
        
        if (season.teams_per_format === "No Limit" || season.teams_per_format === 0) {
            scegliNumero(teamsInput, 0);
            if (badgeNoLimit) badgeNoLimit.style.display = 'block';
        } else {
            scegliNumero(teamsInput, season.teams_per_format || 3);
            if (badgeNoLimit) badgeNoLimit.style.display = 'none';
        }

        // 4. GESTIONE FORMATI (TAG) e TIPO (non si cambia dopo la creazione)
        formatiSelezionati = season.selected_formats ? [...season.selected_formats] : [];
        renderTags(); 
        await popolaFormatiDaRegolamenti();
        const tipoSelect = document.getElementById('tipo-stagione');
        tipoSelect.value = TipoStagione.tipoDi(season, idStagione) === 'beta' ? 'league' : TipoStagione.tipoDi(season, idStagione);
        tipoSelect.disabled = true;
        document.getElementById('icona-cup').value = season.icona || '';
        await cambiaTipoStagione(true);

        // 5. TRASFORMAZIONE UI
        const titoloModale = document.querySelector('#modalCreazione h3');
        if (titoloModale) {
            titoloModale.innerText = "EDIT SEASON: " + (season.name || idStagione);
        }
        
        const btnSave = document.querySelector('#modalCreazione .btn-save');
        if (btnSave) {
            btnSave.innerText = "Edit Season"; 
            btnSave.onclick = function() { salvaModificheStagione(); };
        }

        // 6. MOSTRA MODALE E AGGIORNA CALCOLI
        document.getElementById('modalCreazione').style.display = 'flex'; 
        aggiornaCalcoloDinamico();

    } catch (e) {
        console.error("Errore apertura edit:", e);
    }
}

async function salvaModificheStagione() {
    if (!editingSeasonId) {
        alert("Error: Season ID missing. Unable to overwrite.");
        return;
    }

    try {
        const nomeStagione = document.getElementById('new-season-name').value;
        const s = parseInt(document.getElementById('num-showdowns-per-format').value) || 0;
        const n = parseInt(document.getElementById('num-formati-target').value) || 0;
        const iconaCup = document.getElementById('icona-cup').value.trim();
        const deadlineVal = document.getElementById('deadline-iscrizioni').value || "";
        const openSheetVal = document.getElementById('new-season-open-sheet').checked;
        
        // --- GESTIONE NO LIMIT ---
        const tInput = parseInt(document.getElementById('teams-per-formato').value);
        const t = (tInput === 0 || isNaN(tInput)) ? "No Limit" : tInput;

        const bo = parseInt(document.getElementById('best-of-format').value) || 3;

        let formatiFinali = [];
        const tags = document.querySelectorAll('#container-tags-formati .format-tag');
        tags.forEach(tag => {
            let nome = tag.innerText.replace('×', '').trim();
            if (nome) formatiFinali.push(nome);
        });

        const updatedData = {
            name: nomeStagione,
            deadline: deadlineVal,
            teams_per_format: t, // Salva numero o "No Limit"
            showdowns_per_format: s,
            best_of: bo,
            num_formats: n,
            selected_formats: formatiFinali,
            open_sheet: openSheetVal,
            updated_at: new Date().toISOString()
        };
        if (document.getElementById('tipo-stagione').value === 'cup') updatedData.icona = iconaCup || null;

        await db.ref(`seasons/${editingSeasonId}/info`).update(updatedData);

        alert(`Season ${editingSeasonId} overwritten successfully!`);
        
        editingSeasonId = null;
        location.reload();

    } catch (e) {
        console.error("Error saving changes:", e);
        alert("An error occurred while updating the data.");
    }
}

// Giocatori toccati dalla stagione: chi è in classifica, chi ha giocato un match
// o ha lo storico della stagione nel profilo. Solo quelli con un profilo esistente
// (ricalcolare un player cancellato ricreerebbe un profilo fantasma).
function giocatoriDellaStagione(idStagione, season, players) {
    const ids = new Set(Object.keys(season.leaderboard || {}).map(n => n.toLowerCase()));

    Object.values(season.showdowns || {}).forEach(sd => {
        Object.values(sd.matches || {}).forEach(m => {
            if (m.player1Id) ids.add(m.player1Id);
            if (m.player2Id) ids.add(m.player2Id);
        });
    });

    Object.entries(players).forEach(([pid, p]) => {
        if (p && p.stats && p.stats.seasons && p.stats.seasons.history && p.stats.seasons.history[idStagione]) {
            ids.add(pid);
        }
    });

    return [...ids].filter(pid => players[pid]);
}

// Dati legati alla stagione che stanno fuori da seasons/{id}: sfide e notifiche.
// Vanno tolti perché il prossimo ID stagione viene calcolato come "massimo + 1",
// quindi dopo aver cancellato l'ultima stagione il suo ID viene riutilizzato.
// Best-effort: se le regole del database vietano la scrittura non blocchiamo nulla.
async function pulisciSfideENotifiche(idStagione) {
    const avvisi = [];

    try {
        await db.ref(`sfide/${idStagione}`).remove();
    } catch (e) {
        console.warn("Impossibile rimuovere le sfide della stagione:", e);
        avvisi.push(`challenges (sfide/${idStagione})`);
    }

    try {
        const notificheSnap = await db.ref('notifiche').once('value');
        const updates = {};
        Object.entries(notificheSnap.val() || {}).forEach(([uid, perStagione]) => {
            if (perStagione && perStagione[idStagione] !== undefined) {
                updates[`notifiche/${uid}/${idStagione}`] = null;
            }
        });
        if (Object.keys(updates).length > 0) await db.ref().update(updates);
    } catch (e) {
        console.warn("Impossibile rimuovere le notifiche della stagione:", e);
        avvisi.push(`notifications (notifiche/*/${idStagione})`);
    }

    return avvisi;
}

async function eliminaStagioneCorrente(idDaEliminare) {
    if (!idDaEliminare || eliminazioneInCorso) return;
    eliminazioneInCorso = true;

    try {
        const infoSnap = await db.ref(`seasons/${idDaEliminare}/info`).once('value');
        const nomeStagione = (infoSnap.val() && infoSnap.val().name) || idDaEliminare;

        // --- DOPPIA CONFERMA ---
        if (!confirm(`Are you sure you want to permanently delete the season "${nomeStagione}" (${idDaEliminare})?\n\nAll its showdowns, matches and leaderboard will be deleted, and every player will lose the wins, showdowns, team stats and ELO obtained in this season. This action is irreversible.`)) return;

        if (!confirm(`⚠️ FINAL CONFIRMATION ⚠️\n\nPress OK to DEFINITIVELY delete "${nomeStagione}" (${idDaEliminare}) together with all its statistics.\n\nThere is no way back.`)) return;

        // --- 1. LETTURA DI QUELLO CHE STIAMO PER CANCELLARE ---
        mostraProgressoEliminazione("Reading season data...");
        const [seasonSnap, playersSnap] = await Promise.all([
            db.ref(`seasons/${idDaEliminare}`).once('value'),
            db.ref('players').once('value')
        ]);
        const season = seasonSnap.val();
        const players = playersSnap.val() || {};

        if (!season) {
            alert("Season not found!");
            return;
        }

        const giocatori = giocatoriDellaStagione(idDaEliminare, season, players);
        const idVincitore = String((season.info && season.info.winner) || '').toLowerCase();

        // --- 2. CANCELLAZIONE ATOMICA: stagione + palmarès dei giocatori ---
        // Una sola scrittura multi-percorso: o va tutto o non cambia niente.
        const updates = {};
        updates[`seasons/${idDaEliminare}`] = null;

        giocatori.forEach(pid => {
            const statsStagioni = (players[pid].stats && players[pid].stats.seasons) || {};
            const storico = statsStagioni.history && statsStagioni.history[idDaEliminare];
            if (!storico) return;

            updates[`players/${pid}/stats/seasons/history/${idDaEliminare}`] = null;

            // La vittoria di stagione viene contata in salvaVincitoreStagione solo se il
            // giocatore era 1° con punti > 0, cioè se è il "winner" salvato nella stagione.
            if (Number(storico.rank) === 1 && idVincitore === pid) {
                updates[`players/${pid}/stats/seasons/won`] = Math.max(0, (statsStagioni.won || 0) - 1);
            }
        });

        mostraProgressoEliminazione("Deleting season...");
        await db.ref().update(updates);

        // --- 3. SFIDE E NOTIFICHE DELLA STAGIONE ---
        mostraProgressoEliminazione("Cleaning challenges and notifications...");
        const avvisi = await pulisciSfideENotifiche(idDaEliminare);

        // --- 4. RICALCOLO STATISTICHE ---
        // ricalcolaStatisticheGlobali ricostruisce da zero le statistiche (l'Elo lo rifà ricalcolaEloGiocatori, in ordine cronologico),
        // vittorie/sconfitte, showdown, statistiche dei team, badge e uso dei tipi
        // sommando solo le stagioni rimaste: quella appena cancellata non conta più.
        // L'Elo si rifà per TUTTI i profili e per primo (senza match ufficiali: unranked, 0): così non resta nessun valore vecchio, anche se
        // il ricalcolo completo di qualcuno va storto qui sotto.
        mostraProgressoEliminazione("Resetting Elo...");
        await ricalcolaEloGiocatori();
        for (let i = 0; i < giocatori.length; i++) {
            mostraProgressoEliminazione(`Recalculating statistics (${i + 1}/${giocatori.length}): ${giocatori[i]}...`);
            await ricalcolaStatisticheGlobali(giocatori[i]);
        }

        mostraProgressoEliminazione("");
        let messaggio = `Season "${nomeStagione}" deleted successfully!\nStatistics recalculated for ${giocatori.length} player(s).`;
        if (avvisi.length > 0) {
            messaggio += `\n\n⚠️ Could not remove: ${avvisi.join(', ')}.`;
        }
        alert(messaggio);
        caricaStagioni();
    } catch (e) {
        console.error("Error during deletion:", e);
        alert("Technical error: Unable to delete the season completely. Check the console, then run the global recalculation from matches.html if the statistics look wrong.");
    } finally {
        mostraProgressoEliminazione("");
        eliminazioneInCorso = false;
    }
}

// salvaVincitoreStagione(seasonId) sta in risultati-match.js: è la stessa che chiude la stagione da sola quando tutti hanno giocato tutto

function validaMezzora(input) {
    const dataSelezionata = new Date(input.value);
    const minuti = dataSelezionata.getMinutes();

    // Se i minuti non sono 0 o 30, arrotondiamo alla mezzora più vicina
    if (minuti !== 0 && minuti !== 30) {
        if (minuti < 15) {
            dataSelezionata.setMinutes(0);
        } else if (minuti < 45) {
            dataSelezionata.setMinutes(30);
        } else {
            dataSelezionata.setMinutes(0);
            dataSelezionata.setHours(dataSelezionata.getHours() + 1);
        }
        
        // Formattazione per riportare il valore corretto nell'input datetime-local
        const year = dataSelezionata.getFullYear();
        const month = String(dataSelezionata.getMonth() + 1).padStart(2, '0');
        const day = String(dataSelezionata.getDate()).padStart(2, '0');
        const hours = String(dataSelezionata.getHours()).padStart(2, '0');
        const mins = String(dataSelezionata.getMinutes()).padStart(2, '0');
        
        input.value = `${year}-${month}-${day}T${hours}:${mins}`;
    }
}

/** 2. Salvataggio su Firebase con ID Automatico **/
async function creaNuovaStagione() {
    try {
        const tipo = document.getElementById('tipo-stagione').value;
        const regole = TipoStagione.regoleDi(tipo);
        let nomeStagione = document.getElementById('new-season-name').value.trim();
        if (!regole.nomeAutomatico && !nomeStagione) return alert("Please enter a name for the cup!");

        const metodo = document.getElementById('metodo-selezione-tendina').value;
        const numFormatiTarget = regole.formati || parseInt(document.getElementById('num-formati-target').value) || 1;
        
        let formatiFinali = [];

        if (metodo === 'manuale') {
            const tags = document.querySelectorAll('#container-tags-formati .format-tag');
            tags.forEach(tag => {
                let nome = tag.innerText.replace('×', '').trim();
                if (nome) formatiFinali.push(nome);
            });
            
            if (formatiFinali.length < numFormatiTarget) {
                return alert(`Please select at least ${numFormatiTarget} formats!`);
            }
        } else {
            // League: almeno un Anything Goose, un Custom e un VGC da 3 formati in su; due di tipo diverso con 2 formati (mai Random)
            const regSnapshot = await db.ref('regolamenti').once('value');
            const dataReg = regSnapshot.val() || {};
            const tuttiIFormati = Object.keys(dataReg).filter(k => !FormatoRandom.eRandom(dataReg[k])).map(k => ({ nome: dataReg[k].categoria || k, struttura: dataReg[k].strutturaSito || 'custom' }));
            if (tuttiIFormati.length < numFormatiTarget) {
                return alert("Insufficient formats in the database!");
            }
            formatiFinali = TipoStagione.estraiFormati(tuttiIFormati, numFormatiTarget);
        }

        const snapSeasons = await db.ref('seasons').once('value');
        const seasons = snapSeasons.val() || {};
        
        let maxIdx = -1;
        Object.keys(seasons).forEach(id => {
            if (id.startsWith('s') && id !== 'sbeta') {
                const num = parseInt(id.substring(1));
                if (!isNaN(num) && num > maxIdx) maxIdx = num;
            }
        });
        const nuovoID = `s${maxIdx + 1}`;
        // il nome delle stagioni è progressivo (Sant'Alvise III, Friuli DOC II...): si ricalcola ora, sulle stagioni che ci sono davvero
        if (regole.nomeAutomatico) nomeStagione = TipoStagione.nomeProgressivo(tipo, seasons);

        const s = regole.showdowns || parseInt(document.getElementById('num-showdowns-per-format').value) || 0;
        const deadlineVal = document.getElementById('deadline-iscrizioni').value || "";
        const bo = parseInt(document.getElementById('best-of-format').value) || 3;
        const openSheetVal = document.getElementById('new-season-open-sheet').checked;

        // --- GESTIONE NO LIMIT ---
        const tInput = parseInt(document.getElementById('teams-per-formato').value);
        const t = (tInput === 0 || isNaN(tInput)) ? "No Limit" : tInput;

        const seasonInfo = {
            id: nuovoID,
            tipo,
            name: nomeStagione,
            deadline: deadlineVal,
            teams_per_format: t, // Salva numero o "No Limit"
            showdowns_per_format: s,
            best_of: bo,

// Funzione per controllare le scadenze e aggiornare lo status in PLAYING
async function controllaScadenzeIscrizioni() {
    try {
        const snap = await db.ref('seasons').once('value');
        const seasons = snap.val();
        if (!seasons) return;

        const oraAttuale = new Date();
        let aggiornamentiEffettuati = false;

        for (const id in seasons) {
            const info = seasons[id].info || seasons[id];
            
            // Controlliamo solo se è OPEN e se ha una deadline
            if (info.status === "open" && info.deadline) {
                const scadenza = new Date(info.deadline);

                // Se l'ora attuale è maggiore o uguale alla scadenza
                if (oraAttuale >= scadenza) {
                    console.log(`Scadenza raggiunta per ${id}. Passaggio a PLAYING...`);
                    await db.ref(`seasons/${id}/info/status`).set("playing");
                    aggiornamentiEffettuati = true;
                }
            }
        }

        // Se abbiamo cambiato qualcosa, ricarichiamo la tabella
        if (aggiornamentiEffettuati) {
            caricaStagioni();
        }
    } catch (e) {
        console.error("Errore nel controllo scadenze:", e);
    }
}

function caricaListaPlayers() {
    db.ref('users').off(); 

    db.ref('users').on('value', snap => {
        const tbody = document.getElementById('lista-players-admin');
        if (!tbody) return;
        
        tbody.innerHTML = "";
        
        snap.forEach(child => {
            const user = child.val();
            const uid = child.key;
            
            // Mantiene il nome originale (es: "Lu") senza forzare il minuscolo
            const nomeEsatto = user.name ? user.name.trim() : uid;
            const nomeDaMostrare = user.name ? user.name.toUpperCase() : uid.toUpperCase();

            tbody.innerHTML += `
                <tr>
                    <td><strong>${nomeDaMostrare}</strong></td>
                    <td>${user.email || 'N/A'}</td>
                    <td><span class="status-tag">${user.role || 'player'}</span></td>
                    <td>                     
                        <button class="btn-delete" onclick="eliminaPlayer('${nomeEsatto}', '${uid}')" style="cursor:pointer; background:none; border:none; font-size:1.2rem;">🗑️</button>
                        <button class="btn-edit" onclick="modificaPlayer('${nomeEsatto}', '${uid}')" style="cursor:pointer; background:none; border:none; font-size:1.2rem;">✏️</button>
                    </td>
                </tr>
            `;
        });
    });
}


async function modificaPlayer(nomePlayer, realUid) {
  const nuovoNome = prompt(`Inserisci il nuovo nome per ${nomePlayer}:`);
  if (!nuovoNome || nuovoNome.trim() === "" || nuovoNome === nomePlayer) return;

  const vecchioNome = nomePlayer.trim();
  const nuovoNomeTrimmed = nuovoNome.trim();

  // Varianti del VECCHIO nome (es: "lu", "Lu", "LU")
  const vLower = vecchioNome.toLowerCase();
  const vCap = vLower.charAt(0).toUpperCase() + vLower.slice(1);
  const vUpper = vLower.toUpperCase();

  // Varianti del NUOVO nome (es: "lukiani", "Lukiani", "LUKIANI")
  const nLower = nuovoNomeTrimmed.toLowerCase();
  const nCap = nLower.charAt(0).toUpperCase() + nLower.slice(1);
  const nUpper = nLower.toUpperCase();

  try {
    const rootRef = db.ref('/');
    const snapshot = await rootRef.once('value');

    if (!snapshot.exists()) {
      alert("Database not found.");
      return;
    }

    let updatedData = snapshot.val();

    // 1. Convertiamo in stringa JSON SOLO per sostituire le stringhe del nome
    // NOTA: NON facciamo più alcun replace sull'UID reale!
    let json = JSON.stringify(updatedData);

    // Sostituzione dei nomi nelle stringhe e nei campi
    json = json.replaceAll(`"${vCap}"`, `"${nCap}"`);
    json = json.replaceAll(`"${vLower}"`, `"${nLower}"`);
    json = json.replaceAll(`"${vUpper}"`, `"${nUpper}"`);

    // Sostituzione nelle stringhe composte dei match (es: "lu: 1 vs didi: 2")
    json = json.replaceAll(`${vLower}:`, `${nLower}:`);
    json = json.replaceAll(`${vCap}:`, `${nCap}:`);
    json = json.replaceAll(`${vLower} vs`, `${nLower} vs`);
    json = json.replaceAll(`${vCap} vs`, `${nCap} vs`);
    json = json.replaceAll(`vs ${vLower}`, `vs ${nLower}`);
    json = json.replaceAll(`vs ${vCap}`, `vs ${nCap}`);

    updatedData = JSON.parse(json);

    // 2. Spostiamo il nodo del profilo player (es: players/lu -> players/lukiani)
    if (updatedData.players) {
      if (updatedData.players[vLower] && vLower !== nLower) {
        updatedData.players[nLower] = updatedData.players[vLower];
        delete updatedData.players[vLower];
      }
      if (updatedData.players[nLower] && updatedData.players[nLower].info) {
        updatedData.players[nLower].info.name = nCap;
      }
    }

    // 3. Nel nodo users, manteniamo intatta la chiave UID originale e aggiorniamo solo il nome
    if (updatedData.users && updatedData.users[realUid]) {
      updatedData.users[realUid].name = nCap;
      updatedData.users[realUid].uid = realUid; // Mantiene l'UID reale
    }

    // Salvataggio nel database
    await rootRef.set(updatedData);

    alert(`Player "${vecchioNome}" updated to "${nCap}"! The UID (${realUid}) has been preserved.`);
    location.reload();
  } catch (error) {
    console.error("Error during player modification:", error);
    alert("An error occurred while updating the database.");
  }
}

async function creaNuovoPlayerAdmin() {
    const nome = document.getElementById('new-player-name').value.trim().toLowerCase();
    const realName = document.getElementById('new-player-real-name').value.trim();
    const lastName = document.getElementById('new-player-last-name').value.trim(); // 🆕 Estratto cognome
    const email = document.getElementById('new-player-email').value.trim();
    const password = "password123"; 

    if (!nome || !realName || !lastName || !email) {
        alert("Please enter a nickname, real name, last name and email!");
        return;
    }

    const config = firebase.app().options;

    try {
        // 1. Creazione account in Authentication tramite App temporanea
        const tempAppName = "TempApp_" + Date.now();
        const tempApp = firebase.initializeApp(config, tempAppName);
        const userCredential = await tempApp.auth().createUserWithEmailAndPassword(email, password);
        const uid = userCredential.user.uid;
        
        await tempApp.auth().signOut();
        await tempApp.delete();

        // 2. Salvataggio in users/UID (con cognome)
        await db.ref(`users/${uid}`).set({
            uid: uid,
            name: nome,
            real_name: realName,
            last_name: lastName, // 🎯 Salvato in users/{uid}
            email: email,
            role: "player"
        });

        // 3. Salvataggio in players/NOME_UTENTE
        const playerRef = db.ref(`players/${nome}`);
        
        const infoData = {
            avatar: "https://via.placeholder.com/150",
            bio: "Hello there, I'm a new trainer!",
            color: "#31c489",
            fav_team: "Non impostato",
            idTeamPreferito: "",
            musicaPreferita: "",
            name: nome.charAt(0).toUpperCase() + nome.slice(1),
            real_name: realName,
            last_name: lastName // 🎯 Salvato correttamente dentro INFO
        };

        await playerRef.child('info').set(infoData);
        
        await playerRef.child('stats').set({ 
            uid_riferimento: uid 
        });
        
        await playerRef.child('teams').set({
            descrizione: "Lista team ancora vuota" 
        });

        alert(`Player ${nome} created successfully! Info, teams and stats structure is ready.`);
        
        // Reset dei campi del form
        document.getElementById('new-player-name').value = "";
        document.getElementById('new-player-real-name').value = "";
        document.getElementById('new-player-last-name').value = "";
        document.getElementById('new-player-email').value = "";

    } catch (error) {
        console.error("Error during player creation:", error);
        alert("Error: " + error.message);
    }
}

async function eliminaPlayer(nomePlayer) {
    // 1. Pulizia del nome per sicurezza (minuscolo come nel database)
    const nomeID = nomePlayer.toLowerCase().trim();
    
    const conferma = confirm(`PERMANENT DELETION: Do you want to permanently delete ${nomeID.toUpperCase()}?`);
    
    if (conferma) {
        try {
            // 2. Leggiamo il nodo players per recuperare l'UID prima di cancellare
            const snap = await db.ref(`players/${nomeID}`).once('value');
            const data = snap.val();

            // 3. CANCELLAZIONE NODO USERS (Auth reference)
            if (data && data.stats && data.stats.uid_riferimento) {
                const uid = data.stats.uid_riferimento;
                await db.ref(`users/${uid}`).remove();
                console.log(`Rimosso nodo users/${uid}`);
            } else {
                // Fallback: prova a rimuovere usando il nome (per vecchi record)
                await db.ref(`users/${nomeID}`).remove();
            }

            // 4. CANCELLAZIONE NODO PLAYERS (Profilo completo)
            // Usiamo .set(null) che è il modo più radicale di Firebase per dire "distruggi questo percorso e tutto ciò che contiene"
            await db.ref(`players/${nomeID}`).set(null);
            console.log(`Rimosso intero nodo players/${nomeID}`);

            alert(`Player ${nomeID.toUpperCase()} removed successfully from all archives.`);
            
            // 5. Refresh tabella
            if (typeof caricaListaPlayers === "function") caricaListaPlayers();

        } catch (e) {
            console.error("Critical Error during deletion:", e);
            alert("Technical Error: The database did not respond correctly.");
        }
    }
}

// Funzione per generare i badge dinamici e il Founder badge
function generaHTMLBadge(statsBadges = {}, playerKey = "") {
    let html = "";

    // 1. FOUNDER BADGE (Didi e Lukiani)
    const pKeyLower = (playerKey || "").trim().toLowerCase();
    if (pKeyLower === 'didi' || pKeyLower === 'lukiani') {
        html += `<img src="immagini/badge_founder.png" class="trainer-mini-badge" title="League Founder" alt="Founder">`;
    }

    // 2. DYNAMIC BADGES (Clean, Won, SD Streaks)
    const badgeConfig = [
        {
            id: 'clean',
            label: 'Clean Streak',
            max: parseInt(statsBadges.maxcleanstrike) || 0,
            steps: [3, 5, 7]
        },
        {
            id: 'won',
            label: 'Win Streak',
            max: parseInt(statsBadges.maxwonstrike) || 0,
            steps: [5, 7, 10]
        },
        {
            id: 'sd',
            label: 'SD Streak',
            max: parseInt(statsBadges.maxsdstrike) || 0,
            steps: [3, 5, 7]
        }
    ];

    badgeConfig.forEach(b => {
        let level = "";

        if (b.max >= b.steps[2]) {
            level = "gold";
        } else if (b.max >= b.steps[1]) {
            level = "silver";
        } else if (b.max >= b.steps[0]) {
            level = "bronze";
        }

        if (level !== "") {
            const imagePath = `immagini/badge_${b.id}_${level}.png`;
            html += `<img src="${imagePath}" class="trainer-mini-badge" title="${b.label} (${level.toUpperCase()})" alt="${b.label} ${level}">`;
        }
    });

    return html;
}

async function initTrainersPage() {
    const gridContainer = document.getElementById('trainers-grid');
    const loader = document.getElementById('poke-loader');

    if (loader) {
        loader.style.transition = 'none';
        loader.style.display = 'flex';
        loader.style.opacity = '1';
        loader.offsetHeight; 
    }

    try {
        const snapshot = await db.ref('players').once('value');
        const playersData = snapshot.val();

        if (!playersData) {
            gridContainer.innerHTML = "<p style='font-weight:800;'>Nessun allenatore trovato.</p>";
            return;
        }

        const playersList = [];
        for (let key in playersData) {
            const player = playersData[key];
            const info = player.info || {};
            const stats = player.stats || {};
            const indStats = stats['individual-stats'] || {};
            const statsBadges = stats.badges || {};

            // 🚫 RECUPERO ED ESCLUSIONE STAGIONE BETA DALLA CONTA TROFEI
            const seasonsData = player['seasons-history'] || player.seasonsHistory || player.seasons || stats.seasons || {};
            
            let trophiesWon = 0;
            if (seasonsData && typeof seasonsData === 'object') {
                trophiesWon = Object.entries(seasonsData).filter(([sId, s]) => {
                    if (!s || typeof s !== 'object') return false;
                    const isBeta = sId === 'sbeta' || s.id === 'sbeta' || (s.name && String(s.name).toLowerCase().includes('beta'));
                    if (isBeta) return false;
                    return s.rank === 1 || s.rank === "1";
                }).length;
            }

            playersList.push({
                id: key,
                name: info.name || key,
                avatar: info.avatar || 'immagini/magikarp.png',
                color: info.color || '#31c489',
                ranking: indStats.ranking !== undefined ? Number(indStats.ranking) : 0,
                trophiesWon: trophiesWon,
                badgesHTML: generaHTMLBadge(statsBadges, key)
            });
        }

        playersList.sort((a, b) => b.ranking - a.ranking);

        gridContainer.innerHTML = playersList.map((player, index) => {
            const randomRotation = (Math.random() * 2 - 1).toFixed(2);
            
            const htmlTrofeati = player.trophiesWon > 0 
                ? `<div class="trainer-card-trophy" title="Seasons">
                    <img src="immagini/season-winner-color.png" class="trophy-icon" alt="Trophy">
                    <span class="trophy-count">x${player.trophiesWon}</span>
                   </div>` 
                : '';

            return `
                <a href="public.html?player=${encodeURIComponent(player.id)}" 
                   class="trainer-card" 
                   style="background-color: ${player.color}; --random-deg: ${randomRotation}deg;">
                    
                    <div class="trainer-left-group">
                        <span class="trainer-rank-text">#${index + 1}</span>
                        
                        <div class="trainer-avatar-box">
                            <img src="${player.avatar}" alt="${player.name}" onerror="this.src='immagini/magikarp.png'">
                        </div>
                        
                        <div class="trainer-info-block">
                            <h2 class="trainer-name">${player.name}</h2>
                        </div>
                    </div>
                    
                    <div class="trainer-achievements-group">
                        ${htmlTrofeati}
                        <div class="trainer-badges-container">
                            ${player.badgesHTML}
                        </div>
                    </div>

                    <div class="trainer-points-box">
                        ${player.ranking}
                    </div>
                </a>
            `;
        }).join('');

    } catch (error) {
        console.error("Errore durante il caricamento dei giocatori:", error);
        gridContainer.innerHTML = "<p style='font-weight:800;'>Errore nel caricamento della classifica.</p>";
    } finally {
        nascondiLoader();
    }
}

const LINK_MP3_HOME = "https://dn721900.ca.archive.org/0/items/pkmn-rse-soundtrack/Disc%201/13%20-%20Pok%C3%A9mon%20Center.mp3";

function syncMusicState() {
    const player = document.getElementById('bg-music-home');
    const musicBtn = document.getElementById('music-control');

    if (!player) return;

    if (player.src !== LINK_MP3_HOME) {
        player.src = LINK_MP3_HOME;
        player.volume = 0.3;
    }

    const savedPref = localStorage.getItem('userMusicPref');

    // Case 1: L'utente ha silenziato la musica
    if (savedPref === 'off') {
        player.pause();
        if (musicBtn) musicBtn.classList.add('muted');
        return;
    }

    // Case 2: La musica deve riprodursi ('on' o mai impostata)
    player.play()
        .then(() => {
            if (musicBtn) musicBtn.classList.remove('muted');
        })
        .catch(() => {
            // Se il browser blocca l'autoplay, mostra l'icona muted e attendi un click
            if (musicBtn) musicBtn.classList.add('muted');
            sbloccaAudioAlPrimoClick();
        });
}

// Sblocca l'audio non appena l'utente clicca qualsiasi punto della pagina
function sbloccaAudioAlPrimoClick() {
    const unlock = () => {
        const savedPref = localStorage.getItem('userMusicPref');
        const player = document.getElementById('bg-music-home');
        const musicBtn = document.getElementById('music-control');

        if (savedPref !== 'off' && player && player.paused) {
            player.play().then(() => {
                if (musicBtn) musicBtn.classList.remove('muted');
            }).catch(() => {});
        }
    };

    document.addEventListener('click', unlock, { once: true });
    document.addEventListener('touchstart', unlock, { once: true });
}

function toggleMusic() {
    const player = document.getElementById('bg-music-home');
    const musicBtn = document.getElementById('music-control');

    if (!player || !musicBtn) return;

    if (player.paused) {
        player.play().then(() => {
            musicBtn.classList.remove('muted');
            localStorage.setItem('userMusicPref', 'on');
        }).catch(error => {
            console.warn("Riproduzione bloccata:", error);
        });
    } else {
        player.pause();
        musicBtn.classList.add('muted');
        localStorage.setItem('userMusicPref', 'off');
    }
}

// Eventi di Inizializzazione e Sincronizzazione:

// 1. Caricamento standard DOM
document.addEventListener('DOMContentLoaded', syncMusicState);

// 2. Navigazione indietro/avanti nel browser (bfcache)
window.addEventListener('pageshow', syncMusicState);

// 3. Modifica della preferenza in un'altra scheda o finestra del browser
window.addEventListener('storage', (e) => {
    if (e.key === 'userMusicPref') {
        syncMusicState();
    }
});

// Funzione per scurire o schiarire un colore HEX
function pSBC(p, c0, c1, l) {
    let r, g, b, P, f, t, h, i = parseInt, m = Math.round, a = typeof (c1) == "string";
    if (typeof (p) != "number" || p < -1 || p > 1 || typeof (c0) != "string" || (c0[0] != 'r' && c0[0] != '#') || (c1 && !a)) return null;
    if (!this.pSBCr) this.pSBCr = (d) => {
        let n = d.length, x = {};
        if (n > 9) {
            [r, g, b, a] = d = d.split(","), n = d.length;
            if (n < 3 || n > 4) return null;
            x.r = i(r[3] == "a" ? r.slice(5) : r.slice(4)), x.g = i(g), x.b = i(b), x.a = a ? parseFloat(a) : -1
        } else {
            if (n == 8 || n == 6 || n < 4) return null;
            if (n < 6) d = "#" + d[1] + d[1] + d[2] + d[2] + d[3] + d[3] + (n > 4 ? d[4] + d[4] : "");
            d = i(d.slice(1), 16);
            if (n == 9 || n == 5) x.r = d >> 24 & 255, x.g = d >> 16 & 255, x.b = d >> 8 & 255, x.a = m((d & 255) / 0.255) / 1000;
            else x.r = d >> 16, x.g = d >> 8 & 255, x.b = d & 255, x.a = -1
        } return x
    };
    h = c0.length > 9, f = this.pSBCr(c0);
    if (!f) return null;
    if (p < 0) p *= -1, t = { r: 0, g: 0, b: 0, a: f.a };
    else t = { r: 255, g: 255, b: 255, a: f.a };
    r = m((t.r - f.r) * p) + f.r, g = m((t.g - f.g) * p) + f.g, b = m((t.b - f.b) * p) + f.b;
    return "#" + (0x1000000 + (f.a != -1 ? m(f.a * 255) : 0) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function getPlayerPalette(baseColor) {
    if (!baseColor) baseColor = "#31c489";
    
    return {
        base: baseColor,
        dark: pSBC(-0.4, baseColor),
        darker: pSBC(-0.7, baseColor),
        light: pSBC(0.6, baseColor),
        tag: pSBC(-0.5, baseColor),
        bright: pSBC(0.3, baseColor)
    };
}

        --light-color: ${palette.light};

        --bright-color: ${palette.bright};
    `;
}

    const snap2 = await ref2.once('value');

    console.log(`VALORE REALE DB per ${name1}:`, snap1.val());

    return {

// Funzione per applicare il colore alla TopBar (centralizzata)
async function applicaColoreUtente(user) {
    const topBar = document.querySelector('.top-bar');
    if (!user || !topBar) return;

    try {
        const nameSnap = await db.ref(`users/${user.uid}/name`).once('value');
        const userName = nameSnap.val();

        if (userName) {
            console.log("👤 Utente riconosciuto:", userName);
            const colorSnap = await db.ref(`players/${userName.toLowerCase().trim()}/info/color`).once('value');
            if (colorSnap.exists()) {
                const userColor = colorSnap.val();
                topBar.style.setProperty('background-color', userColor, 'important');
                console.log("🎨 Colore applicato:", userColor);
            }
        }
    } catch (e) {
        console.error("❌ Errore recupero colore:", e);
    }
}

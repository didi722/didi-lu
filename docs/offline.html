        button {

            background: #ffbd44; color: #000; border: 3px solid #fff; box-shadow: 4px 4px 0 rgba(255, 255, 255, .25);
            font: 900 1rem 'Josefin Sans', 'Trebuchet MS', system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase;

        button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(255, 255, 255, .25); }

    <script>
        // Nel sito si ricarica la pagina; nell'APK questa pagina sta nell'app e il sito vero è all'indirizzo che l'app apre di solito
        document.getElementById('riprova').addEventListener('click', function () {
            var sito = 'https://didi722.github.io/didi-lu/';
            if (location.hostname === 'localhost' && location.protocol === 'https:' && !location.port) location.href = sito;
            else location.href = location.pathname.replace(/offline\.html$/, '') || './';
        });
        window.addEventListener('online', function () { document.getElementById('riprova').click(); });
    </script>

// Funzione per scurire o schiarire un colore HEX
function pSBC(p, c0, c1, l) {
    let r, g, b, P, f, t, h, i = parseInt, m = Math.round, a = typeof (c1) == "string";
    if (typeof (p) != "number" || p < -1 || p > 1 || typeof (c0) != "string" || (c0[0] != 'r' && c0[0] != '#') || (c1 && !a)) return null;
    if (!this.pSBCr) this.pSBCr = (d) => {
        let n = d.length, x = {};
        if (n > 9) {
            [r, g, b, a] = d = d.split(","), n = d.length;
            if (n < 3 || n > 4) return null;
            x.r = i(r[3] == "a" ? r.slice(5) : r.slice(4)), x.g = i(g), x.b = i(b), x.a = a ? parseFloat(a) : -1
        } else {
            if (n == 8 || n == 6 || n < 4) return null;
            if (n < 6) d = "#" + d[1] + d[1] + d[2] + d[2] + d[3] + d[3] + (n > 4 ? d[4] + d[4] : "");
            d = i(d.slice(1), 16);
            if (n == 9 || n == 5) x.r = d >> 24 & 255, x.g = d >> 16 & 255, x.b = d >> 8 & 255, x.a = m((d & 255) / 0.255) / 1000;
            else x.r = d >> 16, x.g = d >> 8 & 255, x.b = d & 255, x.a = -1
        } return x
    };
    h = c0.length > 9, f = this.pSBCr(c0);
    if (!f) return null;
    if (p < 0) p *= -1, t = { r: 0, g: 0, b: 0, a: f.a };
    else t = { r: 255, g: 255, b: 255, a: f.a };
    r = m((t.r - f.r) * p) + f.r, g = m((t.g - f.g) * p) + f.g, b = m((t.b - f.b) * p) + f.b;
    return "#" + (0x1000000 + (f.a != -1 ? m(f.a * 255) : 0) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function getPlayerPalette(baseColor) {
    if (!baseColor) baseColor = "#31c489";

        light: pSBC(0.6, baseColor),
        tag: pSBC(-0.5, baseColor),
        bright: pSBC(0.3, baseColor)
    };
}

    async function applicaColoreBordo(pkmName, elementId) {
    const box = document.getElementById(elementId);
    if (!box) return;
    try {
        const cleanName = pkmName.toLowerCase().replace(/ /g, '-').replace(/[.'é]/g, '');
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${cleanName}`);
        const data = await res.json();
        
        const colori = {
            fire: '#ff4422', water: '#3399ff', grass: '#77cc55', electric: '#ffcc33', ice: '#66ccff', fighting: '#bb5544', poison: '#aa5599', ground: '#ddbb55', flying: '#8899ff', psychic: '#ff5599', bug: '#aabb22', rock: '#bbaa66', ghost: '#6666bb', dragon: '#7766ee', dark: '#775544', steel: '#aaaabb', fairy: '#ee99ee', normal: '#aaaa99'
        };

        const types = data.types.map(t => colori[t.type.name]);

        // Applichiamo il colore allo pseudo-elemento ::before
        if (types.length === 1) {
            box.style.setProperty('--bordo-colore', types[0]);
            box.style.styleSheet ? "" : box.setAttribute('style', `background-left: none;`); // cleanup
            // Usiamo il background diretto sullo pseudo-elemento tramite una variabile o stile iniettato
            box.style.setProperty('--bg-bordo', types[0]);
        } else {
            box.style.setProperty('--bg-bordo', `linear-gradient(to bottom, ${types[0]} 50%, ${types[1]} 50%)`);
        }
        
        // Applichiamo lo stile finale
        const bgEffettivo = types.length === 1 ? types[0] : `linear-gradient(to bottom, ${types[0]} 50%, ${types[1]} 50%)`;
        
        // Creiamo una piccola regola stile al volo per colpire il ::before di quel box specifico
        const stileDinamico = document.createElement('style');
        stileDinamico.innerHTML = `#${elementId}::before { background: ${bgEffettivo} !important; }`;
        document.head.appendChild(stileDinamico);

    } catch (e) {
        console.error("Error:", e);
    }
}

function applicaPaletteUtente(baseColor) {
    // Generiamo le sfumature usando la tua funzione pSBC già esistente
    const palette = {
        base: baseColor,
        dark: pSBC(-0.4, baseColor),       // 40% più scuro
        darker: pSBC(-0.88, baseColor),     // 80% più scuro (per i bordi delle card)
        light: pSBC(0.6, baseColor),       // 60% più chiaro
        bgGradient: pSBC(0.9, baseColor),  // 90% più chiaro (per lo sfondo del body)
        text: pSBC(-0.7, baseColor),        // Molto scuro (per il testo leggibile)
        tags: pSBC(-0.5, baseColor),
        bright: pSBC(0.3, baseColor)
    };

    const root = document.documentElement;

    // Iniettiamo i colori nelle variabili CSS
    root.style.setProperty('--bg-body', palette.bgGradient);
    root.style.setProperty('--light-color', palette.light);
    root.style.setProperty('--text-main', palette.text);
    root.style.setProperty('--accent-color', palette.base);
    root.style.setProperty('--border-color', palette.darker);
    root.style.setProperty('--tag-color', palette.tags);
    root.style.setProperty('--bright-color',palette.bright);
    root.style.setProperty('--dark-color', palette.dark);

    
    // Ombra delle card dinamica (colore base con 20% di opacità)
    root.style.setProperty('--card-shadow', `${palette.base}33`); 

    console.log("🎨 Palette CSS aggiornata correttamente.");
}



async function renderizzaBestTeam(team) {
    const container = document.getElementById('best-team-container');
    if (!team || !container) return;

    container.innerHTML = `
    <div class="card" onclick="apriDettagli('${team.id}')" style="cursor: pointer;">
        <div class="card-header">
            <span class="category">${team.category || team.categoria || 'VGC'}</span>
            <span class="stats">W: ${team.vittorie || 0} / L: ${team.sconfitte || 0}</span>
        </div>
        <h3>${team.nome}</h3>
        <div class="pkm-grid">
            ${team.pokemon.map((p, index) => {
                // Formattazione URL per PokeAPI e Sprite
                const pkmNameUrl = p.nome.toLowerCase().replace(/ /g, '-').replace(/[.'é]/g, '');
                const itemNameUrl = p.strumento.toLowerCase().replace(/ /g, '-').replace(/[.'é]/g, '');
                
                const pkmSprite = `https://play.pokemonshowdown.com/sprites/ani/${pkmNameUrl}.gif`;
                const itemSprite = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${itemNameUrl}.png`;
                
                const sideClass = (index % 2 === 0) ? 'left-side' : 'right-side';
                const pkmBoxId = `best-pkm-${index}`;
                
                // Serializzazione dati per passare l'oggetto al modale tecnico
                const pDataStr = JSON.stringify(p).replace(/"/g, '&quot;');

                // Applicazione colore bordo ritardata per attendere il rendering
                setTimeout(() => {
                    if (typeof applicaColoreBordo === 'function') {
                        applicaColoreBordo(p.nome, pkmBoxId);
                    }
                }, 100);

                return `
                    <div class="pkm-box" 
                         id="${pkmBoxId}" 
                         onclick="event.stopPropagation(); apriPkmDettaglio(${pDataStr}, '${pkmNameUrl}')">
                        
                        <div class="pkm-sprite-container">
                            <img src="${pkmSprite}" class="pkm-sprite" 
                                 onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png'">
                        </div>

                        <div class="pkm-info">
                            <span class="pkm-name">${p.nome}</span>
                            <div class="item-container">
                                <img src="${itemSprite}" class="item-icon" title="${p.strumento}" 
                                     onerror="this.style.display='none'">
                                <span class="pkm-item">${p.strumento}</span>
                            </div>
                        </div>

                        <!-- Hover Card / Tooltip -->
                        <div class="pkm-hover-card ${sideClass}">
                            <strong>${p.nome}</strong>
                            <p>✨ ${p.abilita}</p>
                            <p style="color: #1a1a1a !important; margin-bottom: 8px !important;">📊 ${p.evs}</p>
                            <div class="hover-moves">
                                ${p.mosse.map(m => `<span>${m}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    </div>
    `;
}   

async function apriDettagli(id) {
    const listaTeam = (typeof tuttiITeam !== 'undefined') ? tuttiITeam : window.tuttiITeam;
    
    if (!listaTeam || listaTeam.length === 0) {
        console.error("L'array dei team è vuoto o non caricato.");
        return;
    }

    const team = listaTeam.find(t => t.id === id);
    
    if (!team) {
        console.error("Team non trovato per l'ID:", id);
        return;
    }

    const modal = document.getElementById('teamModal');
    const content = document.getElementById('modalBody'); 
    if (!modal || !content) return;

    // --- CONFIGURAZIONE BADGE E SOGLIE ---
    const stats = team.stats || {};
    const teamBadges = team.badges || {}; 
    
    const badgeConfig = {
        'maxwonstrike': {
            path: 'immagini/team-wins.png',
            label: 'Win Streak',
            desc: '7+ matches won in a row.',
            min: 7
        },
        'maxcleanstrike': {
            path: 'immagini/team-clean.png',
            label: 'Clean Streak',
            desc: '4+ undefeated matches in a row.',
            min: 4
        },
        'maxshowdownstrike': {
            path: 'immagini/team-sd.png',
            label: 'SD Streak',
            desc: '3+ showdowns won in a row.',
            min: 3
        }
    };

    // Generazione HTML Badge per il Team con controllo soglia >=
    const teamBadgesHtml = Object.keys(teamBadges)
    .filter(bKey => {
        const config = badgeConfig[bKey];
        // Mostra solo se la chiave è in config E il valore è >= al minimo richiesto
        return config && parseInt(teamBadges[bKey] || 0) >= config.min;
    }) 
    .map(bKey => {
        const config = badgeConfig[bKey];
        const dataBadge = teamBadges[`${bKey}date`] || "--/--/----";
        return `
            <div class="badge-wrapper" style="position: relative; display: inline-block; cursor: help;">
                <img src="${config.path}" 
                     style="width: 50px; height: 50px; object-fit: contain; filter: drop-shadow(2px 2px 0px #000);">
                
                <div class="custom-badge-tooltip">
                    <span class="badge-date" style="position: absolute; top: 8px; right: 10px; font-size: 0.6rem; color: #666; font-family: monospace;">${dataBadge}</span>
                    <strong style="display: inline-block; margin-bottom: 8px; text-transform: uppercase; color: white; background: black; padding: 2px 8px; transform: rotate(-1.5deg); box-shadow: 3px 3px 0px rgba(0,0,0,0.3); max-width: 70%;">${config.label}</strong>
                    <p style="margin: 0; line-height: 1.2;">${config.desc}</p>
                </div>
            </div>`;
    }).join('');

    const w = Number(stats.won || 0);
    const l = Number(stats.lost || 0);
    const sV = Number(stats.setW || 0);
    const sP = Number(stats.setL || 0);
    const pts = Number(stats.points || team.puntiFatti || 0);
    const played = Number(stats.played || 0);

    content.innerHTML = `
        <div class="modal-header-container">
            <h2>${team.nome}</h2>
            <div class="header-right-area" style="display: flex; align-items: center; gap: 15px;">
                <div class="team-badges-container" style="display: flex; gap: 10px; align-items: center;">
                    ${teamBadgesHtml}
                </div>
                <div class="team-score-banner">
                    <div class="score-item"><span>W/L</span><strong>${w} - ${l}</strong></div>
                    <div class="score-item"><span>Sets</span><strong>${sV} - ${sP}</strong></div>
                    <div class="score-item"><span>Points</span><strong>${pts}</strong></div>
                    <div class="score-item"><span>Played</span><strong>${played}</strong></div>
                </div>
            </div>
        </div>

async function caricaStats(pkmName, elementId) {
    const tooltip = document.getElementById(elementId);
    if (tooltip.dataset.loaded === "true") return;

    try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pkmName}`);
        const data = await res.json();
        
        const statsMap = {
            'hp': 'HP',
            'attack': 'ATK',
            'defense': 'DEF',
            'special-attack': 'SPA',
            'special-defense': 'SPD',
            'speed': 'SPE'
        };

        let statsHTML = `<h4 class="panel-title">BASE STATS</h4>`;
        
        data.stats.forEach(s => {
            const val = s.base_stat;
            // Calcoliamo la larghezza della barra (max 150 per le stats base medie)
            const width = Math.min((val / 150) * 100, 100); 
            statsHTML += `
                <div class="stat-row">
                    <span style="width: 30px; font-weight:bold;">${statsMap[s.stat.name]}</span>
                    <span style="width: 25px; text-align:right;">${val}</span>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill" style="width: ${width}%"></div>
                    </div>
                </div>`;
        });

        tooltip.innerHTML = statsHTML;
        tooltip.dataset.loaded = "true";
    } catch (e) {
        tooltip.innerText = "Error.";
    }
}

// Nuova funzione per scaricare i tipi
// Aggiunto "direzione" ai parametri
async function caricaTipi(pkmName, elementId, direzione) {
    try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pkmName}`);
        const data = await res.json();
        const container = document.getElementById(elementId);
        if (!container) return;

        const d_types = ["normal","fire","water","electric","grass","ice","fighting","poison","ground","flying","psychic","bug","rock","ghost","dragon","dark","steel","fairy"];
        let effectiveness = {};
        d_types.forEach(type => effectiveness[type] = 1);

        await Promise.all(data.types.map(async (t) => {
            const typeRes = await fetch(t.type.url);
            const typeData = await typeRes.json();
            const rel = typeData.damage_relations;

            rel.double_damage_from.forEach(type => effectiveness[type.name] *= 2);
            rel.half_damage_from.forEach(type => effectiveness[type.name] *= 0.5);
            rel.no_damage_from.forEach(type => effectiveness[type.name] *= 0);
        }));

        let result = { x4: [], x2: [], x05: [], x025: [], x0: [] };
        for (let type in effectiveness) {
            const mult = effectiveness[type];
            if (mult === 4) result.x4.push(type);
            else if (mult === 2) result.x2.push(type);
            else if (mult === 0.5) result.x05.push(type);
            else if (mult === 0.25) result.x025.push(type);
            else if (mult === 0) result.x0.push(type);
        }

        const creaBadge = (lista) => {
            return `<div class="eff-badge-container">
                ${lista.map(t => `<span class="mini-type-badge ${t}">${t}</span>`).join('')}
            </div>`;
        };

        let tooltipHTML = "";
        if (result.x4.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-4">4x</span>${creaBadge(result.x4)}</div>`;
        if (result.x2.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-2">2x</span>${creaBadge(result.x2)}</div>`;
        if (result.x05.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-05">0.5x</span>${creaBadge(result.x05)}</div>`;
        if (result.x025.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-025">0.25x</span>${creaBadge(result.x025)}</div>`;
        if (result.x0.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-0">0x</span>${creaBadge(result.x0)}</div>`;

        // --- APPLICAZIONE CLASSE DIREZIONE ---
        container.innerHTML = data.types.map(t => 
        `<div class="type-container">
            <span class="type-badge ${t.type.name}">${t.type.name.toUpperCase()}</span>
            <div class="type-effectiveness-tooltip ${direzione}">${tooltipHTML}</div>
        </div>`
    ).join('');

    } catch (e) { console.error("Error:", e); }
}

        };

        const types = data.types.map(t => colori[t.type.name]);

        // Applichiamo lo stile finale

async function caricaInfoMossa(nomeMossa, elementoId) {
    const tooltip = document.getElementById(elementoId);
    
    // Se la mossa è vuota o già caricata, non fare nulla
    if (!nomeMossa || nomeMossa.trim() === "-" || tooltip.dataset.loaded === "true") return;

    try {
        const cleanName = nomeMossa.trim().toLowerCase().replace(/\s+/g, '-').replace(/[.'é]/g, '');
        const res = await fetch(`https://pokeapi.co/api/v2/move/${cleanName}`);
        
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        // --- APPLICHIAMO IL COLORE AL TOOLTIP ---
        const tipo = data.type.name; 
        tooltip.className = `move-tooltip ${tipo}`; // Aggiunge la classe del tipo (es. "fire") al fumetto
        // ----------------------------------------

        const power = data.power || '--';
        const accuracy = data.accuracy ? data.accuracy + '%' : '--';
        let effect = data.effect_entries.find(e => e.language.name === 'en')?.short_effect || "Descrizione non disponibile.";
        if (data.effect_chance) effect = effect.replace('$effect_chance', data.effect_chance);

        tooltip.innerHTML = `
            <div style="font-weight:bold; margin-bottom:4px; border-bottom:1px solid rgba(255,255,255,0.4);">
                ${nomeMossa.toUpperCase()}
            </div>
            <b>POW:</b> ${power} &nbsp;&nbsp; <b>ACC:</b> ${accuracy}<br>
            <div style="margin-top:6px; font-style:italic; font-size:0.7rem; line-height:1.2;">${effect}</div>
        `;
        
        tooltip.dataset.loaded = "true";
    } catch (e) {
        tooltip.innerText = "Dati mossa non trovati.";
        tooltip.style.background = "#33261c"; // Colore di fallback in caso di errore
    }
}

function inizializzaRotazioneTooltipMosse() {
    // Seleziona tutte le mosse nel modale
    const mosse = document.querySelectorAll('.move-span');

    mosse.forEach(mossa => {
        // Trova il tooltip figlio di questa mossa
        const tooltip = mossa.querySelector('.move-tooltip');
        
        if (!tooltip) return; // Sicurezza se il tooltip non esiste

        // Evento: Il mouse entra nella mossa
        mossa.addEventListener('mouseover', () => {
            // GENERA ROTAZIONE CASUALE
            // Esempio: tra -4deg e +4deg. Modifica i numeri per più/meno caos.
            const gradiCasuali = (Math.random() * 8 - 4).toFixed(2); 
            
            // APPLICA LA TRASFORMAZIONE
            // Dobbiamo mantenere translateX(-50%) per centrarlo rispetto alla mossa,
            // e aggiungere la rotazione casuale.
            tooltip.style.transform = `translateX(-50%) rotate(${gradiCasuali}deg)`;
            
            // Mostra il tooltip aggiungendo la classe CSS
            tooltip.classList.add('is-active');
        });

        // Evento: Il mouse esce dalla mossa
        mossa.addEventListener('mouseout', () => {
            // Nascondi il tooltip rimuovendo la classe
            tooltip.classList.remove('is-active');
            
            // Opzionale: resetta la trasformazione dopo un po' 
            // per evitare glitch visivi alla prossima apertura
            setTimeout(() => {
                tooltip.style.transform = 'translateX(-50%) rotate(0deg)';
            }, 150);
        });
    });
}

async function renderPlayerStats(playerName) {
    // 1. Recupero TUTTI i players per calcolare la posizione in classifica
    const playersRef = db.ref(`players`);
    const playersSnapshot = await playersRef.once('value');
    const allPlayers = playersSnapshot.val() || {};

    // Trasformiamo l'oggetto in un array per poterlo ordinare
    const playersArray = Object.keys(allPlayers).map(id => ({
        id: id,
        ranking: allPlayers[id].stats?.['individual-stats']?.ranking || 1000
    }));

    // Ordiniamo l'array dal ranking più alto al più basso
    playersArray.sort((a, b) => b.ranking - a.ranking);

    // Troviamo la posizione (index + 1)
    const position = playersArray.findIndex(p => p.id === playerName) + 1;
    
    // 2. Recupero le stats specifiche del player
    const stats = allPlayers[playerName]?.stats?.['individual-stats'] || {};

    const won = stats.won || 0;
    const lost = stats.lost || 0;
    const currentElo = stats.ranking || 1000;
    
    // --- CORREZIONE ACCESSO CHIAVI ---
    // Usiamo la notazione ['chiave'] perché i nomi nel DB hanno il trattino (es. format-won)
    const bestFormatData = stats.format || {};
    const formatName = bestFormatData['format-name'] || "-";
    const formatWon = bestFormatData['format-won'] || 0;
    const formatLost = bestFormatData['format-lose'] || 0; 

    const winRate = (won + lost) > 0 ? ((won / (won + lost)) * 100).toFixed(1) : 0;
    const setRate = ( (stats.setW || 0) + (stats.setL || 0) ) > 0 
        ? ((stats.setW / (stats.setW + stats.setL)) * 100).toFixed(1) : 0;

    const container = document.getElementById('stats-container');
    if (!container) return;

    // 3. Definiamo le stats da mostrare
    const items = [
        { 
            label: "RANKING", 
            value: `#${position} (${currentElo})` 
        },
        { label: "GLOBAL WON", value: won },
        { label: "% WIN", value: `${winRate}%` },
        { label: "% SET WON", value: `${setRate}%` },
        { 
            label: "BEST FORMAT", 
            // Mostra: Nome Formato (Vinte/Perse)
            value: formatName !== "-" ? `${formatName} (${formatWon}/${formatLost})` : "-" 
        }
    ];

    container.innerHTML = ""; 

    items.forEach(item => {
        const randomDeg = (Math.random() * 4 - 2).toFixed(2);
        
        const bar = document.createElement('div');
        bar.className = 'stat-bar';
        bar.style.setProperty('--rand-deg', `${randomDeg}deg`); 
        
        bar.innerHTML = `
            <span class="stat-label">${item.label}</span>
            <span class="stat-value">${item.value}</span>
        `;
        container.appendChild(bar);
    });
}

async function caricaPokemonPreferito(pkmNome) {
    const pkmArea = document.getElementById('pokemon-display-area');
    if (!pkmArea) return;

    try {
        let pkmNomePulito = pkmNome.toLowerCase().trim();

        // 1. GESTIONE FORME
        const formeSpeciali = {
            'mimikyu': 'mimikyu-disguised',
            'giratina': 'giratina-altered',
            'deoxys': 'deoxys-normal',
            'shaymin': 'shaymin-land',
            'aegislash': 'aegislash-shield'
        };
        if (formeSpeciali[pkmNomePulito]) pkmNomePulito = formeSpeciali[pkmNomePulito];

        // 2. FETCH DATI
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${pkmNomePulito}`);
        if (!response.ok) throw new Error("Pokémon non trovato");
        const pkmData = await response.json();

        const gifUrl = pkmData.sprites.other['showdown'].front_default 
                        || pkmData.sprites.other['official-artwork'].front_default;

        // 3. CALCOLO ALTEZZA (SCALA) - TUA FORMULA ORIGINALE
        const pkmAltezzaM = pkmData.height / 10;
        const trainerAltezzaM = 1.70;
        const trainerPx = 150; 
        let pkmPx = (pkmAltezzaM * trainerPx) / trainerAltezzaM;

        // --- GESTIONE SCALE SPECIALI ---
        const rimpicciolisciBlacklist = ['kyogre', 'wailord']; 
        const ingrandisciBlacklist = ['charizard']
        
        if (rimpicciolisciBlacklist.includes(pkmNomePulito)) {
            pkmPx *= 0.5; 
        } else if (ingrandisciBlacklist.includes(pkmNomePulito)) {
            pkmPx *= 1.5; // Ingrandimento forzato del 50%
        } else if (pkmAltezzaM < 0.6) {
            pkmPx *= 1.6; 
        } else if (pkmAltezzaM < 1.3) {
            pkmPx *= 1.35; 
        }
        
        pkmPx = Math.min(Math.max(pkmPx, 85), 350);

        // 4. LOGICA VOLO
        const aTerraBlacklist = ['gyarados','dodrio', 'umbreon', 'garchomp', 'murkrow', 'honchkrow', 'bronzong', 'scyther', 'tyranitar'];
        const floatingBlacklist = ['klefki', 'kyogre', 'mew', 'celebi', 'darkrai', 'haunter'];

        const isFloating = (
            pkmData.types.some(t => t.type.name === 'flying') || 
            pkmData.abilities.some(a => a.ability.name === 'levitate') ||
            floatingBlacklist.includes(pkmNomePulito) ||
            pkmNomePulito.includes('rayquaza')
        ) && !aTerraBlacklist.includes(pkmNomePulito);

        // 5. GESTIONE PROFONDITÀ (Z-INDEX)
        const sempreDavantiBlacklist = ['misdreavus', 'salamence', 'rapidash', 'mew', 'butterfree', 'scyther', 'charizard', 'honchkrow'];
        const sogliaDietro = trainerAltezzaM * 1.2; 
        
        if (sempreDavantiBlacklist.includes(pkmNomePulito)) {
            pkmArea.className = "pokemon-column pokemon-front";
        } else if (isFloating || pkmAltezzaM >= sogliaDietro) {
            pkmArea.className = "pokemon-column pokemon-back";
        } else {
            pkmArea.className = "pokemon-column pokemon-front";
        }

        // 6. INIEZIONE HTML - AGGIORNATA PER OMBRA SENZA SPORCO
        pkmArea.innerHTML = `
            <div class="pokemon-sprite-container ${isFloating ? 'floating-pkm' : ''}" 
                 style="height: ${pkmPx}px; opacity: 0; transition: opacity 0.3s;">
                
                <img src="${gifUrl}" 
                     class="pokemon-sprite pokemon-shadow-layer" 
                     style="height: 100%;" alt="">
                
                <img src="${gifUrl}" 
                     id="active-pkm-sprite"
                     class="pokemon-sprite" 
                     style="height: 100%;" 
                     alt="${pkmNome}">
            </div>
        `;

        const container = pkmArea.querySelector('.pokemon-sprite-container');
        const imgElement = document.getElementById('active-pkm-sprite');

        imgElement.onload = function() {
            const larghezzaEffettiva = imgElement.clientWidth;
            let posLeft = 130; 
            
            if (larghezzaEffettiva > 250) {
                posLeft = 240 - (larghezzaEffettiva / 1.8);
            } else if (pkmAltezzaM < 1.0) {
                posLeft = 145;
            }

            pkmArea.style.left = `${posLeft}px`;
            container.style.opacity = "1";
        };

    } catch (err) {
        console.error("Errore:", err);
    }
}

async function caricaBestTeamDallAlto(playerKey) {
    try {
        // 1. Recuperiamo i dati aggregati del Best Team
        // Ora il database contiene già: name, won, lose, played, setsW, setsL
        const bestTeamSnapshot = await db.ref(`players/${playerKey}/stats/team-stats/bestteam`).once('value');
        const bestData = bestTeamSnapshot.val();

        if (!bestData || !bestData.name || bestData.name === "-") {
            console.warn("Nessun Best Team calcolato per questo giocatore.");
            return;
        }

        // 2. Recuperiamo il team completo per ottenere la lista dei Pokémon (necessaria per le immagini)
        const allTeamsSnapshot = await db.ref(`players/${playerKey}/teams`).once('value');
        const allTeams = allTeamsSnapshot.val() || {};

        const teamKey = Object.keys(allTeams).find(key => allTeams[key].nome === bestData.name);
        const teamCompleto = allTeams[teamKey];

        // 3. RENDER NELLA SIDEBAR (Usiamo i dati di bestData per le statistiche)
        const nameEl = document.getElementById('best-team-name');
        if (nameEl) nameEl.innerText = bestData.name.toUpperCase();
        
        // Calcolo WinRate dai dati aggregati
        const v = bestData.won || 0;
        const p = bestData.played || 0;
        const wr = p > 0 ? ((v / p) * 100).toFixed(1) : "0.0";
        
        // Calcolo Punti (Vinte * 10 + Set Vinti) - Esempio di logica più complessa ora possibile
        const setsW = bestData.setsW || 0;
        const score = (v * 10) + setsW;

        if (document.getElementById('best-team-winrate')) 
            document.getElementById('best-team-winrate').innerText = `WR: ${wr}%`;
        
        if (document.getElementById('best-team-score')) 
            document.getElementById('best-team-score').innerText = `PTS: ${score}`;
            
        if (document.getElementById('best-team-usage')) 
            document.getElementById('best-team-usage').innerText = `PLAYED: ${p}`;

        // 4. Ciclo sui Pokemon (Griglia) utilizzando teamCompleto
        if (teamCompleto && teamCompleto.pokemon) {
            teamCompleto.pokemon.forEach((pkm, index) => {
                const i = index + 1;
                const pkmNameUrl = pkm.nome.toLowerCase().replace(/ /g, '-').replace(/[.'é]/g, '');
                
                const imgEl = document.getElementById(`team-pkm-${i}`);
                const pkmNameEl = document.getElementById(`team-pkm-${i}-name`);

                if (imgEl) {
                    imgEl.src = `https://play.pokemonshowdown.com/sprites/ani/${pkmNameUrl}.gif`;
                    imgEl.onerror = () => { imgEl.src = `https://play.pokemonshowdown.com/sprites/dex/${pkmNameUrl}.png`; };
                    
                    // Applica bordo se la funzione esiste
                    const slotBox = imgEl.closest('.pkm-slot');
                    if (slotBox && typeof applicaColoreBordo === 'function') {
                        applicaColoreBordo(pkm.nome, slotBox); 
                    }
                }
                
                if (pkmNameEl) pkmNameEl.innerText = pkm.nome.toUpperCase();
            });
        }

    } catch (error) {
        console.error("Errore nel caricamento del Best Team:", error);
    }
}

function renderPalmares(count, baseColor, titoloSalvato, typeUsageData = {}) {
    const container = document.getElementById('trophy-list');
    if (!container) return;
    container.innerHTML = "";

    const playerColor = baseColor.base || baseColor;
    const hasTrophies = count > 0;
    const displayCount = hasTrophies ? count : 0;
    const trophyImg = hasTrophies ? "immagini/season-winner.png" : "immagini/season-no-winner.png";
    const colorMask = hasTrophies ? "url('immagini/season-winner-color.png')" : "url('immagini/season-no-winner-color.png')";

    const TITOLI_MAP = {
        "Bug Catcher": "bug", "Punk Guy": "dark", "Dragon Tamer": "dragon",
        "Guitarist": "electric", "Fairy Tale Girl": "fairy", "Black Belt": "fighting",
        "Kindler": "fire", "Bird Keeper": "flying", "Hex Maniac": "ghost",
        "Aroma Lady": "grass", "Ruin Maniac": "ground", "Skier": "ice",
        "Rich Boy": "normal", "Ninja Boy": "poison", "Psychic": "psychic",
        "Hiker": "rock", "Working Man": "steel", "Fisherman": "water"
    };

    if (titoloSalvato && titoloSalvato !== "" && titoloSalvato !== "No Title") {
        const tipoAtteso = TITOLI_MAP[titoloSalvato] || titoloSalvato.split(" ")[0].toLowerCase();

        // Navigazione sicura dell'oggetto dati
        let targetData = typeUsageData;
        if (targetData && typeof targetData.val === 'function') targetData = targetData.val();
        if (targetData && targetData.stats) targetData = targetData.stats;
        if (targetData && targetData['team-stats']) targetData = targetData['team-stats'];
        if (targetData && targetData.typeusage) targetData = targetData.typeusage;

        let stats = { played: 0, won: 0 };
        if (targetData) {
            const keys = Object.keys(targetData);
            const match = keys.find(k => k.toLowerCase() === tipoAtteso.toLowerCase());
            if (match) stats = targetData[match];
        }

        const played = Number(stats.played) || 0;
        const won = Number(stats.won) || 0;

        // --- LOGICA DI CALCOLO DEL RANKING SUCCESSIVO ---
        let nextPlayedTarget = 50;
        let nextWonTarget = 0;

        if (played >= 150 && won >= 50) {
            nextPlayedTarget = 150;
            nextWonTarget = 50;
        } else if (played >= 100 && won >= 20) {
            nextPlayedTarget = 150;
            nextWonTarget = 50;
        } else if (played >= 50) {
            nextPlayedTarget = 100;
            nextWonTarget = 20;
        } else {
            nextPlayedTarget = 50;
            nextWonTarget = 0;
        }

        // Calcolo percentuali sbarre di progressione
        const progPlayed = nextPlayedTarget > 0 ? Math.min((played / nextPlayedTarget) * 100, 100) : 100;
        const progWon = nextWonTarget > 0 ? Math.min((won / nextWonTarget) * 100, 100) : 100;

        const titleBadge = document.createElement('div');
        titleBadge.id = "player-active-title-badge";
        titleBadge.className = `hub-title-badge tipo-${tipoAtteso}`;
        
        // FISSIAMO LO STACKING CONTEXT SUL BADGE PADRE
        titleBadge.style.position = "relative";
        titleBadge.style.zIndex = "999"; 
        titleBadge.style.display = "inline-block";
        titleBadge.innerText = titoloSalvato;

        // Stili CSS strutturali in linea per le barre interne
        const bgStyle = `style="background: #e0e0e0; border: 2px solid #000; height: 12px; border-radius: 4px; margin: 4px 0 8px 0; overflow: hidden; position: relative; width: 100%; text-align: left;"`;
        const fillStyle = (percent) => `style="background: ${playerColor}; height: 100%; width: ${percent}%; border-right: ${percent > 0 ? '2px solid #000' : 'none'}; transition: width 0.3s ease;"`;

        const tooltip = document.createElement('span');
        tooltip.className = "neubrutal-tooltip";
        
        // AGGRESSIVE OVERRIDE DELLO STACKING CONTEXT SUL TOOLTIP
        tooltip.style.position = "absolute";
        tooltip.style.zIndex = "99999";
        tooltip.style.minWidth = "210px";
        tooltip.style.boxSizing = "border-box";
        tooltip.style.transform = "rotate(3deg)";

        const grayWonText = nextWonTarget > 0 ? `<span style="color: #888; font-size: 11px; white-space: nowrap;">${nextWonTarget}</span>` : '';

        tooltip.innerHTML = `
            <div class="tooltip-row" style="display: flex; justify-content: space-between; align-items: center; font-weight: bold; width: 100%;">
                <span style="white-space: nowrap;">Played: ${played}</span>
                <span style="color: #888; font-size: 11px; white-space: nowrap;">${nextPlayedTarget}</span>
            </div>
            <div class="progress-bar-bg" ${bgStyle}>
                <div class="progress-bar-fill" ${fillStyle(progPlayed)}></div>
            </div>
            
            <div class="tooltip-row" style="display: flex; justify-content: space-between; align-items: center; font-weight: bold; width: 100%; margin-top: 4px;">
                <span style="white-space: nowrap;">Won: ${won}</span>
                ${grayWonText}
            </div>
            <div class="progress-bar-bg" ${bgStyle}>
                <div class="progress-bar-fill" ${fillStyle(progWon)}></div>
            </div>
        `;
        
        titleBadge.appendChild(tooltip);
        container.appendChild(titleBadge);
    }

    const trophyWrapper = document.createElement('div');
    trophyWrapper.className = 'compact-palmares';
    trophyWrapper.style.setProperty('--player-color', playerColor);
    
    // Evitiamo che anche il wrapper dei trofei crei blocchi parassiti davanti al badge
    trophyWrapper.style.position = "relative";
    trophyWrapper.style.zIndex = "1";

    trophyWrapper.innerHTML = `
        <span class="trophy-count">x${displayCount}</span>
        <div class="trophy-recolor-wrapper">
            <div class="trophy-color-base" style="-webkit-mask-image: ${colorMask}; mask-image: ${colorMask};"></div>
            <img src="${trophyImg}" class="trophy-icon-top">
        </div>
    `;
    container.appendChild(trophyWrapper);
}

function caricaBadge(stats, playerKey) {
    const container = document.getElementById('badges-container');
    if (!container) return;

    const formattaData = (dataRaw) => {
        if (!dataRaw || dataRaw === '--/--/--' || dataRaw === 'Data N.D.') return '--/--/----';
        try {
            const d = new Date(dataRaw);
            if (isNaN(d.getTime())) return dataRaw; 
            const giorno = String(d.getDate()).padStart(2, '0');
            const mese = String(d.getMonth() + 1).padStart(2, '0');
            const anno = d.getFullYear();
            return `${giorno}/${mese}/${anno}`;
        } catch (e) { return dataRaw; }
    };

    const badgeConfig = [
        {
            id: 'clean',
            label: 'Clean Streak',
            descTemplate: (n) => `${n} matches undefeated`,
            max: parseInt(stats.maxcleanstrike) || 0,
            current: parseInt(stats.cleanstrike) || 0,
            date: formattaData(stats.maxcleanstrikedate),
            steps: [3, 5, 7]
        },
        {
            id: 'won',
            label: 'Win Streak',
            descTemplate: (n) => `${n} matches in a row`,
            max: parseInt(stats.maxwonstrike) || 0,
            current: parseInt(stats.wonstrike) || 0,
            date: formattaData(stats.maxwonstrikedate),
            steps: [5, 7, 10]
        },
        {
            id: 'sd',
            label: 'SD Streak',
            descTemplate: (n) => `${n} showdowns in a row`,
            max: parseInt(stats.maxsdstrike) || 0,
            current: parseInt(stats.sdstrike) || 0,
            date: formattaData(stats.sdwonstrikedate),
            steps: [3, 5, 7]
        }
    ];

    container.innerHTML = '';

    // --- 1. FOUNDER BADGE ---
    const pKeyLower = playerKey ? playerKey.trim().toLowerCase() : "";
    if (pKeyLower === 'didi' || pKeyLower === 'lu') {
        const founderHTML = `
            <div class="badge-item">
                <img src="immagini/badge_founder.png" class="badge-img" alt="Founder">
                <div class="neubrutal-tooltip">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">

                        <span style="font-size: 0.7rem; color: #666; font-weight: bold;"></span>
                    </div>
                    <p style="margin-top: 5px; font-size: 0.85rem;">Hail to the kings</p>
                </div>
            </div>`;
        container.insertAdjacentHTML('beforeend', founderHTML);
    }

    // --- 2. DYNAMIC BADGES ---
    badgeConfig.forEach(b => {
        let level = ""; 
        let milestone = 0;
        let nextGoal = b.steps[0];

        // Determiniamo il livello e la milestone raggiunta
        if (b.max >= b.steps[2]) {
            level = "gold";
            milestone = b.steps[2];
            nextGoal = b.steps[2]; // Max raggiunto
        } else if (b.max >= b.steps[1]) {
            level = "silver";
            milestone = b.steps[1];
            nextGoal = b.steps[2];
        } else if (b.max >= b.steps[0]) {
            level = "bronze";
            milestone = b.steps[0];
            nextGoal = b.steps[1];
        }

        if (level !== "") {
            const progress = Math.min((b.current / nextGoal) * 100, 100);
            // Generiamo la descrizione dinamica usando la milestone raggiunta
            const dynamicDesc = b.descTemplate(milestone);

function avviaMusicaGiocatore(urlMusica) {
    const player = document.getElementById('bg-music-home');
    if (!player || !urlMusica) return;

    // Recuperiamo la preferenza salvata (on/off)
    const savedPref = localStorage.getItem('userMusicPref') || 'on';

    if (player.src !== urlMusica) {
        player.src = urlMusica;
        player.volume = 0.3;
        player.loop = true; // Assicuriamoci che vada in loop
        
        // Se l'utente non ha silenziato il sito precedentemente, proviamo l'autoplay
        if (savedPref === 'on') {
            player.play()
                .then(() => console.log("Musica del giocatore partita!"))
                .catch(() => {
                    console.log("Autoplay bloccato, attendo interazione.");
                    const musicBtn = document.getElementById('music-control');
                    if (musicBtn) musicBtn.classList.add('muted');
                });
        } else {
            player.pause();
            const musicBtn = document.getElementById('music-control');
            if (musicBtn) musicBtn.classList.add('muted');
        }
    }
}

document.addEventListener('click', () => {

    const musicPref = localStorage.getItem('userMusicPref') || 'on';

    if (player && player.paused && musicPref === 'on') {

            .catch(err => console.warn("Autoplay bloccato dal browser:", err));
    } else {
        console.log("🔇 Musica rimane spenta al click (Preferenza: OFF)");
    }
}, { once: true });

// --- 2. FUNZIONE TOGGLE AGGIORNATA ---
function toggleMusic() {
    const player = document.getElementById('bg-music-home') || document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-control') || document.getElementById('music-toggle');

    if (!player || !musicBtn) return;

    if (player.paused || player.muted) {
        // RESET E ACCENSIONE
        player.muted = false; 
        player.volume = 0.3; 

        player.play().then(() => {
            musicBtn.classList.remove('muted');
            localStorage.setItem('userMusicPref', 'on'); // SALVA ON
            console.log("🔊 Musica ripresa");
        }).catch(error => {
            console.warn("Autoplay bloccato:", error);
            musicBtn.classList.add('muted');
        });
        
    } else {
        // SPEGNIMENTO TOTALE
        player.pause();
        player.muted = true; 
        
        musicBtn.classList.add('muted');
        localStorage.setItem('userMusicPref', 'off'); // SALVA OFF
        console.log("🔇 Musica fermata");
    }
}

// --- 3. SINCRONIZZAZIONE ALL'AVVIO ---
// Questo serve per far sì che il bottone mostri la sbarra corretta appena carichi la pagina

    const musicPref = localStorage.getItem('userMusicPref') || 'on';

/** * AGGIUNTA FONDAMENTALE: 
 * Al caricamento della pagina, controlla se l'utente aveva precedentemente 
 * silenziato la musica in un'altra parte del sito.
 */
window.addEventListener('DOMContentLoaded', () => {
    const player = document.getElementById('bg-music-home');
    const musicBtn = document.getElementById('music-control');
    const savedPref = localStorage.getItem('userMusicPref');

    if (player && musicBtn) {
        if (savedPref === 'off') {
            // Se l'utente ha scelto 'off' altrove, non far partire nulla
            player.pause();
            musicBtn.classList.add('muted');
        } else {
            // Altrimenti prova a farla partire (rispettando i blocchi del browser)
            player.play().catch(() => {
                musicBtn.classList.add('muted');
            });
        }
    }
});

async function resetPasswordDalLogin() {
    const emailInput = document.getElementById('login-email');
    const emailValue = emailInput ? emailInput.value.trim() : "";

    // 1. Controlla se l'utente ha inserito l'email
    if (!emailValue) {
        alert("⚠️ Inserisci il tuo indirizzo email nel campo sopra per richiedere il reset della password.");
        if (emailInput) emailInput.focus();
        return;
    }

    // 2. Chiedi conferma
    if (!confirm(`Inviare il link per reimpostare la password a: ${emailValue}?`)) return;

    // 3. Attiva l'overlay della Pokeball se presente nella pagina di login
    const loader = document.getElementById('loading-overlay');
    if (loader) loader.classList.add('active');

    try {
        // 4. Chiamata a Firebase Auth tramite l'email passata dall'input
        await firebase.auth().sendPasswordResetEmail(emailValue);
        
        alert(`📧 Email di ripristino inviata!\n\nControlla la casella di posta (e la cartella Spam) all'indirizzo: ${emailValue}`);
        
    } catch (error) {
        console.error("Errore durante il reset della password dal login:", error);
        
        // Gestione degli errori tipici in fase di login
        if (error.code === 'auth/user-not-found') {
            alert("Errore: Questo indirizzo email non è registrato nel sistema.");
        } else if (error.code === 'auth/invalid-email') {
            alert("Errore: L'indirizzo email inserito non è valido.");
        } else if (error.code === 'auth/too-many-requests') {
            alert("Errore: Troppi tentativi di recente. Riprova tra qualche minuto.");
        } else {
            alert("Errore: " + error.message);
        }
    } finally {
        // 5. Spegni il loader
        if (loader) loader.classList.remove('active');
    }
}

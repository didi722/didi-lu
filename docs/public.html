// Funzione per scurire o schiarire un colore HEX
function pSBC(p, c0, c1, l) {
    let r, g, b, P, f, t, h, i = parseInt, m = Math.round, a = typeof (c1) == "string";
    if (typeof (p) != "number" || p < -1 || p > 1 || typeof (c0) != "string" || (c0[0] != 'r' && c0[0] != '#') || (c1 && !a)) return null;
    if (!this.pSBCr) this.pSBCr = (d) => {
        let n = d.length, x = {};
        if (n > 9) {
            [r, g, b, a] = d = d.split(","), n = d.length;
            if (n < 3 || n > 4) return null;
            x.r = i(r[3] == "a" ? r.slice(5) : r.slice(4)), x.g = i(g), x.b = i(b), x.a = a ? parseFloat(a) : -1
        } else {
            if (n == 8 || n == 6 || n < 4) return null;
            if (n < 6) d = "#" + d[1] + d[1] + d[2] + d[2] + d[3] + d[3] + (n > 4 ? d[4] + d[4] : "");
            d = i(d.slice(1), 16);
            if (n == 9 || n == 5) x.r = d >> 24 & 255, x.g = d >> 16 & 255, x.b = d >> 8 & 255, x.a = m((d & 255) / 0.255) / 1000;
            else x.r = d >> 16, x.g = d >> 8 & 255, x.b = d & 255, x.a = -1
        } return x
    };
    h = c0.length > 9, f = this.pSBCr(c0);
    if (!f) return null;
    if (p < 0) p *= -1, t = { r: 0, g: 0, b: 0, a: f.a };
    else t = { r: 255, g: 255, b: 255, a: f.a };
    r = m((t.r - f.r) * p) + f.r, g = m((t.g - f.g) * p) + f.g, b = m((t.b - f.b) * p) + f.b;
    return "#" + (0x1000000 + (f.a != -1 ? m(f.a * 255) : 0) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function getPlayerPalette(baseColor) {
    if (!baseColor) baseColor = "#31c489";
    
    return {
        base: baseColor,
        dark: pSBC(-0.3, baseColor),
        darker: pSBC(-0.7, baseColor),
        light: pSBC(0.6, baseColor),
        tag: pSBC(-0.5, baseColor),
        bright: pSBC(0.3, baseColor)
    };
}

        --tag-color: ${palette.tag};
        --bright-color: ${palette.bright};
    `;
}

// Il testo che viene dal database entra nell'HTML solo protetto
const escHtml = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// La versione pubblica di un team: id, nome, formato, record e specie dei Pokémon (con l'amicizia, che è un vanto). Niente set.
function versionePubblica(id, t) {
    t = t || {};
    const nome = t.nome && typeof t.nome === 'object' ? t.nome.valore : t.nome;
    const stats = t.stats && typeof t.stats === 'object' ? t.stats : {};
    return {
        id,
        nome: nome || '',
        categoria: t.categoria || t.category || '',
        stats: { won: stats.won, lost: stats.lost, lose: stats.lose, setW: stats.setW, setL: stats.setL, points: stats.points, played: stats.played },
        vittorie: Number(stats.won || 0),
        pokemon: Object.values(t.pokemon || {}).filter(p => p && p.nome).map(p => ({
            nome: String(p.nome),
            amicizia: !!(p.badges && (p.badges.loyaltybadge === true || p.badges.loyaltyBadge === true))
        }))
    };
}

async function initPublicProfile() {
    const loader = document.getElementById('poke-loader');

    // Assicuriamoci che il loader sia visibile all'avvio
    if (loader) {
        loader.style.display = 'flex';
        loader.style.opacity = '1';
        loader.classList.remove('hidden');
    }

    const urlParams = new URLSearchParams(window.location.search);
    let playerKey = urlParams.get('player')?.trim();

    // CASO 1: Nessun parametro nell'URL -> Chiudiamo il loader ed usciamo
    if (!playerKey) {
        console.error("No player specified in URL");
        PublicCard.mostraMessaggio("PLAYER MISSING");
        nascondiLoader(loader);
        return;
    }

    try {
        let snapshot = await db.ref(`players/${playerKey}/info`).once('value');
        let info = snapshot.val();

        if (!info) {
            playerKey = playerKey.toLowerCase();
            snapshot = await db.ref(`players/${playerKey}/info`).once('value');
            info = snapshot.val();
        }

        if (!info) {
            // CASO 2: Giocatore non trovato nel database
            PublicCard.mostraMessaggio("PLAYER NOT FOUND");
            return;
        }

        // Tutto quello che serve alla carta, in parallelo
        const leggi = percorso => db.ref(percorso).once('value').then(snap => snap.val()).catch(err => {
            console.error(`Error occurred while fetching ${percorso}:`, err);
            return null;
        });
        const [badges, stagioni, tipi, pokemon, teamsGrezzi, tutti] = await Promise.all([
            leggi(`players/${playerKey}/stats/badges`),
            leggi(`players/${playerKey}/stats/seasons`),
            leggi(`players/${playerKey}/stats/team-stats/typeusage`),
            leggi(`players/${playerKey}/stats/team-stats/pokemonusage`),
            leggi(`players/${playerKey}/teams`),
            leggi(`players`)
        ]);

        // I team come elenco; window.tuttiITeam serve al modale del team (apriDettagli). Qui entra solo ciò che è pubblico: id, nome, formato,
        // record e le specie dei sei Pokémon. Strumenti, abilità, nature, EV e mosse non si leggono in questa pagina: il team potrebbe essere
        // iscritto a una stagione a scheda chiusa, e i dettagli di un team si vedono solo nel Box del suo giocatore o nelle stagioni a scheda aperta.
        const teams = Object.keys(teamsGrezzi || {}).map(key => versionePubblica(key, teamsGrezzi[key]));
        window.tuttiITeam = teams;
        // anche degli altri giocatori servono solo il profilo e i numeri (classifica, tessera): i loro team non servono a questa pagina
        const tuttiPubblico = Object.fromEntries(Object.entries(tutti || {}).map(([k, g]) => [k, { info: g && g.info, stats: g && g.stats }]));

        const colore = info.color || '#31c489';
        const palette = getPlayerPalette(colore);
        document.documentElement.style.setProperty('--accent-color', palette.base);
        document.documentElement.style.setProperty('--bright-color', palette.bright);
        document.documentElement.style.setProperty('--dark-color', palette.dark);

        const nome = info.name || playerKey;
        document.title = `${nome} \u00b7 Trainer Card \u00b7 Sant'Alvise Pkmn League`;

        // i badge dell'allenatore si calcolano sui numeri di tutto il sito (una lettura per pagina); senza, restano le medaglie delle serie
        let badgeAllenatore = [];
        let stagioniVinte = null;     // le stagioni vinte come le contano i badge (dalla classifica di ogni stagione chiusa); senza, il contatore del profilo
        try {
            if (window.BadgeAllenatore && window.Fiocchi) {
                const r = await BadgeAllenatore.carica(db, playerKey);
                badgeAllenatore = BadgeAllenatore.guadagnati(r.lista);
                if (r.dati) stagioniVinte = { conteggio: r.stagioniVinte, elenco: r.elencoStagioniVinte };
            }
        } catch (e) { console.warn('Trainer badges not available:', e); }

        // la personalità (scarti dalla media della lega, stessa lettura di tutto il sito): se non c'è abbastanza, il blocco resta vuoto
        let personalita = null;
        try {
            if (window.Personalita && window.Fiocchi) {
                const risultato = await Fiocchi.carica(db);
                personalita = Personalita.calcola(risultato.players, playerKey);
            }
        } catch (e) { console.warn('Personality not available:', e); }

        PublicCard.monta({
            chiave: playerKey,
            nome,
            colore,
            info,
            badges: badges || {},
            badgeAllenatore,
            personalita,
            stagioni: stagioni || {},
            stagioniVinte,
            tipi: tipi || {},
            pokemon: pokemon || {},
            teams,
            tutti: tuttiPubblico
        });

        // la musica parte (se l'utente non l'ha tolta nel resto del sito) solo se il widget della canzone è in vista
        if (info.musicaPreferita && PublicCard.musicaAttiva()) avviaMusicaGiocatore(info.musicaPreferita);

        inizializzaChiusuraModali();
    } catch (e) {
        console.error("Error occurred while fetching player data:", e);
    } finally {
        // --- CHIUSURA LOADER GARANTITA ---
        nascondiLoader(loader);
    }
}

// Helper per nascondere il loader in modo fluido
function nascondiLoader(loaderEl) {
    const loader = loaderEl || document.getElementById('poke-loader');
    if (!loader) return;
    
    loader.style.opacity = '0';
    loader.classList.add('hidden');
    setTimeout(() => {
        loader.style.display = 'none';
    }, 500);
}

function closeTeamModal() {
    const modal = document.getElementById('teamModal');
    if (modal) {
        modal.style.display = 'none';
        // Opzionale: svuota il contenuto per ricaricarlo pulito la prossima volta
        document.getElementById('modalBody').innerHTML = '';
    }
}

function chiudiPkmModal() {
    const modal = document.getElementById('pkmDetailModal');
    if (modal) {
        modal.style.display = "none";
        // Opzionale: puliamo il contenuto per resettare le API alla prossima apertura
        document.getElementById('pkmModalBody').innerHTML = "";
    }
}

    

function applicaPaletteUtente(baseColor) {
    // Generiamo le sfumature usando la tua funzione pSBC già esistente
    const palette = {
        base: baseColor,
        dark: pSBC(-0.4, baseColor),       // 40% più scuro
        darker: pSBC(-0.88, baseColor),     // 80% più scuro (per i bordi delle card)
        light: pSBC(0.6, baseColor),       // 60% più chiaro
        bgGradient: pSBC(0.9, baseColor),  // 90% più chiaro (per lo sfondo del body)
        text: pSBC(-0.7, baseColor),        // Molto scuro (per il testo leggibile)
        tags: pSBC(-0.5, baseColor),
        bright: pSBC(0.3, baseColor)
    };

    const root = document.documentElement;

    // Iniettiamo i colori nelle variabili CSS
    root.style.setProperty('--bg-body', palette.bgGradient);
    root.style.setProperty('--light-color', palette.light);
    root.style.setProperty('--text-main', palette.text);
    root.style.setProperty('--accent-color', palette.base);
    root.style.setProperty('--border-color', palette.darker);
    root.style.setProperty('--tag-color', palette.tags);

// Il team di un allenatore, visto da chiunque: nome, record, le medagliette dei badge del team e i sei Pokémon con le medagliette dei loro fiocchi.
// Mai strumenti, abilità, nature, EV e mosse (potrebbero essere di una stagione a scheda chiusa) e mai i progressi verso il livello dopo
// (lo scaffale dei badge è solo nel Box del giocatore): solo ciò che è stato vinto, con la descrizione al passaggio.
async function apriDettagli(id) {
    const listaTeam = (typeof tuttiITeam !== 'undefined') ? tuttiITeam : window.tuttiITeam;

    if (!listaTeam || listaTeam.length === 0) {
        console.error("The teams array is empty or not loaded.");
        return;
    }

    const team = listaTeam.find(t => t.id === id);

    if (!team) {
        console.error("Team not found for ID:", id);
        return;
    }

    const modal = document.getElementById('teamModal');
    const content = document.getElementById('modalBody');
    if (!modal || !content) return;

    const stats = team.stats || {};

    const w = Number(stats.won || 0);
    const l = Number(stats.lost || 0);
    const sV = Number(stats.setW || 0);
    const sP = Number(stats.setL || 0);
    const pts = Number(stats.points || 0);
    const played = Number(stats.played || 0);

    content.innerHTML = `
        <div class="modal-header-container">
            <h2>${escHtml(team.nome)}</h2>
            <div class="header-right-area">
                <span class="bt-barra-team" data-badge-team></span>
                <div class="team-score-banner">
                    <div class="score-item"><span>W/L</span><strong>${w} - ${l}</strong></div>
                    <div class="score-item"><span>Sets</span><strong>${sV} - ${sP}</strong></div>
                    <div class="score-item"><span>Points</span><strong>${pts}</strong></div>
                    <div class="score-item"><span>Played</span><strong>${played}</strong></div>
                </div>
            </div>
        </div>

        <div class="modal-grid">
            ${team.pokemon.map((p, pIndex) => `
                <div class="modal-pkm-card modal-pkm-card-apri" role="button" tabindex="0" data-i="${pIndex}" aria-label="${escHtml(p.nome)}">
                    <div class="pkm-badges-overlay" data-fiocchi-pkm="${pIndex}"></div>
                    <div class="modal-left-column">
                        <img src="${SpritePkm.gif(p.nome)}" class="modal-sprite" alt=""
                             onerror="SpritePkm.riserva(this, '${SpritePkm.id(p.nome)}')">
                    </div>
                    <div class="modal-pkm-info">
                        <strong>${escHtml(p.nome)}</strong>
                    </div>
                </div>`).join('')}
        </div>
    `;
    // un Pokémon si apre cliccandolo (la lista è quella della pagina, i nomi non passano dall'HTML)
    const apri = scheda => {
        if (!scheda) return;
        const i = Number(scheda.dataset.i);
        apriPkmDettaglio(team.pokemon[i], SpritePkm.id(team.pokemon[i].nome), i);
    };
    content.onclick = e => apri(e.target.closest('.modal-pkm-card'));
    content.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); apri(e.target.closest('.modal-pkm-card')); } };
    modal.style.display = "flex";

    // le medagliette arrivano appena sono pronte le statistiche reali
    window.squadraAperta = team;
    if (typeof Fiocchi !== 'undefined') {
        const valido = () => window.squadraAperta === team;
        if (typeof BadgeTeam !== 'undefined') {
            BadgeTeam.montaBarra(db, content.querySelector('[data-badge-team]'), { giocatore: giocatoreDellaPagina(), team, valido });
        }
        Fiocchi.riempiMini(db, content, { giocatore: giocatoreDellaPagina(), team, valido, max: 4, amicizia: p => !!p.amicizia });
    }
}

// Il Pokémon di un team, visto da chiunque: lo sprite, il nome, il team e le medagliette dei fiocchi vinti (con la descrizione al passaggio).
// Niente mosse, abilità, strumento, EV o natura, e niente progressi: i fiocchi con i progressi stanno nella scheda del Box del suo giocatore.
async function apriPkmDettaglio(pokemonData, pkmNameUrl, indice) {
    const modal = document.getElementById('pkmDetailModal');
    const content = document.getElementById('pkmModalBody');
    if (!modal || !content || !pokemonData) return;

    const playerName = giocatoreDellaPagina();
    if (!playerName) {
        console.error("Player name not found in URL!");
        return;
    }
    const team = window.squadraAperta;
    const nome = String(pokemonData.nome || '').trim();

    // l'amicizia è l'unico fiocco assegnato a mano: si legge solo quella dai dati salvati (gli altri si calcolano, fiocchi.js)
    let amicizia = !!pokemonData.amicizia;
    if (!amicizia) {
        try {
            const pkmSnap = await db.ref(`players/${playerName}/pokemon-badges/${nome}`).once('value');
            const badgesData = pkmSnap.val() || {};
            amicizia = badgesData.loyaltybadge === true || badgesData.loyaltyBadge === true;
        } catch (e) { /* senza, il fiocco dell'amicizia segue i numeri */ }
    }

    content.innerHTML = `
        <div class="pp-pkm-scheda">
            <img id="pkm-hero-sprite" class="pp-pkm-hero" src="${SpritePkm.gif(nome || pkmNameUrl)}" alt="" onerror="SpritePkm.riserva(this, '${SpritePkm.id(nome || pkmNameUrl)}')">
            <h2 class="pp-pkm-nome">${escHtml(nome)}</h2>
            ${team && team.nome ? `<p class="pp-pkm-team">${escHtml(team.nome)}</p>` : ''}
            <h4 class="pp-pkm-etichetta">RIBBONS</h4>
            <div class="pp-pkm-fiocchi" id="pkm-fiocchi" data-fiocchi-pkm="${Number.isInteger(indice) ? indice : 0}">
                <span class="fiocchi-caricamento">Loading ribbons…</span>
            </div>
        </div>
    `;
    modal.style.display = "flex";

    // i fiocchi: arrivano appena sono pronte le statistiche reali
    const casella = document.getElementById('pkm-fiocchi');
    const nessuno = testo => { if (document.getElementById('pkm-fiocchi') === casella) casella.innerHTML = `<span class="pp-nota">${testo}</span>`; };
    if (typeof Fiocchi === 'undefined' || !team) return nessuno('No ribbons yet.');
    const posto = Number.isInteger(indice) ? indice : team.pokemon.indexOf(pokemonData);
    casella.dataset.fiocchiPkm = String(posto);
    const ok = await Fiocchi.riempiMini(db, modal, {
        giocatore: playerName, team, max: 99, amicizia: p => p === pokemonData && amicizia,
        valido: () => document.getElementById('pkm-fiocchi') === casella
    });
    if (document.getElementById('pkm-fiocchi') !== casella) return;
    if (!ok) nessuno('Ribbons are not available right now.');
    else if (!casella.querySelector('.bt-mini')) nessuno('No ribbons yet.');
}

// Variabile globale per distruggere l'istanza precedente del grafico se si cambia giocatore
let eloChartInstance = null;



async function mostraGraficoElo(playerName) {
    if (!playerName) return;

    const modal = document.getElementById('elo-modal');
    const modalTitle = document.getElementById('elo-modal-title');
    const closeBtn = document.getElementById('close-elo-modal');

    if (!modal) return;
    modal.style.setProperty('display', 'flex', 'important');
    if (modalTitle) modalTitle.innerText = `RANKING HISTORY`;

    closeBtn.onclick = () => modal.style.setProperty('display', 'none', 'important');
    modal.onclick = (e) => { if (e.target === modal) modal.style.setProperty('display', 'none', 'important'); };

    try {
        // Recupera tutte le stagioni anziché solo sbeta
        const snapshot = await db.ref(`seasons`).once('value');
        const seasons = snapshot.val() || {};
        const searchName = playerName.toLowerCase().trim();
        let matchStorici = [];

        console.log("--- INIZIO ANALISI DATI ELO ---");

        Object.keys(seasons).forEach(seasonKey => {
            // 🛠️ ESCLUSIONE STAGIONE SBETA
            if (seasonKey === 'sbeta') return;

            const showdowns = seasons[seasonKey]?.showdowns || {};

            Object.keys(showdowns).forEach(sdId => {
                const sd = showdowns[sdId];
                if (sd.matches) {
                    Object.entries(sd.matches).forEach(([matchKey, m]) => {
                        // Controllo validità base
                        if (!m.player1Id || !m.player2Id || !m.data) return;

                        // --- CACCIA ALL'ERRORE (DEBUG) ---
                        if (m.data && m.data.includes("03-16")) {
                            console.error(`!!! SUSPICIOUS DATA FOUND !!! 
                            Season: ${seasonKey}
                            Showdown: ${sdId}
                            Match: ${matchKey}
                            Data nel DB: ${m.data}
                            Oggetto Completo:`, m);
                        }
                        // ---------------------------------

                        const p1 = m.player1Id.toLowerCase().trim();
                        const p2 = m.player2Id.toLowerCase().trim();

                        if (p1 === searchName || p2 === searchName) {
                            const base = p1 === searchName ? parseFloat(m.p1EloAtMatch) : parseFloat(m.p2EloAtMatch);
                            const delta = p1 === searchName ? parseFloat(m.p1DeltaElo) : parseFloat(m.p2DeltaElo);
                            
                            if (!isNaN(base) && !isNaN(delta)) {
                                matchStorici.push({
                                    dataRaw: m.data,
                                    elo: base + delta,
                                    timestamp: new Date(m.data).getTime()
                                });
                            }
                        }
                    });
                }
            });
        });

        // Ordine cronologico
        matchStorici.sort((a, b) => a.timestamp - b.timestamp);
        
        const ultime10 = matchStorici.slice(-10);
        console.log("Ultimi 10 match processati:", ultime10);
        
        // --- LOGICA DI AGGLOMERAZIONE ETICHETTE ---
        const rawLabels = ultime10.map(m => m.dataRaw.split("-").slice(1).reverse().join("/"));
        
        const labels = rawLabels.map((label, index) => {
            if (index > 0 && label === rawLabels[index - 1]) {
                return ""; 
            }
            return label;
        });
        
        const dataElo = ultime10.map(m => m.elo);

        // Reset Grafico
        if (window.eloChartInstance) window.eloChartInstance.destroy();
        const container = document.getElementById('realEloChartInstance').parentElement;
        container.innerHTML = '<canvas id="realEloChartInstance" style="display: block; width: 100% !important; height: 100% !important;"></canvas>';

        // Render Chart.js
        const canvas = document.getElementById('realEloChartInstance');
        const ctx = canvas.getContext('2d');
        window.eloChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: dataElo,
                    borderColor: '#000000',
                    borderWidth: 3.5,
                    backgroundColor: 'rgba(74, 222, 128, 0.2)',
                    pointBackgroundColor: '#ffde4d',
                    pointBorderColor: '#000000',
                    pointBorderWidth: 2,
                    pointRadius: 6,
                    tension: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { ticks: { color: '#000', font: { weight: 'bold', family: 'Josefin Sans, sans-serif' } }, grid: { display: false } },
                    x: { ticks: { color: '#000', font: { weight: 'bold', family: 'Josefin Sans, sans-serif' } }, grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });

    } catch (e) {
        console.error("Critical error:", e);
    }
}

// ---- Musica ----
// La musica del giocatore si accende e si spegne dal widget "NOW PLAYING" della carta. La preferenza
// (userMusicPref: 'on' | 'off') è quella di tutto il sito: se il volume è stato tolto altrove, qui la
// musica resta spenta, e se la si accende qui vale anche nel resto del sito.
const preferenzaMusica = () => localStorage.getItem('userMusicPref') || 'on';

function avviaMusicaGiocatore(urlMusica) {
    const player = document.getElementById('bg-music-home');
    if (!player || !urlMusica) return;

    if (player.src !== urlMusica) {
        player.src = urlMusica;
        player.volume = 1;
        player.loop = true;
    }

    if (preferenzaMusica() === 'on') {
        player.muted = false;
        player.play().catch(() => console.log("Autoplay bloccato, attendo un clic."));
    } else {
        player.pause();
    }
}

// Il browser spesso blocca l'autoplay: al primo clic ovunque sulla pagina la musica parte, se la preferenza lo permette
document.addEventListener('click', () => {
    const player = document.getElementById('bg-music-home');
    if (!player || !player.getAttribute('src') || !player.paused) return;
    if (preferenzaMusica() !== 'on' || !(window.PublicCard && PublicCard.musicaAttiva())) return;
    player.muted = false;
    player.play().catch(err => console.warn("Autoplay bloccato dal browser:", err));
}, { once: true });

function toggleMusic() {
    const player = document.getElementById('bg-music-home');
    if (!player || !player.getAttribute('src')) return;

    if (player.paused || player.muted) {
        player.muted = false;
        player.volume = 1;
        player.play()
            .then(() => localStorage.setItem('userMusicPref', 'on'))
            .catch(error => console.warn("Autoplay bloccato:", error));
    } else {
        player.pause();
        player.muted = true;
        localStorage.setItem('userMusicPref', 'off');
    }
}

async function resetPasswordDalLogin() {
    const emailInput = document.getElementById('login-email');
    const emailValue = emailInput ? emailInput.value.trim() : "";

    // 1. Controlla se l'utente ha inserito l'email
    if (!emailValue) {
        alert("⚠️ Please enter your email address in the field above to request a password reset.");
        if (emailInput) emailInput.focus();
        return;
    }

    // 2. Chiedi conferma
    if (!confirm(`Send a password reset link to: ${emailValue}?`)) return;

    // 3. Attiva l'overlay della Pokeball se presente nella pagina di login
    const loader = document.getElementById('loading-overlay');
    if (loader) loader.classList.add('active');

    try {
        // 4. Chiamata a Firebase Auth tramite l'email passata dall'input
        await firebase.auth().sendPasswordResetEmail(emailValue);
        
        alert(`📧 Password reset email sent!\n\nCheck your inbox (and spam folder) at: ${emailValue}`);
        
    } catch (error) {
        console.error("Error during password reset from login:", error);
        
        // Gestione degli errori tipici in fase di login
        if (error.code === 'auth/user-not-found') {
            alert("Error: This email address is not registered in the system.");
        } else if (error.code === 'auth/invalid-email') {
            alert("Error: The email address entered is not valid.");
        } else if (error.code === 'auth/too-many-requests') {
            alert("Error: Too many attempts recently. Please try again in a few minutes.");
        } else {
            alert("Error: " + error.message);
        }
    } finally {
        // 5. Spegni il loader
        if (loader) loader.classList.remove('active');
    }
}

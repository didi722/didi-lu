<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battle | Poké-Tournament</title>
    <link rel="icon" type="image/png" href="immagini/magikarp.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Motore grafico di Pokémon Showdown: gli stessi file usati dai replay.
         (La parte battle-* del client di Showdown è sotto licenza MIT.) -->
    <link rel="stylesheet" href="https://play.pokemonshowdown.com/style/font-awesome.css">
    <link rel="stylesheet" href="https://play.pokemonshowdown.com/style/battle.css">
    <link rel="stylesheet" href="https://play.pokemonshowdown.com/style/utilichart.css">
    <link rel="stylesheet" href="style-battle.css">

    <script>window.exports = window;</script>
    <script src="https://play.pokemonshowdown.com/js/lib/ps-polyfill.js"></script>
    <script src="https://play.pokemonshowdown.com/config/config.js"></script>
    <script src="https://play.pokemonshowdown.com/js/lib/jquery-1.11.0.min.js"></script>
    <script src="https://play.pokemonshowdown.com/js/lib/html-sanitizer-minified.js"></script>
    <script src="https://play.pokemonshowdown.com/js/battle-sound.js"></script>
    <script src="https://play.pokemonshowdown.com/js/battledata.js"></script>
    <script src="https://play.pokemonshowdown.com/data/pokedex-mini.js"></script>
    <script src="https://play.pokemonshowdown.com/data/pokedex-mini-bw.js"></script>
    <script src="https://play.pokemonshowdown.com/data/graphics.js"></script>
    <script src="https://play.pokemonshowdown.com/data/pokedex.js"></script>
    <script src="https://play.pokemonshowdown.com/data/moves.js"></script>
    <script src="https://play.pokemonshowdown.com/data/abilities.js"></script>
    <script src="https://play.pokemonshowdown.com/data/items.js"></script>
    <script src="https://play.pokemonshowdown.com/data/teambuilder-tables.js"></script>
    <script src="https://play.pokemonshowdown.com/js/battle-tooltips.js"></script>
    <script src="https://play.pokemonshowdown.com/js/battle.js"></script>
    <script>
        // Le classi di Showdown, raccolte per battle-ui.js
        try {
            window.PSClient = { Battle, BattleTooltips, BattleSound, Dex };
        } catch (e) {
            window.PSClient = null;
            console.error("Showdown's battle engine didn't load", e);
        }
    </script>

    <!-- Firebase: stessa configurazione di matches.html -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-functions-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBsReygP9TcC9jdqBcYN6Gz5--DOtsasNI",
            authDomain: "pokemonsuite-didi-lu.firebaseapp.com",
            databaseURL: "https://pokemonsuite-didi-lu-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pokemonsuite-didi-lu",
            storageBucket: "pokemonsuite-didi-lu.appspot.com",
            messagingSenderId: "333119159516",
            appId: "1:333119159516:web:689a9f5d3791093f66878b"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    </script>
</head>
<body>
    <main class="pagina">
        <header class="testata">
            <a class="btn-hub" id="link-hub" href="matches.html">← Hub</a>
            <h1 class="titolo">
                <span class="nome p1" id="nome-p1">P1</span>
                <small>vs</small>
                <span class="nome p2" id="nome-p2">P2</span>
            </h1>
            <span class="badge-live" id="badge-live" hidden>Watching live</span>
            <div class="info-turno" id="info-turno"></div>
            <label class="opzione-bot" id="opzione-bot">
                <input type="checkbox" id="bot-p2">
                Bot plays P2
            </label>
            <button type="button" class="btn-audio" id="btn-audio" aria-label="Battle sound">
                <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
                    <path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
        </header>

        <div class="arena">
            <section class="palco" id="palco" aria-label="Battle field">
                <div id="campo"></div>
                <div class="velo" id="messaggio-palco">
                    <p id="testo-palco">Loading the battle engine…</p>
                </div>
                <div class="velo lobby" id="lobby" hidden></div>
                <div class="esito" id="vittoria" aria-live="polite" hidden>
                    <div class="esito-card">
                        <h2 id="testo-vittoria"></h2>
                        <p id="sotto-vittoria" hidden></p>
                        <div class="riga-azioni centrata" id="azioni-vittoria" hidden></div>
                    </div>
                </div>
            </section>
            <aside class="cronaca battle-log" id="log" aria-label="Battle log"></aside>
        </div>

        <section class="comandi" id="comandi" aria-label="Your commands">
            <div class="pannello" id="comandi-p1">
                <div class="pannello-testa p1">
                    <h2 id="titolo-p1">Player 1</h2>
                    <p class="stato-avversario" id="stato-p1" aria-live="polite"></p>
                </div>
                <div class="corpo" id="corpo-p1"></div>
            </div>
            <div class="pannello" id="comandi-p2">
                <div class="pannello-testa p2">
                    <h2 id="titolo-p2">Player 2</h2>
                    <p class="stato-avversario" id="stato-p2" aria-live="polite"></p>
                </div>
                <div class="corpo" id="corpo-p2"></div>
            </div>
            <p class="striscia" id="striscia-spettatore" aria-live="polite" hidden></p>
        </section>
    </main>

    <script>
        // Se dopo qualche secondo la pagina non è partita, quasi sempre è stata
        // aperta con doppio clic (file://) invece che da un server.
        setTimeout(() => {
            if (!window.battagliaPronta) {
                document.getElementById('testo-palco').textContent =
                    "The battle didn't start. Open this page from the site (or a local server like Live Server), not by double-clicking the file. Check the console for errors.";
            }
        }, 6000);
    </script>
    <script type="module" src="battle-ui.js"></script>
</body>
</html>

// Funzione per aprire/chiudere il modale
function toggleLoginModal() {
    const modal = document.getElementById('login-modal');
    modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
}

function handleAuthClick() {
    const user = auth.currentUser;
    if (!user) {
        toggleLoginModal();
    } else {
        const menu = document.getElementById('user-menu');
        const overlay = document.getElementById('menu-overlay');
        
        if (menu) {
            if (menu.style.display === 'block') {
                // Se è aperto, lo chiudiamo e togliamo il blur
                menu.style.display = 'none';
                if (overlay) {
                    overlay.classList.remove('active');
                    overlay.style.display = 'none';
                }
                console.log("Stato: Menu chiuso al click su auth-content");
            } else {
                // Se è chiuso, lo apriamo e attiviamo il blur dello schermo
                menu.style.display = 'block';
                if (overlay) {
                    overlay.style.display = 'block';
                    // Il piccolo timeout garantisce che la transizione CSS dell'opacity funzioni fluidamente
                    setTimeout(() => overlay.classList.add('active'), 10);
                }
                console.log("Stato: Menu aperto e schermo sfocato");
            }
        }
    }
}

function chiudiMenuConOverlay() {
    const menu = document.getElementById('user-menu');
    const overlay = document.getElementById('menu-overlay');
    
    if (menu) menu.style.display = 'none';
    
    if (overlay) {
        overlay.classList.remove('active');
        overlay.style.display = 'none';
    }
    console.log("Stato: Menu chiuso via overlay");
}

// Listener globale per i click esterni aggiornato
document.addEventListener('click', function(event) {
    const menu = document.getElementById('user-menu');
    const authBtn = document.getElementById('auth-content');

    // Se il menu è visibile (controllo basato su 'block')
    if (menu && menu.style.display === 'block') {
        // Se l'utente clicca fuori dal menu e fuori dal pulsante di login
        if (!menu.contains(event.target) && !authBtn.contains(event.target)) {
            chiudiMenuConOverlay();
        }
    }
});

const LINK_MP3_HOME = "https://dn721900.ca.archive.org/0/items/pkmn-rse-soundtrack/Disc%201/13%20-%20Pok%C3%A9mon%20Center.mp3"; 

function avviaMusicaHome() {
    const player = document.getElementById('bg-music-home');
    
    if (player.src !== LINK_MP3_HOME) {
        player.src = LINK_MP3_HOME;
        player.volume = 0.3;
        
        player.play()
            .then(() => { console.log("Musica Home partita al volo!"); })
            .catch(() => { console.log("Autoplay Home bloccato, attendo il primo click."); });
    }
}

document.addEventListener('DOMContentLoaded', avviaMusicaHome);



// UNICO listener per lo stato autenticazione
auth.onAuthStateChanged(async (user) => {
    console.log("Stato Auth cambiato. Utente:", user ? user.uid : "Nessuno");
    const authIcon = document.getElementById('auth-icon');
    const authText = document.getElementById('auth-text');
    const topBar = document.querySelector('.top-bar');

    if (user) {
        try {
            const nameSnap = await db.ref(`users/${user.uid}/name`).once('value');
            const userName = nameSnap.val();
            console.log("Nome recuperato da users/uid/name:", userName);

            if (userName) {
                if (authText) authText.innerText = userName;
                if (authIcon) authIcon.className = "fas fa-user-circle";

                // PROVA: usa il nome esattamente come registrato (senza toLowerCase)
                const playerPath = `players/${userName.toLowerCase().trim()}/info/color`;
                console.log("Cerco il colore al percorso:", playerPath);
                
                const colorSnap = await db.ref(playerPath).once('value');
                if (colorSnap.exists()) {
                    const userColor = colorSnap.val();
                    console.log("✅ Colore trovato:", userColor);
                    topBar.style.setProperty('background-color', userColor, 'important');
                } else {
                    console.warn("⚠️ Percorso colore non trovato nel DB");
                }
            }
        } catch (e) { console.error("Errore debug:", e); }
    } else {
        console.log("Utente non loggato.");
        if (authText) authText.innerText = "Login";
        if (topBar) topBar.style.backgroundColor = "#FFA500";
    }
});


// Gestione Form Login
document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');

    // Impostiamo la persistenza locale esplicitamente per sicurezza
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
        .then(() => {
            return auth.signInWithEmailAndPassword(email, password);
        })
        .then((userCredential) => {
            console.log("Login effettuato con successo!");
            toggleLoginModal();
            // NON usare location.reload(). 
            // L'ascoltatore auth.onAuthStateChanged qui sotto aggiornerà tutto da solo.
        })
        .catch((error) => {
            console.error("Errore login:", error);
            errorEl.innerText = "Email o Password errati.";
        });
});

// Funzione Logout
function logout() {
    auth.signOut().then(() => {
        location.reload();
    });
}

document.addEventListener('click', function(event) {

    if (menu && (menu.style.display === 'flex' || menu.style.display === 'block')) {

        if (!menu.contains(event.target) && !authBtn.contains(event.target)) {
            menu.style.display = 'none';
            console.log("Stato: Menu chiuso (click esterno)");

    }
});


let playerColors = {};

async function caricaColoriPlayers() {
    try {
        const snapshot = await db.ref('players').once('value');
        const playersData = snapshot.val();
        
        if (!playersData) return;

        for (let nomeKey in playersData) {
            const nomeMinuscolo = nomeKey.toLowerCase();
            
            const coloreRecuperato = playersData[nomeKey].info?.color;
            
            if (coloreRecuperato) {
                playerColors[nomeMinuscolo] = coloreRecuperato;
            }
        }
        console.log("Colori mappati:", playerColors);
    } catch (error) {
        console.error("Errore caricamento:", error);
    }
}

// Funzione per scurire o schiarire un colore HEX
function pSBC(p, c0, c1, l) {
    let r, g, b, P, f, t, h, i = parseInt, m = Math.round, a = typeof (c1) == "string";
    if (typeof (p) != "number" || p < -1 || p > 1 || typeof (c0) != "string" || (c0[0] != 'r' && c0[0] != '#') || (c1 && !a)) return null;
    if (!this.pSBCr) this.pSBCr = (d) => {
        let n = d.length, x = {};
        if (n > 9) {
            [r, g, b, a] = d = d.split(","), n = d.length;
            if (n < 3 || n > 4) return null;
            x.r = i(r[3] == "a" ? r.slice(5) : r.slice(4)), x.g = i(g), x.b = i(b), x.a = a ? parseFloat(a) : -1
        } else {
            if (n == 8 || n == 6 || n < 4) return null;
            if (n < 6) d = "#" + d[1] + d[1] + d[2] + d[2] + d[3] + d[3] + (n > 4 ? d[4] + d[4] : "");
            d = i(d.slice(1), 16);
            if (n == 9 || n == 5) x.r = d >> 24 & 255, x.g = d >> 16 & 255, x.b = d >> 8 & 255, x.a = m((d & 255) / 0.255) / 1000;
            else x.r = d >> 16, x.g = d >> 8 & 255, x.b = d & 255, x.a = -1
        } return x
    };
    h = c0.length > 9, f = this.pSBCr(c0);
    if (!f) return null;
    if (p < 0) p *= -1, t = { r: 0, g: 0, b: 0, a: f.a };
    else t = { r: 255, g: 255, b: 255, a: f.a };
    r = m((t.r - f.r) * p) + f.r, g = m((t.g - f.g) * p) + f.g, b = m((t.b - f.b) * p) + f.b;
    return "#" + (0x1000000 + (f.a != -1 ? m(f.a * 255) : 0) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function getPlayerPalette(baseColor) {
    if (!baseColor) baseColor = "#31c489";
    
    return {
        base: baseColor,
        dark: pSBC(-0.4, baseColor),
        darker: pSBC(-0.7, baseColor),
        light: pSBC(0.6, baseColor),
        tag: pSBC(-0.5, baseColor),
        bright: pSBC(0.3, baseColor)
    };
}

function generaVariabiliCSS(palette) {
    return `
        --accent-color: ${palette.base};
        --border-color: ${palette.darker};
        --dark-color: ${palette.dark};
        --light-color: ${palette.light};
        --tag-color: ${palette.tag};
        --bright-color: ${palette.bright};
    `;
}

async function getPlayersColors(p1, p2) {
    const name1 = p1.toLowerCase().trim(); // Aggiunto trim() per evitare spazi nascosti
    const name2 = p2.toLowerCase().trim();

    console.log("Tentativo query su path:", `players/${name1}/info/color`);

    // Usiamo una nuova reference pulita
    const ref1 = db.ref(`players/${name1}/info/color`);
    const ref2 = db.ref(`players/${name2}/info/color`);

    const snap1 = await ref1.once('value');
    const snap2 = await ref2.once('value');

    console.log(`VALORE REALE DB per ${name1}:`, snap1.val());
    console.log(`VALORE REALE DB per ${name2}:`, snap2.val());

    return {
        c1: snap1.val() || '#31c489',
        c2: snap2.val() || '#8e44ad'
    };
}

function toggleMusic() {
    // 1. Identifica il player (usa l'ID presente in questa pagina, es. bg-music-home)
    const player = document.getElementById('bg-music-home');
    const musicBtn = document.getElementById('music-control');

    if (!player || !musicBtn) {
        console.error("Elementi audio o tasto non trovati in questa pagina.");
        return;
    }

    if (player.paused) {
        player.play().then(() => {
            // Se parte, rimuoviamo la sbarra e salviamo la preferenza 'on'
            musicBtn.classList.remove('muted');
            localStorage.setItem('userMusicPref', 'on');
        }).catch(error => {
            console.warn("Autoplay bloccato o errore riproduzione:", error);
        });
        
    } else {
        player.pause();
        // Aggiungiamo la sbarra e salviamo la preferenza 'off'
        musicBtn.classList.add('muted');
        localStorage.setItem('userMusicPref', 'off');
    }
}

/** * AGGIUNTA FONDAMENTALE: 
 * Al caricamento della pagina, controlla se l'utente aveva precedentemente 
 * silenziato la musica in un'altra parte del sito.
 */
window.addEventListener('DOMContentLoaded', () => {
    const player = document.getElementById('bg-music-home');
    const musicBtn = document.getElementById('music-control');
    const savedPref = localStorage.getItem('userMusicPref');

    if (player && musicBtn) {
        if (savedPref === 'off') {
            // Se l'utente ha scelto 'off' altrove, non far partire nulla
            player.pause();
            musicBtn.classList.add('muted');
        } else {
            // Altrimenti prova a farla partire (rispettando i blocchi del browser)
            player.play().catch(() => {
                musicBtn.classList.add('muted');
            });
        }
    }
});

// Aggiungi l'evento click

// Funzione per applicare il colore alla TopBar (centralizzata)
async function applicaColoreUtente(user) {
    const topBar = document.querySelector('.top-bar');
    if (!user || !topBar) return;

    try {
        const nameSnap = await db.ref(`users/${user.uid}/name`).once('value');
        const userName = nameSnap.val();

        if (userName) {
            console.log("👤 Utente riconosciuto:", userName);
            const colorSnap = await db.ref(`players/${userName.toLowerCase().trim()}/info/color`).once('value');
            if (colorSnap.exists()) {
                const userColor = colorSnap.val();
                topBar.style.setProperty('background-color', userColor, 'important');
                console.log("🎨 Colore applicato:", userColor);
            }
        }
    } catch (e) {
        console.error("❌ Errore recupero colore:", e);
    }
}

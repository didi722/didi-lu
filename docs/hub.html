        console.log("Colori mappati:", playerColors);
    } catch (error) {
        console.error("Errore caricamento:", error);

}

// Funzione per scurire o schiarire un colore HEX
function pSBC(p, c0, c1, l) {
    let r, g, b, P, f, t, h, i = parseInt, m = Math.round, a = typeof (c1) == "string";
    if (typeof (p) != "number" || p < -1 || p > 1 || typeof (c0) != "string" || (c0[0] != 'r' && c0[0] != '#') || (c1 && !a)) return null;
    if (!this.pSBCr) this.pSBCr = (d) => {
        let n = d.length, x = {};
        if (n > 9) {
            [r, g, b, a] = d = d.split(","), n = d.length;
            if (n < 3 || n > 4) return null;
            x.r = i(r[3] == "a" ? r.slice(5) : r.slice(4)), x.g = i(g), x.b = i(b), x.a = a ? parseFloat(a) : -1
        } else {
            if (n == 8 || n == 6 || n < 4) return null;
            if (n < 6) d = "#" + d[1] + d[1] + d[2] + d[2] + d[3] + d[3] + (n > 4 ? d[4] + d[4] : "");
            d = i(d.slice(1), 16);
            if (n == 9 || n == 5) x.r = d >> 24 & 255, x.g = d >> 16 & 255, x.b = d >> 8 & 255, x.a = m((d & 255) / 0.255) / 1000;
            else x.r = d >> 16, x.g = d >> 8 & 255, x.b = d & 255, x.a = -1
        } return x
    };
    h = c0.length > 9, f = this.pSBCr(c0);
    if (!f) return null;
    if (p < 0) p *= -1, t = { r: 0, g: 0, b: 0, a: f.a };
    else t = { r: 255, g: 255, b: 255, a: f.a };
    r = m((t.r - f.r) * p) + f.r, g = m((t.g - f.g) * p) + f.g, b = m((t.b - f.b) * p) + f.b;
    return "#" + (0x1000000 + (f.a != -1 ? m(f.a * 255) : 0) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function getPlayerPalette(baseColor) {

// 3. Funzione di Avvio Unica
// Variable di controllo globale per gestire i rendering asincroni
let currentRenderID = 0;

// --- 1. FUNZIONE HELPER PER NASCONDERE IL LOADER CON TRANSIZIONE ---
function nascondiLoader(loaderEl) {
    const loader = loaderEl || document.getElementById('poke-loader');
    if (!loader) return;
    
    loader.style.opacity = '0';
    loader.classList.add('hidden');
    setTimeout(() => {
        loader.style.display = 'none';
    }, 500);
}

// --- 2. INIZIALIZZAZIONE SEASON HUB CON GESTIONE LOADER ---
async function initHub() {
    // Mostra il loader all'inizio dell'operazione
    const loader = document.getElementById('poke-loader');
    if (loader) {
        loader.style.display = 'flex';
        loader.style.opacity = '1';
        loader.classList.remove('hidden');
    }

    const user = auth.currentUser;
    if (!user) {
        nascondiLoader(loader);
        return;
    }

    if (typeof seasonId === 'undefined' || !seasonId) {
        alert("ID Stagione mancante nell'URL!");
        nascondiLoader(loader);
        return;
    }

    // Flag per rimuovere il loader solo al primo rendering dei dati
    let isInitialLoad = true;

    try {
        const userSnap = await db.ref(`users/${user.uid}`).once('value');
        const userData = userSnap.val();
        
        if (!userData || !userData.name) {
            nascondiLoader(loader);
            return;
        }

        const nomeUtenteClean = userData.name.toLowerCase();
        window.currentNomeUtenteClean = nomeUtenteClean;
        let lastAlertTime = 0;

        db.ref(`seasons/${seasonId}`).off();

        db.ref(`seasons/${seasonId}`).on('value', async (snap) => {
            try {
                const data = snap.val();
                if (!data) return;

                window.teamsIscrittiStagione = data.teams_iscritti || {};
                currentRenderID++;
                const myRenderID = currentRenderID;

                // --- CONTROLLO PULSANTE DISISCRIVITI CON DEBUG ---
                const btnUnregister = document.getElementById('btn-disiscriviti');
                if (btnUnregister) {
                    const iscritti = data.iscritti || {};
                    const listaIscrittiLower = Object.keys(iscritti).map(n => n.toLowerCase());
                    const isIscritto = listaIscrittiLower.includes(nomeUtenteClean);

                    console.log("--- DEBUG DISISCRIZIONE ---");
                    console.log("Nome Utente Loggato (lower):", nomeUtenteClean);
                    console.log("Nomi Iscritti nel DB:", Object.keys(iscritti));
                    console.log("Esito controllo (isIscritto):", isIscritto);

                    if (isIscritto) {
                        btnUnregister.style.display = 'inline-flex';
                    } else {
                        btnUnregister.style.display = 'none';
                    }
                }

                // --- AGGIORNAMENTO TICKER (LIVE) ---
                if (typeof caricaTickerIscrizione === 'function') {
                    caricaTickerIscrizione(data, seasonId);
                }

                const status = (data.info?.status || 'OPEN').toUpperCase();

                // --- Aggiornamento UI Immediata ---
                const titleDisp = document.getElementById('hub-title-display');
                if (titleDisp) titleDisp.innerText = data.info?.name || "Season Hub";
               
                if (typeof updatePageStatus === 'function') {
                    updatePageStatus(status);
                }
               
                const teamsLimitDisplay = data.info?.teams_per_format === "No Limit" ? "No Limit" : (data.info?.teams_per_format || 1);
                const rulesCont = document.getElementById('hub-rules-content');
                if (rulesCont) {
                    rulesCont.innerHTML = `
                        <p><strong>Status:</strong> ${status}</p>
                        <p><strong>Teams per Format:</strong> ${teamsLimitDisplay}</p>
                    `;
                }

                // --- Gestione Rendering Hub ---
                if (status === 'CLOSED') {
                    if (typeof renderClosedHub === 'function') renderClosedHub(data);
                } else {
                    if (typeof renderHub === 'function') {
                        await renderHub(data, nomeUtenteClean, myRenderID);
                    }

                    if (myRenderID === currentRenderID) {
                        const now = Date.now();
                        if (now - lastAlertTime > 5000) {
                            if (typeof checkOverlimitWarning === 'function') {
                                if (checkOverlimitWarning(data, nomeUtenteClean)) {
                                    lastAlertTime = now;
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                console.error("Errore durante il rendering dei dati dell'Hub:", err);
            } finally {
                // Nasconde il loader solo al primo caricamento dei dati real-time
                if (isInitialLoad) {
                    nascondiLoader(loader);
                    isInitialLoad = false;
                }
            }
        });
    } catch (error) {
        console.error("Errore critico durante l'inizializzazione dell'Hub:", error);
        nascondiLoader(loader);
    }
}


async function gestisciDisiscrizione() {
    // 1. Recupera la lista iscritti per trovare la chiave corretta (es. "Didi")
    const iscrittiSnap = await db.ref(`seasons/${seasonId}/iscritti`).once('value');
    const iscritti = iscrittiSnap.val() || {};
    
    const nomeLoggatoLower = window.currentNomeUtenteClean.toLowerCase(); 
    const chiaveEsatta = Object.keys(iscritti).find(k => k.toLowerCase() === nomeLoggatoLower);

    if (!chiaveEsatta) {
        alert("Errore: non risulti iscritto a questa stagione.");
        return;
    }

    if (!confirm("Sei sicuro di volerti disiscrivere? Tutti i tuoi team associati verranno rimossi.")) {
        return;
    }
    
    try {
        const loader = document.getElementById('loading-screen');
        if (loader) { loader.style.display = 'flex'; loader.style.opacity = '1'; }

        // A. Rimuovi iscrizione principale
        await db.ref(`seasons/${seasonId}/iscritti/${chiaveEsatta}`).remove();

        // B. Rimuovi i team iscritti in ogni formato
        const formatsSnap = await db.ref(`seasons/${seasonId}/teams_iscritti`).once('value');
        const formatsData = formatsSnap.val();

        if (formatsData) {
            const removalPromises = [];
            
            for (const format in formatsData) {
                // Cerchiamo la chiave specifica per questo formato (caso insensibile)
                const teamEntries = formatsData[format];
                const chiaveNelFormat = Object.keys(teamEntries).find(
                    k => k.toLowerCase() === nomeLoggatoLower
                );

                if (chiaveNelFormat) {
                    console.log(`Rimozione team in ${format} con chiave: ${chiaveNelFormat}`);
                    removalPromises.push(
                        db.ref(`seasons/${seasonId}/teams_iscritti/${format}/${chiaveNelFormat}`).remove()
                    );
                }
            }
            // Attendiamo che tutte le rimozioni dei team finiscano
            await Promise.all(removalPromises);
        }

        window.location.href = "index.html";

    } catch (error) {
        console.error("Errore durante la disiscrizione:", error);
        alert("Errore durante la disiscrizione. Riprova.");
        location.reload();
    }
}

function renderClosedHub(data) {
    const leaderboard = data.leaderboard || {};
    const btnContainer = document.getElementById('registration-buttons-container');
    const summaryBox = document.getElementById('season-summary-content');

    // 1. Box di riepilogo (Header della Classifica)
    summaryBox.innerHTML = `
        <div style="background: #ffbd03; border: 3px solid #000; padding: 15px; text-align: center; box-shadow: 5px 5px 0px #000;">
            <h2 style="margin: 0; font-family: 'Josefin Sans'; font-size: 1.5rem; text-transform: uppercase;">🏆 Season Results</h2>
            <p style="margin: 5px 0 0 0; font-family: 'Montserrat'; font-weight: 600; font-size: 0.9rem;">The showdown has ended. Here are the final standings.</p>
        </div>
    `;

    // 2. Costruzione della Tabella Classifica
    // Ordiniamo i player per punti (decrescente)
    const sortedPlayers = Object.entries(leaderboard)
        .sort(([, a], [, b]) => (b.points || 0) - (a.points || 0));

    if (sortedPlayers.length === 0) {
        btnContainer.innerHTML = `
            <div style="padding: 40px; text-align: center; font-family: 'Montserrat'; border: 3px dashed #000;">
                <p>No leaderboard data available yet.</p>
            </div>
        `;
    } else {
        let tableRows = sortedPlayers.map(([name, stats], index) => {
            const isTop1 = index === 0;
            const rowBg = isTop1 ? '#31c489' : '#fff'; // Verde per il vincitore, bianco per gli altri
            const textColor = isTop1 ? '#fff' : '#000';

            return `
                <tr style="background: ${rowBg}; color: ${textColor}; border-bottom: 3px solid #000;">
                    <td style="padding: 15px; font-weight: 900; border-right: 3px solid #000;">#${index + 1}</td>
                    <td style="padding: 15px; font-weight: 700; text-transform: uppercase; border-right: 3px solid #000;">${name}</td>
                    <td style="padding: 15px; font-weight: 900; text-align: center; border-right: 3px solid #000;">${stats.points || 0}</td>
                    <td style="padding: 15px; text-align: center; font-weight: 600;">${stats.wins || 0}W - ${stats.losses || 0}L</td>
                </tr>
            `;
        }).join('');

        btnContainer.innerHTML = `
            <div style="border: 3px solid #000; box-shadow: 8px 8px 0px #000; background: #fff; width: 100%;">
                <table style="width: 100%; border-collapse: collapse; font-family: 'Montserrat';">
                    <thead>
                        <tr style="background: #000; color: #fff; text-align: left; text-transform: uppercase; font-size: 0.8rem;">
                            <th style="padding: 12px; border-right: 3px solid #fff;">Rank</th>
                            <th style="padding: 12px; border-right: 3px solid #fff;">Trainer</th>
                            <th style="padding: 12px; text-align: center; border-right: 3px solid #fff;">Points</th>
                            <th style="padding: 12px; text-align: center;">Record</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
            </div>
        `;
    }

    // 3. Sidebar (opzionale: Hall of Fame)
    const partList = document.getElementById('participants-list');
    const partCardTitle = document.querySelector('.participants-card h3');
    if (partCardTitle) partCardTitle.innerText = "SEASON MVP";
    
    if (sortedPlayers.length > 0) {
        partList.innerHTML = `
            <div style="padding: 10px; text-align: center;">
                <div style="font-size: 2rem;">👑</div>
                <strong style="display: block; font-size: 1.2rem; text-transform: uppercase;">${sortedPlayers[0][0]}</strong>
                <p style="font-size: 0.8rem; color: #666;">Season Champion</p>
            </div>
        `;
    }
}


function checkOverlimitWarning(data, nomeUtenteClean) {
    const info = data.info || {};
    const teamsIscritti = data.teams_iscritti || {};
    
    // Se è No Limit, non può esserci overlimit
    if (info.teams_per_format === "No Limit") return;

    const maxAllowed = parseInt(info.teams_per_format) || 1;
    let overlimitFormats = [];

    // Controlliamo ogni formato selezionato nella stagione
    const formats = Array.isArray(info.selected_formats) ? info.selected_formats : Object.values(info.selected_formats || {});

    formats.forEach(format => {
        const iscrizione = teamsIscritti[format] ? teamsIscritti[format][nomeUtenteClean] : null;
        const count = iscrizione ? (iscrizione.count || 0) : 0;

        if (count > maxAllowed) {
            overlimitFormats.push(format.toUpperCase());
        }
    });

    // Se abbiamo trovato dei formati fuori regola, mostriamo l'avviso
    if (overlimitFormats.length > 0) {
        // Usiamo un piccolo timeout per non bloccare il rendering iniziale
        setTimeout(() => {
            alert(
                `⚠️ ATTENTION!\n\nRules have changed: for the format(s) [${overlimitFormats.join(", ")}] you have too many teams registered.\n\nPlease open the format and deselect the extra teams to fix your registration.`
            );
        }, 500);
    }
}


// 4. Rendering dell'Hub
async function renderHub(data, nomeUtenteClean, myRenderID) {
    const info = data.info || {};
    const teamsIscritti = data.teams_iscritti || {};
    
    // --- 1. LOGICA LIMITI E INFO ---
    const isNoLimit = info.teams_per_format === "No Limit";
    const maxTeamsPerFormat = isNoLimit ? Infinity : (parseInt(info.teams_per_format) || 1);
    const limitLabel = isNoLimit ? "No Limit" : `${maxTeamsPerFormat} TEAMS PER FORMAT`;

    const countIscritti = data.iscritti ? Object.keys(data.iscritti).length : 0;

    // --- NUOVO CALCOLO FORMATI E MATCH TOTALI ---
    let countFormati = 0;
    if (info.selected_formats) {
        countFormati = Array.isArray(info.selected_formats) 
            ? info.selected_formats.length 
            : Object.keys(info.selected_formats).length;
    }
    const showdownsPerFormato = parseInt(info.showdowns_per_format) || 0;
    
    // Formula corretta: (iscritti - 1) * formati * showdowns (minimo 0)
    const totalMatches = Math.max(0, countIscritti - 1) * countFormati * showdownsPerFormato;

    // Iniezione degli stili CSS per le etichette neubrutalist (Senza effetto Hover)
    if (!document.getElementById('neubru-badge-styles')) {
        const style = document.createElement('style');
        style.id = 'neubru-badge-styles';
        style.innerHTML = `
            .hub-stats-row {
                display: flex;
                gap: 15px;
                margin-top: 20px;
                justify-content: center;
                flex-wrap: wrap;
                width: 100%;
            }
            .neubru-badge-white {
                background: #ffffff !important;
                border: 3px solid #000000 !important;
                box-shadow: 4px 4px 0px #000000 !important;
                padding: 10px 16px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-width: 140px;
            }
            .neubru-badge-white .badge-title {
                font-size: 0.65rem;
                font-weight: 900;
                text-transform: uppercase;
                color: #555555;
                letter-spacing: 1.5px;
                margin-bottom: 4px;
                text-align: center;
            }
            .neubru-badge-white .badge-value {
                font-size: 1.3rem;
                font-weight: 900;
                color: #000000;
            }
        `;
        document.head.appendChild(style);
    }

    // --- 2. AGGIORNAMENTO SUMMARY BOX (Neubrutalist) ---
    const summaryBox = document.getElementById('season-summary-content');
    if (summaryBox) {
        summaryBox.innerHTML = `
            <div class="hub-new-layout">
                <div id="registration-column" class="registration-column">
                </div>

                <div class="hub-center-zone">
                    <div class="countdown-main-container">
                        <div class="countdown-label">REGISTRATIONS <br> CLOSE IN:</div>
                        <div id="hub-countdown-timer" class="countdown-digits">00D 00H 00M 00S</div>
                    </div>
                    
                    <!-- Box Informativi Bianchi Flottanti (Statici) -->
                    <div class="hub-stats-row">
                        <div class="neubru-badge-white">
                            <span class="badge-title">Showdowns <br> Per Format</span>
                            <span class="badge-value">${showdownsPerFormato}</span>
                        </div>
                        <div class="neubru-badge-white">
                            <span class="badge-title">Total Matches</span>
                            <span class="badge-value">${totalMatches}</span>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // Avvia il timer se c'è una deadline
        if (info.deadline) {
            if (window.hubInterval) clearInterval(window.hubInterval); // Pulisci timer vecchi
            
            const updateTimer = () => {
                const now = new Date().getTime();
                const distance = new Date(info.deadline).getTime() - now;
                const timerEl = document.getElementById('hub-countdown-timer');
                
                if (!timerEl) return;

                if (distance < 0) {
                    timerEl.innerText = "CLOSED";
                    timerEl.style.color = "#ff4b4b";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                timerEl.innerText = `${days}D ${hours}H ${minutes}M ${seconds}S`;
            };

            updateTimer();
            window.hubInterval = setInterval(updateTimer, 1000);
        }
    }

    // --- 3. BOTTONI REGISTRAZIONE ---
    const btnContainer = document.getElementById('registration-column');
    btnContainer.innerHTML = '';

    if (info.selected_formats) {
        const formats = Array.isArray(info.selected_formats) ? info.selected_formats : Object.values(info.selected_formats);
        formats.forEach(format => {
            const iscrizione = teamsIscritti[format] ? teamsIscritti[format][nomeUtenteClean] : null;
            const count = iscrizione ? (iscrizione.count || 0) : 0;
            const isOverLimit = !isNoLimit && count > maxTeamsPerFormat;
            const isFull = isNoLimit ? (count > 0) : (count >= maxTeamsPerFormat);

            const btn = document.createElement('button');
            btn.className = `btn-team ${isOverLimit ? 'overlimit' : (isFull ? 'registered' : '')}`;
            
            let counterHTML = isNoLimit ? (count > 0 ? `${count}` : "∞") : `${count}/${maxTeamsPerFormat}`;

            btn.innerHTML = `
                <div class="btn-team-label">${format.toUpperCase()}</div>
                <div class="btn-team-counter">${counterHTML}</div>
            `;
            btn.onclick = () => openTeamPicker(format, nomeUtenteClean);
            btnContainer.appendChild(btn);
        });
    }

    // --- 4. SIDEBAR PARTECIPANTI ---
    const partCardTitle = document.getElementById('players-count-title');
    if (partCardTitle) {
        partCardTitle.innerText = `PLAYERS: ${countIscritti}`;
    }
    const partList = document.getElementById('participants-list');
    if (!partList) return;
    partList.innerHTML = ''; 

    if (data.iscritti) {
        const playerNames = Object.keys(data.iscritti);
        
        for (const player of playerNames) {
            if (myRenderID !== currentRenderID) return;

            const colors = await getPlayersColors(player, player);

            if (myRenderID !== currentRenderID) return;

            const baseCol = colors.c1 || "#eeeeee";
            const borderCol = (typeof pSBC !== 'undefined') ? pSBC(-0.8, baseCol) : "#000000";

            const tag = document.createElement('div');
            tag.className = "player-tag";
            
            tag.style.backgroundColor = baseCol;
            tag.style.borderColor = borderCol;
            tag.style.boxShadow = `4px 4px 0px ${borderCol}`;
            tag.style.cursor = "pointer";

            tag.innerHTML = `<span class="player-label">${player.toUpperCase()}</span>`;
            
            tag.onclick = () => {
                window.location.href = `public.html?player=${encodeURIComponent(player)}`;
            };

            partList.appendChild(tag);
        }
    } else {
        partList.innerHTML = '<p class="empty-list-text">No players joined yet</p>';
    }
}

async function openTeamPicker(format, nomeUtenteClean) {

    const overlay = document.getElementById('modal-overlay');
    if (overlay) {
        overlay.style.display = 'block';
        // Chiude il modale se si clicca sullo sfondo sfocato
        overlay.onclick = () => closeTeamModal();
    }
    const seasonSnap = await db.ref(`seasons/${seasonId}/info`).once('value');
    const seasonInfo = seasonSnap.val() || {};
    
    const rawLimit = seasonInfo.teams_per_format;
    const isNoLimit = (rawLimit === "No Limit" || rawLimit === 0 || rawLimit === "0");
    const maxAllowed = isNoLimit ? Number.MAX_SAFE_INTEGER : (parseInt(rawLimit) || 1);

    const currentSnap = await db.ref(`seasons/${seasonId}/teams_iscritti/${format}/${nomeUtenteClean}`).once('value');
    let selectedTeamIds = currentSnap.val()?.teamIds || [];

    const teamsSnap = await db.ref(`players/${nomeUtenteClean}/teams`).once('value');
    const allTeams = teamsSnap.val() || {};
    
    const modal = document.getElementById('modal-select-team');
    const container = document.getElementById('user-teams-list');
    const title = document.getElementById('modal-format-title');
    
    container.innerHTML = '';

    // --- TOOLTIP GLOBALE ESTERNO ---
    let globalTooltip = document.getElementById('global-team-tooltip');
    if (!globalTooltip) {
        globalTooltip = document.createElement('div');
        globalTooltip.id = 'global-team-tooltip';
        globalTooltip.className = 'team-preview-tooltip'; // Usa la classe CSS definita sotto
        document.body.appendChild(globalTooltip);
    }
    
    // --- GESTIONE FOOTER ---
    let footer = modal.querySelector('.modal-footer-controls');
    if (!footer) {
        footer = document.createElement('div');
        footer.className = 'modal-footer-controls';
        modal.appendChild(footer);
    }

    let confirmBtn = document.getElementById('btn-confirm-selection');
    if (!confirmBtn) {
        confirmBtn = document.createElement('button');
        confirmBtn.id = 'btn-confirm-selection';
        confirmBtn.className = 'btn-confirm';
        footer.appendChild(confirmBtn);
    }

    const closeBtn = modal.querySelector('.btn-cancel');
    if (closeBtn) footer.appendChild(closeBtn);

    const updateTitleAndUI = () => {
        const isOverLimit = !isNoLimit && selectedTeamIds.length > maxAllowed;
        const counterText = isNoLimit ? `${selectedTeamIds.length}` : `${selectedTeamIds.length}/${maxAllowed}`;
        title.innerHTML = `<span class="neubrutal-badge">Select ${format} (${counterText})</span>`;
        confirmBtn.innerText = isOverLimit ? "Too many teams!" : "Save selection";
        confirmBtn.disabled = isOverLimit;
    };

    updateTitleAndUI();

    // 4. Generazione Lista Team
    Object.entries(allTeams).forEach(([id, data]) => {
        if (data.categoria === format) {
            const div = document.createElement('div');
            div.className = `team-option ${selectedTeamIds.includes(id) ? 'selected' : ''}`;
            
            const pokemonArray = Array.isArray(data.pokemon) ? data.pokemon : Object.values(data.pokemon || {});
            const pokemonImages = pokemonArray.map(p => {
                const pkmnName = p && typeof p === 'object' ? p.nome : p;
                if (!pkmnName || typeof pkmnName !== 'string') return '';
                const spriteName = pkmnName.toLowerCase().trim().replace(/\s+/g, '-');
                return `<img src="https://play.pokemonshowdown.com/sprites/ani/${spriteName}.gif" 
                        onerror="this.src='https://play.pokemonshowdown.com/sprites/dex/${spriteName}.png'"
                        class="preview-pkmn-img" title="${pkmnName}">`;
            }).join('');

            div.innerHTML = `
                <div class="team-info-wrapper">
                    <strong>${data.nome}</strong>
                    <div class="info-preview-container">
                        <div class="info-icon">i</div>
                    </div>
                </div>
            `;
            
            const infoIcon = div.querySelector('.info-icon');
            
            // Eventi Tooltip (Ora usa l'elemento globale)
            infoIcon.onmouseenter = (e) => {
                globalTooltip.innerHTML = pokemonImages;
                globalTooltip.style.display = 'flex';
                globalTooltip.style.opacity = '1';
                globalTooltip.style.visibility = 'visible';
            };
            
            infoIcon.onmousemove = (e) => {
                globalTooltip.style.left = (e.clientX + 15) + 'px';
                globalTooltip.style.top = (e.clientY + 15) + 'px';
            };
            
            infoIcon.onmouseleave = () => {
                globalTooltip.style.display = 'none';
                globalTooltip.style.opacity = '0';
                globalTooltip.style.visibility = 'hidden';
            };

            infoIcon.onclick = (e) => {
                e.stopPropagation();
                apriDettaglioTeam(nomeUtenteClean, data.nome, format);
            };

            div.onclick = (e) => {
                if (e.target.classList.contains('info-icon')) return;
                const index = selectedTeamIds.indexOf(id);
                if (index > -1) {
                    selectedTeamIds.splice(index, 1);
                    div.classList.remove('selected');
                } else if (selectedTeamIds.length < maxAllowed) {
                    selectedTeamIds.push(id);
                    div.classList.add('selected');
                } else {
                    alert(`Max ${maxAllowed} teams allowed!`);
                }
                updateTitleAndUI();
            };
            container.appendChild(div);
        }
    });
    
    confirmBtn.onclick = () => inviaSelezioneTeam(format, nomeUtenteClean, allTeams, selectedTeamIds);
    modal.style.display = 'flex';
}

async function apriDettaglioTeam(idPlayerPuro, nomeTeam, formato) {
    const modal = document.getElementById('teamModal');
    const content = document.getElementById('teamDetailContent');
    
    // 1. Setup iniziale UI
    content.innerHTML = '<div style="color:white; text-align:center; padding:20px;">Caricamento dati dal database...</div>';
    modal.style.display = 'flex';

    try {
        // --- RECUPERO PALETTE ---
        const colorSnap = await db.ref(`players/${idPlayerPuro.toLowerCase()}/info/color`).once('value');
        const baseColor = colorSnap.val() || "#31c489";
        const palette = getPlayerPalette(baseColor); 

        // --- RICERCA TEAM DIRETTAMENTE SU FIREBASE ---
        const teamsRef = db.ref(`players/${idPlayerPuro.toLowerCase()}/teams`);
        const teamsSnap = await teamsRef.once('value');
        const allTeams = teamsSnap.val();

        if (!allTeams) {
            content.innerHTML = `<div style="color:white; text-align:center;">Nessun team trovato per questo giocatore.</div>`;
            return;
        }

        // Cerchiamo il team all'interno dell'oggetto 'teams' confrontando il nome
        let teamData = null;
        Object.values(allTeams).forEach(t => {
            const n = (typeof t.nome === 'object') ? t.nome.valore : t.nome;
            if (n && n.toString().trim().toLowerCase() === nomeTeam.toString().trim().toLowerCase()) {
                teamData = t;
            }
        });

        if (teamData) {
            // --- RECUPERO STATISTICHE DA WINDOW (FALLBACK) ---
            const statsLocali = (window.databaseDidi && window.databaseDidi[nomeTeam]) || 
                                (window.databaseLu && window.databaseLu[nomeTeam]) || {};

            // 🛠️ COSTRUZIONE ACCURATA DELLE STATS (Uniamo Firebase e Variabili Locali)
            const statsFinali = {
                won: teamData.stats?.won ?? statsLocali.won ?? statsLocali.vittorie ?? 0,
                lost: teamData.stats?.lost ?? statsLocali.lost ?? statsLocali.sconfitte ?? 0,
                setW: teamData.stats?.setW ?? statsLocali.setW ?? statsLocali.setVinti ?? 0,
                setL: teamData.stats?.setL ?? statsLocali.setL ?? statsLocali.setPersi ?? 0,
                points: teamData.stats?.points ?? statsLocali.points ?? statsLocali.puntiFatti ?? 0,
                played: teamData.stats?.played ?? statsLocali.played ?? statsLocali.partiteGiocate ?? 0
            };

            // --- COSTRUZIONE OGGETTO PER IL RENDER ---
            let teamFinalizzato = {
                nome: (typeof teamData.nome === 'object') ? teamData.nome.valore : teamData.nome,
                stats: statsFinali, // 🛠️ FIX: Adesso passiamo l'oggetto completo che la funzione HTML si aspetta!
                pokemon: []
            };

            // Convertiamo l'oggetto pokemon di Firebase in Array per il .map()
            if (teamData.pokemon) {
                teamFinalizzato.pokemon = Array.isArray(teamData.pokemon) 
                    ? teamData.pokemon 
                    : Object.values(teamData.pokemon);
            }

            // --- GENERAZIONE HTML ---
            content.innerHTML = generaHtmlDettaglioTeam(teamFinalizzato, idPlayerPuro, palette);
            
        } else {
            content.innerHTML = `<div style="color:white; text-align:center;">Team "${nomeTeam}" non trovato tra i team di ${idPlayerPuro}.</div>`;
        }

    } catch (e) {
        console.error("Errore Firebase Dettaglio:", e);
        content.innerHTML = `<div style="color:white; text-align:center;">Errore di connessione al database.</div>`;
    }
}

async function caricaInfoAbilita(nomeAbilita, elementoId) {
    const tooltip = document.getElementById(elementoId);
    if (!nomeAbilita || tooltip.dataset.loaded === "true") return;

    try {
        const cleanName = nomeAbilita.toLowerCase().trim().replace(/\s+/g, '-').replace(/[.'é]/g, '');
        const res = await fetch(`https://pokeapi.co/api/v2/ability/${cleanName}`);                 
        const data = await res.json();
        const effect = data.effect_entries.find(e => e.language.name === 'en')?.short_effect || "Descrizione non disponibile.";
        
        tooltip.innerHTML = `<p>${effect}</p>`;
        tooltip.dataset.loaded = "true";
    } catch (e) { tooltip.innerHTML = `</h3><p>Info non trovate.</p>`; }
}

async function caricaInfoStrumento(nomeStrumento, elementoId) {
    const tooltip = document.getElementById(elementoId);
    if (!nomeStrumento || tooltip.dataset.loaded === "true") return;

    try {
        const cleanName = nomeStrumento.toLowerCase().trim().replace(/\s+/g, '-').replace(/[.'é]/g, '');
        const res = await fetch(`https://pokeapi.co/api/v2/item/${cleanName}`);
        const data = await res.json();

        tooltip.dataset.loaded = "true";
    } catch (e) { tooltip.innerHTML = `</h3><p>Info non trovate.</p>`; }
}

async function caricaInfoMossa(nomeMossa, elementoId) {
    const tooltip = document.getElementById(elementoId);
    
    // Se la mossa è vuota o già caricata, non fare nulla
    if (!nomeMossa || nomeMossa.trim() === "-" || tooltip.dataset.loaded === "true") return;

    try {
        const cleanName = nomeMossa.trim().toLowerCase().replace(/\s+/g, '-').replace(/[.'é]/g, '');
        const res = await fetch(`https://pokeapi.co/api/v2/move/${cleanName}`);
        
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        // --- APPLICHIAMO IL COLORE AL TOOLTIP ---
        const tipo = data.type.name; 
        tooltip.className = `move-tooltip ${tipo}`; // Aggiunge la classe del tipo (es. "fire") al fumetto
        // ----------------------------------------

        const power = data.power || '--';
        const accuracy = data.accuracy ? data.accuracy + '%' : '--';
        let effect = data.effect_entries.find(e => e.language.name === 'en')?.short_effect || "Descrizione non disponibile.";
        if (data.effect_chance) effect = effect.replace('$effect_chance', data.effect_chance);

        tooltip.innerHTML = `
            <div style="font-weight:bold; margin-bottom:4px; border-bottom:1px solid rgba(255,255,255,0.4);">
                ${nomeMossa.toUpperCase()}
            </div>
            <b>POW:</b> ${power} &nbsp;&nbsp; <b>ACC:</b> ${accuracy}<br>
            <div style="margin-top:6px; font-style:italic; font-size:0.7rem; line-height:1.2;">${effect}</div>
        `;
        
        tooltip.dataset.loaded = "true";
    } catch (e) {
        tooltip.innerText = "Dati mossa non trovati.";
        tooltip.style.background = "#33261c"; // Colore di fallback in caso di errore
    }
}
async function caricaStats(pkmName, elementId) {
    const tooltip = document.getElementById(elementId);
    if (tooltip.dataset.loaded === "true") return;

    try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pkmName}`);
        const data = await res.json();
        
        const statsMap = {
            'hp': 'HP',
            'attack': 'ATK',
            'defense': 'DEF',
            'special-attack': 'SPA',

        };

        let statsHTML = `<div style="font-weight:bold; margin-bottom:8px; border-bottom:1px solid #eeeeee; font-size:0.8rem">BASE STATS</div>`;
        
        data.stats.forEach(s => {
            const val = s.base_stat;
            // Calcoliamo la larghezza della barra (max 150 per le stats base medie)
            const width = Math.min((val / 150) * 100, 100);

                <div class="stat-row">

        tooltip.innerText = "Not able to load stats.";

}

// Nuova funzione per scaricare i tipi
// Aggiunto "direzione" ai parametri
async function caricaTipi(pkmName, elementId, direzione) {
    try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pkmName}`);
        const data = await res.json();
        const container = document.getElementById(elementId);
        if (!container) return;

        const d_types = ["normal","fire","water","electric","grass","ice","fighting","poison","ground","flying","psychic","bug","rock","ghost","dragon","dark","steel","fairy"];
        let effectiveness = {};
        d_types.forEach(type => effectiveness[type] = 1);

        await Promise.all(data.types.map(async (t) => {
            const typeRes = await fetch(t.type.url);
            const typeData = await typeRes.json();
            const rel = typeData.damage_relations;

            rel.double_damage_from.forEach(type => effectiveness[type.name] *= 2);
            rel.half_damage_from.forEach(type => effectiveness[type.name] *= 0.5);
            rel.no_damage_from.forEach(type => effectiveness[type.name] *= 0);
        }));

        let result = { x4: [], x2: [], x05: [], x025: [], x0: [] };
        for (let type in effectiveness) {
            const mult = effectiveness[type];
            if (mult === 4) result.x4.push(type);
            else if (mult === 2) result.x2.push(type);
            else if (mult === 0.5) result.x05.push(type);
            else if (mult === 0.25) result.x025.push(type);
            else if (mult === 0) result.x0.push(type);
        }

        const creaBadge = (lista) => {
            return `<div class="eff-badge-container">
                ${lista.map(t => `<span class="mini-type-badge ${t}">${t}</span>`).join('')}
            </div>`;
        };

        let tooltipHTML = "";
        if (result.x4.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-4">4x</span>${creaBadge(result.x4)}</div>`;
        if (result.x2.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-2">2x</span>${creaBadge(result.x2)}</div>`;
        if (result.x05.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-05">0.5x</span>${creaBadge(result.x05)}</div>`;
        if (result.x025.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-025">0.25x</span>${creaBadge(result.x025)}</div>`;
        if (result.x0.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-0">0x</span>${creaBadge(result.x0)}</div>`;

        // --- APPLICAZIONE CLASSE DIREZIONE ---
        container.innerHTML = data.types.map(t => 
        `<div class="type-container">
            <span class="type-badge ${t.type.name}">${t.type.name.toUpperCase()}</span>
            <div class="type-effectiveness-tooltip ${direzione}">${tooltipHTML}</div>
        </div>`
    ).join('');

    } catch (e) { console.error("Error:", e); }
}    

// Funzione globale per generare l'URL della GIF
function getGifUrl(pName) {
    if (!pName) return "";
    // Showdown usa nomi puliti senza spazi e punteggiatura
    const urlName = pName.toLowerCase()
                         .replace(/\s+/g, '') // Rimuove gli spazi
                         .replace(/[.'é’]/g, ''); // Rimuove punteggiatura
    return `https://play.pokemonshowdown.com/sprites/ani/${urlName}.gif`;
}

function toggleMusic() {
    const player = document.getElementById('bg-music-home') || document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-control') || document.getElementById('music-toggle');

    if (!player || !musicBtn) return;

    if (player.paused || player.muted) {
        // RESET E ACCENSIONE
        player.muted = false; 
        player.volume = 0.3; 

        player.play().then(() => {
            musicBtn.classList.remove('muted');
            localStorage.setItem('userMusicPref', 'on'); // SALVA ON
            console.log("🔊 Musica ripresa");
        }).catch(error => {
            console.warn("Autoplay bloccato:", error);
            musicBtn.classList.add('muted');
        });
        
    } else {
        // SPEGNIMENTO TOTALE
        player.pause();
        player.muted = true; 
        
        musicBtn.classList.add('muted');
        localStorage.setItem('userMusicPref', 'off'); // SALVA OFF
        console.log("🔇 Musica fermata");
    }
}

async function resetPasswordDalLogin() {
    const emailInput = document.getElementById('login-email');
    const emailValue = emailInput ? emailInput.value.trim() : "";

    // 1. Controlla se l'utente ha inserito l'email
    if (!emailValue) {
        alert("⚠️ Inserisci il tuo indirizzo email nel campo sopra per richiedere il reset della password.");
        if (emailInput) emailInput.focus();
        return;
    }

    // 2. Chiedi conferma
    if (!confirm(`Inviare il link per reimpostare la password a: ${emailValue}?`)) return;

    // 3. Attiva l'overlay della Pokeball se presente nella pagina di login
    const loader = document.getElementById('loading-overlay');
    if (loader) loader.classList.add('active');

    try {
        // 4. Chiamata a Firebase Auth tramite l'email passata dall'input
        await firebase.auth().sendPasswordResetEmail(emailValue);
        
        alert(`📧 Email di ripristino inviata!\n\nControlla la casella di posta (e la cartella Spam) all'indirizzo: ${emailValue}`);
        
    } catch (error) {
        console.error("Errore durante il reset della password dal login:", error);
        
        // Gestione degli errori tipici in fase di login
        if (error.code === 'auth/user-not-found') {
            alert("Errore: Questo indirizzo email non è registrato nel sistema.");
        } else if (error.code === 'auth/invalid-email') {
            alert("Errore: L'indirizzo email inserito non è valido.");
        } else if (error.code === 'auth/too-many-requests') {
            alert("Errore: Troppi tentativi di recente. Riprova tra qualche minuto.");
        } else {
            alert("Errore: " + error.message);
        }
    } finally {
        // 5. Spegni il loader
        if (loader) loader.classList.remove('active');
    }
}

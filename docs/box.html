// --- SPECIE, LEARNSET, ABILITÀ, STRUMENTI ---------------------------
function tbSpecie(id) {
    return (tbDex.pokedex && tbDex.pokedex[id]) || null;
}

function tbSpriteId(sp) {
    if (!sp) return '';
    const base = tbToID(sp.baseSpecies || sp.name);
    return sp.forme && sp.baseSpecies ? `${base}-${tbToID(sp.forme)}` : tbToID(sp.name);
}

// Specie "fuori dalla lotta" (per abilità e Species Clause): Zacian-Crowned → Zacian
function tbSpecieBase(sp) {
    if (!sp) return null;
    if (sp.battleOnly) {
        const base = Array.isArray(sp.battleOnly) ? sp.battleOnly[0] : sp.battleOnly;
        return tbSpecie(tbToID(base)) || sp;
    }
    if (/^(Mega|Primal)/.test(sp.forme || '') && sp.baseSpecies) {
        return tbSpecie(tbToID(sp.baseSpecies)) || sp;
    }
    return sp;
}

// Strumento obbligatorio per alcune forme (Rusted Sword, Megapietre, Tavole di Arceus...)
function tbOggettoObbligatorio(sp) {
    if (!sp) return '';
    const lista = sp.requiredItem ? [sp.requiredItem] : (sp.requiredItems || []);
    for (const nome of lista) {
        const item = tbDex.items[tbToID(nome)];
        if (item && (item.gen || 0) <= tbStato.gen) return tbToID(nome);
    }
    return lista.length ? tbToID(lista[0]) : '';
}

// Generazione di debutto della specie (stessa logica di Showdown: le forme di Hisui sono Gen 8)
function tbGenSpecie(sp) {
    if (!sp) return 0;
    if (sp.gen) return sp.gen;
    const forme = sp.forme || '';
    const n = sp.num || 0;
    if (n < 1) {
        // forme cosmetiche senza numero (Gastrodon-East...): conta la specie base
        const base = sp.baseSpecies && tbSpecie(tbToID(sp.baseSpecies));
        return base && base !== sp ? tbGenSpecie(base) : 99;
    }
    if (n >= 906 || forme.includes('Paldea')) return 9;
    if (n >= 810 || ['Gmax', 'Galar', 'Galar-Zen', 'Hisui'].includes(forme)) return 8;
    if (n >= 722 || forme.startsWith('Alola') || forme === 'Starter') return 7;
    if (n >= 650 || /^(Mega|Primal)/.test(forme)) return 6;
    if (n >= 494) return 5;
    if (n >= 387) return 4;
    if (n >= 252) return 3;
    if (n >= 152) return 2;
    return 1;
}

// Specie che esistono già nella gen del formato ma di cui Showdown ha solo il learnset
// di una gen successiva (forme di Hisui, Wyrdeer, Kleavor, Ursaluna, Basculegion,
// Sneasler, Overqwil, Enamorus): si usa la gen più vicina con dati
function tbGenRipiegoLearnset(sp, learnset) {
    if (!sp || !learnset || tbGenSpecie(sp) > tbStato.gen) return 0;

    const genDati = Object.values(learnset)
        .flatMap(fonti => [].concat(fonti))
        .map(f => parseInt(String(f).charAt(0), 10))
        .filter(g => !isNaN(g));

    if (!genDati.length || genDati.some(g => g <= tbStato.gen)) return 0;
    return Math.min(...genDati);
}

function tbRaccogliLearnset(specieId) {
    const risultato = {};
    const visti = new Set();
    const coda = [specieId];

    while (coda.length) {
        const id = coda.shift();
        if (!id || visti.has(id)) continue;
        visti.add(id);

        const sp = tbSpecie(id);
        const voce = tbDex.learnsets[id];
        const learnset = voce && voce.learnset;
        const genRipiego = tbGenRipiegoLearnset(sp, learnset);
        let haMosse = false;

        if (learnset) {
            Object.entries(learnset).forEach(([mossa, fonti]) => {
                let lista = [].concat(fonti);
                if (genRipiego) {
                    lista = lista
                        .filter(f => parseInt(String(f).charAt(0), 10) === genRipiego)
                        .map(f => tbStato.gen + String(f).slice(1));
                    if (!lista.length) return;
                }
                haMosse = true;
                if (!risultato[mossa]) risultato[mossa] = [];
                risultato[mossa].push(...lista);
            });
        }

        if (!sp) continue;        if (sp.prevo) coda.push(tbToID(sp.prevo));
        if (sp.changesFrom) coda.push(tbToID(sp.changesFrom));
        if (sp.battleOnly) [].concat(sp.battleOnly).forEach(b => coda.push(tbToID(b)));
        if (!haMosse && sp.baseSpecies && tbToID(sp.baseSpecies) !== id) coda.push(tbToID(sp.baseSpecies));
    }

    return risultato;
}

// "9M", "8L20", "7E"... → la prima cifra è la generazione
function tbFonteValida(fonte) {
    const s = String(fonte);
    const generazioni = /^\d+$/.test(s) ? s.split('').map(Number) : [parseInt(s.charAt(0), 10)];
    return generazioni.some(g => !isNaN(g) && (tbStato.within ? g === tbStato.gen : g <= tbStato.gen));
}

function tbGenMossa(m) {
    const n = m.num || 0;
    // Mosse di Leggende Arceus (Dire Claw → Take Heart): Showdown le conta di Gen 9,
    // qui valgono come Gen 8, coerentemente con le forme di Hisui
    if (n >= 827 && n <= 850 && !m.isMax && !m.isZ) return 8;
    if (m.gen) return m.gen;if (n >= 827) return 9;
    if (n >= 743) return 8;
    if (n >= 622) return 7;
    if (n >= 560) return 6;
    if (n >= 468) return 5;
    if (n >= 355) return 4;
    if (n >= 252) return 3;
    if (n >= 166) return 2;
    return 1;
}

function tbGenAbilita(nome) {
    const a = tbDex.abilities[tbToID(nome)];
    if (!a) return 3;
    if (a.gen) return a.gen;
    const n = a.num || 0;
    if (n >= 268) return 9;
    if (n >= 234) return 8;
    if (n >= 192) return 7;
    if (n >= 165) return 6;
    if (n >= 124) return 5;
    if (n >= 77) return 4;
    return 3;
}

// Valori della mossa con gli stessi nomi usati dal validatore del sito
function tbValoriMossa(m) {
    return {
        power: m.basePower || 0,
        category: m.category,
        type: m.type,
        max_pp: m.pp || 0,
        accuracy: m.accuracy === true ? 100 : (m.accuracy || 100),
        priority: m.priority || 0,
        is_protect: TB_MOSSE_PROTECT.includes(tbToID(m.name)),
        is_contact: !!(m.flags && m.flags.contact),
        sound_based: !!(m.flags && m.flags.sound),
        punch: !!(m.flags && m.flags.punch),
        healing: !!(m.flags && m.flags.heal) && m.category === 'Status'
    };
}

function tbMossaAmmessaDalFormato(m) {
    if (!m || !m.name) return false;
    if (m.isZ || m.isMax) return false;
    if (['CAP', 'LGPE', 'Custom', 'Unobtainable', 'Future', 'Gigantamax'].includes(m.isNonstandard)) return false;
    if (tbStato.within && tbStato.gen === 9 && m.isNonstandard === 'Past') return false;
        if (voceBannata(tbStato.regolamento?.restrizioni, 'mosse', m.name)) return false;

    const regole = tbStato.regolamento?.restrizioni?.mosse;
    if (!regole) return true;

    const valori = tbValoriMossa(m);
    return Object.entries(regole).every(([campo, regola]) => {
        if (!regola || !(campo in valori)) return true;
        if (regola.mode === 'SPECIFIC' && typeof validaSingoloOperatore === 'function') {
            return validaSingoloOperatore(valori[campo], regola);
        }
        if (regola.mode === 'BANNED') return valori[campo] !== true;
        return true;
    });
}

function tbMosseLegali(specieId) {
    if (tbStato.cacheMosse[specieId]) return tbStato.cacheMosse[specieId];

    const learnset = tbRaccogliLearnset(specieId);
    let ids;

    if (learnset.sketch && learnset.sketch.some(tbFonteValida)) {
        // Smeargle: Sketch permette qualsiasi mossa esistente nella generazione
        ids = Object.keys(tbDex.moves).filter(id => tbGenMossa(tbDex.moves[id]) <= tbStato.gen && id !== 'struggle' && id !== 'chatter');
    } else {
        ids = Object.keys(learnset).filter(id =>
            learnset[id].some(tbFonteValida) &&
            (!tbDex.moves[id] || tbGenMossa(tbDex.moves[id]) <= tbStato.gen)
        );    }

    const legali = ids
        .map(id => tbDex.moves[id] ? { id, dati: tbDex.moves[id] } : null)
        .filter(m => m && tbMossaAmmessaDalFormato(m.dati))
        .sort((a, b) => a.dati.name.localeCompare(b.dati.name));

    tbStato.cacheMosse[specieId] = legali;
    return legali;
}

function tbAbilitaLegali(spBase, ignoraBan = false) {
    if (!spBase || tbStato.gen < 3) return [];
    const abilita = spBase.abilities || {};
    const nomi = ['0', '1', 'H', 'S']
        .filter(k => abilita[k])
        .filter(k => !(k === 'H' && tbStato.gen < 5))
        .map(k => abilita[k])
        .filter(nome => tbGenAbilita(nome) <= tbStato.gen)
                .filter(nome => ignoraBan || !voceBannata(tbStato.regolamento?.restrizioni, 'abilita', nome));
    return [...new Set(nomi)];
}

function tbOggettiLegali() {
    if (tbStato.oggetti) return tbStato.oggetti;
    if (tbStato.gen < 2) return (tbStato.oggetti = []);

    const valoreMega = tbStato.regolamento?.restrizioni?.pokemon?.is_mega?.value;
    const megaAmmesse = ['true', 'yes', 'allowed'].includes(String(valoreMega).toLowerCase().trim());
    const regoleStrumenti = tbStato.regolamento?.restrizioni?.strumenti || {};
    const regolaBacche = regoleStrumenti.is_berry;

    tbStato.oggetti = Object.entries(tbDex.items)
        .filter(([id, it]) => {
            if (!it || !it.name) return false;
            if ((it.gen || 0) > tbStato.gen) return false;
            if (['CAP', 'LGPE', 'Custom', 'Unobtainable', 'Future'].includes(it.isNonstandard)) return false;
            if (it.isPokeball) return false;
if (it.zMove && (tbStato.gen !== 7 || !tbMeccanicheAttive())) return false;
if (it.megaStone && (!megaAmmesse || tbStato.gen < 6 || !tbMeccanicheAttive())) return false;
            if (tbStato.within && tbStato.gen === 9 && it.isNonstandard === 'Past') return false;

            if (regolaBacche) {
                if (regolaBacche.mode === 'BANNED' && it.isBerry) return false;
                if (regolaBacche.mode === 'SPECIFIC' && typeof validaSingoloOperatore === 'function' &&
                    !validaSingoloOperatore(!!it.isBerry, regolaBacche)) return false;
            }
            return true;
        })
        .map(([id, it]) => ({ id, nome: it.name }))
        .sort((a, b) => a.nome.localeCompare(b.nome));

    return tbStato.oggetti;
}

// --- NATURA (stile Showdown: + e − sulle statistiche) ----------------
function tbNatureAmmesse() {
    const regola = tbStato.regolamento?.restrizioni?.pokemon?.nature;
    const tutte = Object.keys(TB_NATURE);
    if (regola && regola.mode === 'SPECIFIC' && regola.value && (!regola.operator || regola.operator === 'equals')) {
        const filtrate = tutte.filter(n => n.toLowerCase() === String(regola.value).toLowerCase().trim());
        if (filtrate.length) return filtrate;
    }
    return tutte;
}

function tbNaturaImposta() {
    const ammesse = tbNatureAmmesse();
    return ammesse.length === 1 ? ammesse[0] : '';
}

function tbTrovaNatura(plus, minus) {
    if (!plus || !minus || plus === minus) return '';
    return Object.keys(TB_NATURE).find(n => TB_NATURE[n] && TB_NATURE[n][0] === plus && TB_NATURE[n][1] === minus) || '';
}

function tbEtichettaNatura(s) {
    const eff = TB_NATURE[s.natura];
    if (!eff) return `${s.natura} (neutral)`;
    const lab = k => TB_STAT.find(x => x.key === k).label;
    return `${s.natura} (+${lab(eff[0])}, −${lab(eff[1])})`;
}

function tbImpostaNatura(tipo, chiave) {
    const s = tbStato.slot[tbStato.attivo];
    if (!s || tbNaturaImposta()) return;

    if (tipo === 'plus') {
        s.natPlus = s.natPlus === chiave ? '' : chiave;
        if (s.natMinus === s.natPlus) s.natMinus = '';
    } else {
        s.natMinus = s.natMinus === chiave ? '' : chiave;
        if (s.natPlus === s.natMinus) s.natPlus = '';
    }
    s.natura = tbTrovaNatura(s.natPlus, s.natMinus) || 'Serious';

    const pannello = document.getElementById('tb-ev-panel');
    if (pannello) pannello.innerHTML = tbHtmlPannelloEV(s);
    tbRenderLeggero();
}

// --- DEBOLEZZE E RESISTENZE ------------------------------------------
function tbTipiAttaccanti() {
    return tbStato.gen >= 6 ? TB_TIPI : TB_TIPI.filter(t => t !== 'Fairy');
}

function tbMoltiplicatore(attacco, tipiDifesa, abilita) {
    let mult = 1;
    tipiDifesa.forEach(dif => {
        const tabella = TB_DIFESE[dif];
        if (!tabella) return;
        let [deboli, resiste, immune] = tabella;
        if (tbStato.gen < 6 && dif === 'Steel') resiste = [...resiste, 'Ghost', 'Dark'];
        if (immune.includes(attacco)) mult *= 0;
        else if (deboli.includes(attacco)) mult *= 2;
        else if (resiste.includes(attacco)) mult *= 0.5;
    });
    const mod = TB_ABILITA_DIFENSIVE[tbToID(abilita)];
    if (mod && mod[attacco] !== undefined && mult !== 0) mult *= mod[attacco];
    return mult;
}

function tbHtmlEfficacia(tipiDifesa, abilita) {
    const gruppi = { 4: [], 2: [], 0.5: [], 0.25: [], 0: [] };
    tbTipiAttaccanti().forEach(t => {
        const m = tbMoltiplicatore(t, tipiDifesa, abilita);
        if (m >= 4) gruppi[4].push(t);
        else if (m >= 2) gruppi[2].push(t);
        else if (m === 0) gruppi[0].push(t);
        else if (m <= 0.25) gruppi[0.25].push(t);
        else if (m < 1) gruppi[0.5].push(t);
    });

    const badge = lista => `<div class="eff-badge-container">${lista.map(t =>
        `<span class="mini-type-badge ${t.toLowerCase()}">${t.toLowerCase()}</span>`).join('')}</div>`;

    let html = '';
    if (gruppi[4].length)    html += `<div class="eff-section"><span class="eff-title v-4">4x</span>${badge(gruppi[4])}</div>`;
    if (gruppi[2].length)    html += `<div class="eff-section"><span class="eff-title v-2">2x</span>${badge(gruppi[2])}</div>`;
    if (gruppi[0.5].length)  html += `<div class="eff-section"><span class="eff-title v-05">0.5x</span>${badge(gruppi[0.5])}</div>`;
    if (gruppi[0.25].length) html += `<div class="eff-section"><span class="eff-title v-025">0.25x</span>${badge(gruppi[0.25])}</div>`;
    if (gruppi[0].length)    html += `<div class="eff-section"><span class="eff-title v-0">0x</span>${badge(gruppi[0])}</div>`;
    if (TB_ABILITA_DIFENSIVE[tbToID(abilita)]) html += `<div class="tb-eff-note">Includes ${tbEsc(abilita)}</div>`;
    return html;
}

// =====================================================================
// 🛡️ COPERTURA DIFENSIVA (tooltip "Team weaknesses")
// =====================================================================
function tbCalcolaCopertura() {
    const pieni = tbStato.slot.filter(Boolean);
    const critici = [];
    const avvisi = [];

    const tipi = tbTipiAttaccanti().map(t => {
        const r = { tipo: t, deboli: [], x4: [], resiste: [], immune: [] };
        pieni.forEach(s => {
            const sp = tbSpecie(s.specieId);
            const nome = tbNomeBello(sp);
            const m = tbMoltiplicatore(t, sp.types || [], s.abilita);
            if (m === 0) r.immune.push(nome);
            else if (m > 1) { r.deboli.push(nome); if (m >= 4) r.x4.push(nome); }
            else if (m < 1) r.resiste.push(nome);
        });

        const d = r.deboli.length;
        const c = r.resiste.length + r.immune.length;
        // rosso: 3+ deboli, o 2+ deboli senza nessuna risposta
        // arancione: più deboli che risposte, o un 4× senza risposta
        if (d >= 3 || (d >= 2 && c === 0)) r.stato = 'critical';
        else if ((d >= 2 && c < d) || (r.x4.length && c === 0)) r.stato = 'warning';
        else if (d === 0 && c >= 2) r.stato = 'strong';
        else r.stato = '';

        if (r.stato === 'critical') critici.push(t);
        if (r.stato === 'warning') avvisi.push(t);
        return r;
    });

    return { pieni: pieni.length, tipi, critici, avvisi };
}

// Tipizzazioni presenti nel formato che coprono i tipi problematici (resistenza o immunità)
// senza aggiungere debolezze ai tipi già problematici. I nomi sono cliccabili se c'è uno slot libero
function tbHtmlSuggerimenti(critici, avvisi, quantiNelTeam) {
    const bersagli = critici.length ? critici : avvisi;
    const problemi = [...critici, ...avvisi];
    if (!bersagli.length) return '';
    const numeriUsati = tbStato.clausole ? tbNumeriUsati(-1) : new Set();

    // Raggruppa i Pokémon disponibili per tipizzazione (esclusi quelli già nel team)
    const gruppi = new Map();
    tbStato.pool.forEach(v => {
        const tipi = v.sp && Array.isArray(v.sp.types) ? v.sp.types : [];
        if (!tipi.length) return;
        const base = tbSpecieBase(v.sp);
        if ((base && numeriUsati.has(base.num)) || tbEvolveNelFormato(v.sp)) return;
                const chiave = [...tipi].sort().join('/'); // Steel/Flying e Flying/Steel sono la stessa tipizzazione
        if (!gruppi.has(chiave)) gruppi.set(chiave, { tipi, pokemon: [] });
        gruppi.get(chiave).pokemon.push(v); // il pool è già ordinato per BST
    });

    const valutati = [...gruppi.values()].map(g => ({
        ...g,
        copre: bersagli.filter(t => tbMoltiplicatore(t, g.tipi, '') < 1),
        peggiora: problemi.filter(t => tbMoltiplicatore(t, g.tipi, '') > 1),
        // resistenze meno debolezze su tutti i tipi: a parità premia le tipizzazioni più solide
        bilancio: tbTipiAttaccanti().reduce((tot, t) => {
            const m = tbMoltiplicatore(t, g.tipi, '');
            return tot + (m < 1 ? 1 : (m > 1 ? -1 : 0));
        }, 0)
    })).filter(g => g.copre.length);

    // Prima le tipizzazioni che non peggiorano nulla; se non ce ne sono, le migliori disponibili
    const puliti = valutati.filter(g => !g.peggiora.length);
    const scelti = (puliti.length ? puliti : valutati)
        .sort((a, b) => (b.copre.length - a.copre.length)
                     || (a.peggiora.length - b.peggiora.length)
                     || (b.bilancio - a.bilancio)
                     || (b.pokemon[0].bst - a.pokemon[0].bst))
        .slice(0, 3);
    if (!scelti.length) return '';

    const slotLibero = tbStato.slot.some(s => !s) && !tbStato.solaLettura;
        const esempio = v => slotLibero
        ? `<span class="tb-tip-link" onclick="tbAggiungiSuggerito('${v.specieId}')">${tbEsc(v.nome)}</span>`
        : tbEsc(v.nome);

    const righe = scelti.map(g => `
        <div class="tb-tip-row">
            <span class="tb-tip-types">${g.tipi.map(tbBadgeTipoMini).join('')}</span>
            <span class="tb-tip-names wrap">covers <b>${g.copre.join(', ')}</b>${g.peggiora.length ? ` · <i>weak to ${g.peggiora.join(', ')}</i>` : ''}</span>
        </div>
        <div class="tb-tip-examples">e.g. ${g.pokemon.slice(0, 3).map(esempio).join(', ')}</div>`).join('');

    return `
        <div class="tb-tip-section">
            <div class="tb-tip-title">💡 ${quantiNelTeam < 6 ? 'Consider adding' : 'Consider swapping in'}</div>
            ${righe}
            ${slotLibero ? `<div class="tb-tip-note">Click a name to add it to the first empty slot</div>` : ''}
        </div>`;
}

function tbAggiungiSuggerito(specieId) {
    const libero = tbStato.slot.findIndex(s => !s);
    if (libero < 0) return;
    tbNascondiTooltip();
    tbStato.attivo = libero;
    tbScegliPokemon(specieId);
}

function tbHtmlDifesa() {
    const c = tbCalcolaCopertura();
    const testata = tbTestataCoach(`TEAM DEFENCE · ${c.pieni}/6`);
    if (!c.pieni) {
        return `${testata}<div class="neubrutalist-tooltip-body"><div class="tb-tip-sub">Add Pokémon to see the team's weaknesses and resistances.</div></div>`;
    }

    const totale = c.tipi.length;
    const conRisposta = c.tipi.filter(r => r.resiste.length + r.immune.length > 0).length;

    // Tipi problematici: prima i rossi, poi per numero di deboli
    const problemi = c.tipi
        .filter(r => r.stato === 'critical' || r.stato === 'warning')
        .sort((a, b) => ((a.stato === 'critical' ? 0 : 1) - (b.stato === 'critical' ? 0 : 1))
                     || (b.deboli.length - a.deboli.length)
                     || (b.x4.length - a.x4.length));

    const righeProblemi = problemi.map(r => {
        const nomi = r.deboli.map(n => r.x4.includes(n) ? `<b>${tbEsc(n)} 4×</b>` : tbEsc(n)).join(', ');
        const risposte = [...r.immune, ...r.resiste];
        const badge = risposte.length
            ? `<span class="tb-tip-badge ok">↳ ${tbEsc(risposte[0])}${risposte.length > 1 ? ` +${risposte.length - 1}` : ''}</span>`
            : `<span class="tb-tip-badge bad">no switch-in</span>`;
        return `
            <div class="tb-tip-row ${r.stato}">
                ${tbBadgeTipoMini(r.tipo)}<span class="tb-tip-names">${nomi}</span>${badge}
            </div>`;
    }).join('');

    const sezioneProblemi = problemi.length
        ? `<div class="tb-tip-section">
               <div class="tb-tip-title">⚠ Problem types · who is weak</div>
               ${righeProblemi}
           </div>
           ${tbHtmlSuggerimenti(c.critici, c.avvisi, c.pieni)}`
        : `<div class="tb-tip-section"><div class="tb-tip-sub">✔ No critical weaknesses</div></div>`;

    const celle = c.tipi.map(r => `
        <div class="tb-tip-cell ${r.stato}">
            ${tbBadgeTipoMini(r.tipo)}
            <small>▼${r.deboli.length} ▲${r.resiste.length + r.immune.length}</small>
        </div>`).join('');

    return `
        ${testata}
        <div class="neubrutalist-tooltip-body">
            <div class="tb-tip-big">${conRisposta}/${totale}</div>
            <div class="tb-tip-sub">attacking types with a safe switch-in</div>
            <div class="tb-tip-bar"><div style="width: ${(100 * conRisposta / totale).toFixed(1)}%;"></div></div>
            <div class="tb-tip-sub">${c.critici.length} critical · ${c.avvisi.length} to watch</div>
            ${sezioneProblemi}
            <div class="tb-tip-section"><div class="tb-tip-grid">${celle}</div></div>
        </div>`;
}

// =====================================================================
// ⚔️ COPERTURA OFFENSIVA (tooltip "Team coverage")
// Per ogni Pokémon del formato calcola la miglior efficacia che il team ottiene
// con le mosse d'attacco scelte. Considera il tipo reale della mossa (Pixilate & co.,
// Tera Blast, Freeze-Dry...) e l'abilità del bersaglio solo se è garantita
// (es. Levitate su Rotom-Wash, che non ha alternative)
// =====================================================================
const TB_ABILITA_ATE = { pixilate: 'Fairy', aerilate: 'Flying', refrigerate: 'Ice', galvanize: 'Electric' };
const TB_ABILITA_MOLD = ['moldbreaker', 'teravolt', 'turboblaze'];
const TB_MOSSE_POTENZA_VARIABILE = ['lowkick', 'grassknot', 'heavyslam', 'heatcrash', 'gyroball', 'electroball',
    'return', 'frustration', 'reversal', 'flail', 'crushgrip', 'wringout', 'hardpress', 'punishment'];
const TB_MOSSE_NON_SUGGERIRE = ['explosion', 'selfdestruct', 'mistyexplosion', 'finalgambit', 'steelbeam', 'mindblown'];
const TB_MOSSE_SOLO_SUPPORTO = ['fakeout', 'feint']; // fanno danno, ma non sono copertura

// Conta per la copertura: mossa d'attacco, non a danno fisso (Seismic Toss), né OHKO, né Fake Out & co.
function tbMossaOffensiva(m, id) {
    if (!m || m.category === 'Status' || m.damage || m.ohko || TB_MOSSE_SOLO_SUPPORTO.includes(id)) return false;
    return m.basePower > 0 || TB_MOSSE_POTENZA_VARIABILE.includes(id);
}

// Tipo effettivo della mossa per questo Pokémon
function tbTipoMossa(id, m, s, sp) {
    const ab = tbToID(s.abilita);
    if (ab === 'normalize') return 'Normal';
    if (id === 'terablast' && tbStato.gen === 9 && s.tera && s.tera !== 'Stellar') return s.tera;
    if (['judgment', 'multiattack', 'revelationdance'].includes(id)) return (sp.types || [m.type])[0];
    if (m.type === 'Normal' && TB_ABILITA_ATE[ab]) return TB_ABILITA_ATE[ab];
    return m.type;
}

function tbEfficaciaMossa(id, tipo, abilitaAttaccante, tipiDifesa, abilitaDifesa) {
    const abAtt = tbToID(abilitaAttaccante);
    let tipi = tipiDifesa;
    let abDif = TB_ABILITA_MOLD.includes(abAtt) ? '' : abilitaDifesa;

    if ((abAtt === 'scrappy' || abAtt === 'mindseye') && (tipo === 'Normal' || tipo === 'Fighting')) {
        tipi = tipi.filter(t => t !== 'Ghost');
    }
    if (id === 'thousandarrows') { // colpisce anche i Volante e chi ha Levitate
        tipi = tipi.filter(t => t !== 'Flying');
        abDif = '';
    }

    let m = tbMoltiplicatore(tipo, tipi, abDif);
    if (id === 'freezedry' && tipi.includes('Water')) m *= 4;
    if (id === 'flyingpress') m *= tbMoltiplicatore('Flying', tipi, '');
    return m;
}

// Efficacia di un tipo "puro" su un bersaglio (abilità contata solo se garantita)
function tbEfficaciaTipoSuBersaglio(tipo, b) {
    return Math.max(...b.abilita.map(a => tbMoltiplicatore(tipo, b.v.sp.types, a)));
}

function tbCalcolaAttacco() {
    const chiave = tbStato.firma + '|' + JSON.stringify(tbStato.slot.map(s => s && [s.specieId, s.abilita, s.tera, s.mosse]));
    if (tbStato.cacheAttacco && tbStato.cacheAttacco.chiave === chiave) return tbStato.cacheAttacco.dati;

    const membri = tbStato.slot.filter(Boolean).map(s => {
        const sp = tbSpecie(s.specieId);
        const mosse = s.mosse
            .filter(id => id && tbMossaOffensiva(tbDex.moves[id], id))
            .map(id => ({ id, tipo: tbTipoMossa(id, tbDex.moves[id], s, sp) }));
        return { s, sp, nome: tbNomeBello(sp), mosse, colpiti: 0 };
    });
    const attaccanti = membri.filter(x => x.mosse.length);

    const bersagli = tbStato.pool.filter(v => v.sp && Array.isArray(v.sp.types)).map(v => {
        const abilita = tbAbilitaLegali(v.sp);
        if (!abilita.length) abilita.push('');
        let migliore = 0;
        attaccanti.forEach(x => {
            let delMembro = 0;
            x.mosse.forEach(mv => {
                // max sulle abilità: un'immunità da abilità conta solo se tutte le sue abilità la danno
                const eff = Math.max(...abilita.map(a => tbEfficaciaMossa(mv.id, mv.tipo, x.s.abilita, v.sp.types, a)));
                if (eff > delMembro) delMembro = eff;
            });
            if (delMembro > 1) x.colpiti++;
            if (delMembro > migliore) migliore = delMembro;
        });
        return { v, abilita, migliore };
    });

    const dati = {
        membri,
        attaccanti: attaccanti.length,
        mosse: attaccanti.reduce((t, x) => t + x.mosse.length, 0),
        bersagli,
        totale: bersagli.length,
        superEfficaci: bersagli.filter(b => b.migliore > 1).length,
        muri: bersagli.filter(b => b.migliore < 1)
    };
    tbStato.cacheAttacco = { chiave, dati };
    return dati;
}

// Chi nel team può imparare una mossa di quel tipo, con la mossa migliore
// (potenza × STAB × stat d'attacco base × precisione; mosse a carica/ricarica penalizzate)
function tbChiImparaTipo(membri, tipo) {
    return membri.map(x => {
        const giaNelSet = new Set(x.s.mosse);
        let migliore = null, punteggio = 0;
        tbMosseLegali(x.s.specieId).forEach(({ id, dati }) => {
            if (giaNelSet.has(id) || TB_MOSSE_NON_SUGGERIRE.includes(id) || !tbMossaOffensiva(dati, id)) return;
            if (tbTipoMossa(id, dati, x.s, x.sp) !== tipo) return;
            const stat = dati.category === 'Physical' ? x.sp.baseStats.atk : x.sp.baseStats.spa;
            const stab = (x.sp.types || []).includes(tipo) ? 1.5 : 1;
            const precisione = dati.accuracy === true ? 100 : (dati.accuracy || 100);
            const penalita = dati.flags && (dati.flags.recharge || dati.flags.charge) ? 0.5 : 1;
            const p = (dati.basePower || 60) * stab * stat * precisione * penalita;
            if (p > punteggio) { punteggio = p; migliore = dati.name; }
        });
        return migliore ? { nome: x.nome, mossa: migliore, punteggio } : null;
    }).filter(Boolean).sort((a, b) => b.punteggio - a.punteggio);
}

function tbHtmlAttacco() {
    const a = tbCalcolaAttacco();
    const testata = tbTestataCoach(`TEAM COVERAGE · ${a.mosse} attacks`);
    if (!a.attaccanti || !a.totale) {
        return `${testata}<div class="neubrutalist-tooltip-body"><div class="tb-tip-sub">Give your Pokémon some attacking moves to see the offensive coverage.</div></div>`;
    }

    const nonSE = a.bersagli.filter(b => b.migliore <= 1);
    const neutri = nonSE.length - a.muri.length;
    const nomiBersagli = (lista, quanti) =>
        lista.slice(0, quanti).map(b => tbEsc(b.v.nome)).join(', ') + (lista.length > quanti ? ` +${lista.length - quanti}` : '');

    // Tipi d'attacco del team (quante mosse per tipo)
    const conteggioTipi = {};
    a.membri.forEach(x => x.mosse.forEach(mv => { conteggioTipi[mv.tipo] = (conteggioTipi[mv.tipo] || 0) + 1; }));
    const htmlTipiTeam = Object.entries(conteggioTipi)
        .sort((x, y) => y[1] - x[1])
        .map(([t, n]) => `<span class="tb-tip-chip">${tbBadgeTipoMini(t)}${n > 1 ? `<small>×${n}</small>` : ''}</span>`)
        .join('');

    // Pokémon che resistono a tutto il team
    const sezioneMuri = a.muri.length
        ? `<div class="tb-tip-section">
               <div class="tb-tip-title">🧱 Resist your whole team · ${a.muri.length}</div>
               <div class="tb-tip-examples">${nomiBersagli(a.muri, 8)}</div>
           </div>`
        : '';

    // Non colpiti superefficace, raggruppati per tipizzazione (le più numerose prima)
    const gruppi = new Map();
    nonSE.forEach(b => {
        const k = [...b.v.sp.types].sort().join('/');
        if (!gruppi.has(k)) gruppi.set(k, { tipi: b.v.sp.types, lista: [], peggiore: 4 });
        const g = gruppi.get(k);
        g.lista.push(b);
        g.peggiore = Math.min(g.peggiore, b.migliore);
    });
    const righeGruppi = [...gruppi.values()]
        .sort((x, y) => (y.lista.length - x.lista.length) || (x.peggiore - y.peggiore))
        .slice(0, 5)
        .map(g => `
            <div class="tb-tip-row">
                <span class="tb-tip-types">${g.tipi.map(tbBadgeTipoMini).join('')}</span>
                <span class="tb-tip-names">${nomiBersagli(g.lista, 2)}</span>
                <span class="tb-tip-badge ${g.peggiore < 1 ? 'bad' : 'warn'}">${g.lista.length}</span>
            </div>`).join('');
    const sezioneGruppi = nonSE.length
        ? `<div class="tb-tip-section">
               <div class="tb-tip-title">Not hit super-effectively · by typing</div>
               ${righeGruppi}
               ${gruppi.size > 5 ? `<div class="tb-tip-note">…and ${gruppi.size - 5} more typings</div>` : ''}
           </div>`
        : `<div class="tb-tip-section"><div class="tb-tip-sub">🏁 Everything in the format is hit super-effectively</div></div>`;

    // Per ogni tipo d'attacco: quali dei Pokémon non colpiti superefficace colpirebbe superefficace
    const colpitiDaTipo = new Map(tbTipiAttaccanti().map(t => [
        t, new Set(nonSE.map((b, i) => (tbEfficaciaTipoSuBersaglio(t, b) > 1 ? i : -1)).filter(i => i >= 0))
    ]));

    // Tipi che aggiungerebbero più superefficaci, con chi li può imparare
    const suggerimenti = [...colpitiDaTipo.entries()]
        .map(([tipo, colpiti]) => ({ tipo, guadagno: colpiti.size }))
        .filter(x => x.guadagno > 0)
        .sort((x, y) => y.guadagno - x.guadagno)
        .slice(0, 3);
    const righeSuggerimenti = suggerimenti.map(sug => {
        const chi = tbChiImparaTipo(a.membri, sug.tipo).slice(0, 2);
        return `
            <div class="tb-tip-row">
                ${tbBadgeTipoMini(sug.tipo)}
                <span class="tb-tip-names wrap">${chi.length
                    ? chi.map(c => `${tbEsc(c.nome)}: <b>${tbEsc(c.mossa)}</b>`).join(' · ')
                    : '<i>nobody in the team learns one</i>'}</span>
                <span class="tb-tip-badge ok">+${sug.guadagno}</span>
            </div>`;
    }).join('');
    const sezioneSuggerimenti = suggerimenti.length
        ? `<div class="tb-tip-section">
               <div class="tb-tip-title">💡 Best type to add · who can learn it</div>
               ${righeSuggerimenti}
           </div>`
        : '';

    // Pokémon del formato i cui STAB aggiungono più superefficaci (uno per tipizzazione, es. Bug/Steel → Scizor);
    // a parità si preferisce chi copre anche le debolezze difensive del team e non ne aggiunge
    const numeriUsati = tbStato.clausole ? tbNumeriUsati(-1) : new Set();
    const difesa = tbCalcolaCopertura();
    const problemiDifesa = [...difesa.critici, ...difesa.avvisi];
    const tipizzazioni = new Map();
    tbStato.pool.forEach(v => {
        const tipi = v.sp && Array.isArray(v.sp.types) ? v.sp.types : [];
        if (!tipi.length) return;
        const base = tbSpecieBase(v.sp);
        if ((base && numeriUsati.has(base.num)) || tbEvolveNelFormato(v.sp)) return;
        const k = [...tipi].sort().join('/');
        if (!tipizzazioni.has(k)) tipizzazioni.set(k, { tipi, pokemon: [] });
        const gruppo = tipizzazioni.get(k);
        if (base && gruppo.pokemon.some(p => tbSpecieBase(p.sp)?.num === base.num)) return; // una forma per specie
        gruppo.pokemon.push(v); // il pool è già ordinato per BST
    });
    const proposte = [...tipizzazioni.values()]
        .map(g => {
            const colpiti = new Set();
            g.tipi.forEach(t => (colpitiDaTipo.get(t) || new Set()).forEach(i => colpiti.add(i)));
            return {
                ...g,
                guadagno: colpiti.size,
                aiuta: problemiDifesa.filter(t => tbMoltiplicatore(t, g.tipi, '') < 1),
                peggiora: problemiDifesa.filter(t => tbMoltiplicatore(t, g.tipi, '') > 1)
            };
        })
        .filter(g => g.guadagno > 0)
        .sort((x, y) => (y.guadagno - x.guadagno)
                     || ((y.aiuta.length - y.peggiora.length) - (x.aiuta.length - x.peggiora.length))
                     || (y.pokemon[0].bst - x.pokemon[0].bst))
        .slice(0, 3);
    const slotLibero = tbStato.slot.some(s => !s) && !tbStato.solaLettura;
        const esempio = v => slotLibero
        ? `<span class="tb-tip-link" onclick="tbAggiungiSuggerito('${v.specieId}')">${tbEsc(v.nome)}</span>`
        : tbEsc(v.nome);
    const sezionePokemon = proposte.length
        ? `<div class="tb-tip-section">
               <div class="tb-tip-title">💡 ${slotLibero ? 'Or add' : 'Or swap in'} a Pokémon with these STABs</div>
               ${proposte.map(g => `
                   <div class="tb-tip-row">
                       <span class="tb-tip-types">${g.tipi.map(tbBadgeTipoMini).join('')}</span>
                       <span class="tb-tip-names wrap">${g.aiuta.length ? `also resists <b>${g.aiuta.join(', ')}</b>` : ''}${g.peggiora.length ? `${g.aiuta.length ? ' · ' : ''}<i>weak to ${g.peggiora.join(', ')}</i>` : ''}</span>
                       <span class="tb-tip-badge ok">+${g.guadagno}</span>
                   </div>
                   <div class="tb-tip-examples">e.g. ${g.pokemon.slice(0, 3).map(esempio).join(', ')}</div>`).join('')}
               ${slotLibero ? '<div class="tb-tip-note">Click a name to add it to the first empty slot</div>' : ''}
           </div>`
        : '';

    // Contributo di ogni membro
    const righeMembri = a.membri.map(x => {
        const tipi = [...new Set(x.mosse.map(mv => mv.tipo))];
        return `
            <div class="tb-tip-row">
                <span class="tb-tip-names">${tbEsc(x.nome)}</span>
                <span class="tb-tip-types">${tipi.length ? tipi.map(tbBadgeTipoMini).join('') : '<i>no attacks</i>'}</span>
                <b>${tipi.length ? `${tbPerc(x.colpiti, a.totale)}%` : '—'}</b>
            </div>`;
    }).join('');

    return `
        ${testata}
        <div class="neubrutalist-tooltip-body">
            <div class="tb-tip-big">${tbPerc(a.superEfficaci, a.totale)}%</div>
            <div class="tb-tip-sub">of the format hit super-effectively</div>
            <div class="tb-tip-bar"><div style="width: ${(100 * a.superEfficaci / a.totale).toFixed(1)}%;"></div></div>
            <div class="tb-tip-sub">${a.superEfficaci} super-effective · ${neutri} neutral at best · ${a.muri.length} resist everything</div>
            <div class="tb-tip-section"><div class="tb-tip-chips">${htmlTipiTeam}</div></div>
            ${sezioneMuri}
            ${sezioneGruppi}
            ${sezioneSuggerimenti}
                        ${sezionePokemon}
            <div class="tb-tip-section">
                <div class="tb-tip-title">Per Pokémon · % of the format hit super-effectively</div>
                ${righeMembri}
            </div>
            <div class="tb-tip-note">${a.totale} Pokémon · target abilities counted only when guaranteed (e.g. Levitate on Rotom-Wash)</div>
        </div>`;
}

// =====================================================================
// 🧮 DAMAGE CALC: tooltip su Atk/SpA (danni che fai) e su HP/Def/SpD (danni che subisci)
// Motore: @smogon/calc, lo stesso calcolatore di Showdown, caricato da jsDelivr.
// Avversari: i TB_CALC_MINACCE Pokémon completamente evoluti del formato con BST più alto.
// I calcoli pesanti partono dopo che il tooltip è comparso e restano in cache
// finché il Pokémon non cambia, quindi il primo hover mostra "Calculating..." per un attimo
// =====================================================================
const TB_CALC_URL = 'https://cdn.jsdelivr.net/npm/@smogon/calc@0.12.0/dist/';
const TB_CALC_MINACCE = 80;
const TB_CALC_MOSSE_ESCLUSE = ['dreameater', 'belch', 'lastresort', 'synchronoise', 'focuspunch', 'steelroller',
    'shelltrap', 'burnup', 'futuresight', 'doomdesire', 'hyperspacefury', 'spitup', 'fling', 'naturalgift'];
const TB_CALC_METEO = {
    drought: 'Sun', orichalcumpulse: 'Sun', drizzle: 'Rain', sandstream: 'Sand',
    desolateland: 'Harsh Sunshine', primordialsea: 'Heavy Rain', deltastream: 'Strong Winds'
};
const TB_CALC_TERRENI = {
    electricsurge: 'Electric', hadronengine: 'Electric', grassysurge: 'Grassy',
    psychicsurge: 'Psychic', mistysurge: 'Misty'
};

let tbPromessaCalc = null;
const tbCacheCalc = new Map();
const tbCalcInCorso = new Set();

// --- CARICAMENTO DELLA LIBRERIA ---------------------------------------
function tbCalcPronto() {
    return !!(window.calc && window.calc.calculate && window.calc.Generations);
}

function tbCaricaCalc() {
    if (tbCalcPronto()) return Promise.resolve(window.calc);
    if (tbPromessaCalc) return tbPromessaCalc;

    const carica = src => new Promise((ok, ko) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = ok;
        script.onerror = () => ko(new Error(`Unable to load ${src}`));
        document.head.appendChild(script);
    });
    tbPromessaCalc = carica(TB_CALC_URL + 'data/production.min.js')
        .then(() => carica(TB_CALC_URL + 'production.min.js'))
        .then(() => window.calc)
        .catch(err => { tbPromessaCalc = null; throw err; });
    return tbPromessaCalc;
}

function tbCoachAperto(id) {
    const tooltip = document.getElementById('global-neubrutalist-tooltip');
    return !!tooltip && tooltip.style.display !== 'none' && tooltip.dataset.currentId === id;
}

// Tooltip sulle statistiche del pannello EV: Velocità → speed tier, Atk/SpA → danni fatti, HP/Def/SpD → danni subiti
function tbApriCoachStat(el, chiave) {
    const id = `stat-${chiave}`;
    if (chiave === 'spe') return tbApriCoach(el, id, tbHtmlSpeedTier);
    const costruisci = (chiave === 'atk' || chiave === 'spa')
        ? () => tbHtmlCalcAttacco(chiave)
        : () => tbHtmlCalcDifesa(chiave);
    tbApriCoach(el, id, () => tbHtmlCalcConLibreria(id, costruisci));
}

// Se la libreria non è ancora arrivata mostra un messaggio e aggiorna il tooltip appena è pronta
function tbHtmlCalcConLibreria(id, costruisci) {
    if (tbCalcPronto()) return costruisci();
    tbCaricaCalc()
        .then(() => { if (tbCoachAperto(id)) tbAggiornaCoach(); })
        .catch(() => {
            if (!tbCoachAperto(id)) return;
            const tooltip = tbGetTooltip();
            tooltip.innerHTML = `${tbTestataCoach('DAMAGE CALC')}<div class="neubrutalist-tooltip-body"><div class="tb-tip-sub">❌ Couldn't load the damage calculator. Check the connection and hover again.</div></div>`;
        });
    return `${tbTestataCoach('DAMAGE CALC')}<div class="neubrutalist-tooltip-body"><div class="tb-tip-sub">⏳ Loading the damage calculator...</div></div>`;
}

// Calcolo in differita: il tooltip compare subito, i numeri arrivano appena pronti
function tbDatiCalc(chiave, idCoach, calcola) {
    if (tbCacheCalc.has(chiave)) return tbCacheCalc.get(chiave);
    if (!tbCalcInCorso.has(chiave)) {
        tbCalcInCorso.add(chiave);
        const contesto = tbStatoInUso; // se parte dal dettaglio del box, il calcolo usa lo stato del dettaglio
        setTimeout(() => {
            let dati = null;
            try {
                dati = contesto ? tbEseguiCon(contesto, calcola) : calcola();
            } catch (err) {
                console.error('[Damage calc]', err);
                dati = { errore: err.message };
            }
            if (tbCacheCalc.size > 60) tbCacheCalc.clear();
            tbCacheCalc.set(chiave, dati);
            tbCalcInCorso.delete(chiave);
            if (tbCoachAperto(idCoach)) tbAggiornaCoach();
        }, 30);
    }
    return null;
}

// --- OPZIONI (chip cliccabili nel tooltip) ------------------------------
function tbOpzCalc() {
    if (!tbStato.opzCalc) tbStato.opzCalc = { bulk: 'hp', invest: 'max', boost: false };
    return tbStato.opzCalc;
}

function tbCambiaOpzCalc(campo, valore) {
    const opz = tbOpzCalc();
    opz[campo] = campo === 'boost' ? !opz.boost : valore;
    tbAggiornaCoach();
}

function tbChipCalc(etichetta, attivo, campo, valore = '') {
    return `<span class="tb-tip-chip-btn ${attivo ? 'on' : ''}" onclick="tbCambiaOpzCalc('${campo}', '${valore}')">${etichetta}</span>`;
}

// Dynamax in Gen 8, Terastal in Gen 9
function tbChipBoost(s) {
    const opz = tbOpzCalc();
    if (tbStato.gen === 8) return tbChipCalc('Dynamax', opz.boost, 'boost');
    if (tbStato.gen === 9 && s.tera && s.tera !== 'Stellar') return tbChipCalc(`Tera ${tbEsc(s.tera)}`, opz.boost, 'boost');
    return '';
}

// --- COSTRUZIONE DEI POKÉMON PER IL CALCOLATORE -------------------------
function tbCalcGen() {
    return window.calc.Generations.get(Math.min(9, Math.max(1, tbStato.gen)));
}

// Formato (singolo/doppio) + meteo e terreno portati dall'abilità del tuo Pokémon
function tbCampoCalc(s) {
    const doppio = tbStato.struttura === 'vgc' || tbStato.regolamento?.battleStyle === 'doubles';
    const opz = { gameType: doppio ? 'Doubles' : 'Singles' };
    const ab = tbToID(s.abilita);
    const meteo = ab === 'snowwarning' ? (tbStato.gen >= 9 ? 'Snow' : 'Hail') : TB_CALC_METEO[ab];
    if (meteo) opz.weather = meteo;
    if (TB_CALC_TERRENI[ab]) opz.terrain = TB_CALC_TERRENI[ab];
    return new window.calc.Field(opz);
}

function tbPokemonCalc(s, evsDiversi = {}) {
    const sp = tbSpecie(s.specieId);
    const opz = tbOpzCalc();
    const dati = {
        level: tbStato.livello,
        nature: s.natura,
        evs: { ...s.evs, ...evsDiversi },
        ivs: { ...s.ivs }
    };
    if (s.abilita) dati.ability = s.abilita;
    if (s.oggetto && tbDex.items[s.oggetto]) dati.item = tbDex.items[s.oggetto].name;
    if (opz.boost && tbStato.gen === 8) dati.isDynamaxed = true;
    if (opz.boost && tbStato.gen === 9 && s.tera && s.tera !== 'Stellar') dati.teraType = s.tera;
    return new window.calc.Pokemon(tbCalcGen(), sp.name, dati);
}

// Bersaglio quando attacchi tu: niente strumento, prima abilità legale
function tbPokemonBersaglio(m, categoria, bulk) {
    const dif = categoria === 'Physical' ? 'def' : 'spd';
    const evs = bulk === 'frail' ? {} : (bulk === 'max' ? { hp: 252, [dif]: 252 } : { hp: 252 });
    const nature = bulk === 'max' ? (categoria === 'Physical' ? 'Bold' : 'Calm') : 'Serious';
    const dati = { level: tbStato.livello, nature, evs };
    if (m.abilita[0]) dati.ability = m.abilita[0];
    return new window.calc.Pokemon(tbCalcGen(), m.v.sp.name, dati);
}

// Minaccia quando attacca lei: 252 nella stat d'attacco (con o senza natura), niente strumento.
// Gli oggetti restano in m.cache perché non dipendono dal tuo Pokémon
function tbPokemonMinaccia(m, categoria, invest, abilita) {
    const chiave = `${categoria}|${invest}|${abilita || ''}|${tbStato.livello}`;
    m.cache = m.cache || {};
    if (!m.cache[chiave]) {
        const piu = categoria === 'Physical' ? 'Adamant' : 'Modest';
        const dati = {
            level: tbStato.livello,
            nature: invest === 'max' ? piu : 'Serious',
            evs: categoria === 'Physical' ? { atk: 252 } : { spa: 252 }
        };
        if (abilita) dati.ability = abilita;
        m.cache[chiave] = new window.calc.Pokemon(tbCalcGen(), m.v.sp.name, dati);
    }
    return m.cache[chiave];
}

// Un solo calcolo, in percentuale degli HP del difensore (null se la mossa non fa danni)
function tbCalcola(attaccante, difensore, mossa, campo) {
    try {
        const r = window.calc.calculate(tbCalcGen(), attaccante, difensore, mossa, campo);
        const [min, max] = r.range();
        if (!max) return null;
        const hp = r.defender.maxHP();
        return { min: 100 * min / hp, max: 100 * max / hp, nome: r.move.name };
    } catch (err) {
        return null;
    }
}

function tbEtichettaKO(r) {
    if (r.min >= 100) return 'OHKO';
    if (r.max >= 100) return 'OHKO?';
    return r.min > 0 ? `${Math.ceil(100 / r.min)}HKO` : '—';
}

function tbPercCalc(r) {
    return `${r.min.toFixed(1)}–${r.max.toFixed(1)}%`;
}

// --- LISTA DEGLI AVVERSARI -----------------------------------------------
// Completamente evoluti dentro il formato, dal BST più alto, senza forme identiche (Gastrodon East/West)
function tbMinacceCalc() {
    const cache = tbStato.cacheMinacce;
    if (cache && cache.firma === tbStato.firma) return cache.lista;

    const nelPool = new Set(tbStato.pool.map(v => v.specieId));
    const visti = new Set();
    const lista = [];
    for (const v of tbStato.pool) {
        if (!v.sp || !v.sp.baseStats || !Array.isArray(v.sp.types)) continue;
        if ((v.sp.evos || []).some(e => nelPool.has(tbToID(e)))) continue;
        const abilita = tbAbilitaLegali(v.sp);
        const impronta = `${v.sp.types.join('/')}|${Object.values(v.sp.baseStats).join(',')}|${abilita.join(',')}`;
        if (visti.has(impronta)) continue;
        visti.add(impronta);
        lista.push({ v, abilita: abilita.length ? abilita : [''], mosse: null });
        if (lista.length >= TB_CALC_MINACCE) break;
    }
    tbStato.cacheMinacce = { firma: tbStato.firma, lista };
    return lista;
}

// Mosse STAB migliori della minaccia: una per tipo e per categoria (fisica/speciale)
function tbMosseMinaccia(m) {
    if (m.mosse) return m.mosse;
    const tipi = m.v.sp.types || [];
    const migliori = {};
    tbMosseLegali(m.v.specieId).forEach(({ id, dati }) => {
        if (!tbMossaOffensiva(dati, id) || !dati.basePower || !tipi.includes(dati.type)) return;
        if (TB_MOSSE_NON_SUGGERIRE.includes(id) || TB_CALC_MOSSE_ESCLUSE.includes(id)) return;
        const precisione = dati.accuracy === true ? 100 : (dati.accuracy || 100);
        const penalita = dati.flags && (dati.flags.recharge || dati.flags.charge) ? 0.5 : 1;
        const colpi = Array.isArray(dati.multihit) ? 3 : (dati.multihit || 1);
        const punti = dati.basePower * colpi * precisione * penalita;
        const k = `${dati.category}|${dati.type}`;
        if (!migliori[k] || punti > migliori[k].punti) migliori[k] = { nome: dati.name, categoria: dati.category, punti };
    });
    m.mosse = Object.values(migliori);
    return m.mosse;
}

// --- EV: PIANO PER ARRIVARE AI NUOVI VALORI -------------------------------
// nuovi = valori finali (es. { hp: 36, def: 12 }). Gli EV che mancano si prendono prima da quelli
// sprecati, poi dall'attacco che il set non usa, poi dalle altre stat difensive, per ultimo dall'attacco.
// La Velocità non si tocca. Ritorna { tolti } oppure null se non bastano.
function tbPianoEV(s, sp, nuovi) {
    const tolti = {};
    if (tbStato.gen < 3) return { tolti };

    const protette = new Set(['spe', ...Object.keys(nuovi)]);
    const totaleDopo = TB_STAT.reduce((t, st) => t + (st.key in nuovi ? nuovi[st.key] : s.evs[st.key]), 0);
    let mancano = totaleDopo - 510;
    if (mancano <= 0) return { tolti };
    mancano = Math.ceil(mancano / 4) * 4;

    const prendi = (k, quanto) => {
        if (protette.has(k)) return;
        const q = Math.min(quanto, s.evs[k] - (tolti[k] || 0), mancano);
        if (q > 0) { tolti[k] = (tolti[k] || 0) + q; mancano -= q; }
    };
    TB_STAT.forEach(st => prendi(st.key, s.evs[st.key] - tbEvUtili(st.key, sp.baseStats[st.key], s.evs[st.key], s.ivs[st.key], s.natura)));
    const cat = tbCategoriaPrevalente(s);
    if (cat.fisiche + cat.speciali > 0 && (cat.fisiche === 0 || cat.speciali === 0)) prendi(cat.fisiche ? 'spa' : 'atk', Infinity);
    ['hp', 'def', 'spd']
        .sort((a, b) => (s.evs[b] - (tolti[b] || 0)) - (s.evs[a] - (tolti[a] || 0)))
        .forEach(k => prendi(k, Infinity));
    ['atk', 'spa'].forEach(k => prendi(k, Infinity));
    return mancano > 0 ? null : { tolti };
}

function tbApplicaEV(nuovi, idAncora) {
    const s = tbStato.slot[tbStato.attivo];
    const sp = s && tbSpecie(s.specieId);
    const piano = sp && tbPianoEV(s, sp, nuovi);
    if (!piano) return;

    Object.entries(piano.tolti).forEach(([k, v]) => { s.evs[k] -= v; });
    Object.assign(s.evs, nuovi);

    const pannello = document.getElementById('tb-ev-panel');
    if (pannello) pannello.innerHTML = tbHtmlPannelloEV(s);
    tbRenderLeggero();
    tbAggiornaCoach(idAncora);
}

// Riga cliccabile con il costo del piano (verde: EV liberi, arancione: EV spostati, ✕: impossibile)
function tbBadgePianoEV(s, sp, nuovi, idAncora) {
    const piano = tbPianoEV(s, sp, nuovi);
    const aggiunte = Object.entries(nuovi)
        .filter(([k, v]) => v > s.evs[k])
        .map(([k, v]) => `+${v - s.evs[k]} ${tbEtichettaStat(k)}`);
    if (!piano) return { badge: `<span class="tb-tip-badge bad">${aggiunte.join(' · ')} ✕ EVs</span>`, attr: 'class="tb-tip-row"' };
    const tolti = Object.entries(piano.tolti).map(([k, v]) => `−${v} ${tbEtichettaStat(k)}`);
    const argomento = `{${Object.entries(nuovi).map(([k, v]) => `${k}: ${v}`).join(', ')}}`;
    return {
        badge: `<span class="tb-tip-badge ${tolti.length ? 'warn' : 'ok'}">${[...aggiunte, ...tolti].join(' · ')}</span>`,
        attr: `class="tb-tip-row tb-click" onclick="tbApplicaEV(${argomento}, '${idAncora}')"`
    };
}

// Primo valore di EV (multiplo di 4, tra da e 252) per cui ok(ev) è vero; null se nemmeno a 252
function tbCercaEV(da, ok) {
    let basso = Math.ceil(da / 4), alto = 63;
    if (!ok(252)) return null;
    while (basso < alto) {
        const medio = Math.floor((basso + alto) / 2);
        if (ok(medio * 4)) alto = medio; else basso = medio + 1;
    }
    return Math.min(252, basso * 4);
}

// ⚔️ DANNI CHE FAI (tooltip su Atk / SpA)
// =====================================================================
function tbAnalisiAttacco(s, chiave) {
    const sp = tbSpecie(s.specieId);
    const categoria = chiave === 'atk' ? 'Physical' : 'Special';
    const opz = tbOpzCalc();
    const gen = tbCalcGen();
    const campo = tbCampoCalc(s);
    const dmax = opz.boost && tbStato.gen === 8;

    const mosse = s.mosse
        .filter(id => id && tbMossaOffensiva(tbDex.moves[id], id) && tbDex.moves[id].category === categoria)
        .map(id => {
            try { return { id, tipo: tbTipoMossa(id, tbDex.moves[id], s, sp), mossa: new window.calc.Move(gen, tbDex.moves[id].name, { useMax: dmax }) }; }
            catch (err) { return null; }
        })
        .filter(Boolean);
    if (!mosse.length) return { mosse: [] };

    const attaccante = tbPokemonCalc(s);
    const bersagli = tbMinacceCalc().map(m => {
        let difensore;
        try { difensore = tbPokemonBersaglio(m, categoria, opz.bulk); } catch (err) { return null; }
        const risultati = mosse.map(mv => tbCalcola(attaccante, difensore, mv.mossa, campo));
        let migliore = -1;
        risultati.forEach((r, i) => { if (r && (migliore < 0 || r.min > risultati[migliore].min)) migliore = i; });
        return { m, difensore, risultati, migliore };
    }).filter(Boolean);

    // Soglie a portata con più EV (stessa natura): OHKO se ora è 2HKO, 2HKO se ora è 3HKO.
    // Prima un controllo a 252 EV, poi la ricerca binaria solo dove la soglia è raggiungibile
    // (Body Press e Foul Play non usano la tua stat d'attacco: escluse)
    const soglie = [];
    if (s.evs[chiave] < 252) {
        const attaccantiPerEv = new Map();
        const attaccanteCon = ev => {
            if (!attaccantiPerEv.has(ev)) attaccantiPerEv.set(ev, tbPokemonCalc(s, { [chiave]: ev }));
            return attaccantiPerEv.get(ev);
        };
        const utili = mosse.filter(mv => !['bodypress', 'foulplay'].includes(mv.id));
        bersagli.forEach(b => {
            if (b.migliore < 0) return;
            const ora = b.risultati[b.migliore];
            const colpi = Math.ceil(100 / ora.min);
            if (colpi < 2 || colpi > 3) return;
            const obiettivo = 100 / (colpi - 1) - 1e-9;

            let mossa = null, alMassimo = 0;
            utili.forEach(mv => {
                const r = tbCalcola(attaccanteCon(252), b.difensore, mv.mossa, campo);
                if (r && r.min >= obiettivo && r.min > alMassimo) { mossa = mv; alMassimo = r.min; }
            });
            if (!mossa) return;
            const ev = tbCercaEV(s.evs[chiave] + 4, e => {
                const r = tbCalcola(attaccanteCon(e), b.difensore, mossa.mossa, campo);
                return !!r && r.min >= obiettivo;
            });
            if (ev !== null) soglie.push({ b, ev, etichetta: colpi === 2 ? 'OHKO' : '2HKO', ora });
        });
        soglie.sort((a, b) => a.ev - b.ev);
    }

    return { mosse, bersagli, soglie: soglie.slice(0, 5) };
}

function tbHtmlCalcAttacco(chiave) {
    const s = tbStato.slot[tbStato.attivo];
    const sp = s && tbSpecie(s.specieId);
    if (!sp) return '';

    const categoria = chiave === 'atk' ? 'Physical' : 'Special';
    const opz = tbOpzCalc();
    const valore = tbCalcolaStat(chiave, sp.baseStats[chiave], s.evs[chiave], s.ivs[chiave], s.natura);
    const idCoach = `stat-${chiave}`;
    const testata = tbTestataCoach(`DAMAGE · ${categoria.toUpperCase()} · ${valore} ${tbEtichettaStat(chiave)}`);
    const chip = `
        <div class="tb-tip-chips">
            <span class="tb-tip-chip-label">Targets</span>
            ${tbChipCalc('Frail', opz.bulk === 'frail', 'bulk', 'frail')}
            ${tbChipCalc('252 HP', opz.bulk === 'hp', 'bulk', 'hp')}
            ${tbChipCalc('Max bulk', opz.bulk === 'max', 'bulk', 'max')}
            ${tbChipBoost(s)}
        </div>`;

    const chiaveCache = `att|${chiave}|${tbStato.firma}|${JSON.stringify(s)}|${JSON.stringify(opz)}`;
    const a = tbDatiCalc(chiaveCache, idCoach, () => tbAnalisiAttacco(s, chiave));
    if (!a) return `${testata}<div class="neubrutalist-tooltip-body">${chip}<div class="tb-tip-sub">⏳ Calculating...</div></div>`;
    if (a.errore) return `${testata}<div class="neubrutalist-tooltip-body">${chip}<div class="tb-tip-sub">❌ ${tbEsc(a.errore)}</div></div>`;
    if (!a.mosse.length) {
        const altra = chiave === 'atk' ? 'SpA' : 'Atk';
        return `${testata}<div class="neubrutalist-tooltip-body">${chip}<div class="tb-tip-sub">No ${categoria.toLowerCase()} attacks in the set — hover ${altra} for the other ones.</div></div>`;
    }

    const totale = a.bersagli.length;
    const ohko = a.bersagli.filter(b => b.migliore >= 0 && b.risultati[b.migliore].min >= 100).length;
    const dueHko = a.bersagli.filter(b => b.migliore >= 0 && b.risultati[b.migliore].min >= 50).length;

    const righeMosse = a.mosse.map((mv, i) => {
        const validi = a.bersagli.map(b => b.risultati[i]).filter(Boolean);
        const o = validi.filter(r => r.min >= 100).length;
        const d = validi.filter(r => r.min >= 50).length;
        return `
            <div class="tb-tip-row">
                ${tbBadgeTipoMini(mv.tipo)}<span class="tb-tip-names">${tbEsc(validi[0]?.nome || tbDex.moves[mv.id].name)}</span>
                <span class="tb-tip-badge ok">OHKO ${tbPerc(o, totale)}% · 2HKO ${tbPerc(d, totale)}%</span>
            </div>`;
    }).join('');

    const righeSoglie = a.soglie.map(t => {
        const c = tbBadgePianoEV(s, sp, { [chiave]: t.ev }, `tb-stat-${chiave}`);
        return `
            <div ${c.attr}>
                <span class="tb-tip-names"><b>${tbEsc(t.b.m.v.nome)}</b> · ${tbPercCalc(t.ora)} → ${t.etichetta}</span>${c.badge}
            </div>`;
    }).join('');

    // Chi incassa meglio (gli immuni a tutte le mosse per primi)
    const danno = b => b.migliore >= 0 ? b.risultati[b.migliore].max : -1;
    const difficili = [...a.bersagli]
        .sort((x, y) => danno(x) - danno(y))
        .slice(0, 3)
        .map(b => {
            const r = b.migliore >= 0 ? b.risultati[b.migliore] : null;
            return `
                <div class="tb-tip-row">
                    <span class="tb-tip-names">${tbEsc(b.m.v.nome)}${r ? ` · ${tbEsc(r.nome)}` : ''}</span>
                    <span class="tb-tip-badge bad">${r ? tbPercCalc(r) : 'immune'}</span>
                </div>`;
        }).join('');

    return `
        ${testata}
        <div class="neubrutalist-tooltip-body">
            ${chip}
            <div class="tb-tip-big">${tbPerc(ohko, totale)}%</div>
            <div class="tb-tip-sub">of the top ${totale} threats OHKO'd by your best ${categoria.toLowerCase()} move</div>
            <div class="tb-tip-bar"><div style="width: ${(100 * ohko / totale).toFixed(1)}%;"></div></div>
            <div class="tb-tip-sub">${ohko} OHKO · ${dueHko} at least 2HKO</div>
            <div class="tb-tip-section">${righeMosse}</div>
            ${righeSoglie ? `
                <div class="tb-tip-section">
                    <div class="tb-tip-title">More ${tbEtichettaStat(chiave)} EVs → next KO · click to apply</div>
                    ${righeSoglie}
                </div>` : ''}
            <div class="tb-tip-section">
                <div class="tb-tip-title">Hardest to damage</div>
                ${difficili}
            </div>
            <div class="tb-tip-note">Top ${totale} fully evolved threats by BST · no item, first ability · guaranteed KOs (min roll), no recovery${tbCampoCalc(s).gameType === 'Doubles' ? ' · doubles: spread moves ×0.75' : ''}</div>
        </div>`;
}

// 🛡️ DANNI CHE SUBISCI (tooltip su HP / Def / SpD)
// HP considera sia gli attacchi fisici sia gli speciali, Def solo i fisici, SpD solo gli speciali
// =====================================================================
function tbAnalisiDifesa(s, chiave) {
    const sp = tbSpecie(s.specieId);
    const opz = tbOpzCalc();
    const gen = tbCalcGen();
    const campo = tbCampoCalc(s);
    const categorie = chiave === 'def' ? ['Physical'] : (chiave === 'spd' ? ['Special'] : ['Physical', 'Special']);
    const difensore = tbPokemonCalc(s);

    const colpi = tbMinacceCalc().map(m => {
        const mosse = tbMosseMinaccia(m).filter(x => categorie.includes(x.categoria));
        if (!mosse.length) return null;

        // Mossa più forte con la prima abilità, poi si prova quella mossa con le altre abilità
        let migliore = null;
        mosse.forEach(x => {
            let mossa;
            try { mossa = new window.calc.Move(gen, x.nome); } catch (err) { return; }
            let att;
            try { att = tbPokemonMinaccia(m, x.categoria, opz.invest, m.abilita[0]); } catch (err) { return; }
            const r = tbCalcola(att, difensore, mossa, campo);
            if (r && (!migliore || r.max > migliore.r.max)) migliore = { r, mossa, categoria: x.categoria, abilita: m.abilita[0], att };
        });
        if (!migliore) return { m, r: { min: 0, max: 0, nome: mosse[0].nome }, immune: true }; // immune a tutti i suoi STAB
        m.abilita.slice(1).forEach(ab => {
            let att;
            try { att = tbPokemonMinaccia(m, migliore.categoria, opz.invest, ab); } catch (err) { return; }
            const r = tbCalcola(att, difensore, migliore.mossa, campo);
            if (r && r.max > migliore.r.max) migliore = { ...migliore, r, abilita: ab, att };
        });
        return { m, ...migliore };
    }).filter(Boolean);

    // OHKO più vicini da evitare: EV minimi in HP + Def/SpD per sopravvivere al roll massimo
    const daSistemare = colpi.filter(c => c.r.max >= 100).sort((a, b) => a.r.max - b.r.max).slice(0, 5);
    daSistemare.forEach(c => {
        const dif = c.categoria === 'Physical' ? 'def' : 'spd';
        const sopravvive = (hp, d) => {
            const r = tbCalcola(c.att, tbPokemonCalc(s, { hp, [dif]: d }), c.mossa, campo);
            return !!r && r.max < 100;
        };
        if (!sopravvive(252, 252)) { c.piano = null; return; }

        let meglio = null;
        for (let hp = s.evs.hp; hp <= 252; hp += 4) {
            if (hp > s.evs.hp && tbCalcolaStat('hp', sp.baseStats.hp, hp, s.ivs.hp, s.natura) === tbCalcolaStat('hp', sp.baseStats.hp, hp - 4, s.ivs.hp, s.natura)) continue;
            const aggiuntaHp = hp - s.evs.hp;
            if (meglio && aggiuntaHp >= meglio.totale) break;
            const d = sopravvive(hp, s.evs[dif]) ? s.evs[dif] : tbCercaEV(s.evs[dif] + 4, ev => sopravvive(hp, ev));
            if (d === null) continue;
            const totale = aggiuntaHp + (d - s.evs[dif]);
            if (!meglio || totale < meglio.totale) meglio = { totale, nuovi: { hp, [dif]: d } };
        }
        c.piano = meglio;
    });

    return { colpi, daSistemare, pesanti: [...colpi].sort((a, b) => b.r.max - a.r.max).slice(0, 3) };
}

function tbHtmlCalcDifesa(chiave) {
    const s = tbStato.slot[tbStato.attivo];
    const sp = s && tbSpecie(s.specieId);
    if (!sp) return '';

    const opz = tbOpzCalc();
    const valore = tbCalcolaStat(chiave, sp.baseStats[chiave], s.evs[chiave], s.ivs[chiave], s.natura);
    const idCoach = `stat-${chiave}`;
    const tipoAttacchi = chiave === 'def' ? 'physical ' : (chiave === 'spd' ? 'special ' : '');
    const testata = tbTestataCoach(`BULK · ${valore} ${tbEtichettaStat(chiave)}`);
    const chip = `
        <div class="tb-tip-chips">
            <span class="tb-tip-chip-label">Threats</span>
            ${tbChipCalc('252+', opz.invest === 'max', 'invest', 'max')}
            ${tbChipCalc('252 neutral', opz.invest === 'neutral', 'invest', 'neutral')}
            ${tbChipBoost(s)}
        </div>`;

    const chiaveCache = `dif|${chiave}|${tbStato.firma}|${JSON.stringify(s)}|${JSON.stringify(opz)}`;
    const d = tbDatiCalc(chiaveCache, idCoach, () => tbAnalisiDifesa(s, chiave));
    if (!d) return `${testata}<div class="neubrutalist-tooltip-body">${chip}<div class="tb-tip-sub">⏳ Calculating...</div></div>`;
    if (d.errore) return `${testata}<div class="neubrutalist-tooltip-body">${chip}<div class="tb-tip-sub">❌ ${tbEsc(d.errore)}</div></div>`;
    if (!d.colpi.length) return `${testata}<div class="neubrutalist-tooltip-body">${chip}<div class="tb-tip-sub">No ${tipoAttacchi}threats found in the format.</div></div>`;

    const totale = d.colpi.length;
    const sopravvivi = d.colpi.filter(c => c.r.max < 100).length;
    const sicuri = d.colpi.filter(c => c.r.min >= 100).length;
    const forse = totale - sopravvivi - sicuri;
    const classeKO = r => r.min >= 100 ? 'bad' : (r.max >= 100 ? 'warn' : 'ok');

    const righeSistemare = d.daSistemare.map(c => {
        const b = c.piano
            ? tbBadgePianoEV(s, sp, c.piano.nuovi, `tb-stat-${chiave}`)
            : { badge: `<span class="tb-tip-badge bad">✕ even at max</span>`, attr: 'class="tb-tip-row"' };
        return `
            <div ${b.attr}>
                <span class="tb-tip-names"><b>${tbEsc(c.m.v.nome)}</b> · ${tbEsc(c.r.nome)} ${tbPercCalc(c.r)}</span>${b.badge}
            </div>`;
    }).join('');

    const righePesanti = d.pesanti.map(c => `
        <div class="tb-tip-row">
            <span class="tb-tip-names">${tbEsc(c.m.v.nome)} · ${tbEsc(c.r.nome)}${c.abilita && c.abilita !== c.m.abilita[0] ? ` <i>(${tbEsc(c.abilita)})</i>` : ''}</span>
            <span class="tb-tip-badge ${classeKO(c.r)}">${tbPercCalc(c.r)} · ${tbEtichettaKO(c.r)}</span>
        </div>`).join('');

    return `
        ${testata}
        <div class="neubrutalist-tooltip-body">
            ${chip}
            <div class="tb-tip-big">${tbPerc(sopravvivi, totale)}%</div>
            <div class="tb-tip-sub">of the top ${totale} threats' strongest ${tipoAttacchi}STAB survived</div>
            <div class="tb-tip-bar"><div style="width: ${(100 * sopravvivi / totale).toFixed(1)}%;"></div></div>
            <div class="tb-tip-sub">${sicuri} always OHKO you · ${forse} might (high roll)</div>
            ${righeSistemare ? `
                <div class="tb-tip-section">
                    <div class="tb-tip-title">Closest OHKOs to fix · click to apply</div>
                    ${righeSistemare}
                </div>` : ''}
            <div class="tb-tip-section">
                <div class="tb-tip-title">Hits you hardest</div>
                ${righePesanti}
            </div>
            <div class="tb-tip-note">Top ${totale} fully evolved threats by BST · their best STAB and ability, no item · no crits, no Intimidate${tbCampoCalc(s).gameType === 'Doubles' ? ' · doubles: spread moves ×0.75' : ''}</div>
        </div>`;
}

function handleAuthClick() {
    const user = auth.currentUser;
    if (!user) {
        toggleLoginModal();
    } else {
        const menu = document.getElementById('user-menu');
        const overlay = document.getElementById('menu-overlay');
        
        if (menu) {
            if (menu.style.display === 'block') {
                // Se è aperto, lo chiudiamo e togliamo il blur
                menu.style.display = 'none';
                if (overlay) {
                    overlay.classList.remove('active');
                    overlay.style.display = 'none';
                }
                console.log("Stato: Menu chiuso al click su auth-content");
            } else {
                // Se è chiuso, lo apriamo e attiviamo il blur dello schermo
                menu.style.display = 'block';
                if (overlay) {
                    overlay.style.display = 'block';
                    // Il piccolo timeout garantisce che la transizione CSS dell'opacity funzioni fluidamente
                    setTimeout(() => overlay.classList.add('active'), 10);
                }
                console.log("Stato: Menu aperto e schermo sfocato");
            }
        }
    }
}

function chiudiMenuConOverlay() {
    const menu = document.getElementById('user-menu');
    const overlay = document.getElementById('menu-overlay');
    
    if (menu) menu.style.display = 'none';
    
    if (overlay) {
        overlay.classList.remove('active');
        overlay.style.display = 'none';
    }
    console.log("Stato: Menu chiuso via overlay");
}

async function caricaColoriPlayers() {
    try {
        const snapshot = await db.ref('players').once('value');
        const playersData = snapshot.val();
        
        if (!playersData) return;

        for (let nomeKey in playersData) {
            const nomeMinuscolo = nomeKey.toLowerCase();
            
            const coloreRecuperato = playersData[nomeKey].info?.color;
            
            if (coloreRecuperato) {
                playerColors[nomeMinuscolo] = coloreRecuperato;
            }
        }
        console.log("Colori mappati:", playerColors);
    } catch (error) {
        console.error("Error loading colors:", error);
    }
}

// Funzione per scurire o schiarire un colore HEX
function pSBC(p, c0, c1, l) {
    let r, g, b, P, f, t, h, i = parseInt, m = Math.round, a = typeof (c1) == "string";
    if (typeof (p) != "number" || p < -1 || p > 1 || typeof (c0) != "string" || (c0[0] != 'r' && c0[0] != '#') || (c1 && !a)) return null;
    if (!this.pSBCr) this.pSBCr = (d) => {
        let n = d.length, x = {};
        if (n > 9) {
            [r, g, b, a] = d = d.split(","), n = d.length;
            if (n < 3 || n > 4) return null;
            x.r = i(r[3] == "a" ? r.slice(5) : r.slice(4)), x.g = i(g), x.b = i(b), x.a = a ? parseFloat(a) : -1
        } else {
            if (n == 8 || n == 6 || n < 4) return null;
            if (n < 6) d = "#" + d[1] + d[1] + d[2] + d[2] + d[3] + d[3] + (n > 4 ? d[4] + d[4] : "");
            d = i(d.slice(1), 16);
            if (n == 9 || n == 5) x.r = d >> 24 & 255, x.g = d >> 16 & 255, x.b = d >> 8 & 255, x.a = m((d & 255) / 0.255) / 1000;
            else x.r = d >> 16, x.g = d >> 8 & 255, x.b = d & 255, x.a = -1
        } return x
    };
    h = c0.length > 9, f = this.pSBCr(c0);
    if (!f) return null;
    if (p < 0) p *= -1, t = { r: 0, g: 0, b: 0, a: f.a };
    else t = { r: 255, g: 255, b: 255, a: f.a };
    r = m((t.r - f.r) * p) + f.r, g = m((t.g - f.g) * p) + f.g, b = m((t.b - f.b) * p) + f.b;
    return "#" + (0x1000000 + (f.a != -1 ? m(f.a * 255) : 0) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

async function getPlayerPalette(playerName) {
    const snap = await db.ref(`players/${playerName}/info/color`).once('value');
    const baseColor = snap.val() || "#31c489"; // Colore scelto dall'utente

    return {
        base: baseColor,
        border: pSBC(-0.8, baseColor), // 40% più scuro per i bordi
        light: pSBC(0.8, baseColor) + "22", // 80% più chiaro + trasparenza per sfondi
        text: pSBC(-0.6, baseColor) // Molto scuro per il testo leggibile
    };
}

function applicaPaletteUtente(baseColor) {
    // Generiamo le sfumature usando la tua funzione pSBC già esistente
    const palette = {
        base: baseColor,
        dark: pSBC(-0.4, baseColor),       // 40% più scuro
        darker: pSBC(-0.88, baseColor),     // 80% più scuro (per i bordi delle card)
        light: pSBC(0.6, baseColor),       // 60% più chiaro
        bgGradient: pSBC(0.9, baseColor),  // 90% più chiaro (per lo sfondo del body)
        text: pSBC(-0.7, baseColor),        // Molto scuro (per il testo leggibile)
        tags: pSBC(-0.5, baseColor),
        bright: pSBC(0.3, baseColor)
    };

    const root = document.documentElement;

    // Iniettiamo i colori nelle variabili CSS
    root.style.setProperty('--bg-body', palette.bgGradient);
    root.style.setProperty('--light-color', palette.light);
    root.style.setProperty('--text-main', palette.text);
    root.style.setProperty('--accent-color', palette.base);
    root.style.setProperty('--border-color', palette.darker);
    root.style.setProperty('--tag-color', palette.tags);
    root.style.setProperty('--bright-color',palette.bright);
    root.style.setProperty('--dark-color', palette.dark);

    
    // Ombra delle card dinamica (colore base con 20% di opacità)
    root.style.setProperty('--card-shadow', `${palette.base}33`); 

    console.log("🎨 Palette CSS aggiornata correttamente.");
}

// 4. Funzione di Inizializzazione della Pagina
// Helper per nascondere il loader
let timerNascondiLoader = null;

function nascondiLoader() {
    const loader = document.getElementById('poke-loader');
    if (!loader) return;

    loader.style.opacity = '0';
    loader.classList.add('hidden'); // Se usi la classe CSS per nasconderlo

    clearTimeout(timerNascondiLoader);
    timerNascondiLoader = setTimeout(() => {
        loader.style.display = 'none';
        loader.style.zIndex = '';
    }, 500); // Durata del fade-out CSS
}

// Rimette il loader della pagina a tutto schermo, all'istante (senza dissolvenza in entrata)
function mostraLoaderPagina() {
    const loader = document.getElementById('poke-loader');
    if (!loader) return;

    clearTimeout(timerNascondiLoader); // un nascondiLoader precedente non deve spegnerlo a metà
    loader.style.transition = 'none';
    loader.classList.remove('hidden');
    loader.style.display = 'flex';
    loader.style.opacity = '1';
    loader.style.zIndex = '100000'; // sopra pannello, helper e builder
    void loader.offsetHeight;       // applica subito; poi la dissolvenza in uscita torna quella del CSS
    loader.style.transition = '';
}

async function scaricaDati() {
    return new Promise((resolve, reject) => {
        if (!playerID) {
            console.warn("playerID non ancora disponibile...");
            return resolve([]);
        }

        // Usiamo .once('value') all'avvio o lasciamo l'ascoltatore .on
        db.ref(`players/${playerID}/teams`).on('value', (snapshot) => {
            const dataTeams = snapshot.val();
            
            if (dataTeams) {
                let tempTeams = Object.keys(dataTeams).map(key => {
                    const team = dataTeams[key];
                    const s = team.stats || {};
                    
                    let nomiPokemon = "";
                    if (team.pokemon && Array.isArray(team.pokemon)) {
                        nomiPokemon = team.pokemon.map(p => p ? p.nome : "").join(" ");
                    } else if (team.pokemon && typeof team.pokemon === 'object') {
                        nomiPokemon = Object.values(team.pokemon).map(p => p ? p.nome : "").join(" ");
                    }

                    return {
                        ...team,
                        id: key,
                        vittorie: Number(s.won) || 0,
                        sconfitte: Number(s.lost) || 0,
                        giocate: Number(s.played) || 0,
                        setVinti: Number(s.setW) || 0,
                        setPersi: Number(s.setL) || 0,
                        puntiFatti: Number(s.punti) || 0, 
                        tuttoIlTesto: ((team.nome || "") + " " + (team.categoria || "") + " " + nomiPokemon).toLowerCase()
                    };
                });

                tuttiITeam = tempTeams;
                resolve(tuttiITeam);
            } else {
                tuttiITeam = [];
                resolve([]);
            }
        }, (error) => {
            reject(error);
        });
    });
}

async function inizializzaPaginaBox() {
    const loader = document.getElementById('poke-loader');
    
    if (loader) {
        loader.style.display = 'flex';
        loader.style.opacity = '1';
        loader.classList.remove('hidden');
    }

    try {
        if (!playerID) {
            console.warn("⚠️ Player ID non trovato.");
            return;
        }

        const nomeFormattato = playerID.charAt(0).toUpperCase() + playerID.slice(1);
        document.title = `Box - ${nomeFormattato}`;

        // 1. Recupero dati utente
        const snapInfo = await db.ref(`players/${playerID}/info`).once('value');
        const info = snapInfo.val() || {};
        const userColor = info.color || "#31c489"; 

        // 2. Applicazione stile alla Top Bar
        const topBar = document.querySelector('.top-bar');
        const titoloDisplay = document.querySelector('.hub-title-display');

        if (topBar) topBar.style.backgroundColor = userColor;

        if (titoloDisplay) {
            titoloDisplay.style.backgroundColor = "#000"; 
            titoloDisplay.style.color = "#fff"; 
            titoloDisplay.innerHTML = `<span id="player-name-placeholder">${nomeFormattato.toUpperCase()}</span>'S BOX`;
        }

        if (typeof applicaPaletteUtente === "function") {
            applicaPaletteUtente(userColor);
        }

        if (typeof sincronizzaCategorie === "function") {
            await sincronizzaCategorie(); 
        }
        
        // 3. ATTENDIAMO che i team siano stati scaricati ed elaborati
        await scaricaDati(); 

        if (typeof ascoltaMusicaFirebase === "function" && !INCORPORATO) {     // nell'editor del simulatore la musica non serve
            ascoltaMusicaFirebase();
        }

        // 4. Impostiamo l'ordinamento e mostriamo i team A SCHERMO
        const sortFilter = document.getElementById('sortFilter');
        if (sortFilter) {
            sortFilter.value = 'win';
        }

        // Lancia il rendering effettivo
        if (typeof applicaFiltri === "function") {
            applicaFiltri();
        } else if (typeof renderizza === "function") {
            renderizza(tuttiITeam);
        }

        console.log(`✅ Box loaded successfully for ${nomeFormattato}. Teams found: ${tuttiITeam.length}`);
        if (INCORPORATO) avviaEditorIncorporato();

    } catch (e) {
        console.error("❌ Error during Box initialization:", e);
    } finally {
        setTimeout(nascondiLoader, 300);
    }
}

// 5. Funzione Musica Dinamica
function ascoltaMusicaFirebase() {
    const player = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-control');

    if (!player || !playerID) return;

    db.ref(`players/${playerID}/info`).on('value', (snapshot) => {
        const data = snapshot.val();
        
        // --- 1. CONTROLLO PREFERENZA AD OGNI AGGIORNAMENTO ---
        // Leggiamo la memoria dentro il listener, non fuori!
        const musicaMutaInMemoria = localStorage.getItem('userMusicPref') === 'off';

        if (data && data.musicaPreferita) {
            if (player.src !== data.musicaPreferita) {
                player.src = data.musicaPreferita;
                player.volume = 1;
                player.load();

                // 2. Logica di riproduzione dinamica
                if (musicaMutaInMemoria) {
                    player.pause();
                    player.muted = true; // Sicurezza extra
                    if (musicBtn) musicBtn.classList.add('muted');
                    console.log("🔇 Preferenza OFF rilevata: musica caricata ma silenziata.");
                } else {
                    // Tentiamo il play solo se la preferenza è ON
                    player.muted = false;
                    player.play()
                        .then(() => { 
                            if(musicBtn) musicBtn.classList.remove('muted');
                        })
                        .catch((err) => { 
                            console.warn("Autoplay bloccato: serve interazione utente.");
                            if(musicBtn) musicBtn.classList.add('muted');
                        });
                }
            }
        }
    });
}

document.addEventListener('click', () => {
    const player = document.getElementById('bg-music');
    const musicPref = localStorage.getItem('userMusicPref') || 'on';

    if (player && player.paused && musicPref === 'on') {

    }
}, { once: true });

// 7. Gestione Play/Pause Manuale
function toggleMusic() {
    const player = document.getElementById('bg-music-home') || document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-control') || document.getElementById('music-toggle');

    if (!player || !musicBtn) return;

    if (player.paused || player.muted) {
        // RESET E ACCENSIONE
        player.muted = false; 
        player.volume = 1; 

        player.play().then(() => {
            musicBtn.classList.remove('muted');
            localStorage.setItem('userMusicPref', 'on'); // SALVA ON
            console.log("🔊 Musica ripresa");
        }).catch(error => {
            console.warn("Autoplay bloccato:", error);
            musicBtn.classList.add('muted');
        });
        
    } else {
        // SPEGNIMENTO TOTALE
        player.pause();
        player.muted = true; 
        
        musicBtn.classList.add('muted');
        localStorage.setItem('userMusicPref', 'off'); // SALVA OFF
        console.log("🔇 Musica fermata");
    }
}

async function coloraBordoDinamico(pkmName, elementId) {
    try {
        const cleanName = pkmName.toLowerCase().replace(/ /g, '-').replace(/[.'é]/g, '');
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${cleanName}`);
        const data = await res.json();
        
        const coloriTipi = {
            fire: '#ff4422', water: '#3399ff', grass: '#77cc55', electric: '#ffcc33',
            ice: '#66ccff', fighting: '#bb5544', poison: '#aa5599', ground: '#ddbb55',
            flying: '#8899ff', psychic: '#ff5599', bug: '#aabb22', rock: '#bbaa66',
            ghost: '#6666bb', dragon: '#7766ee', dark: '#775544', steel: '#aaaabb',
            fairy: '#ee99ee', normal: '#aaaa99'
        };

        const tipi = data.types.map(t => coloriTipi[t.type.name]);
        const box = document.getElementById(elementId);
        if (!box) return;

        if (tipi.length === 1) {
            // Singolo tipo: bordo normale
            box.style.borderLeftColor = tipi[0];
        } else {
            // Per farlo funzionare su border-left dobbiamo usare border-image
            box.style.borderLeft = "6px solid"; // Aumentiamo un po' lo spessore per il doppio tipo
            box.style.borderImage = `linear-gradient(to bottom, ${tipi[0]} 50%, ${tipi[1]} 50%) 1 100%`;
        }
    } catch (e) {
        console.error("Error setting border colors:", e);
    }
}

// ---------- Aperto dal simulatore (iframe) per modificare un team ----------
// A fine partita contro la CPU battle.html apre il Box dentro una finestra con ?modifica=ID&incorporato=1 (editor-team.js).
// Qui si vede solo l'editor (box-incorporato.css), che si apre da solo sul team indicato: stesso pannello e stesso Team Builder
// di sempre. Dopo un salvataggio, invece di ricaricare la pagina, si avvisa il simulatore; lo stesso se si chiude.
const INCORPORATO = EditorTeam.eIncorporato(location.search, window);

function notificaSimulatore(evento, extra) {
    if (!INCORPORATO) return;
    try { window.parent.postMessage(EditorTeam.messaggio(evento, extra), location.origin); } catch (e) { /* nessuno ascolta: pazienza */ }
}

async function avviaEditorIncorporato() {
    const id = EditorTeam.teamDaModificare(location.search);
    const team = tuttiITeam.find(t => t.id === id);
    if (!team) return notificaSimulatore('errore', { messaggio: 'That team is not in your Box anymore.' });
    // la stessa regola del tasto con la matita: un team già iscritto a una stagione iniziata non si modifica
    await caricaTeamBloccati();
    if (TeamBloccati.eBloccato(window.nomiTeamBloccati, team.nome)) return notificaSimulatore('bloccato', { id });
    notificaSimulatore('pronto', { id });
    // si apre subito il Team Builder, con il team (e da lì si può importare/esportare in Showdown)
    caricaTeamPerModifica(id).catch(e => console.warn('Team Builder not opened', e));
}

// Il simulatore chiede di chiudere (il suo "Back"): si passa dalle chiusure di sempre, che chiedono conferma se ci sono modifiche
function chiudiEditorIncorporato() {
    if (salvataggioTeamInCorso) return;     // sta scrivendo su Firebase: chiudere ora lo interromperebbe, a salvataggio finito si chiude da solo
    const builder = document.getElementById('tb-overlay');
    if (builder && builder.classList.contains('open')) return tbChiediChiusura();
    notificaSimulatore('chiuso');
}
window.addEventListener('message', e => {
    if (!INCORPORATO || e.source !== window.parent || e.origin !== location.origin) return;
    if (e.data && e.data.sito === EditorTeam.SITO && e.data.comando === 'chiudi') chiudiEditorIncorporato();
});

// Effetto delle nature sulle statistiche: [statistica aumentata, statistica diminuita]
const EFFETTI_NATURE = {
    lonely:  ['Atk', 'Def'], brave:   ['Atk', 'Spe'], adamant: ['Atk', 'SpA'], naughty: ['Atk', 'SpD'],
    bold:    ['Def', 'Atk'], relaxed: ['Def', 'Spe'], impish:  ['Def', 'SpA'], lax:     ['Def', 'SpD'],
    timid:   ['Spe', 'Atk'], hasty:   ['Spe', 'Def'], jolly:   ['Spe', 'SpA'], naive:   ['Spe', 'SpD'],
    modest:  ['SpA', 'Atk'], mild:    ['SpA', 'Def'], quiet:   ['SpA', 'Spe'], rash:    ['SpA', 'SpD'],
    calm:    ['SpD', 'Atk'], gentle:  ['SpD', 'Def'], sassy:   ['SpD', 'Spe'], careful: ['SpD', 'SpA']
    // Hardy, Docile, Serious, Bashful, Quirky: neutre, nessun effetto

function formattaEffettoNatura(natura) {
    const effetto = EFFETTI_NATURE[String(natura || '').toLowerCase().trim()];

    return `<span style="white-space: nowrap; ">(<span style="color: #15803d; font-weight: bold;">+ ${effetto[0]}</span>, <span style="color: #b91c1c; font-weight: bold;">- ${effetto[1]}</span>)</span>`;
}

async function caricaInfoMossa(nomeMossa, elementoId) {
    const tooltip = document.getElementById(elementoId);
    
    // Se la mossa è vuota o già caricata, non fare nulla
    if (!nomeMossa || nomeMossa.trim() === "-" || tooltip.dataset.loaded === "true") return;

    try {
        const cleanName = nomeMossa.trim().toLowerCase().replace(/\s+/g, '-').replace(/[.'é]/g, '');
        const res = await fetch(`https://pokeapi.co/api/v2/move/${cleanName}`);
        
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        // --- APPLICHIAMO IL COLORE AL TOOLTIP ---
        const tipo = data.type.name; 
        tooltip.className = `move-tooltip ${tipo}`; // Aggiunge la classe del tipo (es. "fire") al fumetto
        // ----------------------------------------

        const power = data.power || '--';
        const accuracy = data.accuracy ? data.accuracy + '%' : '--';
        let effect = data.effect_entries.find(e => e.language.name === 'en')?.short_effect || "Descrizione non disponibile.";
        if (data.effect_chance) effect = effect.replace('$effect_chance', data.effect_chance);

        tooltip.innerHTML = `
            <div style="font-weight:bold; margin-bottom:4px; border-bottom:1px solid rgba(255,255,255,0.4);">
                ${nomeMossa.toUpperCase()}
            </div>
            <b>POW:</b> ${power} &nbsp;&nbsp; <b>ACC:</b> ${accuracy}<br>
            <div style="margin-top:6px; font-style:italic; font-size:0.7rem; line-height:1.2;">${effect}</div>
        `;
        
        tooltip.dataset.loaded = "true";
    } catch (e) {
        tooltip.innerText = "Dati mossa non trovati.";
        tooltip.style.background = "#33261c"; // Colore di fallback in caso di errore
    }
}

function inizializzaRotazioneTooltipMosse() {
    // Seleziona tutte le mosse nel modale
    const mosse = document.querySelectorAll('.move-span');

    mosse.forEach(mossa => {
        // Trova il tooltip figlio di questa mossa
        const tooltip = mossa.querySelector('.move-tooltip');
        
        if (!tooltip) return; // Sicurezza se il tooltip non esiste

        // Evento: Il mouse entra nella mossa
        mossa.addEventListener('mouseover', () => {
            // GENERA ROTAZIONE CASUALE
            // Esempio: tra -4deg e +4deg. Modifica i numeri per più/meno caos.
            const gradiCasuali = (Math.random() * 8 - 4).toFixed(2); 
            
            // APPLICA LA TRASFORMAZIONE
            // Dobbiamo mantenere translateX(-50%) per centrarlo rispetto alla mossa,
            // e aggiungere la rotazione casuale.
            tooltip.style.transform = `translateX(-50%) rotate(${gradiCasuali}deg)`;
            
            // Mostra il tooltip aggiungendo la classe CSS
            tooltip.classList.add('is-active');
        });

        // Evento: Il mouse esce dalla mossa
        mossa.addEventListener('mouseout', () => {
            // Nascondi il tooltip rimuovendo la classe
            tooltip.classList.remove('is-active');
            
            // Opzionale: resetta la trasformazione dopo un po' 
            // per evitare glitch visivi alla prossima apertura
            setTimeout(() => {
                tooltip.style.transform = 'translateX(-50%) rotate(0deg)';
            }, 150);
        });
    });
}

async function caricaStats(pkmName, elementId, natura = '') {
    const tooltip = document.getElementById(elementId);
    if (tooltip.dataset.loaded === "true") return;

    try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pkmName}`);
        const data = await res.json();
        
        const statsMap = {
            'hp': 'HP',
            'attack': 'ATK',
            'defense': 'DEF',
            'special-attack': 'SPA',
            'special-defense': 'SPD',
            'speed': 'SPE'
        };

        // Da nomi usati in EFFETTI_NATURE ai nomi delle stat di PokeAPI
        const statNaturaPokeAPI = {
            'Atk': 'attack',
            'Def': 'defense',
            'SpA': 'special-attack',
            'SpD': 'special-defense',
            'Spe': 'speed'
        };

        const effetto = (typeof EFFETTI_NATURE !== 'undefined')
            ? EFFETTI_NATURE[String(natura || '').toLowerCase().trim()]
            : null;
        const statAumentata = effetto ? statNaturaPokeAPI[effetto[0]] : null;
        const statDiminuita = effetto ? statNaturaPokeAPI[effetto[1]] : null;

        let statsHTML = `<h4 class="panel-title">BASE STATS</h4>`;
        
        data.stats.forEach(s => {
            const val = s.base_stat;
            // Calcoliamo la larghezza della barra (max 150 per le stats base medie)
            const width = Math.min((val / 150) * 100, 100); 

            // Colore dell'etichetta in base alla natura
            let stileEtichetta = 'width: 30px; font-weight:bold;';
            let segno = '';
            if (s.stat.name === statAumentata) {
                stileEtichetta += ' color: #15803d !important;';
                segno = '+';
            } else if (s.stat.name === statDiminuita) {
                stileEtichetta += ' color: #b91c1c !important;';
                segno = '-';
            }

            statsHTML += `
                <div class="stat-row">
                    <span style="${stileEtichetta}">${statsMap[s.stat.name]}${segno}</span>
                    <span style="width: 25px; text-align:right;">${val}</span>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill" style="width: ${width}%"></div>
                    </div>
                </div>`;
        });

        tooltip.innerHTML = statsHTML;
        tooltip.dataset.loaded = "true";
    } catch (e) {
        tooltip.innerText = "Error.";
    }
}

// Nuova funzione per scaricare i tipi
// Aggiunto "direzione" ai parametri
async function caricaTipi(pkmName, elementId, direzione) {
    try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pkmName}`);
        const data = await res.json();
        const container = document.getElementById(elementId);
        if (!container) return;

        const d_types = ["normal","fire","water","electric","grass","ice","fighting","poison","ground","flying","psychic","bug","rock","ghost","dragon","dark","steel","fairy"];
        let effectiveness = {};
        d_types.forEach(type => effectiveness[type] = 1);

        await Promise.all(data.types.map(async (t) => {
            const typeRes = await fetch(t.type.url);
            const typeData = await typeRes.json();
            const rel = typeData.damage_relations;

            rel.double_damage_from.forEach(type => effectiveness[type.name] *= 2);
            rel.half_damage_from.forEach(type => effectiveness[type.name] *= 0.5);
            rel.no_damage_from.forEach(type => effectiveness[type.name] *= 0);
        }));

        let result = { x4: [], x2: [], x05: [], x025: [], x0: [] };
        for (let type in effectiveness) {
            const mult = effectiveness[type];
            if (mult === 4) result.x4.push(type);
            else if (mult === 2) result.x2.push(type);
            else if (mult === 0.5) result.x05.push(type);
            else if (mult === 0.25) result.x025.push(type);
            else if (mult === 0) result.x0.push(type);
        }

        const creaBadge = (lista) => {
            return `<div class="eff-badge-container">
                ${lista.map(t => `<span class="mini-type-badge ${t}">${t}</span>`).join('')}
            </div>`;
        };

        let tooltipHTML = "";
        if (result.x4.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-4">4x</span>${creaBadge(result.x4)}</div>`;
        if (result.x2.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-2">2x</span>${creaBadge(result.x2)}</div>`;
        if (result.x05.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-05">0.5x</span>${creaBadge(result.x05)}</div>`;
        if (result.x025.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-025">0.25x</span>${creaBadge(result.x025)}</div>`;
        if (result.x0.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-0">0x</span>${creaBadge(result.x0)}</div>`;

        // --- APPLICAZIONE CLASSE DIREZIONE ---
        container.innerHTML = data.types.map(t => 
        `<div class="type-container">
            <span class="type-badge ${t.type.name}">${t.type.name.toUpperCase()}</span>
            <div class="type-effectiveness-tooltip ${direzione}">${tooltipHTML}</div>
        </div>`
    ).join('');

    } catch (e) { console.error("Error:", e); }
}

function applicaFiltri() {
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    
    if (!searchInput || !categoryFilter) return;

    const search = searchInput.value.toLowerCase().trim();
    const cat = categoryFilter.value;
    const sort = document.getElementById('sortFilter') ? document.getElementById('sortFilter').value : 'default';

    console.log("Ricerca attiva per:", search); // Debug: guarda la console F12

    let filtrati = tuttiITeam.filter(team => {
        // Se la ricerca è vuota, passa sempre. Se non è vuota, cerca nel testo.
        const matchesSearch = search === "" || team.tuttoIlTesto.includes(search);
        const matchesCat = cat === "" || team.categoria === cat;
        return matchesSearch && matchesCat;
    });

    // Ordinamento
    filtrati.sort((a, b) => {
        switch (sort) {
            case 'alpha': return (a.nome || "").localeCompare(b.nome || "");
            case 'win': return Number(b.vittorie || 0) - Number(a.vittorie || 0);
            case 'loss': return Number(b.sconfitte || 0) - Number(a.sconfitte || 0);
            case 'setV': return Number(b.setVinti || 0) - Number(a.setVinti || 0);
            case 'setP': return Number(b.setPersi || 0) - Number(a.setPersi || 0);
            case 'played':
                const playedA = Number(a.setVinti || 0) + Number(a.setPersi || 0);
                const playedB = Number(b.setVinti || 0) + Number(b.setPersi || 0);
                return playedB - playedA;
            default: return 0;
        }
    });

    renderizza(filtrati);
}

async function applicaColoreBordo(pokemonNome, elemento) {
    try {
        if (!pokemonNome) return;

        // 1. Formattazione e pulizia nome
        let nomeFormatted = pokemonNome.toLowerCase().trim()
            .replace(/\s+/g, '-')
            .replace(/[^a-z0-9-]/g, '');

        // 2. Mappatura nomi speciali che PokéAPI richiede con la forma base
        const mappaturaNomi = {
            'aegislash': 'aegislash-shield',
            'indeedee': 'indeedee-male',
            'mimikyu': 'mimikyu-disguised',
            'meowstic': 'meowstic-male',
            'toxtricity': 'toxtricity-amped',
            'eiscue': 'eiscue-ice',
            'urshifu': 'urshifu-single-strike',
            'giratina': 'giratina-altered',
            'deoxys': 'deoxys-normal',
            'wormadam': 'wormadam-plant',
            'basculin': 'basculin-red-striped',
            'keldeo': 'keldeo-ordinary',
            'meloetta': 'meloetta-aria',
            'thundurus': 'thundurus-incarnate',
            'tornadus': 'tornadus-incarnate',
            'landorus': 'landorus-incarnate',
            'pumpkaboo': 'pumpkaboo-average',
            'gourgeist': 'gourgeist-average',
            'zygarde': 'zygarde-50'
        };

        if (mappaturaNomi[nomeFormatted]) {
            nomeFormatted = mappaturaNomi[nomeFormatted];
        }

        // 3. Fetch dati da PokéAPI
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${nomeFormatted}`);

        // CONTROLLO FONDAMENTALE: Se la risposta NON è OK (es. 404), NON chiamare .json()
        if (!res.ok) {
            console.warn(`⚠️ Impossibile trovare "${nomeFormatted}" su PokéAPI (Status: ${res.status})`);
            return; 
        }

        // 4. Parsing sicuro del JSON
        const data = await res.json();

        // Il primo tipo dà il colore al disco dello sprite (variabile --tipo, vedi box-team.css)
        const primoTipo = data.types && data.types[0] && data.types[0].type && data.types[0].type.name;
        const colore = primoTipo && typeof Dettagli !== 'undefined' && Dettagli.coloreTipo ? Dettagli.coloreTipo(primoTipo) : null;
        const tessera = typeof elemento === 'string' ? document.getElementById(elemento) : elemento;
        if (colore) {
            // si ricorda: al prossimo disegno (ricerca, filtri) la tessera nasce già colorata, senza lampeggiare
            (window.coloriPokemonNoti = window.coloriPokemonNoti || {})[pokemonNome] = colore;
            if (tessera) tessera.style.setProperty('--tipo', colore);
        }

    } catch (err) {
        // Gestione silenziosa dell'errore per non bloccare mai la pagina
        console.error(`Error during applyBorderColor for ${pokemonNome}:`, err);
    }
}

function gestisciErroreSprite(img, pkmNameUrl) {
    const fase = parseInt(img.dataset.spriteFase || '0', 10);
    img.dataset.spriteFase = String(fase + 1);

    if (fase === 0) {
        img.src = `https://play.pokemonshowdown.com/sprites/dex/${pkmNameUrl}.png`;
        return;
    }

    if (fase === 1) {
        fetch(`https://pokeapi.co/api/v2/pokemon/${pkmNameUrl}`)
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(data => {
                img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${data.id}.gif`;
            })
            .catch(() => {
                img.onerror = null;
                img.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png';
            });
        return;
    }

    // Ultimo fallback: niente più tentativi
    img.onerror = null;
    img.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png';
}

            else if (mult === 2) result.x2.push(type);
            else if (mult === 0.5) result.x05.push(type);
            else if (mult === 0.25) result.x025.push(type);
            else if (mult === 0) result.x0.push(type);
        }

        // Funzione interna per creare i micro-badge colorati
        const creaBadge = (lista) => `
    <div class="types-wrapper">
        ${lista.map(t => `<span class="mini-type-badge ${t}">${t}</span>`).join('')}
    </div>`;

container.innerHTML = `
    <div class="weakness-container">
        ${result.x4.length > 0 ? `<div class="w-row"><b class="mult x4">4x</b> ${creaBadge(result.x4)}</div>` : ''}
        ${result.x2.length > 0 ? `<div class="w-row"><b class="mult x2">2x</b> ${creaBadge(result.x2)}</div>` : ''}
        ${result.x05.length > 0 ? `<div class="w-row"><b class="mult x05">0.5x</b> ${creaBadge(result.x05)}</div>` : ''}
        ${result.x025.length > 0 ? `<div class="w-row"><b class="mult x025">0.25x</b> ${creaBadge(result.x025)}</div>` : ''}
        ${result.x0.length > 0 ? `<div class="w-row"><b class="mult x0">0x</b> ${creaBadge(result.x0)}</div>` : ''}
    </div>
`;
    } catch (e) { 
        console.error(e);
        container.innerHTML = "<span style='color:red'>Error.</span>"; 
    }
}

function livelloDelRegolamento(regolamento) {
    const struttura = String(regolamento?.strutturaSito || 'custom').toLowerCase().trim();
    if (struttura === 'vgc') return 50;
    return String(regolamento?.baseTier || '').toUpperCase() === 'LC' ? 5 : 100;
}

function generazioneDelRegolamento(regolamento) {
    return parseInt(regolamento?.genRuleValue, 10) ||
        parseInt(String(regolamento?.vgcGen || '').replace(/\D/g, ''), 10) || 9;
}

function meccanicheAttiveRegolamento(regolamento) {
    return regolamento?.generationalMechanics === true;
}

// Scrive il livello del formato e toglie dal testo ciò che il formato non prevede
function adattaTestoAlFormato(testo, regolamento) {
    const livello = livelloDelRegolamento(regolamento);
    const gen = generazioneDelRegolamento(regolamento);
    const meccaniche = meccanicheAttiveRegolamento(regolamento);
    const tieniDynamax = gen === 8 && meccaniche;
    const tieniTera = gen === 9 && meccaniche;

    return String(testo || '').trim().split(/\n\s*\n/).map(blocco => {
        const righe = blocco.split('\n').map(r => r.trim()).filter(r => r !== '');
        if (righe.length < 2) return righe.join('\n');
        const filtrate = righe.filter(r => !/^Level:/i.test(r)
            && (tieniDynamax || !/^(Dynamax Level|Gigantamax):/i.test(r))
            && (tieniTera || !/^Tera Type:/i.test(r)));
        const dopoAbilita = filtrate.findIndex(r => /^Ability:/i.test(r));
        filtrate.splice(dopoAbilita >= 0 ? dopoAbilita + 1 : 1, 0, `Level: ${livello}`);
        return filtrate.join('\n');
    }).join('\n\n');
}

// Toglie dai campi dei Pokémon ciò che il formato non prevede
function pulisciCampiPokemon(lista, regolamento) {
    const gen = generazioneDelRegolamento(regolamento);
    const meccaniche = meccanicheAttiveRegolamento(regolamento);
    return lista.map(p => {
        const copia = { ...p };
        if (!(gen === 8 && meccaniche)) { delete copia.livelloDynamax; delete copia.gigantamax; }
        if (!(gen === 9 && meccaniche)) delete copia.tera;
        return copia;
    });
}



function parseShowdown(text) {
    const teams = [];
    const blocks = String(text || '').split(/\n\s*\n/);

    blocks.forEach(block => {
        const lines = block.split('\n').map(l => l.trim()).filter(l => l !== '');
        if (lines.length < 2) return;

        let pokemon = {};
        let rigaNome = lines[0];
        let strumentoScelto = "None";

        if (rigaNome.includes('@')) {
            const parts = rigaNome.split('@');
            rigaNome = parts[0].trim();
            strumentoScelto = parts[1].trim();
        }

        // Sesso: "(M)" o "(F)" in fondo alla riga del nome
        const matchSesso = rigaNome.match(/\(([MF])\)\s*$/i);
        pokemon.sesso = matchSesso ? matchSesso[1].toUpperCase() : '';

        // Nome pulito per la UI (es. "Mimikyu")
        pokemon.nome = rigaNome.replace(/\s*\([MF]\)\s*/gi, '').trim();

        // ID PokeAPI generato una volta sola qui
        pokemon.idPokeAPI = normalizzaNomePerPokeAPI(pokemon.nome);

        pokemon.strumento = strumentoScelto;
        pokemon.mosse = [];
        pokemon.natura = "Serious";
        pokemon.livello = 100;
        pokemon.felicita = 255;
        pokemon.shiny = false;
        pokemon.gigantamax = false;
        pokemon.livelloDynamax = 10;

        const numero = (riga, prefisso, min, max) => {
            const v = parseInt(riga.slice(prefisso.length).trim(), 10);
            return isNaN(v) ? null : Math.max(min, Math.min(max, v));
        };

        lines.forEach(line => {
            if (line.startsWith('Ability:')) pokemon.abilita = line.replace('Ability:', '').trim();
            if (line.startsWith('Tera Type:')) pokemon.tera = line.replace('Tera Type:', '').trim();
            if (line.startsWith('EVs:')) pokemon.evs = line.replace('EVs:', '').trim();
            if (line.startsWith('IVs:')) pokemon.ivs = line.replace('IVs:', '').trim();

            if (line.startsWith('Level:')) pokemon.livello = numero(line, 'Level:', 1, 100) ?? 100;
            if (line.startsWith('Happiness:')) pokemon.felicita = numero(line, 'Happiness:', 0, 255) ?? 255;
            if (line.startsWith('Dynamax Level:')) pokemon.livelloDynamax = numero(line, 'Dynamax Level:', 0, 10) ?? 10;
            if (/^Shiny:\s*Yes/i.test(line)) pokemon.shiny = true;
            if (/^Gigantamax:\s*Yes/i.test(line)) pokemon.gigantamax = true;

            const matchNatura = line.match(/^([A-Za-z]+)\s+Nature$/i);
            if (matchNatura) {
                pokemon.natura = matchNatura[1].charAt(0).toUpperCase() + matchNatura[1].slice(1).toLowerCase();
            }

            if (line.startsWith('-')) pokemon.mosse.push(line.replace('-', '').trim());
        });

        while (pokemon.mosse.length < 4) pokemon.mosse.push("");
        teams.push(pokemon);
    });

    return teams;
}


async function preparaDatiTeamPerValidazione(listaPokemon) {
    const promesse = listaPokemon.map(async (pkmn) => {
        const nomePkmn = pkmn.nome;
        if (!nomePkmn) return null;

        const nomeIdPokeAPI = pkmn.idPokeAPI || normalizzaNomePerPokeAPI(nomePkmn);

        try {
            // 1. FETCH BASE POKÉMON
            const resPokemon = await fetch(`https://pokeapi.co/api/v2/pokemon/${nomeIdPokeAPI}`);
            if (!resPokemon.ok) throw new Error(`Not found on PokeAPI`);
            const dataPkmn = await resPokemon.json();

            // Calcolo BST e Statistica migliore
            const nomiStat = { hp: "HP", attack: "Attack", defense: "Defense", "special-attack": "Sp. Attack", "special-defense": "Sp. defense", speed: "Speed" };
            let bst = 0;
            let miglioreStatNome = "HP";
            let miglioreStatValore = -1;

            dataPkmn.stats.forEach(s => {
                bst += s.base_stat;
                if (s.base_stat > miglioreStatValore) {
                    miglioreStatValore = s.base_stat;
                    miglioreStatNome = nomiStat[s.stat.name] || "HP";
                }
            });

            // 2. FETCH SPECIE POKÉMON
            const resSpecies = await fetch(dataPkmn.species.url);
            let genId = 1, misterioso = false, leggendario = false, baseFriendship = 70;
            let colore = "White", habitat = "Grassland", shape = "Ball", eggGroups = [];

            if (resSpecies.ok) {
                const dataSpecie = await resSpecies.json();
                misterioso = dataSpecie.is_mythical || false;
                leggendario = dataSpecie.is_legendary || false;
                baseFriendship = dataSpecie.base_happiness ?? 70;
                colore = dataSpecie.color?.name ? dataSpecie.color.name.charAt(0).toUpperCase() + dataSpecie.color.name.slice(1) : "White";
                habitat = dataSpecie.habitat?.name ? dataSpecie.habitat.name.charAt(0).toUpperCase() + dataSpecie.habitat.name.slice(1) : "Grassland";
                
                const shapeRaw = dataSpecie.shape?.name || "ball";
                shape = shapeRaw.charAt(0).toUpperCase() + shapeRaw.slice(1).replace('-', '_');

                eggGroups = dataSpecie.egg_groups?.map(g => {
                    let n = g.name.charAt(0).toUpperCase() + g.name.slice(1);
                    if (n === "Water-1") return "Water1";
                    if (n === "Water-2") return "Water2";
                    if (n === "Water-3") return "Water3";
                    if (n === "No-eggs") return "No-eggs";
                    return n;
                }) || [];
            }

            // 3. FETCH STRUMENTO
            let infoStrumento = { is_berry: false, is_consumable: false, is_healing: false, has_negative_effect: false };
            if (pkmn.strumento && pkmn.strumento.toLowerCase() !== 'none') {
                try {
                    const idStrumento = pkmn.strumento.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
                    const resItem = await fetch(`https://pokeapi.co/api/v2/item/${idStrumento}`);
                    if (resItem.ok) {
                        const dataItem = await resItem.json();
                        infoStrumento.is_berry = dataItem.attributes?.some(a => a.name === 'berry') || dataItem.category?.name === 'berries';
                        infoStrumento.is_consumable = dataItem.attributes?.some(a => a.name === 'consumable') || false;
                        infoStrumento.is_healing = dataItem.category?.name?.includes('healing') || false;
                        infoStrumento.has_negative_effect = idStrumento.includes('choice') || idStrumento.includes('toxic-orb') || idStrumento.includes('flame-orb') || idStrumento.includes('life-orb');
                    }
                } catch(e) { console.warn("Errore fetch strumento", e); }
            }

            // 4. FETCH MOSSE
            const promesseMosse = pkmn.mosse.map(async (nomeMossa) => {
                if (!nomeMossa) return null;
                try {
                    const idMossa = nomeMossa.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
                    const resMove = await fetch(`https://pokeapi.co/api/v2/move/${idMossa}`);
                    if (!resMove.ok) return null;
                    const dataMove = await resMove.json();

                    return {
                        name: nomeMossa,
                        power: dataMove.power || 0,
                        category: dataMove.damage_class?.name ? dataMove.damage_class.name.charAt(0).toUpperCase() + dataMove.damage_class.name.slice(1) : "Physical",
                        type: dataMove.type?.name ? dataMove.type.name.charAt(0).toUpperCase() + dataMove.type.name.slice(1) : "Normal",
                        max_pp: dataMove.pp || 0,
                        accuracy: dataMove.accuracy || 100,
                        priority: dataMove.priority || 0,
                        is_protect: idMossa === 'protect' || idMossa === 'detect' || idMossa === 'spiky-shield' || idMossa === 'baneful-bunker' || idMossa === 'kings-shield' || idMossa === 'silk-trap',
                        is_contact: dataMove.flags?.some(f => f.name === 'contact') || false,
                        sound_based: dataMove.flags?.some(f => f.name === 'sound') || false,
                        punch: idMossa.includes('punch') || dataMove.flags?.some(f => f.name === 'punch'),
                        healing: dataMove.meta?.category?.name === 'heal' || idMossa === 'recover' || idMossa === 'roost' || idMossa === 'soft-boiled'
                    };
                } catch { return null; }
            });
            const infoMosse = (await Promise.all(promesseMosse)).filter(Boolean);

            // 5. COMPILAZIONE PAYLOAD COMPLETO
            return {
                name: nomePkmn,
                idPokeAPI: nomeIdPokeAPI,
                generation: genId,
                erroreDati: false,
                strumento: pkmn.strumento || "None",
                mosse: pkmn.mosse || [],
                                abilita: pkmn.abilita || "",
                name_starts: nomePkmn.trim().charAt(0).toUpperCase(),
                name_length: nomePkmn.replace(/\s+/g, '').length,
                height: dataPkmn.height * 10,
                weight: dataPkmn.weight / 10,
                type: dataPkmn.types.map(t => t.type.name.charAt(0).toUpperCase() + t.type.name.slice(1)),
                color: colore,
                egg_group: eggGroups,
                bst: bst,
                highest_stat: miglioreStatNome,
                base_friendship: baseFriendship,
                habitat: habitat,
                shape: shape,
                nature: pkmn.natura || "Serious",
                is_legendary: leggendario,
                is_mythical: misterioso,
                itemData: infoStrumento,
                movesData: infoMosse
            };

        } catch (err) {
            console.error(`Error retrieving data for ${nomePkmn}:`, err);
            return { 
                name: nomePkmn, 
                idPokeAPI: nomeIdPokeAPI, 
                erroreDati: true, 
                strumento: pkmn.strumento || "None", 
                mosse: pkmn.mosse || [] ,
                                abilita: pkmn.abilita || ""
            };
        }
    });

    return (await Promise.all(promesse)).filter(p => p !== null);
}

// Array di supporto per mappe tier
const ORDINE_TIER_REGOLE = ["LC", "NFE", "ZU", "PU", "NU", "RU", "UU", "OU", "Ubers", "AG"];

// 🆕 1. FUNZIONE DI VALIDAZIONE GENERAZIONE CON PROTEZIONE BLINDATA
function validaGenerazione(teamDatiPokeAPI, regolamento, jsonDati) {
    const errori = [];
    if (!regolamento || !regolamento.genRuleType || !regolamento.genRuleValue) return errori;

    // 🛡️ Trasforma qualsiasi dato in ingresso (Array, Oggetto o null) in un Array valido
    let listaPokemon = [];
    if (Array.isArray(teamDatiPokeAPI)) {
        listaPokemon = teamDatiPokeAPI;
    } else if (teamDatiPokeAPI && typeof teamDatiPokeAPI === 'object') {
        listaPokemon = Object.values(teamDatiPokeAPI);
    }

    const genLimite = parseInt(regolamento.genRuleValue);

    listaPokemon.forEach(pkmn => {
        if (!pkmn || pkmn.erroreDati) return;
        
        const nomePkmn = pkmn.name || pkmn.nome || '';
        const nomeChiave = nomePkmn.toLowerCase().replace(/[^a-z0-9]/g, '');

        if (regolamento.genRuleType === "up_to") {
            if (pkmn.generation > genLimite) {
                errori.push(`[${nomePkmn}] non è legale: il formato permette solo Gen ${genLimite} (Introdotto in Gen ${pkmn.generation}).`);
            }
        } else if (regolamento.genRuleType === "within") {
            const dati = jsonDati ? jsonDati[nomeChiave] : null;
            if (!dati || dati.tier === "Illegal" || dati.tier === "Past") {
                errori.push(`[${nomePkmn}] non è legale: non fa parte del Pokédex per la Gen ${genLimite}.`);
            }
        }
    });
    return errori;
}

/**
 * Pulizia e normalizzazione estrema dei nomi Pokémon.
 * Rimuove spazi, trattini, apostrofi, punti e converte in minuscolo.
 * Es: "Urshifu-Rapid-Strike" ➔ "urshifurapidstrike"
 * Es: "urshifu-rapidstrike"  ➔ "urshifurapidstrike"
 */
function normalizzaNomePokemon(nome) {
    if (!nome) return '';
    return nome.toString().toLowerCase().replace(/[^a-z0-9]/g, '');
}

/**
 * Prende un oggetto JSON e ne duplica/mappa le chiavi in formato normalizzato.
 * In questo modo jsonDati conterrà sia le chiavi originali sia quelle super-pulite.
 */
function normalizzaMappaJson(jsonOriginale) {
    if (!jsonOriginale || typeof jsonOriginale !== 'object') return {};
    
    const jsonNormalizzato = { ...jsonOriginale };

    for (const key in jsonOriginale) {
        const keyPulita = normalizzaNomePokemon(key);
        if (keyPulita && !jsonNormalizzato[keyPulita]) {
            jsonNormalizzato[keyPulita] = jsonOriginale[key];
        }
    }
    return jsonNormalizzato;
}

/**
 * Funzione di ricerca flessibile e sicura all'interno del JSON
 */
function trovaDatiPokemonNelJson(jsonDati, nomePoke) {
    if (!jsonDati || !nomePoke) return null;

    // 1. Prova ricerca esatta (es. "urshifu-rapidstrike")
    if (jsonDati[nomePoke]) return jsonDati[nomePoke];

    // 2. Prova ricerca in minuscolo (es. "landorus-therian")
    const lower = nomePoke.toLowerCase();
    if (jsonDati[lower]) return jsonDati[lower];

    // 3. Prova ricerca pulita senza trattini/spazi (es. "urshifurapidstrike")
    const pulito = normalizzaNomePokemon(nomePoke);
    if (jsonDati[pulito]) return jsonDati[pulito];

    return null;
}

// 🆕 2. VALIDA TEAM DINAMICO CORRETTA
async function validaTeamDinamico(teamInput, regolamento, altriTeamEsistenti = []) {
    let tuttiGliErrori = [];
    
    // 🛡️ Estrazione ed unificazione sicura dei dati dei Pokémon
    let teamDatiPokeAPI = [];
    let currentTeamId = null;

    if (Array.isArray(teamInput)) {
        teamDatiPokeAPI = teamInput;
    } else if (teamInput && typeof teamInput === 'object') {
        currentTeamId = teamInput.id || null;
        if (Array.isArray(teamInput.pokemon)) {
            teamDatiPokeAPI = teamInput.pokemon;
        } else if (teamInput.pokemon && typeof teamInput.pokemon === 'object') {
            teamDatiPokeAPI = Object.values(teamInput.pokemon);
        }
    }

    const strutturaFormato = String(regolamento.strutturaSito || 'custom').toLowerCase().trim();
    const isAnythingGoes = strutturaFormato === 'anything_goes';

    let jsonDati = null;
    const genLimite = parseInt(regolamento.genRuleValue);

    // 👤 RECUPERO DELLE INIZIALI (NOME E COGNOME PER LA REGOLA PLAYER_INITIAL)
    let inizialiUtente = { nome: "", cognome: "" };
    const regolaNameStarts = regolamento.restrizioni?.pokemon?.name_starts;

    if (regolaNameStarts && regolaNameStarts.mode === "PLAYER_INITIAL") {
        try {
            const authObj = typeof firebase !== 'undefined' && firebase.auth ? firebase.auth() : (typeof auth !== 'undefined' ? auth : null);
            const currentUser = authObj?.currentUser;
            let realNameEstratto = "";
            let lastNameEstratto = "";

            if (currentUser && typeof db !== 'undefined') {
                // 1. Recupera i dati account dell'utente
                const userSnap = await db.ref(`users/${currentUser.uid}`).once('value');
                const userData = userSnap.val() || {};

                // Cerca prima su users/
                realNameEstratto = userData.real_name || userData.realName || "";
                lastNameEstratto = userData.last_name || userData.lastName || "";

                // 2. Se mancanti, cerca sul nodo players/
                if (!realNameEstratto || !lastNameEstratto) {
                    const playerKey = userData.name || currentUser.displayName || currentUser.uid;
                    if (playerKey) {
                        let playerSnap = await db.ref(`players/${playerKey}/info`).once('value');
                        if (!playerSnap.exists() || !playerSnap.val()) {
                            playerSnap = await db.ref(`players/${playerKey.toLowerCase()}/info`).once('value');
                        }

                        if (playerSnap.exists() && playerSnap.val()) {
                            const pInfo = playerSnap.val();
                            if (!realNameEstratto) realNameEstratto = pInfo.real_name || pInfo.realName || "";
                            if (!lastNameEstratto) lastNameEstratto = pInfo.last_name || pInfo.lastName || "";
                        }
                    }
                }
            }

            // Backup su variabili globali di contesto
            if (!realNameEstratto) {
                realNameEstratto = window.currentUserRealName || window.currentPlayer?.info?.real_name || window.currentUser?.real_name || "";
            }
            if (!lastNameEstratto) {
                lastNameEstratto = window.currentUserLastName || window.currentPlayer?.info?.last_name || window.currentUser?.last_name || "";
            }

            // Assegnazione delle iniziali pulite
            if (realNameEstratto && typeof realNameEstratto === 'string') {
                inizialiUtente.nome = realNameEstratto.trim().charAt(0).toLowerCase();
            }
            if (lastNameEstratto && typeof lastNameEstratto === 'string') {
                inizialiUtente.cognome = lastNameEstratto.trim().charAt(0).toLowerCase();
            }

            if (!inizialiUtente.nome && !inizialiUtente.cognome) {
                console.warn("[Validazione] Attenzione: Nome/Cognome reale non trovato per l'utente loggato.");
            }

        } catch (errUser) {
            console.error("[Validazione] Errore durante il recupero di 'real_name' / 'last_name':", errUser);
        }
    }

    try {
        if (regolamento.genRuleType === "within") {
            const risposta = await fetch(`pkm-gens/gen${genLimite}.json`);
            if (risposta.ok) jsonDati = await risposta.json();
            
        } else if (regolamento.genRuleType === "up_to") {
            const [resGen, resNatDex] = await Promise.all([
                fetch(`pkm-gens/gen${genLimite}.json`).catch(() => null),
                fetch(`pkm-gens/natdex-tiers.json`).catch(() => null)
            ]);

            let jsonGen = {};
            let jsonNatDex = {};

            if (resGen && resGen.ok) jsonGen = await resGen.json();
            if (resNatDex && resNatDex.ok) jsonNatDex = await resNatDex.json();

            jsonDati = { ...jsonNatDex };

            for (const key in jsonGen) {
                const valGen = jsonGen[key];
                const valNat = jsonNatDex[key];

                if (!valNat) {
                    jsonDati[key] = valGen;
                    continue;
                }

                if (typeof valGen === 'object' && valGen !== null) {
                    const singleGen = (valGen.single_tier || '').toUpperCase();
                    const doublesGen = (valGen.doubles_tier || '').toUpperCase();

                    const singleValido = singleGen && singleGen !== 'ILLEGAL' && singleGen !== 'UNRELEASED';
                    const doublesValido = doublesGen && doublesGen !== 'ILLEGAL' && doublesGen !== 'UNRELEASED';

                    jsonDati[key] = {
                        single_tier: singleValido ? valGen.single_tier : (valNat.single_tier || valGen.single_tier),
                        doubles_tier: doublesValido ? valGen.doubles_tier : (valNat.doubles_tier || valGen.doubles_tier)
                    };
                } else if (typeof valGen === 'string') {
                    if (valGen.toUpperCase() !== 'ILLEGAL' && valGen.toUpperCase() !== 'UNRELEASED') {
                        jsonDati[key] = valGen;
                    }
                }
            }
        }

        // 🔥 NORMALIZZAZIONE MAPPA JSON:
        // Genera automaticamente chiavi senza trattini e spazi per ogni entry (es. "urshifurapidstrike")
        jsonDati = normalizzaMappaJson(jsonDati);

    } catch (err) {
        console.error("Error loading validation file:", err);
    }

        // Controlli Standard (gen, tier, clausole): saltati solo nei formati Anything Goes
    if (!isAnythingGoes) {
        const erroriGen = validaGenerazione(teamDatiPokeAPI, regolamento, jsonDati);
        const erroriTier = validaTier(teamDatiPokeAPI, regolamento, jsonDati);
        const erroriClauses = validaClauses(teamDatiPokeAPI, regolamento);
        tuttiGliErrori = tuttiGliErrori.concat(erroriGen, erroriTier, erroriClauses);
    }

        // Mosse ripetute o più di 4 mosse: impossibili nel gioco, quindi valgono in tutti i formati
    tuttiGliErrori = tuttiGliErrori.concat(validaMosseDuplicate(teamDatiPokeAPI));

    // Restrizioni del formato: valgono SEMPRE, anche in Anything Goes
    if (regolamento.restrizioni) {
        const erroriAvanzati = eseguiValidazioneRestrizioniAvanzate(teamDatiPokeAPI, regolamento.restrizioni, jsonDati, regolamento, inizialiUtente);
        tuttiGliErrori = tuttiGliErrori.concat(erroriAvanzati);
    }

    // Max 2 Pokémon in comune con gli altri team: formati custom e Anything Goes
    if ((strutturaFormato === 'custom' || isAnythingGoes) && altriTeamEsistenti.length > 0) {
        const erroriSovrapposizione = validaSovrapposizioneTeam(teamDatiPokeAPI, altriTeamEsistenti, currentTeamId);
        tuttiGliErrori = tuttiGliErrori.concat(erroriSovrapposizione);
    }

    return {
        valido: tuttiGliErrori.length === 0,
        errori: tuttiGliErrori
    };
}

/**
 * Funzione Helper per verificare che il team non condivida più di 2 Pokémon con altri team
 */
function validaSovrapposizioneTeam(teamCorrente, altriTeam, currentTeamId = null) {
    const errori = [];

    const nomiTeamCorrente = teamCorrente
        .map(p => (p.species?.name || p.name || p.nome || p.pokemon || '').toLowerCase())
        .filter(Boolean);

    for (const teamEsistente of altriTeam) {
        if (currentTeamId && teamEsistente.id && teamEsistente.id === currentTeamId) {
            continue;
        }

        const listaPokemonEsistenti = teamEsistente.pokemon || teamEsistente.teamDati || [];
        
        const nomiTeamEsistente = listaPokemonEsistenti
            .map(p => (typeof p === 'string' ? p : (p.species?.name || p.name || p.nome || p.pokemon || '')).toLowerCase())
            .filter(Boolean);

        const pokemonInComune = nomiTeamCorrente.filter(nome => nomiTeamEsistente.includes(nome));

        if (pokemonInComune.length > 2) {
            const listaNomiFormatted = pokemonInComune.map(n => n.charAt(0).toUpperCase() + n.slice(1)).join(', ');
            errori.push(
                `Il team condivide troppi Pokémon (${pokemonInComune.length}: ${listaNomiFormatted}) con un altro team già registrato (${teamEsistente.nome || 'Team esistente'}). Nei formati custom sono consentiti al massimo 2 Pokémon uguali.`
            );
            break; 
        }
    }

    return errori;
}

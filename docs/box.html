function handleAuthClick() {
    const user = auth.currentUser;
    if (!user) {
        toggleLoginModal();
    } else {
        const menu = document.getElementById('user-menu');
        const overlay = document.getElementById('menu-overlay');
        
        if (menu) {
            if (menu.style.display === 'block') {
                // Se è aperto, lo chiudiamo e togliamo il blur
                menu.style.display = 'none';
                if (overlay) {
                    overlay.classList.remove('active');
                    overlay.style.display = 'none';
                }
                console.log("Stato: Menu chiuso al click su auth-content");
            } else {
                // Se è chiuso, lo apriamo e attiviamo il blur dello schermo
                menu.style.display = 'block';
                if (overlay) {
                    overlay.style.display = 'block';
                    // Il piccolo timeout garantisce che la transizione CSS dell'opacity funzioni fluidamente
                    setTimeout(() => overlay.classList.add('active'), 10);
                }
                console.log("Stato: Menu aperto e schermo sfocato");
            }
        }
    }
}

function chiudiMenuConOverlay() {
    const menu = document.getElementById('user-menu');
    const overlay = document.getElementById('menu-overlay');
    
    if (menu) menu.style.display = 'none';
    
    if (overlay) {
        overlay.classList.remove('active');
        overlay.style.display = 'none';
    }
    console.log("Stato: Menu chiuso via overlay");
}

            }
        }
        console.log("Colori mappati:", playerColors);
    } catch (error) {
        console.error("Errore caricamento:", error);
    }
}

// Funzione per scurire o schiarire un colore HEX
function pSBC(p, c0, c1, l) {
    let r, g, b, P, f, t, h, i = parseInt, m = Math.round, a = typeof (c1) == "string";
    if (typeof (p) != "number" || p < -1 || p > 1 || typeof (c0) != "string" || (c0[0] != 'r' && c0[0] != '#') || (c1 && !a)) return null;
    if (!this.pSBCr) this.pSBCr = (d) => {
        let n = d.length, x = {};
        if (n > 9) {
            [r, g, b, a] = d = d.split(","), n = d.length;
            if (n < 3 || n > 4) return null;
            x.r = i(r[3] == "a" ? r.slice(5) : r.slice(4)), x.g = i(g), x.b = i(b), x.a = a ? parseFloat(a) : -1
        } else {
            if (n == 8 || n == 6 || n < 4) return null;
            if (n < 6) d = "#" + d[1] + d[1] + d[2] + d[2] + d[3] + d[3] + (n > 4 ? d[4] + d[4] : "");
            d = i(d.slice(1), 16);
            if (n == 9 || n == 5) x.r = d >> 24 & 255, x.g = d >> 16 & 255, x.b = d >> 8 & 255, x.a = m((d & 255) / 0.255) / 1000;
            else x.r = d >> 16, x.g = d >> 8 & 255, x.b = d & 255, x.a = -1
        } return x
    };
    h = c0.length > 9, f = this.pSBCr(c0);
    if (!f) return null;
    if (p < 0) p *= -1, t = { r: 0, g: 0, b: 0, a: f.a };
    else t = { r: 255, g: 255, b: 255, a: f.a };
    r = m((t.r - f.r) * p) + f.r, g = m((t.g - f.g) * p) + f.g, b = m((t.b - f.b) * p) + f.b;
    return "#" + (0x1000000 + (f.a != -1 ? m(f.a * 255) : 0) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

async function getPlayerPalette(playerName) {
    const snap = await db.ref(`players/${playerName}/info/color`).once('value');
    const baseColor = snap.val() || "#31c489"; // Colore scelto dall'utente

    return {
        base: baseColor,
        border: pSBC(-0.8, baseColor), // 40% più scuro per i bordi
        light: pSBC(0.8, baseColor) + "22", // 80% più chiaro + trasparenza per sfondi
        text: pSBC(-0.6, baseColor) // Molto scuro per il testo leggibile
    };
}

function applicaPaletteUtente(baseColor) {
    // Generiamo le sfumature usando la tua funzione pSBC già esistente
    const palette = {
        base: baseColor,
        dark: pSBC(-0.4, baseColor),       // 40% più scuro
        darker: pSBC(-0.88, baseColor),     // 80% più scuro (per i bordi delle card)
        light: pSBC(0.6, baseColor),       // 60% più chiaro
        bgGradient: pSBC(0.9, baseColor),  // 90% più chiaro (per lo sfondo del body)
        text: pSBC(-0.7, baseColor),        // Molto scuro (per il testo leggibile)
        tags: pSBC(-0.5, baseColor),
        bright: pSBC(0.3, baseColor)
    };

    const root = document.documentElement;

    // Iniettiamo i colori nelle variabili CSS
    root.style.setProperty('--bg-body', palette.bgGradient);
    root.style.setProperty('--light-color', palette.light);
    root.style.setProperty('--text-main', palette.text);
    root.style.setProperty('--accent-color', palette.base);
    root.style.setProperty('--border-color', palette.darker);
    root.style.setProperty('--tag-color', palette.tags);
    root.style.setProperty('--bright-color',palette.bright);
    root.style.setProperty('--dark-color', palette.dark);

    
    // Ombra delle card dinamica (colore base con 20% di opacità)
    root.style.setProperty('--card-shadow', `${palette.base}33`); 

    console.log("🎨 Palette CSS aggiornata correttamente.");
}

        ascoltaMusicaFirebase();

        // 5. Ordinamento e filtri iniziali
        const sortFilter = document.getElementById('sortFilter');
        if (sortFilter) {

            if (typeof applicaFiltri === "function") applicaFiltri();

                setTimeout(() => loader.style.display = 'none', 500);
            }
        }, 1000);
    }
}

// 5. Funzione Musica Dinamica
function ascoltaMusicaFirebase() {
    const player = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-control');

    if (!player || !playerID) return;

    db.ref(`players/${playerID}/info`).on('value', (snapshot) => {
        const data = snapshot.val();
        
        // --- 1. CONTROLLO PREFERENZA AD OGNI AGGIORNAMENTO ---
        // Leggiamo la memoria dentro il listener, non fuori!
        const musicaMutaInMemoria = localStorage.getItem('userMusicPref') === 'off';

        if (data && data.musicaPreferita) {
            if (player.src !== data.musicaPreferita) {
                player.src = data.musicaPreferita;
                player.volume = 0.3;
                player.load();

                // 2. Logica di riproduzione dinamica
                if (musicaMutaInMemoria) {
                    player.pause();
                    player.muted = true; // Sicurezza extra
                    if (musicBtn) musicBtn.classList.add('muted');
                    console.log("🔇 Preferenza OFF rilevata: musica caricata ma silenziata.");
                } else {
                    // Tentiamo il play solo se la preferenza è ON
                    player.muted = false;
                    player.play()
                        .then(() => { 
                            if(musicBtn) musicBtn.classList.remove('muted');
                        })
                        .catch((err) => { 
                            console.warn("Autoplay bloccato: serve interazione utente.");
                            if(musicBtn) musicBtn.classList.add('muted');
                        });
                }
            }
        }
    });
}

// 7. Gestione Play/Pause Manuale
function toggleMusic() {
    const player = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-control');

    if (!player) return;

    if (player.paused) {
        player.play();
        musicBtn.classList.remove('muted');
        // Salviamo la preferenza: musica ON
        localStorage.setItem('userMusicPref', 'on');
    } else {
        player.pause();
        musicBtn.classList.add('muted');
        // Salviamo la preferenza: musica OFF
        localStorage.setItem('userMusicPref', 'off');
    }
}

async function scaricaDati() {
    try {
        // Verifichiamo che il playerID sia disponibile
        if (!playerID) {
            console.warn("playerID non ancora disponibile...");
            return;
        }

        // 1. Puntiamo al nodo dei team dell'utente loggato
        db.ref(`players/${playerID}/teams`).on('value', (snapshot) => {
            const dataTeams = snapshot.val();
            
            if (dataTeams) {
                // 2. Trasformiamo l'oggetto in array recuperando le statistiche dal sotto-nodo /stats
                let tempTeams = Object.keys(dataTeams).map(key => {
                    const team = dataTeams[key];
                    // Recuperiamo l'oggetto stats (se manca, inizializziamo a 0 per sicurezza)
                    const s = team.stats || {};
                    
                    // Recupero nomi pokemon per la ricerca testuale
                    let nomiPokemon = "";
                    if (team.pokemon && Array.isArray(team.pokemon)) {
                        nomiPokemon = team.pokemon.map(p => p ? p.nome : "").join(" ");
                    } else if (team.pokemon && typeof team.pokemon === 'object') {
                        nomiPokemon = Object.values(team.pokemon).map(p => p ? p.nome : "").join(" ");
                    }

                    return {
                        ...team,
                        id: key,
                        // PESCAGGIO DAL NUOVO PERCORSO: players/ID/teams/ID_TEAM/stats/
                        vittorie: s.won || 0,
                        sconfitte: s.lost || 0,
                        giocate: s.played || 0,
                        setVinti: s.setW || 0,
                        setPersi: s.setL || 0,
                        // I punti fatti (se non presenti nel DB) rimangono calcolabili o inizializzati
                        puntiFatti: s.punti || 0, 
                        tuttoIlTesto: ((team.nome || "") + " " + (team.categoria || "") + " " + nomiPokemon).toLowerCase()
                    };
                });

                // 3. Salvataggio e aggiornamento UI
                tuttiITeam = tempTeams;
                applicaFiltri(); 
                
                // Gestione Loader
                const loader = document.getElementById('loading-screen');
                if (loader) loader.style.display = 'none';

            } else {
                tuttiITeam = [];
                renderizza([]);
                const loader = document.getElementById('loading-screen');
                if (loader) loader.style.display = 'none';
            }
        });
    } catch (error) {
        console.error("Errore critico nello scaricamento dati:", error);
    }
}

    try {
        const cleanName = nomeMossa.trim().toLowerCase().replace(/\s+/g, '-').replace(/[.'é]/g, '');

function inizializzaRotazioneTooltipMosse() {
    // Seleziona tutte le mosse nel modale
    const mosse = document.querySelectorAll('.move-span');

    mosse.forEach(mossa => {
        // Trova il tooltip figlio di questa mossa
        const tooltip = mossa.querySelector('.move-tooltip');
        
        if (!tooltip) return; // Sicurezza se il tooltip non esiste

        // Evento: Il mouse entra nella mossa
        mossa.addEventListener('mouseover', () => {
            // GENERA ROTAZIONE CASUALE
            // Esempio: tra -4deg e +4deg. Modifica i numeri per più/meno caos.
            const gradiCasuali = (Math.random() * 8 - 4).toFixed(2); 
            
            // APPLICA LA TRASFORMAZIONE
            // Dobbiamo mantenere translateX(-50%) per centrarlo rispetto alla mossa,
            // e aggiungere la rotazione casuale.
            tooltip.style.transform = `translateX(-50%) rotate(${gradiCasuali}deg)`;
            
            // Mostra il tooltip aggiungendo la classe CSS
            tooltip.classList.add('is-active');
        });

        // Evento: Il mouse esce dalla mossa
        mossa.addEventListener('mouseout', () => {
            // Nascondi il tooltip rimuovendo la classe
            tooltip.classList.remove('is-active');
            
            // Opzionale: resetta la trasformazione dopo un po' 
            // per evitare glitch visivi alla prossima apertura
            setTimeout(() => {
                tooltip.style.transform = 'translateX(-50%) rotate(0deg)';
            }, 150);
        });
    });
}

// Nuova funzione per scaricare i tipi
// Aggiunto "direzione" ai parametri
async function caricaTipi(pkmName, elementId, direzione) {
    try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pkmName}`);
        const data = await res.json();
        const container = document.getElementById(elementId);
        if (!container) return;

        const d_types = ["normal","fire","water","electric","grass","ice","fighting","poison","ground","flying","psychic","bug","rock","ghost","dragon","dark","steel","fairy"];
        let effectiveness = {};
        d_types.forEach(type => effectiveness[type] = 1);

        await Promise.all(data.types.map(async (t) => {
            const typeRes = await fetch(t.type.url);
            const typeData = await typeRes.json();
            const rel = typeData.damage_relations;

            rel.double_damage_from.forEach(type => effectiveness[type.name] *= 2);
            rel.half_damage_from.forEach(type => effectiveness[type.name] *= 0.5);
            rel.no_damage_from.forEach(type => effectiveness[type.name] *= 0);
        }));

        let result = { x4: [], x2: [], x05: [], x025: [], x0: [] };
        for (let type in effectiveness) {
            const mult = effectiveness[type];
            if (mult === 4) result.x4.push(type);
            else if (mult === 2) result.x2.push(type);
            else if (mult === 0.5) result.x05.push(type);
            else if (mult === 0.25) result.x025.push(type);
            else if (mult === 0) result.x0.push(type);
        }

        const creaBadge = (lista) => {
            return `<div class="eff-badge-container">
                ${lista.map(t => `<span class="mini-type-badge ${t}">${t}</span>`).join('')}
            </div>`;
        };

        let tooltipHTML = "";
        if (result.x4.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-4">4x</span>${creaBadge(result.x4)}</div>`;
        if (result.x2.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-2">2x</span>${creaBadge(result.x2)}</div>`;
        if (result.x05.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-05">0.5x</span>${creaBadge(result.x05)}</div>`;
        if (result.x025.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-025">0.25x</span>${creaBadge(result.x025)}</div>`;
        if (result.x0.length > 0) tooltipHTML += `<div class="eff-section"><span class="eff-title v-0">0x</span>${creaBadge(result.x0)}</div>`;

        // --- APPLICAZIONE CLASSE DIREZIONE ---
        container.innerHTML = data.types.map(t => 
        `<div class="type-container">
            <span class="type-badge ${t.type.name}">${t.type.name.toUpperCase()}</span>
            <div class="type-effectiveness-tooltip ${direzione}">${tooltipHTML}</div>
        </div>`
    ).join('');

    } catch (e) { console.error("Error:", e); }
}

function applicaFiltri() {
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    
    if (!searchInput || !categoryFilter) return;

    const search = searchInput.value.toLowerCase().trim();
    const cat = categoryFilter.value;
    const sort = document.getElementById('sortFilter') ? document.getElementById('sortFilter').value : 'default';

    console.log("Ricerca attiva per:", search); // Debug: guarda la console F12

    let filtrati = tuttiITeam.filter(team => {
        // Se la ricerca è vuota, passa sempre. Se non è vuota, cerca nel testo.
        const matchesSearch = search === "" || team.tuttoIlTesto.includes(search);
        const matchesCat = cat === "" || team.categoria === cat;
        return matchesSearch && matchesCat;
    });

    // Ordinamento
    filtrati.sort((a, b) => {
        switch (sort) {
            case 'alpha': return (a.nome || "").localeCompare(b.nome || "");
            case 'win': return Number(b.vittorie || 0) - Number(a.vittorie || 0);
            case 'loss': return Number(b.sconfitte || 0) - Number(a.sconfitte || 0);
            case 'setV': return Number(b.setVinti || 0) - Number(a.setVinti || 0);
            case 'setP': return Number(b.setPersi || 0) - Number(a.setPersi || 0);
            case 'played':
                const playedA = Number(a.setVinti || 0) + Number(a.setPersi || 0);
                const playedB = Number(b.setVinti || 0) + Number(b.setPersi || 0);
                return playedB - playedA;
            default: return 0;
        }
    });

    renderizza(filtrati);
}

            // Usiamo il background diretto sullo pseudo-elemento tramite una variabile o stile iniettato
            box.style.setProperty('--bg-bordo', types[0]);
        } else {
            box.style.setProperty('--bg-bordo', `linear-gradient(to bottom, ${types[0]} 50%, ${types[1]} 50%)`);
        }
        
        // Applichiamo lo stile finale
        const bgEffettivo = types.length === 1 ? types[0] : `linear-gradient(to bottom, ${types[0]} 50%, ${types[1]} 50%)`;
        
        // Creiamo una piccola regola stile al volo per colpire il ::before di quel box specifico
        const stileDinamico = document.createElement('style');
        stileDinamico.innerHTML = `#${elementId}::before { background: ${bgEffettivo} !important; }`;
        document.head.appendChild(stileDinamico);

    } catch (e) {
        console.error("Error:", e);
    }
}

async function caricaDebolezzeStatiche(pkmName, elementId) {
    const container = document.getElementById(elementId);
    if (!container) return;

    try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pkmName}`);
        const data = await res.json();
        
        // Lista completa dei tipi per il calcolo
        const tuttiITipi = ['normal', 'fire', 'water', 'electric', 'grass', 'ice', 'fighting', 'poison', 'ground', 'flying', 'psychic', 'bug', 'rock', 'ghost', 'dragon', 'dark', 'steel', 'fairy'];
        
        let effectiveness = {};
        tuttiITipi.forEach(type => effectiveness[type] = 1);

        await Promise.all(data.types.map(async (t) => {
            const typeRes = await fetch(t.type.url);
            const typeData = await typeRes.json();
            const rel = typeData.damage_relations;

            rel.double_damage_from.forEach(type => effectiveness[type.name] *= 2);
            rel.half_damage_from.forEach(type => effectiveness[type.name] *= 0.5);
            rel.no_damage_from.forEach(type => effectiveness[type.name] *= 0);
        }));

        // Raggruppiamo i risultati
        let result = { x4: [], x2: [], x05: [], x025: [], x0: [] };
        for (let type in effectiveness) {
            const mult = effectiveness[type];
            if (mult === 4) result.x4.push(type);
            else if (mult === 2) result.x2.push(type);
            else if (mult === 0.5) result.x05.push(type);
            else if (mult === 0.25) result.x025.push(type);
            else if (mult === 0) result.x0.push(type);
        }

        // Funzione interna per creare i micro-badge colorati
        const creaBadge = (lista) => `
    <div class="types-wrapper">
        ${lista.map(t => `<span class="mini-type-badge ${t}">${t}</span>`).join('')}
    </div>`;

container.innerHTML = `
    <div class="weakness-container">
        ${result.x4.length > 0 ? `<div class="w-row"><b class="mult x4">4x</b> ${creaBadge(result.x4)}</div>` : ''}
        ${result.x2.length > 0 ? `<div class="w-row"><b class="mult x2">2x</b> ${creaBadge(result.x2)}</div>` : ''}
        ${result.x05.length > 0 ? `<div class="w-row"><b class="mult x05">0.5x</b> ${creaBadge(result.x05)}</div>` : ''}
        ${result.x025.length > 0 ? `<div class="w-row"><b class="mult x025">0.25x</b> ${creaBadge(result.x025)}</div>` : ''}
        ${result.x0.length > 0 ? `<div class="w-row"><b class="mult x0">0x</b> ${creaBadge(result.x0)}</div>` : ''}
    </div>
`;
    } catch (e) { 
        console.error(e);
        container.innerHTML = "<span style='color:red'>Error.</span>"; 
    }
}

function normalizzaNomePerPokeAPI(nomeShowdown) {
    // Trasforma in minuscolo, sostituisce gli spazi con trattini e rimuove i caratteri speciali
    let slug = nomeShowdown.toLowerCase().trim()
        .replace(/\s+/g, '-')
        .replace(/[^a-z0-9-]/g, '');

    // Dizionario delle eccezioni più comuni Showdown -> PokeAPI
    const eccezioniForme = {
        'mimikyu': 'mimikyu-disguised',
        'toxtricity': 'toxtricity-amped',
        'urshifu': 'urshifu-single-strike',
        'urshifu-rapid-strike': 'urshifu-rapid-strike',
        'aegislash': 'aegislash-shield',
        'deoxys': 'deoxys-normal',
        'keldeo': 'keldeo-ordinary',
        'meloetta': 'meloetta-aria',
        'shaymin': 'shaymin-land',
        'darmanitan': 'darmanitan-standard',
        'tornadus': 'tornadus-incarnate',
        'thundurus': 'thundurus-incarnate',
        'landorus': 'landorus-incarnate',
        'enamorus': 'enamorus-incarnate',
        'zygarde': 'zygarde-50',
        'hoopa': 'hoopa-confined',
        'lycanroc': 'lycanroc-midday',
        'wishiwashi': 'wishiwashi-solo',
        'morpeko': 'morpeko-full-belly',
        'eiscue': 'eiscue-ice',
        'indeedee': 'indeedee-male',       // Showdown usa 'Indeedee' per il maschio
        'indeedee-f': 'indeedee-female',   // e 'Indeedee-F' per la femmina
        'basculegion': 'basculegion-male',
        'basculegion-f': 'basculegion-female',
        'ogerpon': 'ogerpon-teal-mask',
        'terapagos': 'terapagos-normal'
    };

    return eccezioniForme[slug] || slug;
}

function parseShowdown(text) {
    const teams = [];
    const blocks = text.split(/\n\s*\n/);

    blocks.forEach(block => {
        const lines = block.split('\n').map(l => l.trim());
        if (lines.length < 2) return;

        let pokemon = {};
        let rigaNome = lines[0];
        let strumentoScelto = "None";

        if (rigaNome.includes('@')) {
            const parts = rigaNome.split('@');
            rigaNome = parts[0].trim();
            strumentoScelto = parts[1].trim();
        }

        // Nome pulito per la UI (es. "Mimikyu")
        pokemon.nome = rigaNome.replace(/\s*\([MF]\)\s*/gi, '').trim();
        
        // 🔥 NUOVO: Generiamo l'ID PokeAPI una volta sola qui!
        pokemon.idPokeAPI = normalizzaNomePerPokeAPI(pokemon.nome); 
        
        pokemon.strumento = strumentoScelto;
        pokemon.mosse = [];
        pokemon.natura = "Serious";

        lines.forEach(line => {
            if (line.startsWith('Ability:')) pokemon.abilita = line.replace('Ability:', '').trim();
            if (line.startsWith('Tera Type:')) pokemon.tera = line.replace('Tera Type:', '').trim();
            if (line.startsWith('EVs:')) pokemon.evs = line.replace('EVs:', '').trim();
            if (line.endsWith('Nature')) pokemon.natura = line.replace('Nature', '').trim();
            if (line.startsWith('-')) pokemon.mosse.push(line.replace('-', '').trim());
        });

        while (pokemon.mosse.length < 4) pokemon.mosse.push("");
        teams.push(pokemon);
    });

    return teams;
}

async function preparaDatiTeamPerValidazione(listaPokemon) {
    const promesse = listaPokemon.map(async (pkmn) => {
        const nomePkmn = pkmn.nome;
        if (!nomePkmn) return null;

        // 🔥 MODIFICATO: Usa l'ID pulito estratto dal parser, con fallback di sicurezza per vecchi dati DB
        const nomeIdPokeAPI = pkmn.idPokeAPI || normalizzaNomePerPokeAPI(nomePkmn);

        try {
            // 1. FETCH BASE POKÉMON
            const resPokemon = await fetch(`https://pokeapi.co/api/v2/pokemon/${nomeIdPokeAPI}`);
            if (!resPokemon.ok) throw new Error(`Non trovato su PokeAPI`);
            const dataPkmn = await resPokemon.json();

            // Calcolo BST e Statistica migliore
            const nomiStat = { hp: "HP", attack: "Attack", defense: "Defense", "special-attack": "Sp. Attack", "special-defense": "Sp. defense", speed: "Speed" };
            let bst = 0;
            let miglioreStatNome = "HP";
            let miglioreStatValore = -1;

            dataPkmn.stats.forEach(s => {
                bst += s.base_stat;
                if (s.base_stat > miglioreStatValore) {
                    miglioreStatValore = s.base_stat;
                    miglioreStatNome = nomiStat[s.stat.name] || "HP";
                }
            });

            // 2. FETCH SPECIE POKÉMON (Colore, Sagoma, Habitat, Legend/Mythical)
            const resSpecies = await fetch(dataPkmn.species.url);
            let genId = 1, misterioso = false, leggendario = false, baseFriendship = 70;
            let colore = "White", habitat = "Grassland", shape = "Ball", eggGroups = [];

            if (resSpecies.ok) {
                const dataSpecie = await resSpecies.json();
                misterioso = dataSpecie.is_mythical || false;
                leggendario = dataSpecie.is_legendary || false;
                baseFriendship = dataSpecie.base_happiness ?? 70;
                colore = dataSpecie.color?.name ? dataSpecie.color.name.charAt(0).toUpperCase() + dataSpecie.color.name.slice(1) : "White";
                habitat = dataSpecie.habitat?.name ? dataSpecie.habitat.name.charAt(0).toUpperCase() + dataSpecie.habitat.name.slice(1) : "Grassland";
                
                // Formatta la sagoma per allinearla alle opzioni delle tue regole
                const shapeRaw = dataSpecie.shape?.name || "ball";
                shape = shapeRaw.charAt(0).toUpperCase() + shapeRaw.slice(1).replace('-', '_');

                eggGroups = dataSpecie.egg_groups?.map(g => {
                    let n = g.name.charAt(0).toUpperCase() + g.name.slice(1);
                    if (n === "Water-1") return "Water1";
                    if (n === "Water-2") return "Water2";
                    if (n === "Water-3") return "Water3";
                    if (n === "No-eggs") return "No-eggs";
                    return n;
                }) || [];
            }

            // 3. FETCH STRUMENTO IN PARALLELO
            let infoStrumento = { is_berry: false, is_consumable: false, is_healing: false, has_negative_effect: false };
            if (pkmn.strumento && pkmn.strumento.toLowerCase() !== 'none') {
                try {
                    const idStrumento = pkmn.strumento.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
                    const resItem = await fetch(`https://pokeapi.co/api/v2/item/${idStrumento}`);
                    if (resItem.ok) {
                        const dataItem = await resItem.json();
                        infoStrumento.is_berry = dataItem.attributes?.some(a => a.name === 'berry') || dataItem.category?.name === 'berries';
                        infoStrumento.is_consumable = dataItem.attributes?.some(a => a.name === 'consumable') || false;
                        infoStrumento.is_healing = dataItem.category?.name?.includes('healing') || false;
                        infoStrumento.has_negative_effect = idStrumento.includes('choice') || idStrumento.includes('toxic-orb') || idStrumento.includes('flame-orb') || idStrumento.includes('life-orb');
                    }
                } catch(e) { console.warn("Errore fetch strumento", e); }
            }

            // 4. FETCH MOSSE IN PARALLELO
            const promesseMosse = pkmn.mosse.map(async (nomeMossa) => {
                if (!nomeMossa) return null;
                try {
                    const idMossa = nomeMossa.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
                    const resMove = await fetch(`https://pokeapi.co/api/v2/move/${idMossa}`);
                    if (!resMove.ok) return null;
                    const dataMove = await resMove.json();

                    return {
                        name: nomeMossa,
                        power: dataMove.power || 0,
                        category: dataMove.damage_class?.name ? dataMove.damage_class.name.charAt(0).toUpperCase() + dataMove.damage_class.name.slice(1) : "Physical",
                        type: dataMove.type?.name ? dataMove.type.name.charAt(0).toUpperCase() + dataMove.type.name.slice(1) : "Normal",
                        max_pp: dataMove.pp || 0,
                        accuracy: dataMove.accuracy || 100,
                        priority: dataMove.priority || 0,
                        is_protect: idMossa === 'protect' || idMossa === 'detect' || idMossa === 'spiky-shield' || idMossa === 'baneful-bunker' || idMossa === 'kings-shield' || idMossa === 'silk-trap',
                        is_contact: dataMove.flags?.some(f => f.name === 'contact') || false,
                        sound_based: dataMove.flags?.some(f => f.name === 'sound') || false,
                        punch: idMossa.includes('punch') || dataMove.flags?.some(f => f.name === 'punch'),
                        healing: dataMove.meta?.category?.name === 'heal' || idMossa === 'recover' || idMossa === 'roost' || idMossa === 'soft-boiled'
                    };
                } catch { return null; }
            });
            const infoMosse = (await Promise.all(promesseMosse)).filter(Boolean);

            // 5. COMPILAZIONE PAYLOAD COMPLETO PER REGOLE DINAMICHE
            return {
                name: nomePkmn,
                idPokeAPI: nomeIdPokeAPI, // 🔥 Conserviamo l'ID associato anche per usi futuri sulla UI
                generation: genId,
                erroreDati: false,
                strumento: pkmn.strumento || "None",
                mosse: pkmn.mosse || [],
                
                // Variabili meccanismo Regole Avanzate (Categoria Pokémon)
                name_starts: nomePkmn.trim().charAt(0).toUpperCase(),
                name_length: nomePkmn.replace(/\s+/g, '').length,
                height: dataPkmn.height * 10, // PokeAPI restituisce decimetri -> convertiamo in cm
                weight: dataPkmn.weight / 10, // PokeAPI restituisce ettogrammi -> convertiamo in kg
                type: dataPkmn.types.map(t => t.type.name.charAt(0).toUpperCase() + t.type.name.slice(1)),
                color: colore,
                egg_group: eggGroups,
                bst: bst,
                highest_stat: miglioreStatNome,
                base_friendship: baseFriendship,
                habitat: habitat,
                shape: shape,
                nature: pkmn.natura || "Serious",
                is_legendary: leggendario,
                is_mythical: misterioso,

                // Sotto-strutture per Strumenti e Mosse
                itemData: infoStrumento,
                movesData: infoMosse
            };

        } catch (err) {
            console.error(`Errore nel recupero dati per ${nomePkmn}:`, err);
            return { 
                name: nomePkmn, 
                idPokeAPI: nomeIdPokeAPI, // 🔥 Passiamo l'ID anche nel catch per non rompere i grafici/sprite esterni
                erroreDati: true, 
                strumento: pkmn.strumento || "None", 
                mosse: pkmn.mosse || [] 
            };
        }
    });

    return (await Promise.all(promesse)).filter(p => p !== null);
}

// --- 2. FUNZIONI DI VALIDAZIONE (Logica Core) ---

// Array di supporto per mappare gli indici delle Tier Smogon salvate nel DB
const ORDINE_TIER_REGOLE = ["LC", "NFE", "ZU", "PU", "NU", "RU", "UU", "OU", "Ubers", "AG"];

async function validaTeamDinamico(teamDatiPokeAPI, regolamento) {
    let tuttiGliErrori = [];
    
    if (regolamento.strutturaSito === 'anything_goes') {
        return { valido: true, errori: [] }; // 🌟 Uniformato in 'errori'
    }

    let jsonDati = null;
    const genLimite = parseInt(regolamento.genRuleValue);
    
    try {
        let percorsoFile = "";
        if (regolamento.genRuleType === "within") {
            percorsoFile = `pkm-gens/gen${genLimite}.json`;
        } else if (regolamento.genRuleType === "up_to") {
            percorsoFile = `pkm-gens/natdex-tiers.json`;
        }

        if (percorsoFile) {
            const risposta = await fetch(percorsoFile);
            if (risposta.ok) jsonDati = await risposta.json();
        }
    } catch (err) {
        console.error("Errore nel caricamento file validazione:", err);
    }

    // Controlli Standard Preesistenti
    const erroriGen = validaGenerazione(teamDatiPokeAPI, regolamento, jsonDati);
    const erroriTier = validaTier(teamDatiPokeAPI, regolamento, jsonDati);
    const erroriClauses = validaClauses(teamDatiPokeAPI, regolamento);
    
    tuttiGliErrori = tuttiGliErrori.concat(erroriGen, erroriTier, erroriClauses);

    // CONTROLLO DELLE RESTRIZIONI AVANZATE E DINAMICHE
    if (regolamento.restrizioni) {
        const erroriAvanzati = eseguiValidazioneRestrizioniAvanzate(teamDatiPokeAPI, regolamento.restrizioni, jsonDati);
        tuttiGliErrori = tuttiGliErrori.concat(erroriAvanzati);
    }

    return {
        valido: tuttiGliErrori.length === 0,
        errori: tuttiGliErrori
    };
}

function eseguiValidazioneRestrizioniAvanzate(team, restrizioni, jsonDati) {
    const errori = [];

    // --- 1. CONTROLLI CATEGORIA: POKÉMON ---
    if (restrizioni.pokemon) {
        Object.keys(restrizioni.pokemon).forEach(field => {
            const regola = restrizioni.pokemon[field];

            // Intercetta se il "mode" o il "value" dicono di controllare l'uniformità del team
            if (regola.mode === "SAME_ACROSS_TEAM" || regola.value === "SAME_ACROSS_TEAM") {
                
                // 🌟 ECCEZIONE SPECIALE: Formato Monotype (field === 'type')
                if (field === 'type') {
                    // Trasformiamo i tipi di ogni pokemon in array puliti (es. ['Water', 'Flying'])
                    const listeTipiPerPokemon = team.map(p => {
                        const val = p[field];
                        if (!val) return [];
                        return Array.isArray(val) ? val : [val];
                    }).filter(arr => arr.length > 0);

                    if (listeTipiPerPokemon.length > 0) {
                        // Partiamo dai tipi del primo Pokémon e filtriamo tenendo solo quelli presenti in TUTTI gli altri
                        let tipiComuni = listeTipiPerPokemon[0];
                        
                        for (let i = 1; i < listeTipiPerPokemon.length; i++) {
                            tipiComuni = tipiComuni.filter(tipo => listeTipiPerPokemon[i].includes(tipo));
                        }

                        // Se non è rimasto nessun tipo comune a tutta la squadra, il team non è Monotype
                        if (tipiComuni.length === 0) {
                            const tuttiITipiMisti = [...new Set(listeTipiPerPokemon.flat())];
                            errori.push(`[Restrizione Monotype] Il team non condivide alcun tipo comune. Per essere legale nel formato Monotype, tutti i membri devono avere almeno un tipo condiviso. Tipi trovati: ${tuttiITipiMisti.join(', ')}.`);
                        }
                    }
                } 
                // Logica standard per tutti gli altri campi (color, egg_group, ecc.)
                else {
                    const valoriTeam = team.map(p => p[field]).filter(v => v !== undefined);
                    const valoriUnici = [...new Set(valoriTeam.flat())];

                    if (valoriUnici.length > 1) {
                        errori.push(`[Restrizione Team] I Pokémon violano la regola di uniformità per il campo "${field}". Trovati valori differenti: ${valoriUnici.join(', ')}.`);
                    }
                }
            }
            // Gestione dei valori fissi specifici (es. "color" equals "Red")
            else if (regola.mode === "SPECIFIC") {
                team.forEach(p => {
                    if (p.erroreDati) return;
                    let valoreEffettivo = p[field];

                    if (field === 'tier' && jsonDati) {
                        const nomeChiave = p.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                        const datoGrezzo = jsonDati[nomeChiave];
                        const stringaTier = (typeof datoGrezzo === 'object' ? datoGrezzo.tier : datoGrezzo || "OU").toUpperCase();
                        valoreEffettivo = ORDINE_TIER_REGOLE.indexOf(stringaTier);
                    }

                    if (field === 'is_legendary') {
                        if (regola.value === "Only Legendary" && !p.is_legendary) {
                            errori.push(`[${p.name}] Non valido: Il formato accetta esclusivamente Pokémon Leggendari.`);
                        }
                        return;
                    }
                    if (field === 'is_mythical') {
                        if (regola.value === "Only Mythical" && !p.is_mythical) {
                            errori.push(`[${p.name}] Non valido: Il formato accetta esclusivamente Pokémon Misteriosi.`);
                        }
                        return;
                    }

                    if (!validaSingoloOperatore(valoreEffettivo, regola)) {
                        errori.push(`[${p.name}] Viola la restrizione "${field}": Valore registrato non conforme.`);
                    }
                });
            }
        });
    }

    // --- 2. CONTROLLI CATEGORIA: STRUMENTI ---
    if (restrizioni.strumenti) {
        Object.keys(restrizioni.strumenti).forEach(field => {
            const regola = restrizioni.strumenti[field];
            
            if (regola.mode === "SAME_ACROSS_TEAM" || regola.value === "SAME_ACROSS_TEAM") {
                const valoriTeam = team.map(p => p.itemData?.[field]).filter(v => v !== undefined);
                const valoriUnici = [...new Set(valoriTeam)];
                if (valoriUnici.length > 1) {
                    errori.push(`[Restrizione Strumenti] Gli strumenti violano la regola di uniformità per il campo "${field}".`);
                }
            }
            else if (regola.mode === "SPECIFIC") {
                team.forEach(p => {
                    if (!p.itemData || p.strumento === "None") return;
                    const valoreEffettivo = p.itemData[field];

                    if (!validaSingoloOperatore(valoreEffettivo, regola)) {
                        errori.push(`Lo strumento "${p.strumento}" equipaggiato su [${p.name}] viola la restrizione "${field}".`);
                    }
                });
            }
        });
    }

    // --- 3. CONTROLLI CATEGORIA: MOSSE ---
    if (restrizioni.mosse) {
        Object.keys(restrizioni.mosse).forEach(field => {
            const regola = restrizioni.mosse[field];

            if (regola.mode === "SAME_ACROSS_TEAM" || regola.value === "SAME_ACROSS_TEAM") {
                const tuttiIValoriMosse = team.flatMap(p => p.movesData ? p.movesData.map(m => m[field]) : []).filter(v => v !== undefined);
                const valoriUnici = [...new Set(tuttiIValoriMosse)];
                if (valoriUnici.length > 1) {
                    errori.push(`[Restrizione Mosse] Le mosse del team violano la regola di uniformità per il campo "${field}".`);
                }
            }
            else if (regola.mode === "SPECIFIC") {
                team.forEach(p => {
                    if (!p.movesData) return;
                    p.movesData.forEach(mossa => {
                        const valoreEffettivo = mossa[field];
                        
                        if (!validaSingoloOperatore(valoreEffettivo, regola)) {
                            errori.push(`La mossa "${mossa.name}" scelta per [${p.name}] viola la restrizione "${field}".`);
                        }
                    });
                });
            }
        });
    }

    return errori;
}

function validaSingoloOperatore(valoreEffettivo, regola) {
    let target = regola.value;
    
    // Normalizzazione booleani salvati come stringhe all'interno del DB Firebase
    if (target === "true") target = true;
    if (target === "false") target = false;
    if (valoreEffettivo === "true") valoreEffettivo = true;
    if (valoreEffettivo === "false") valoreEffettivo = false;

    // Gestione Array (es. controllo se un tipo specifico è incluso nei tipi del Pokémon)
    if (Array.isArray(valoreEffettivo)) {
        if (regola.operator === "equals") return valoreEffettivo.includes(target);
    }

    switch (regola.operator) {
        case "equals":
            return valoreEffettivo === target;
        case "lt":
            return valoreEffettivo < target;
        case "gt":
            return valoreEffettivo > target;
        case "lte":
            return valoreEffettivo <= target;
        case "gte":
            return valoreEffettivo >= target;
        case "between":
            return valoreEffettivo >= regola.min && valoreEffettivo <= regola.max;
        default:
            return valoreEffettivo === target;
    }
}

function validaGenerazione(teamDatiPokeAPI, regolamento, jsonDati) {
    const errori = [];
    if (!regolamento.genRuleType || !regolamento.genRuleValue) return errori;
    
    const genLimite = parseInt(regolamento.genRuleValue);

    teamDatiPokeAPI.forEach(pkmn => {
        if (pkmn.erroreDati) return;
        const nomeChiave = pkmn.name.toLowerCase().replace(/[^a-z0-9]/g, '');

        if (regolamento.genRuleType === "up_to") {
            if (pkmn.generation > genLimite) {
                errori.push(`[${pkmn.name}] non è legale: il formato permette solo Gen ${genLimite} (Introdotto in Gen ${pkmn.generation}).`);
            }
        } else if (regolamento.genRuleType === "within") {
            const dati = jsonDati ? jsonDati[nomeChiave] : null;
            if (!dati || dati.tier === "Illegal" || dati.tier === "Past") {
                errori.push(`[${pkmn.name}] non è legale: non fa parte del Pokédex per la Gen ${genLimite}.`);
            }
        }
    });
    return errori;
}

function validaTier(teamDatiPokeAPI, regolamento, jsonDati) {
    const errori = [];
    if (!regolamento.baseTier || regolamento.baseTier === "ALL" || !jsonDati) return errori;

    const tierMassima = regolamento.baseTier.toUpperCase();

    // ================= LOGICA TIER: STANDARD =================
    if (tierMassima === "STANDARD") {
        let contatoreUber = 0;

        teamDatiPokeAPI.forEach(pkmn => {
            if (pkmn.erroreDati) return;
            
            const nomeChiave = pkmn.name.toLowerCase().replace(/[^a-z0-9]/g, '');
            let valoreGrezzo = jsonDati[nomeChiave];
            
            // 🌟 FALLBACK: Se non trova la forma specifica, prova con il nome base (es. Toxtricity)
            if (!valoreGrezzo && pkmn.name.includes('-')) {
                const nomeBase = pkmn.name.split('-')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                valoreGrezzo = jsonDati[nomeBase];
            }

            if (!valoreGrezzo) {
                console.warn(`Tier non trovata nel JSON nemmeno come nome base per: ${pkmn.name}`);
                return;
            }

            const tierPokemon = (typeof valoreGrezzo === 'object' ? valoreGrezzo.tier : valoreGrezzo).toUpperCase();

            // 1. Blocco Pokémon Misteriosi
            if (pkmn.isMythical) {
                errori.push(`[${pkmn.name}] non è ammesso: i Pokémon Misteriosi sono vietati nel formato STANDARD.`);
            }

            // 2. Controllo tetti massimi (Max 2 Uber, No AG, il resto OU o inferiori)
            if (tierPokemon === "AG") {
                errori.push(`[${pkmn.name}] è bandito: appartiene alla tier AG, non ammessa nel formato STANDARD.`);
            } else if (tierPokemon === "UBER") {
                contatoreUber++;
                if (contatoreUber > 2) {
                    errori.push(`[${pkmn.name}] non è legale: il formato STANDARD permette al massimo 2 Pokémon di tier UBER.`);
                }
            } else {
                // Se non è AG o UBER, verifichiamo che non superi comunque la barriera di OU
                const gerarchiaStandard = ["OU", "UUBL", "UU", "RUBL", "RU", "NUBL", "NU", "PU", "ZU", "NFE", "LC"];
                if (gerarchiaStandard.indexOf(tierPokemon) === -1) {
                    errori.push(`[${pkmn.name}] ha una tier (${tierPokemon}) non valida per il formato STANDARD.`);
                }
            }
        });
        return errori;
    }

    // ================= LOGICA TIER: GERARCHICA CLASSICA (OU, UU, ecc.) =================
    const gerarchia = ["AG", "UBER", "OU", "UUBL", "UU", "RUBL", "RU", "NUBL", "NU", "PU", "ZU", "NFE", "LC"];
    const idxMax = gerarchia.indexOf(tierMassima);

    teamDatiPokeAPI.forEach(pkmn => {
        if (pkmn.erroreDati) return;
        
        const nomeChiave = pkmn.name.toLowerCase().replace(/[^a-z0-9]/g, '');
        let valoreGrezzo = jsonDati[nomeChiave];
        
        // 🌟 FALLBACK: Stessa logica di recupero nome base anche qui
        if (!valoreGrezzo && pkmn.name.includes('-')) {
            const nomeBase = pkmn.name.split('-')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
            valoreGrezzo = jsonDati[nomeBase];
        }

        if (!valoreGrezzo) return;

        const tierPokemon = (typeof valoreGrezzo === 'object' ? valoreGrezzo.tier : valoreGrezzo).toUpperCase();
        const idxPkmn = gerarchia.indexOf(tierPokemon);
        
        if (idxMax !== -1 && idxPkmn !== -1 && idxPkmn < idxMax) {
            errori.push(`[${pkmn.name}] è bandito: è ${tierPokemon}, superiore al limite ${tierMassima}.`);
        }
    });
    return errori;
}

function validaClauses(teamDatiPokeAPI, regolamento) {
    const errori = [];
    if (!regolamento.strutturaSito) return errori;

    const struttura = regolamento.strutturaSito.toLowerCase();
    if (struttura !== 'vgc' && struttura !== 'vcg' && struttura !== 'custom') {
        return errori;
    }

    const specieViste = new Set();
    const strumentiVisti = new Set();

    teamDatiPokeAPI.forEach(pkmn => {
        if (pkmn.erroreDati) return;

        // 1. Species Clause
        const nomeChiave = pkmn.name.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (specieViste.has(nomeChiave)) {
            errori.push(`[Species Clause] Non puoi avere più di un Pokémon della stessa specie: ${pkmn.name}.`);
        } else {
            specieViste.add(nomeChiave);
        }

        // 2. Item Clause
        if (pkmn.strumento) {
            const strumentoChiave = pkmn.strumento.toLowerCase().replace(/[^a-z0-9]/g, '').trim();
            if (strumentoChiave && strumentoChiave !== 'none') {
                if (strumentiVisti.has(strumentoChiave)) {
                    errori.push(`[Item Clause] Lo strumento "${pkmn.strumento}" è duplicato su più Pokémon.`);
                } else {
                    strumentiVisti.add(strumentoChiave);
                }
            }
        }

        // 3. Sleep Clause limitata (Dark Void)
        if (pkmn.mosse && Array.isArray(pkmn.mosse)) {
            pkmn.mosse.forEach(mossa => {
                const mossaChiave = mossa.toLowerCase().replace(/[^a-z0-9]/g, '').trim();
                if (mossaChiave === 'darkvoid' || mossaChiave === 'vuototetro') {
                    errori.push(`[Mossa Bandita] [${pkmn.name}] ha la mossa "${mossa}", vietata perché addormenta ad area.`);
                }
            });
        }
    });

    return errori;
}

// --- 3. FUNZIONE DI SALVATAGGIO (Firebase) ---

async function salvaTeamSuFirebase() {
    const databaseRef = typeof db !== 'undefined' ? db.ref() : firebase.database().ref();
    const inputNome = document.getElementById('admin-team-name'); 
    const selectFormato = document.getElementById('admin-team-cat'); 
    const textareaShowdown = document.getElementById('showdown-input'); 

    if (!inputNome || !selectFormato || !textareaShowdown) return;

    const nomeTeamScelto = inputNome.value.trim();
    const idRegolamentoScelto = selectFormato.value;
    const testoShowdown = textareaShowdown.value.trim();

    if (!nomeTeamScelto || !idRegolamentoScelto || !testoShowdown) {
        alert("Compila tutti i campi.");
        return;
    }

    const listaPokemonEstratti = parseShowdown(testoShowdown); 
    const datiTeamDaSalvare = { nome: nomeTeamScelto, pokemon: listaPokemonEstratti, categoria: null, dataUltimaModifica: Date.now() };

    let regolamento = null;
    try {
        const allRegolamentiSnap = await databaseRef.child('regolamenti').once('value');
        allRegolamentiSnap.forEach(childSnapshot => {
            const datiFormato = childSnapshot.val();
            if (datiFormato.categoria && idRegolamentoScelto && datiFormato.categoria.toLowerCase() === idRegolamentoScelto.toLowerCase()) {
                regolamento = datiFormato; 
            }
        });
        if (!regolamento) { alert("Regolamento non trovato."); return; }
    } catch (error) { alert("Errore database: " + error.message); return; }

    const datiPokeAPI = await preparaDatiTeamPerValidazione(datiTeamDaSalvare.pokemon);
    const esitoValidazione = await validaTeamDinamico(datiPokeAPI, regolamento);

    if (!esitoValidazione.valido) {
        let outputErrori = `Il team non è legale:\n\n`;
        esitoValidazione.errori.forEach(err => outputErrori += `- ${err}\n`);
        alert(outputErrori);
        return;
    }

    try {
        const teamRef = databaseRef.child('players/didi/teams').push();
        datiTeamDaSalvare.categoria = regolamento.categoria; 
        await teamRef.set(datiTeamDaSalvare);
        alert("Team salvato con successo!");
        textareaShowdown.value = "";
        inputNome.value = "";
    } catch (error) { alert("Errore salvataggio: " + error.message); }
}

// Funzione per ELIMINARE
// CANCELLA uno specifico team
function cancellaTeamDaFirebase(teamId) {
    if (!teamId) return alert("ID team non trovato");



    // 2. Conferma finale
    if (confirm("Sei assolutamente sicuro? Questa operazione è irreversibile e il team sparirà dal Box.")) {
        // sia dinamico se la funzione è condivisa, o corretto per questa pagina.
        db.ref(`players/didi/teams/${teamId}`).remove()
            .then(() => {
                alert("Team eliminato correttamente!");
                chiudiTeamModal();
                // Ricarichiamo i dati per aggiornare la griglia dei team
                if (typeof caricaBox === "function") caricaBox();
            })
            .catch(e => {
                console.error("Errore durante l'eliminazione del team:", e);
                alert("Errore tecnico durante l'eliminazione.");
            });
    }
}

// MODIFICA uno specifico team
function caricaTeamPerModifica(teamId) {
    

    // --- Se autorizzato, procedi con il caricamento dei dati nel pannello ---
    const team = tuttiITeam.find(t => t.id === teamId);
    if (!team) return;

    document.getElementById('admin-team-name').value = team.nome;
    document.getElementById('admin-team-cat').value = team.categoria;
    
    let testoShowdown = "";
    team.pokemon.forEach(p => {
        testoShowdown += `${p.nome} @ ${p.strumento}\n`;
        testoShowdown += `Ability: ${p.abilita}\n`;
        testoShowdown += `EVs: ${p.evs}\n`;
        p.mosse.forEach(m => { if (m && m !== "-") testoShowdown += `- ${m}\n`; });
        testoShowdown += `\n`;
    });

    document.getElementById('showdown-input').value = testoShowdown.trim();
    
    // Salviamo l'ID per la modifica
    document.getElementById('admin-panel').dataset.editingId = teamId;
    
    document.getElementById('admin-panel').style.display = 'block';
}

// Forza la funzione a riconoscere il database
function sincronizzaCategorie() {
    const selectCat = document.getElementById('admin-team-cat'); 
    const selectFilter = document.getElementById('categoryFilter'); 
    
    console.log("Sincronizzazione categorie in corso...");

    db.ref('regolamenti').on('value', (snapshot) => {
        const data = snapshot.val();
        
        // Prepariamo le opzioni per il filtro (con "Tutte")
        let filterHtml = '<option value="">Category...</option>';
        // Prepariamo le opzioni per l'admin (senza "Tutte")
        let adminHtml = '<option value="">-- Choose Category --</option>';

        if (data) {
            Object.keys(data).forEach(key => {
                const nomeCat = data[key].categoria;
                const opt = `<option value="${nomeCat}">${nomeCat}</option>`;
                filterHtml += opt;
                adminHtml += opt;
            });
        }

        if (selectFilter) {
            const currentFilterVal = selectFilter.value;
            selectFilter.innerHTML = filterHtml;
            selectFilter.value = currentFilterVal; // Mantieni la selezione se l'utente stava filtrando
        }

        if (selectCat) {
            selectCat.innerHTML = adminHtml;
        }
        
        console.log("Categorie sincronizzate da Firebase.");
    });
}

// Avviala al caricamento della pagina
document.addEventListener('DOMContentLoaded', sincronizzaCategorie);

async function resetPasswordDalLogin() {
    const emailInput = document.getElementById('login-email');
    const emailValue = emailInput ? emailInput.value.trim() : "";

    // 1. Controlla se l'utente ha inserito l'email
    if (!emailValue) {
        alert("⚠️ Inserisci il tuo indirizzo email nel campo sopra per richiedere il reset della password.");
        if (emailInput) emailInput.focus();
        return;
    }

    // 2. Chiedi conferma
    if (!confirm(`Inviare il link per reimpostare la password a: ${emailValue}?`)) return;

    // 3. Attiva l'overlay della Pokeball se presente nella pagina di login
    const loader = document.getElementById('loading-overlay');
    if (loader) loader.classList.add('active');

    try {
        // 4. Chiamata a Firebase Auth tramite l'email passata dall'input
        await firebase.auth().sendPasswordResetEmail(emailValue);
        
        alert(`📧 Email di ripristino inviata!\n\nControlla la casella di posta (e la cartella Spam) all'indirizzo: ${emailValue}`);
        
    } catch (error) {
        console.error("Errore durante il reset della password dal login:", error);
        
        // Gestione degli errori tipici in fase di login
        if (error.code === 'auth/user-not-found') {
            alert("Errore: Questo indirizzo email non è registrato nel sistema.");
        } else if (error.code === 'auth/invalid-email') {
            alert("Errore: L'indirizzo email inserito non è valido.");
        } else if (error.code === 'auth/too-many-requests') {
            alert("Errore: Troppi tentativi di recente. Riprova tra qualche minuto.");
        } else {
            alert("Errore: " + error.message);
        }
    } finally {
        // 5. Spegni il loader
        if (loader) loader.classList.remove('active');
    }
}

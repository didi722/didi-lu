// ID stile Showdown: "Fake Out" / "fake-out" → "fakeout"
function idVoceBanlist(nome) {
    return String(nome || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

// true se la mossa/abilità è nella ban list del formato (categoria: 'mosse' | 'abilita')
function voceBannata(restrizioni, categoria, nome) {
    const lista = restrizioni?.[categoria]?.banned_list;
    if (!lista || lista.mode !== 'BANLIST' || !lista.value || !nome) return false;
    const id = idVoceBanlist(nome);
    const presente = (k) => Object.prototype.hasOwnProperty.call(lista.value, k);
    // "Hidden Power [Fire]" risulta bannata anche se in lista c'è solo "Hidden Power"
    return presente(id) || (id.startsWith('hiddenpower') && presente('hiddenpower'));
}

function eseguiValidazioneRestrizioniAvanzate(team, restrizioni, jsonDati, regolamento, inizialiUtente = { nome: "", cognome: "" }) { 
    const errori = [];

    const proprietaTierDinamica = regolamento?.battleStyle === "doubles" ? "doubles_tier" : "single_tier";

    if (restrizioni.pokemon) {
        Object.keys(restrizioni.pokemon).forEach(field => {
            const regola = restrizioni.pokemon[field];

            // 🔤 CONTROLLO RESTRIZIONE INIZIALE NOME/COGNOME (PLAYER_INITIAL)
                        if (field === 'name_starts') {
                // Tutti i Pokémon con la stessa iniziale (calcolata dal nome, vale anche se PokeAPI fallisce)
                if (regola.mode === "SAME_ACROSS_TEAM" || regola.value === "SAME_ACROSS_TEAM") {
                    const iniziali = team
                        .map(p => (p.species?.name || p.name || p.nome || p.pokemon || '').trim().charAt(0).toUpperCase())
                        .filter(Boolean);
                    const inizialiUniche = [...new Set(iniziali)];
                    if (inizialiUniche.length > 1) {
                        errori.push(`[Restrizione Nome] Tutti i Pokémon devono iniziare con la stessa lettera. Iniziali trovate: ${inizialiUniche.join(', ')}.`);
                    }
                    return;
                }

                if (regola.mode === "PLAYER_INITIAL") {
                    const initNome = (inizialiUtente.nome || "").toLowerCase();
                    const initCognome = (inizialiUtente.cognome || "").toLowerCase();

                    if (!initNome && !initCognome) {
                        errori.push(`[Restrizione Nome] Impossibile convalidare la regola sull'iniziale: né il nome né il cognome reale dell'utente sono stati trovati.`);
                    } else {
                        // Verifica se TUTTI i Pokémon iniziano con l'iniziale del NOME
                        const tuttiConInizialeNome = initNome && team.every(p => {
                            const nomePkm = (p.species?.name || p.name || p.nome || p.pokemon || '').toLowerCase().trim();
                            return nomePkm.startsWith(initNome);
                        });

                        // Verifica se TUTTI i Pokémon iniziano con l'iniziale del COGNOME
                        const tuttiConInizialeCognome = initCognome && team.every(p => {
                            const nomePkm = (p.species?.name || p.name || p.nome || p.pokemon || '').toLowerCase().trim();
                            return nomePkm.startsWith(initCognome);
                        });

                        // Se NON soddisfano completamente l'una O l'altra regola (team misto o con altre lettere)
                        if (!tuttiConInizialeNome && !tuttiConInizialeCognome) {
                            if (initNome && initCognome && initNome !== initCognome) {
                                errori.push(`[Restrizione Nome] Team non valido: tutti i Pokémon devono iniziare con l'iniziale del tuo Nome ("${initNome.toUpperCase()}") OPPURE tutti con l'iniziale del Cognome ("${initCognome.toUpperCase()}"). I team misti o con altre lettere non sono consentiti.`);
                            } else {
                                const letteraValida = (initNome || initCognome).toUpperCase();
                                errori.push(`[Restrizione Nome] Team non valido: tutti i Pokémon devono iniziare con la tua iniziale ("${letteraValida}").`);
                            }
                        }
                    }
                    return;
                }
            }

            if (regola.mode === "SAME_ACROSS_TEAM" || regola.value === "SAME_ACROSS_TEAM") {
                if (field === 'type') {
                    const listeTipiPerPokemon = team.map(p => {
                        const val = p[field];
                        if (!val) return [];
                        return Array.isArray(val) ? val : [val];
                    }).filter(arr => arr.length > 0);

                    if (listeTipiPerPokemon.length > 0) {
                        let tipiComuni = listeTipiPerPokemon[0];
                        for (let i = 1; i < listeTipiPerPokemon.length; i++) {
                            tipiComuni = tipiComuni.filter(tipo => listeTipiPerPokemon[i].includes(tipo));
                        }
                        if (tipiComuni.length === 0) {
                            const tuttiITipiMisti = [...new Set(listeTipiPerPokemon.flat())];
                            errori.push(`[Restrizione Monotype] Il team non condivide alcun tipo comune. Per essere legale nel formato Monotype, tutti i membri devono avere almeno un tipo condiviso. Tipi trovati: ${tuttiITipiMisti.join(', ')}.`);
                        }
                    }
                } else {
                    const valoriTeam = team.map(p => p[field]).filter(v => v !== undefined);
                    const valoriUnici = [...new Set(valoriTeam.flat())];

                    if (valoriUnici.length > 1) {
                        errori.push(`[Restrizione Team] I Pokémon violano la regola di uniformità per il campo "${field}". Trovati valori differenti: ${valoriUnici.join(', ')}.`);
                    }
                }
            } else if (regola.mode === "SPECIFIC") {
                team.forEach(p => {
                    if (p.erroreDati) return;
                    let valoreEffettivo = p[field];

                    if (field === 'tier' && jsonDati) {
                        const nomeChiave = p.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                        const datoGrezzo = jsonDati[nomeChiave];
                        
                        const stringaTier = (datoGrezzo && typeof datoGrezzo === 'object' 
                            ? datoGrezzo[proprietaTierDinamica] 
                            : datoGrezzo || "OU").toUpperCase();
                            
                        valoreEffettivo = ORDINE_TIER_REGOLE.indexOf(stringaTier);
                    }

                    if (field === 'is_legendary') {
                        if (regola.value === "Only Legendary" && !p.is_legendary) {
                            errori.push(`[${p.name}] Non valido: Il formato accetta esclusivamente Pokémon Leggendari.`);
                        }
                        return;
                    }
                    if (field === 'is_mythical') {
                        if (regola.value === "Only Mythical" && !p.is_mythical) {
                            errori.push(`[${p.name}] Non valido: Il formato accetta esclusivamente Pokémon Misteriosi.`);
                        }
                        return;
                    }

                    // 🔥 Restrizione sulle Megaevoluzioni
                    if (field === 'is_mega') {
                        if (regola.value === false || regola.value === "false") {
                            const nomeLower = p.name.toLowerCase();
                            const idStrumento = p.strumento ? p.strumento.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '') : '';
                            
                            const LISTA_MEGAPIETRE = [
                                "abomasnite", "absolite", "aerodactylite", "aggronite", "alakazamite", "altarianite", "ampharosite", 
                                "audinite", "banettite", "beedrillite", "blastoisinite", "blazikenite", "cameruptite", "charizardite-x", 
                                "charizardite-y", "diancite", "galladite", "garchompite", "gardevoirite", "gengarite", "glalitite", 
                                "gyaradosite", "heracronite", "houndoominite", "kangaskhanite", "latiasite", "latiosite", "lopunnite", 
                                "lucarionite", "manectricite", "mawilite", "medichamite", "metagrossite", "mewtwonite-x", "mewtwonite-y", 
                                "pidgeotite", "pinsirite", "sablenite", "salamencite", "sceptilite", "scizorite", "sharpedonite", 
                                "slowbronite", "steelixite", "swampertite", "tyranitarite", "venusaurite"
                            ];

                            const terminaInMega = nomeLower.endsWith('-mega') || nomeLower.includes('-mega-');
                            const haMegapietra = LISTA_MEGAPIETRE.includes(idStrumento);

                            if (terminaInMega || haMegapietra) {
                                errori.push(`[${p.name}] Non valido: Le Megaevoluzioni sono vietate in questo formato.`);
                            }
                        }
                        return;
                    }

                    if (!validaSingoloOperatore(valoreEffettivo, regola)) {
                        errori.push(`[${p.name}] Viola la restrizione "${field}": Valore registrato non conforme.`);
                    }
                });
            }
        });
    }

    // --- CONTROLLI STRUMENTI E MOSSE ---
    if (restrizioni.strumenti) {
        Object.keys(restrizioni.strumenti).forEach(field => {
            const regola = restrizioni.strumenti[field];
            if (regola.mode === "SAME_ACROSS_TEAM" || regola.value === "SAME_ACROSS_TEAM") {
                const valoriTeam = team.map(p => p.itemData?.[field]).filter(v => v !== undefined);
                const valoriUnici = [...new Set(valoriTeam)];
                if (valoriUnici.length > 1) errori.push(`[Restrizione Strumenti] Gli strumenti violano la regola di uniformità per il campo "${field}".`);
            } else if (regola.mode === "SPECIFIC") {
                team.forEach(p => {
                    if (!p.itemData || p.strumento === "None") return;
                    if (!validaSingoloOperatore(p.itemData[field], regola)) errori.push(`Lo strumento "${p.strumento}" equipaggiato su [${p.name}] viola la restrizione "${field}".`);
                });
            }
        });
    }
    if (restrizioni.mosse) {
        Object.keys(restrizioni.mosse).forEach(field => {
            const regola = restrizioni.mosse[field];
            if (regola.mode === "SAME_ACROSS_TEAM" || regola.value === "SAME_ACROSS_TEAM") {
                const tuttiIValoriMosse = team.flatMap(p => p.movesData ? p.movesData.map(m => m[field]) : []).filter(v => v !== undefined);
                const valoriUnici = [...new Set(tuttiIValoriMosse)];
                if (valoriUnici.length > 1) errori.push(`[Restrizione Mosse] Le mosse del team violano la regola di uniformità per il campo "${field}".`);
            } else if (regola.mode === "SPECIFIC") {
                team.forEach(p => {
                    if (!p.movesData) return;
                    p.movesData.forEach(mossa => {
                        if (!validaSingoloOperatore(mossa[field], regola)) errori.push(`La mossa "${mossa.name}" scelta per [${p.name}] viola la restrizione "${field}".`);
                    });
                });
            }
        });
    }

        // --- MOSSE E ABILITÀ BANNATE ---
    // Usa i nomi grezzi del team: funziona anche se PokeAPI non ha risposto
    team.forEach(p => {
        const mosse = Array.isArray(p.mosse) ? p.mosse : Object.values(p.mosse || {});
        mosse.filter(Boolean).forEach(nomeMossa => {
            if (voceBannata(restrizioni, 'mosse', nomeMossa)) {
                errori.push(`[${p.name}] La mossa "${nomeMossa}" è bannata in questo formato.`);
            }
        });
        if (voceBannata(restrizioni, 'abilita', p.abilita)) {
            errori.push(`[${p.name}] L'abilità "${p.abilita}" è bannata in questo formato.`);
        }
    });

    return errori;
}

function validaSingoloOperatore(valoreEffettivo, regola) {
    let target = regola.value;
    
    if (target === "true") target = true;
    if (target === "false") target = false;
    if (valoreEffettivo === "true") valoreEffettivo = true;
    if (valoreEffettivo === "false") valoreEffettivo = false;

    if (Array.isArray(valoreEffettivo)) {
        if (regola.operator === "equals") return valoreEffettivo.includes(target);
    }

    switch (regola.operator) {
        case "equals":
            return valoreEffettivo === target;
        case "lt":
            return valoreEffettivo < target;
        case "gt":
            return valoreEffettivo > target;
        case "lte":
            return valoreEffettivo <= target;
        case "gte":
            return valoreEffettivo >= target;
        case "between":
            return valoreEffettivo >= regola.min && valoreEffettivo <= regola.max;
        default:
            return valoreEffettivo === target;
    }
}


function validaTier(teamDatiPokeAPI, regolamento, jsonDati) {
    const errori = [];
    if (!regolamento.baseTier || regolamento.baseTier === "ALL" || !jsonDati) return errori;

    const tierMassima = regolamento.baseTier.toUpperCase();
    const proprietaTierDinamica = regolamento.battleStyle === "doubles" ? "doubles_tier" : "single_tier";
    const genLimite = regolamento.genRuleValue || "selezionata";

    // 🌟 HELPER PER ESTRAZIONE TIER (Supporto Little Cup per Singolo e Doppio)
    function ottieniTierDaOggetto(valoreGrezzo, proprietaDinamica, targetTier) {
        if (!valoreGrezzo) return "";
        if (typeof valoreGrezzo === 'string') return valoreGrezzo.toUpperCase().trim();

        const isTargetLC = targetTier && targetTier.toUpperCase().trim() === "LC";

        if (isTargetLC) {
            const singleTier = valoreGrezzo.single_tier ? String(valoreGrezzo.single_tier).toUpperCase().trim() : "";
            const doublesTier = valoreGrezzo.doubles_tier ? String(valoreGrezzo.doubles_tier).toUpperCase().trim() : "";
            if (singleTier === "LC" || doublesTier === "LC") {
                return "LC";
            }
        }

        const tier = valoreGrezzo[proprietaDinamica] || "";
        return String(tier).toUpperCase().trim();
    }

    // ================= LOGICA TIER: STANDARD =================
    if (tierMassima === "STANDARD") {
        let contatoreUber = 0;

        teamDatiPokeAPI.forEach(pkmn => {
            if (pkmn.erroreDati) return;
            
            const nomeChiave = pkmn.name.toLowerCase().replace(/[^a-z0-9]/g, '');
            let valoreGrezzo = jsonDati[nomeChiave];
            
            if (!valoreGrezzo && pkmn.name.includes('-')) {
                const nomeBase = pkmn.name.split('-')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                valoreGrezzo = jsonDati[nomeBase];
            }

            if (!valoreGrezzo) {
                console.warn(`Tier non trovata nel JSON per: ${pkmn.name}`);
                return;
            }

            const tierPokemon = ottieniTierDaOggetto(valoreGrezzo, proprietaTierDinamica, tierMassima);

            // Gestione "Illegal" (valido solo per formati 'within' in cui il pokemon è Dex-cut)
            if (tierPokemon === "ILLEGAL" || tierPokemon === "UNRELEASED") {
                errori.push(`[${pkmn.name}] non è disponibile o è bandito nella Gen ${genLimite}.`);
                return;
            }

            // Controllo Pokémon Misteriosi (Fix campo: is_mythical)
            const isMisterioso = pkmn.is_mythical || pkmn.isMythical || false;
            if (isMisterioso) {
                errori.push(`[${pkmn.name}] non è ammesso: i Pokémon Misteriosi sono vietati nel formato STANDARD.`);
            }

            if (tierPokemon === "AG") {
                errori.push(`[${pkmn.name}] è bandito: appartiene alla tier AG, non ammessa nel formato STANDARD.`);
            } else if (tierPokemon === "UBER" || tierPokemon === "UBERS") {
                contatoreUber++;
                if (contatoreUber > 2) {
                    errori.push(`[${pkmn.name}] non è legale: il formato STANDARD permette al massimo 2 Pokémon di tier UBER.`);
                }
            } else {
                const gerarchiaStandard = ["OU", "UUBL", "UU", "RUBL", "RU", "NUBL", "NU", "PU", "ZU", "NFE", "LC"];
                if (gerarchiaStandard.indexOf(tierPokemon) === -1) {
                    errori.push(`[${pkmn.name}] ha una tier (${tierPokemon}) non valida per il formato STANDARD.`);
                }
            }
        });
        return errori;
    }

    // ================= LOGICA TIER: GERARCHICA CLASSICA (OU, UU, LC, ecc.) =================
    const gerarchia = ["AG", "UBER", "UBERS", "OU", "UUBL", "UU", "RUBL", "RU", "NUBL", "NU", "PU", "ZU", "NFE", "LC"];
    const idxMax = gerarchia.indexOf(tierMassima);

    teamDatiPokeAPI.forEach(pkmn => {
        if (pkmn.erroreDati) return;
        
        const nomeChiave = pkmn.name.toLowerCase().replace(/[^a-z0-9]/g, '');
        let valoreGrezzo = jsonDati[nomeChiave];
        
        if (!valoreGrezzo && pkmn.name.includes('-')) {
            const nomeBase = pkmn.name.split('-')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
            valoreGrezzo = jsonDati[nomeBase];
        }

        if (!valoreGrezzo) return;

        const tierPokemon = ottieniTierDaOggetto(valoreGrezzo, proprietaTierDinamica, tierMassima);

        if (tierPokemon === "ILLEGAL" || tierPokemon === "UNRELEASED") {
            errori.push(`[${pkmn.name}] non è disponibile o è bandito nella Gen ${genLimite}.`);
            return;
        }

        const idxPkmn = gerarchia.indexOf(tierPokemon);
        
        if (idxMax !== -1 && idxPkmn !== -1 && idxPkmn < idxMax) {
            errori.push(`[${pkmn.name}] è bandito: è ${tierPokemon}, superiore al limite ${tierMassima}.`);
        }
    });
    return errori;
}

// Controlla le mosse di ogni Pokémon: niente doppioni (es. Protect due volte) e massimo 4
function validaMosseDuplicate(teamDatiPokeAPI) {
    const errori = [];

    teamDatiPokeAPI.forEach(pkmn => {
        if (!Array.isArray(pkmn.mosse)) return;

        const mosseReali = pkmn.mosse.filter(m => m && m.trim() && m.trim() !== '-');
        if (mosseReali.length > 4) {
            errori.push(`[${pkmn.name}] ha ${mosseReali.length} mosse: il massimo è 4.`);
        }

        const mosseViste = new Set();
        const giaSegnalate = new Set();

        mosseReali.forEach(mossa => {
            // "Hidden Power [Fire]" e "Hidden Power [Ice]" contano come la stessa mossa
            const chiave = mossa.replace(/\[.*?\]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!chiave) return;

            if (mosseViste.has(chiave) && !giaSegnalate.has(chiave)) {
                errori.push(`[${pkmn.name}] ha la mossa "${mossa}" più di una volta.`);
                giaSegnalate.add(chiave);
            }
            mosseViste.add(chiave);
        });
    });

    return errori;
}


function validaClauses(teamDatiPokeAPI, regolamento) {
    const errori = [];
    if (!regolamento.strutturaSito) return errori;

    const struttura = regolamento.strutturaSito.toLowerCase();
    if (struttura !== 'vgc' && struttura !== 'vcg' && struttura !== 'custom') {
        return errori;
    }

    const specieViste = new Set();
    const strumentiVisti = new Set();

    teamDatiPokeAPI.forEach(pkmn => {
        if (pkmn.erroreDati) return;

        // 1. Species Clause
        const nomeChiave = pkmn.name.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (specieViste.has(nomeChiave)) {
            errori.push(`[Species Clause] Non puoi avere più di un Pokémon della stessa specie: ${pkmn.name}.`);
        } else {
            specieViste.add(nomeChiave);
        }

        // 2. Item Clause
        if (pkmn.strumento) {
            const strumentoChiave = pkmn.strumento.toLowerCase().replace(/[^a-z0-9]/g, '').trim();
            if (strumentoChiave && strumentoChiave !== 'none') {
                if (strumentiVisti.has(strumentoChiave)) {
                    errori.push(`[Item Clause] Lo strumento "${pkmn.strumento}" è duplicato su più Pokémon.`);
                } else {
                    strumentiVisti.add(strumentoChiave);
                }
            }
        }

        // 3. Sleep Clause limitata (Dark Void)
        if (pkmn.mosse && Array.isArray(pkmn.mosse)) {
            pkmn.mosse.forEach(mossa => {
                const mossaChiave = mossa.toLowerCase().replace(/[^a-z0-9]/g, '').trim();
                if (mossaChiave === 'darkvoid' || mossaChiave === 'vuototetro') {
                    errori.push(`[Mossa Bandita] [${pkmn.name}] ha la mossa "${mossa}", vietata perché addormenta ad area.`);
                }
            });
        }
    });

    return errori;
}

}

// alert() blocca la pagina all'istante: prima togliamo il loader e aspettiamo che il browser
// lo ridisegni davvero, altrimenti il popup comparirebbe con la Pokéball che gira ancora dietro
async function avvisoSenzaLoader(messaggio) {
    nascondiLoaderSalvataggio();
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    alert(messaggio);
}

// Fa svanire dolcemente il loader sfocato e lo rimette com'era
async function sfumaLoaderSalvataggio() {
    const overlay = document.getElementById('poke-saving');
    if (!overlay || overlay.classList.contains('hidden')) return;

    overlay.style.transition = 'opacity 0.45s ease';
    overlay.style.opacity = '0';
    await attendi(450);

    overlay.classList.add('hidden');
    overlay.style.transition = '';
    overlay.style.opacity = '';
}

const attendi = ms => new Promise(resolve => setTimeout(resolve, ms));

// Salvataggio riuscito: la Pokéball si ferma e dondola come dopo una cattura, compare il messaggio,
// poi tutto sfuma nel grigio del loader iniziale, così il ricaricamento della pagina non si nota
async function mostraSuccessoSalvataggio(messaggio) {
    const overlay = document.getElementById('poke-saving');
    if (!overlay) return;

    const etichetta = overlay.querySelector('.loading-text');
    const avviso = overlay.querySelector('.saving-message');
    if (avviso) avviso.textContent = messaggio;
    if (etichetta) etichetta.textContent = 'Loading...'; // è invisibile ora, riappare nell'uscita

    overlay.classList.add('successo');
    await attendi(Math.max(1300, messaggio.length * 45)); // i messaggi lunghi restano più a lungo

    overlay.classList.add('in-uscita');
    await attendi(450); // durata della dissolvenza nel CSS
}

let salvataggioTeamInCorso = false; // evita doppi salvataggi (es. Invio premuto sul bottone durante l'attesa)

// Salva (o aggiorna) un team dal Team Builder: { nome, categoria (il formato), testo (in formato Showdown), editingId (null se è nuovo) }
async function salvaTeamSuFirebase({ nome, categoria, testo, editingId = null } = {}) {
    if (salvataggioTeamInCorso) return;

    const databaseRef = typeof db !== 'undefined' ? db.ref() : firebase.database().ref();

    // 🆕 RECUPERO DINAMICO DELL'UTENTE LOGGATO
    // Opzione A: Da Firebase Auth (es. UID o displayName)
    const currentUser = firebase.auth ? firebase.auth().currentUser : null;
    
    // Opzione B: variabile globale (fallback)
    const currentPlayerId = currentUser ? currentUser.uid : window.activePlayerId;

    if (!currentPlayerId) {
        alert("Error: No logged-in user or identified. Unable to save the team.");
        return;
    }

    const nomeTeamScelto = String(nome || '').trim();
    const idRegolamentoScelto = String(categoria || '');
    const testoShowdown = String(testo || '').trim();

    if (!nomeTeamScelto || !idRegolamentoScelto || !testoShowdown) {
        alert("Error: Please fill in all fields.");
        return;
    }

    // Copia SUBITO il testo per Showdown. Va fatto prima di qualsiasi await, finché il browser considera valido il click dell'utente.
    const copiaRiuscita = tbCopiaNegliAppunti(testoShowdown);

    // ⏳ Da qui in poi parte l'attesa (Firebase + PokeAPI): il loader compare subito
    salvataggioTeamInCorso = true;
    mostraLoaderSalvataggio(editingId ? 'Updating team...' : 'Saving team...');
    let staRicaricando = false;

    try {
        const listaPokemonEstratti = parseShowdown(testoShowdown);
           const datiTeamDaSalvare = { 
       nome: nomeTeamScelto, 
       pokemon: listaPokemonEstratti, 
       testoShowdown: testoShowdown,
       categoria: null, 
       dataUltimaModifica: Date.now() 
   };

        let regolamento = null;
        try {
            const allRegolamentiSnap = await databaseRef.child('regolamenti').once('value');
            allRegolamentiSnap.forEach(childSnapshot => {
                const datiFormato = childSnapshot.val();
                if (datiFormato.categoria && idRegolamentoScelto && datiFormato.categoria.toLowerCase() === idRegolamentoScelto.toLowerCase()) {
                    regolamento = datiFormato; 
                }
            });
            if (!regolamento) { await avvisoSenzaLoader("Error: Format not found."); return; }
        } catch (error) { await avvisoSenzaLoader("Error: Database error: " + error.message); return; }

const testoAdattato = adattaTestoAlFormato(testoShowdown, regolamento);
        datiTeamDaSalvare.pokemon = pulisciCampiPokemon(parseShowdown(testoAdattato), regolamento);
        datiTeamDaSalvare.testoShowdown = testoAdattato;

        let altriTeamEsistenti = [];
        const strutturaFormatoSalvataggio = String(regolamento.strutturaSito || 'custom').toLowerCase().trim();
        if (strutturaFormatoSalvataggio === 'custom' || strutturaFormatoSalvataggio === 'anything_goes') {
            try {
                const teamsSnap = await databaseRef.child(`players/${playerID}/teams`).once('value');
                teamsSnap.forEach(childSnap => {
                    const teamVal = childSnap.val();
                    if (teamVal.categoria && teamVal.categoria.toLowerCase() === regolamento.categoria.toLowerCase()) {
                        altriTeamEsistenti.push({ id: childSnap.key, ...teamVal });
                    }
                });
            } catch (e) {
                console.warn("Error: Error during retrieval of existing teams:", e);
            }
        }

        const datiPokeAPI = await preparaDatiTeamPerValidazione(datiTeamDaSalvare.pokemon);
        
        const oggettoTeamPerValidazione = {
            id: editingId,
            nome: nomeTeamScelto,
            pokemon: datiPokeAPI
        };
        
        const esitoValidazione = await validaTeamDinamico(oggettoTeamPerValidazione, regolamento, altriTeamEsistenti);

        if (!esitoValidazione.valido) {
            let outputErrori = `Il team non è legale:\n\n`;
            esitoValidazione.errori.forEach(err => outputErrori += `- ${err}\n`);
            await avvisoSenzaLoader(outputErrori);
            return;
        }

        datiTeamDaSalvare.categoria = regolamento.categoria; 

        if (editingId) {
            // 🆕 Salvataggio dinamico sul player loggato in caso di modifica
            datiTeamDaSalvare.id = editingId;
            await databaseRef.child(`players/${playerID}/teams/${editingId}`).update(datiTeamDaSalvare);
        } else {
            // 🆕 Salvataggio dinamico sul player loggato per nuovi team
            const newTeamRef = databaseRef.child(`players/${playerID}/teams`).push();
            datiTeamDaSalvare.id = newTeamRef.key;
            await newTeamRef.set(datiTeamDaSalvare);
        }

        // Messaggio finale, mostrato dentro il loader (niente popup del browser)
        const azione = editingId ? "Team updated" : "Team saved";
        const messaggio = (await copiaRiuscita)
            ? `${azione} and Showdown text copied to clipboard!`
            : `${azione}, but the Showdown text could not be copied.`;

        staRicaricando = true;
        await mostraSuccessoSalvataggio(messaggio);

        // Ora lo schermo è coperto dal grigio del loader: si può ricaricare senza che si veda

        // Con il builder ancora aperto il browser chiederebbe "Leave site?"
        const overlayBuilder = document.getElementById('tb-overlay');
        if (overlayBuilder) overlayBuilder.classList.remove('open');

        if (INCORPORATO) {
            // dentro il simulatore non si ricarica: lo si avvisa, e lui chiude la finestra
            notificaSimulatore('salvato', { id: editingId || '' });
            return;
        }
        location.reload();

    } catch (error) { 
        await avvisoSenzaLoader("Error: Error saving team: " + error.message); 
    } finally {
        // Rete di sicurezza: qualunque cosa vada storta, il loader non resta mai bloccato a schermo
        salvataggioTeamInCorso = false;
        if (!staRicaricando) nascondiLoaderSalvataggio();
    }
}

async function resetPasswordDalLogin() {
    const emailInput = document.getElementById('login-email');
    const emailValue = emailInput ? emailInput.value.trim() : "";

    // 1. Controlla se l'utente ha inserito l'email
    if (!emailValue) {
        alert("⚠️ Write you email address in the field above to request a password reset.");
        if (emailInput) emailInput.focus();
        return;
    }

    // 2. Chiedi conferma
    if (!confirm(`Send a password reset link to: ${emailValue}?`)) return;

    // 3. Attiva l'overlay della Pokeball se presente nella pagina di login
    const loader = document.getElementById('loading-overlay');
    if (loader) loader.classList.add('active');

    try {
        // 4. Chiamata a Firebase Auth tramite l'email passata dall'input
        await firebase.auth().sendPasswordResetEmail(emailValue);
        
        alert(`📧 Reset email sent!\n\nCheck your inbox (and spam folder) at: ${emailValue}`);
        
    } catch (error) {
        console.error("Error during password reset from login:", error);
        
        // Gestione degli errori tipici in fase di login
        if (error.code === 'auth/user-not-found') {
            alert("Error: This email address is not registered in the system.");
        } else if (error.code === 'auth/invalid-email') {
            alert("Error: The email address entered is not valid.");
        } else if (error.code === 'auth/too-many-requests') {
            alert("Error: Too many recent requests. Please try again in a few minutes.");
        } else {
            alert("Error: " + error.message);
        }
    } finally {
        // 5. Spegni il loader
        if (loader) loader.classList.remove('active');
    }
}

                selectInitial.innerHTML = `<option value="">-- Choose Initial --</option>`;

                arrayIniziali.forEach(lettera => {
                    const opt = document.createElement('option');
                    opt.value = lettera;
                    opt.textContent = `${lettera}   •   ${conteggiIniziali[lettera]}`;
                    selectInitial.appendChild(opt);
                });

                containerInitial.appendChild(labelInitial);
                containerInitial.appendChild(selectInitial);
                if (infoFilters) infoFilters.appendChild(containerInitial);

                selectInitial.addEventListener('change', async () => {
                    const letteraScelta = selectInitial.value;
                    if (!letteraScelta) {
                        if (grid) grid.innerHTML = `<div class="helper-placeholder-row">Please select an initial letter above.</div>`;
                        if (countSpan) countSpan.textContent = '0';
                        return;
                    }
                    await applicaFiltroIniziale(letteraScelta);
                });

                                // Modifica di un team del box: sceglie da sola l'iniziale che contiene i suoi Pokémon
                const specieTeam = tbSpecieTeamInModifica();
                if (specieTeam.length) {
                    let migliore = '', trovatiMax = 0;
                    arrayIniziali.forEach(lettera => {
                        const trovati = tbQuantiNellaLista(listePerIniziale[lettera], specieTeam);
                        if (trovati > trovatiMax) { trovatiMax = trovati; migliore = lettera; }
                    });
                    if (migliore) {
                        selectInitial.value = migliore;
                        await applicaFiltroIniziale(migliore);
                        return;
                    }
                }

                if (grid) grid.innerHTML = `<div class="helper-placeholder-row">Please select an initial letter above.</div>`;
                if (countSpan) countSpan.textContent = '0';
                return;
            }
        }

        // ----------------------------------------------------
        // GESTIONE RESTRIZIONI SAME_ACROSS_TEAM
        // ----------------------------------------------------
        const CHIAVI_BIOLOGICHE_VALIDE = [
            'is_legendary', 'is_mythical', 'height', 'weight', 'bst', 
            'types', 'highest_stat', 'num', 'type', 'color', 'egg_group',
            'hp', 'attack', 'defense', 'sp. attack', 'sp. defense', 'speed', 'shape',
            'base_friendship', 'habitat', 'name_length', 'name_starts', 
            'evolutions_count', 'evolution_stage'
        ];

        const restrizioniPokemon = regolamento.restrizioni?.pokemon;
        const chiaviSameAcross = [];

        if (restrizioniPokemon) {
            for (const chiave in restrizioniPokemon) {
                if (Object.prototype.hasOwnProperty.call(restrizioniPokemon, chiave)) {
                    if (!CHIAVI_BIOLOGICHE_VALIDE.includes(chiave)) continue;

                    const restrizione = restrizioniPokemon[chiave];
                    if (
                        restrizione?.mode === "SAME_ACROSS_TEAM" || 
                        restrizione?.value === "SAME_ACROSS_TEAM" || 
                        restrizione?.operator === "SAME_ACROSS_TEAM"
                    ) {
                        chiaviSameAcross.push(chiave);
                    }
                }
            }
        }

        if (chiaviSameAcross.length > 0) {
            const pokedexBase = window.pokedexBase;

            const regolamentoTemporaneo = JSON.parse(JSON.stringify(regolamento));
            chiaviSameAcross.forEach(chiave => {
                delete regolamentoTemporaneo.restrizioni.pokemon[chiave];
            });

            const risultatoFiltroBase = await generaListaPokémonPerFormato(regolamentoTemporaneo, jsonDati);
            if (selectedFormatId !== window.currentHelperFormatId) return;
            const poolPokemonBase = risultatoFiltroBase.pokemon;

            const vecchioContainer = infoFilters.querySelector('#helper-same-across-container');
            if (vecchioContainer) vecchioContainer.remove();

            const containerSelettori = document.createElement('div');
            containerSelettori.id = "helper-same-across-container";
            containerSelettori.style.cssText = "margin-top: 10px; display: flex; flex-direction: column; gap: 8px;";

            const scelteUtente = {};

                        const selectPerChiave = {};

            // Il Pokémon ha il valore scelto per questa caratteristica?
            const corrispondeAllaScelta = (pkm, chiave, sceltaUtente) => {
                const dettagliBiologici = pokedexBase[pkm.id.toLowerCase().trim()];
                if (!dettagliBiologici) return false;

                const chiaveProprietareale = (typeof normalizzaChiaveDatabase === 'function' ? normalizzaChiaveDatabase(chiave) : null) || chiave;
                let valPkm = dettagliBiologici[chiaveProprietareale];
                if (valPkm === undefined && dettagliBiologici.stats) {
                    valPkm = dettagliBiologici.stats[chiaveProprietareale];
                }
                if (valPkm === undefined) return false;

                if (chiaveProprietareale === 'height') {
                    valPkm = Math.round(valPkm * 100);
                }

                if (Array.isArray(valPkm)) {
                    return valPkm.map(v => String(v).toLowerCase().trim()).includes(String(sceltaUtente).toLowerCase().trim());
                }
                if (typeof valPkm === 'number') {
                    return Math.abs(parseFloat(valPkm) - parseFloat(sceltaUtente)) < 0.001;
                }
                return String(valPkm).toLowerCase().trim() === String(sceltaUtente).toLowerCase().trim();
            };

            chiaviSameAcross.forEach(chiave => {
                scelteUtente[chiave] = "";
                const conteggioValori = {};
                const chiaveProprietareale = (typeof normalizzaChiaveDatabase === 'function' ? normalizzaChiaveDatabase(chiave) : null) || chiave;

                poolPokemonBase.forEach(pkm => {
                    const dettagliBiologici = pokedexBase[pkm.id.toLowerCase().trim()];
                    if (dettagliBiologici) {
                        let val = dettagliBiologici[chiaveProprietareale];
                        if (val === undefined && dettagliBiologici.stats) {
                            val = dettagliBiologici.stats[chiaveProprietareale];
                        }

                        if (val !== undefined) {
                            if (chiaveProprietareale === 'height') {
                                val = Math.round(val * 100);
                            }

                            if (Array.isArray(val)) {
                                val.forEach(item => {
                                    const itemStr = String(item).trim();
                                    conteggioValori[itemStr] = (conteggioValori[itemStr] || 0) + 1;
                                });
                            } else {
                                const valStr = String(val).trim();
                                conteggioValori[valStr] = (conteggioValori[valStr] || 0) + 1;
                            }
                        }
                    }
                });

                const valoriOrdinati = Object.keys(conteggioValori).sort((a, b) => {
                    if (!isNaN(a) && !isNaN(b)) return Number(a) - Number(b);
                    return a.localeCompare(b);
                });

                const wrapperFiltro = document.createElement('div');
                wrapperFiltro.style.cssText = "display: flex; flex-direction: column; gap: 3px;";

                const configConfigurata = CONFIG_CHIAVI_HELPER[chiave] || { label: chiave.toUpperCase(), unit: "" };

                const label = document.createElement('label');
                label.style.cssText = "font-size: 0.85rem; font-weight: 700; color: #444;";
                label.textContent = `Each Pokémon in the Team must have the same ${configConfigurata.label}:`;

                const customSelect = document.createElement('select');
                customSelect.style.cssText = "padding: 6px; border: 3px solid var(--nb-ink, #000); border-radius: var(--nb-raggio, 0px); box-shadow: 5px 5px 0 solid black; font-size: 0.9rem; background: #fff;";
                customSelect.innerHTML = `<option value="">Select ${configConfigurata.label}...</option>`;

                valoriOrdinati.forEach(val => {
                    const opt = document.createElement('option');
                    opt.value = val;
                    
                    const unit = configConfigurata.unit;
                    const quantita = conteggioValori[val];
                    opt.textContent = `${val}${unit}   •   ${quantita}`;
                    
                    customSelect.appendChild(opt);
                });

                customSelect.addEventListener('change', () => {
                    scelteUtente[chiave] = customSelect.value;
                    aggiornaListaPokémonSameAcross();
                });

                                selectPerChiave[chiave] = customSelect;

                wrapperFiltro.appendChild(label);
                wrapperFiltro.appendChild(customSelect);
                containerSelettori.appendChild(wrapperFiltro);
            });

            if (infoFilters) infoFilters.appendChild(containerSelettori);

            function aggiornaListaPokémonSameAcross() {
                const tuttiSelezionati = chiaviSameAcross.every(chiave => scelteUtente[chiave] !== "");

                if (!tuttiSelezionati) {
                    if (grid) grid.innerHTML = `<div class="helper-placeholder-row"></div>`;
                    if (countSpan) countSpan.textContent = '0';
                    return;
                }

                                const poolFiltratoFinale = poolPokemonBase.filter(pkm =>
                    chiaviSameAcross.every(chiave => corrispondeAllaScelta(pkm, chiave, scelteUtente[chiave]))
                );

                renderizzaListaPiatta(poolFiltratoFinale);
                if (countSpan) countSpan.textContent = poolFiltratoFinale.length; 
            }

                        // Modifica di un team del box: preimposta i valori condivisi dai suoi Pokémon
            const specieTeam = tbSpecieTeamInModifica();
            if (specieTeam.length) {
                const membriDelTeam = poolPokemonBase.filter(pkm => tbQuantiNellaLista([pkm], specieTeam) > 0);
                chiaviSameAcross.forEach(chiave => {
                    const sel = selectPerChiave[chiave];
                    if (!sel) return;
                    let migliore = '', trovatiMax = 0;
                    Array.from(sel.options).forEach(opt => {
                        if (!opt.value) return;
                        const trovati = membriDelTeam.filter(pkm => corrispondeAllaScelta(pkm, chiave, opt.value)).length;
                        if (trovati > trovatiMax) { trovatiMax = trovati; migliore = opt.value; }
                    });
                    if (migliore) {
                        sel.value = migliore;
                        scelteUtente[chiave] = migliore;
                    }
                });
            }

            aggiornaListaPokémonSameAcross();
        } else {
            const risultatoFiltro = await generaListaPokémonPerFormato(regolamento, jsonDati);
            if (selectedFormatId !== window.currentHelperFormatId) return;

            if (risultatoFiltro.tipoLayout === "FLAT") {
                renderizzaListaPiatta(risultatoFiltro.pokemon);
                if (countSpan) countSpan.textContent = risultatoFiltro.pokemon.length;
            }
        }

    } catch (error) {
        console.error("Error running Format Helper:", error);
    }
}

async function generaListaPokémonPerFormato(regolamento, jsonDati) {
    // 🌀 1. GESTIONE DIRETTA DEL CARICAMENTO (LOADER)
    const grid = document.getElementById('helper-pkm-grid');
    const countSpan = document.getElementById('helper-count');
    
    if (grid) {
        if (countSpan) countSpan.textContent = "...";
        
        // Inseriamo la Pokéball rotante Neubrutalist nella griglia
        grid.innerHTML = `
            <div class="pokeball-loader-container">
                <div class="pokeball-spinner-builder"></div>
                <div class="loading-text-builder">Loading Pokédex...</div>
            </div>
        `;

        // Se lo stile CSS del loader non esiste ancora nella pagina, lo iniettiamo dinamicamente
        if (!document.getElementById('neubrutalist-loader-styles')) {
            const style = document.createElement('style');
            style.id = 'neubrutalist-loader-styles';
            style.innerHTML = `
                .pokeball-loader-container {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    padding: 80px 20px;
                    grid-column: 1 / -1;
                    width: 100%;
                }
                .pokeball-spinner-builder {
                    width: 60px;
                    height: 60px;
                    background: linear-gradient(to bottom, #ff3e3e 50%, #ffffff 50%);
                    border: 5px solid var(--nb-ink, #000);
                    border-radius: 50%;
                    position: relative;
                    animation: spinPokeball 1.1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
                }
                .pokeball-spinner-builder::before {
                    content: "";
                    position: absolute;
                    height: 6px;
                    width: 100%;
                    background: #000000;
                    top: 50%;
                    left: 0;
                    transform: translateY(-50%);
                }
                .pokeball-spinner-builder::after {
                    content: "";
                    position: absolute;
                    width: 16px;
                    height: 16px;
                    background: #ffffff;
                    border: 5px solid var(--nb-ink, #000);
                    border-radius: 50%;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                }
                .loading-text-builder {
                    margin-top: 20px;
                    font-size: 1.1rem;
                    font-weight: 900;
                    text-transform: uppercase;
                    letter-spacing: 2px;
                    color: #000000;
                }
                @keyframes spinPokeball {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
            `;
            document.head.appendChild(style);
        }
    }

    if (!jsonDati) {
        return { tipoLayout: "FLAT", pokemon: [] };
    }

    const genLimite = parseInt(regolamento.genRuleValue);
    const restrizioniPokemon = regolamento.restrizioni?.pokemon;
    let pokedexBase = window.pokedexBase || null;

    // 👤 RECUPERO DEL VERO NOME (real_name) DAL NODO PLAYERS/{PLAYERKEY}/INFO/REAL_NAME
    let inizialeNomeUtente = "";
    const regolaNameStarts = restrizioniPokemon?.name_starts;

    if (regolaNameStarts) {
        if (regolaNameStarts.mode === "PLAYER_INITIAL") {
            try {
                const authObj = typeof firebase !== 'undefined' && firebase.auth ? firebase.auth() : (typeof auth !== 'undefined' ? auth : null);
                const currentUser = authObj?.currentUser;
                let realNameEstratto = "";

                if (currentUser && typeof db !== 'undefined') {
                    const userSnap = await db.ref(`users/${currentUser.uid}`).once('value');
                    const userData = userSnap.val() || {};

                    const playerKey = userData.name || currentUser.displayName || currentUser.uid;

                    if (playerKey) {
                        let playerSnap = await db.ref(`players/${playerKey}/info/real_name`).once('value');
                        
                        if (!playerSnap.exists() || !playerSnap.val()) {
                            playerSnap = await db.ref(`players/${playerKey.toLowerCase()}/info/real_name`).once('value');
                        }

                        if (playerSnap.exists() && playerSnap.val()) {
                            realNameEstratto = playerSnap.val();
                        }
                    }

                    if (!realNameEstratto && userData.real_name) {
                        realNameEstratto = userData.real_name;
                    }
                }

                if (!realNameEstratto) {
                    realNameEstratto = window.currentUserRealName || 
                                       window.currentPlayer?.info?.real_name || 
                                       window.currentUser?.real_name || "";
                }

                if (realNameEstratto && typeof realNameEstratto === 'string') {
                    inizialeNomeUtente = realNameEstratto.trim().charAt(0).toLowerCase();
                } else {
                    console.warn("[Helper] Attenzione: 'real_name' non trovato per l'utente loggato.");
                }

            } catch (errUser) {
                console.error("[Helper] Errore durante il recupero di 'real_name':", errUser);
            }
        } else if (regolaNameStarts.value) {
            inizialeNomeUtente = String(regolaNameStarts.value).trim().charAt(0).toLowerCase();
        }
    }

    const deveCaricarePokedexBase = (restrizioniPokemon && Object.keys(restrizioniPokemon).length > 0) || (regolamento.strutturaSito === "custom");

    if (deveCaricarePokedexBase && !pokedexBase) {
        try {
            const resBase = await fetch('pkm-gens/pokedex_base.json');
            const pokedexBaseRaw = await resBase.json();
            pokedexBase = {};
            Object.keys(pokedexBaseRaw).forEach(key => {
                pokedexBase[key.toLowerCase().trim()] = pokedexBaseRaw[key];
            });
            window.pokedexBase = pokedexBase;
        } catch (e) {
            console.error("[Helper] Error loading pkm-gens/pokedex_base.json:", e);
        }
    }

    // Il calcolo vero e proprio sta in formato-pool.js: è lo stesso che usa la CPU per scegliere i suoi team.
    // Il file già scaricato dal chiamante non si riscarica.
    const cache = {};
    cache[regolamento.genRuleType === "within" ? `pkm-gens/gen${genLimite}.json` : 'pkm-gens/natdex-tiers.json'] = jsonDati;
    return FormatoPool.caricaPool(regolamento, percorso => fetch(percorso).then(r => r.json()), {
        pokedexBase,
        inizialeNome: inizialeNomeUtente,
        cache
    });
}

function renderizzaListaPiatta(pokemonList) {
    const grid = document.getElementById('helper-pkm-grid');
    const countSpan = document.getElementById('helper-count');

    if (!grid) return;

    // 1. Salviamo la lista originale come proprietà del nodo DOM per accedervi durante i filtri
    grid.originalPokemonList = pokemonList;
        aggiornaBottoneBuildTeam(pokemonList);

    // 2. Creazione dinamica della barra dei controlli (Cerca + Ordina) SE non esiste già
    let controlsContainer = document.getElementById('helper-pkm-controls');
    if (!controlsContainer) {
        controlsContainer = document.createElement('div');
        controlsContainer.id = 'helper-pkm-controls';
        controlsContainer.className = 'helper-controls-container';
        
        // Stile Neubrutalist compatto ottimizzato per l'allineamento nella barra superiore
        controlsContainer.style.cssText = `
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 450px;
            margin: 0 15px;
            flex-wrap: nowrap;
            align-items: center;
        `;

        controlsContainer.innerHTML = `
            <input type="text" id="helper-search-bar" placeholder="🔍 Search Pokémon or Ability..." style="
                flex: 1;
                min-width: 130px;
                padding: 6px 12px;
                border: 3px solid var(--nb-ink, #000);
                border-radius: 0;
                font-family: inherit;
                font-size: 0.9rem;
                box-shadow: calc(3px * var(--nb-kx, 1)) calc(3px * var(--nb-ky, 1)) calc(8px * var(--nb-bk, 0)) var(--nb-shcol, #000);
                outline: none;
                background: white;
            ">
            <select id="helper-sort-select" style="
                padding: 6px 10px;
                border: 3px solid var(--nb-ink, #000);
                border-radius: 0;
                font-family: inherit;
                font-size: 0.9rem;
                box-shadow: calc(3px * var(--nb-kx, 1)) calc(3px * var(--nb-ky, 1)) calc(8px * var(--nb-bk, 0)) var(--nb-shcol, #000);
                background: white;
                cursor: pointer;
                outline: none;
            ">
                <optgroup label="Pokémon">
                <option value="num-asc">Pokédex N°</option>
                <option value="alpha-asc">Alphabetical (A-Z)</option>
                <option value="alpha-desc">Alphabetical (Z-A)</option>
                </optgroup>
                <optgroup label="Best stat">
                    <option value="bst-desc" selected>BST</option>
                    <option value="stat|hp|desc">HP</option>
                    <option value="stat|attack|desc">Attack</option>
                    <option value="stat|defense|desc">Defense</option>
                    <option value="stat|sp. attack|desc">Sp. Attack</option>
                    <option value="stat|sp. defense|desc">Sp. Defense</option>
                    <option value="stat|speed|desc">Speed</option>
                </optgroup>
            </select>
        `;

        // 🌟 POSIZIONAMENTO AL LIVELLO SUPERIORE (Tra POKÉMONS e Found: X)
        const badge = document.getElementById('helper-clause-badge');
        if (badge && badge.parentNode) {
            badge.parentNode.insertBefore(controlsContainer, badge);
        } else {
            // Fallback nel caso in cui il badge non venga trovato
            grid.parentNode.insertBefore(controlsContainer, grid);
        }

        // Listener per reagire istantaneamente ai cambi di input o select
        document.getElementById('helper-search-bar').addEventListener('input', applicaFiltriEOrdinamento);
        document.getElementById('helper-sort-select').addEventListener('change', applicaFiltriEOrdinamento);
    } else {
        // Se cambiamo formato o ricarichiamo la lista, resettiamo i campi ai valori di default
        document.getElementById('helper-search-bar').value = '';
        document.getElementById('helper-sort-select').value = 'bst-desc';
    }

    // --- FUNZIONI UTILITY DI SUPPORTO PER L'ORDINAMENTO ---
    const CHIAVI_STATS = ['hp', 'attack', 'defense', 'sp. attack', 'sp. defense', 'speed'];

    // Unico punto di lookup nel pokedexBase (usato da sort e tooltip)
    function getInfoPkm(pkm) {
        if (pkm && pkm.stats) return pkm;
        if (!window.pokedexBase) return null;
        return window.pokedexBase[String(pkm.id).toLowerCase().trim()]
            || window.pokedexBase[String(pkm.name).toLowerCase().trim()]
            || null;
    }

    function getStat(pkm, chiave) {
        const info = getInfoPkm(pkm);
        return (info && info.stats && info.stats[chiave]) || 0;
    }

    function calcolaBST(pkm) {
        return CHIAVI_STATS.reduce((tot, chiave) => tot + getStat(pkm, chiave), 0);
    }

    function getPokedexNum(pkm) {
        if (pkm.num !== undefined) return pkm.num;
        const info = getInfoPkm(pkm);
        return info && info.num !== undefined ? info.num : 9999;
    }

    // --- LOGICA CORE DI FILTRAGGIO, ORDINAMENTO E RENDERING ---
    function applicaFiltriEOrdinamento() {
        const query = document.getElementById('helper-search-bar').value.toLowerCase().trim();
        const criterioSort = document.getElementById('helper-sort-select').value;

        // A. FILTRAGGIO SU LISTA ORIGINALE
        // A. FILTRAGGIO SU LISTA ORIGINALE (nome o abilità)
let listaFiltrata = grid.originalPokemonList.filter(pkm => pokemonCorrispondeRicerca(pkm, query));

        // B. ORDINAMENTO DINAMICO
        listaFiltrata.sort((a, b) => {
            // Ordinamento per singola stat (formato: "stat|chiave|direzione")
            if (criterioSort.startsWith('stat|')) {
                const [, chiave, direzione] = criterioSort.split('|');
                const diff = getStat(a, chiave) - getStat(b, chiave);
                const risultato = direzione === 'asc' ? diff : -diff;
                // A parità di stat, ordine di Pokédex
                return risultato || getPokedexNum(a) - getPokedexNum(b);
            }

            switch (criterioSort) {
                case 'num-asc':
                    return getPokedexNum(a) - getPokedexNum(b);
                case 'alpha-asc':
                    return a.name.localeCompare(b.name);
                case 'alpha-desc':
                    return b.name.localeCompare(a.name);
                case 'bst-desc':
                    return calcolaBST(b) - calcolaBST(a);
                case 'bst-asc':
                    return calcolaBST(a) - calcolaBST(b);
                default:
                    return 0;
            }
        });

        // Aggiorna il contatore in tempo reale basandosi sui risultati visibili
        if (countSpan) {
            countSpan.textContent = listaFiltrata.length;
        }

        grid.innerHTML = '';

        if (listaFiltrata.length === 0) {
            grid.innerHTML = `<div class="helper-placeholder-row">No matching Pokémon found.</div>`;
            return;
        }

        // Configurato costanti globali per il Tooltip (Invariate)
        const COLORI_TIPI = {
            normal: '#aaaa99', fire: '#ff4422', water: '#3399ff', electric: '#ffcc33',
            grass: '#77cc55', ice: '#66ccff', fighting: '#bb5544', poison: '#aa5599',
            ground: '#ddbb55', flying: '#8899ff', psychic: '#ff5599', bug: '#aabb22',
            rock: '#bbaa66', ghost: '#6666bb', dragon: '#7766ee', dark: '#775544',
            steel: '#aaaabb', fairy: '#ee99ee'
        };

        const MAPPA_STATS = {
            'hp': 'HP', 'attack': 'ATK', 'defense': 'DEF',
            'sp. attack': 'SPA', 'sp. defense': 'SPD', 'speed': 'SPE'
        };

        let tooltip = document.getElementById('global-neubrutalist-tooltip');
        if (!tooltip) {
            tooltip = document.createElement('div');
            tooltip.id = 'global-neubrutalist-tooltip';
            tooltip.className = 'neubrutalist-tooltip';
            document.body.appendChild(tooltip);
        }

        function aggiustaPosizioneTooltip(cardElement, tooltipElement) {
            const rect = cardElement.getBoundingClientRect();
            const scrollY = window.scrollY;
            const scrollX = window.scrollX;

            const cardCenter = rect.left + scrollX + (rect.width / 2);
            const tooltipWidth = tooltipElement.offsetWidth || 245;
            let tooltipLeft = cardCenter - (tooltipWidth / 2);

            if (tooltipLeft < 10) tooltipLeft = 10;
            if (tooltipLeft + tooltipWidth > window.innerWidth - 10) {
                tooltipLeft = window.innerWidth - tooltipWidth - 10;
            }
            tooltipElement.style.left = `${tooltipLeft}px`;

            const tooltipHeight = tooltipElement.offsetHeight;
            const spazioSotto = window.innerHeight - rect.bottom;
            const spazioSopra = rect.top;

            const rotazioneCorrente = tooltipElement.dataset.rotation || '0deg';
            tooltipElement.style.transform = `rotate(${rotazioneCorrente})`;

            if (spazioSotto >= tooltipHeight) {
                tooltipElement.style.top = `${rect.bottom + scrollY + 8}px`;

                tooltipElement.style.top = `${rect.top + scrollY - 8 - tooltipHeight}px`;

// --- CARICAMENTO DATI SHOWDOWN (script caricati uno alla volta) ------
let tbCodaScript = Promise.resolve();
const tbPromesseDati = {};

function tbCaricaDatoShowdown(file, nomeGlobale) {
    if (tbPromesseDati[nomeGlobale]) return tbPromesseDati[nomeGlobale];

    const promessa = tbCodaScript.then(() => new Promise((resolve, reject) => {
        const exportsPrecedente = window.exports;
        const contenitore = {};
        window.exports = contenitore; // i file di Showdown scrivono in "exports.BattleXxx"

        const ripristina = () => {
            if (exportsPrecedente === undefined) {
                try { delete window.exports; } catch (e) { window.exports = undefined; }
            } else {
                window.exports = exportsPrecedente;
            }
        };

        const script = document.createElement('script');
        script.src = TB_URL_DATI_SHOWDOWN + file;
        script.onload = () => {
            ripristina();
            const dati = contenitore[nomeGlobale];
            dati ? resolve(dati) : reject(new Error(`${file}: data not found`));
        };
        script.onerror = () => {
            ripristina();
            reject(new Error(`Unable to load ${file}`));
        };
        document.head.appendChild(script);
    }));

    tbCodaScript = promessa.catch(() => {});
    tbPromesseDati[nomeGlobale] = promessa.catch(err => {
        delete tbPromesseDati[nomeGlobale]; // riprova al prossimo tentativo
        throw err;
    });
    return tbPromesseDati[nomeGlobale];
}

// --- TIPI NEL TOOLTIP DELLA LISTA -----------------------------------
function tbNormalizzaTipi(valore) {
    if (!valore) return [];
    if (typeof valore === 'string') return valore.split(/[\/,]/).map(t => t.trim()).filter(Boolean);
    if (Array.isArray(valore)) return valore.map(t => String(t).trim()).filter(Boolean);
    return [];
}

function tbTipiSincroni(pkm, infoPkm) {
    const candidati = [];
    if (infoPkm) candidati.push(infoPkm.type || infoPkm.types);
    if (pkm) candidati.push(pkm.type || pkm.types);

    if (window.pokedexBase && pkm) {
        const base = window.pokedexBase[String(pkm.id).toLowerCase().trim()] ||
                     window.pokedexBase[String(pkm.name).toLowerCase().trim()];
        if (base) candidati.push(base.type || base.types);
    }

    if (tbDex.pokedex && pkm) {
        const sp = tbDex.pokedex[tbToID(pkm.id)] || tbDex.pokedex[tbToID(pkm.name)];
        if (sp) candidati.push(sp.types);
    }

    for (const c of candidati) {
        const tipi = tbNormalizzaTipi(c);
        if (tipi.length) return tipi;
    }
    return [];
}

// Se nei dati locali mancano i tipi, li prende dal Pokédex di Showdown e aggiorna il tooltip

                <div class="tb-bubble" id="tb-save-bubble"></div>
            </div>
            <div class="tb-cov-wrap">
                <span class="tb-cov-tag" id="tb-cov-tag">Team weaknesses</span>
                <div class="tb-cov-tooltip"><div class="tb-cov-box" id="tb-cov-box"></div></div>
            </div>
        </div>`;
}

// --- CONTROLLI DI SUPPORTO -------------------------------------------
function tbNumeriUsati(escludiIndice) {
    const numeri = new Set();
    tbStato.slot.forEach((s, i) => {
        if (!s || i === escludiIndice) return;
        const base = tbSpecieBase(tbSpecie(s.specieId));
        if (base) numeri.add(base.num);
    });
    return numeri;
}

function tbOggettiUsati(escludiIndice) {
    const usati = new Set();
    tbStato.slot.forEach((s, i) => {
        if (s && i !== escludiIndice && s.oggetto) usati.add(s.oggetto);
    });
    return usati;
}

function tbCalcolaStat(chiave, base, ev, iv, natura) {
    const L = tbStato.livello;
    if (chiave === 'hp') {
        if (base === 1) return 1; // Shedinja
        return Math.floor((2 * base + iv + Math.floor(ev / 4)) * L / 100) + L + 10;
    }
    const effetto = TB_NATURE[natura];
    let mod = 1;
    if (effetto && effetto[0] === chiave) mod = 1.1;
    if (effetto && effetto[1] === chiave) mod = 0.9;
    return Math.floor((Math.floor((2 * base + iv + Math.floor(ev / 4)) * L / 100) + 5) * mod);
}

// --- APERTURA / CHIUSURA ---------------------------------------------
function tbCreaOverlay() {
    let overlay = document.getElementById('tb-overlay');
    if (overlay) return overlay;

    overlay = document.createElement('div');
    overlay.id = 'tb-overlay';
    overlay.className = 'tb-overlay';
    overlay.innerHTML = `
        <div class="tb-wrapper" role="dialog" aria-modal="true" aria-labelledby="tb-title">
            <div class="tb-header">
                <h2 id="tb-title" class="tb-title">Build Team</h2>
                <span id="tb-format-badge" class="tb-format-badge"></span>
<button type="button" class="tb-close" onclick="tbChiediChiusura()" aria-label="Close">&times;</button>            </div>
            <div id="tb-slots" class="tb-slots"></div>
            <div id="tb-body" class="tb-body"></div>
        </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) tbChiediChiusura();    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('open') && !tbCombo.input) tbChiediChiusura();    });

    return overlay;
}

async function apriTeamBuilder() {
    const grid = document.getElementById('helper-pkm-grid');
    const lista = grid && Array.isArray(grid.originalPokemonList) ? grid.originalPokemonList : [];
    const formatId = window.currentHelperFormatId;

    if (!formatId || lista.length === 0) {
        alert("Choose a format with at least one available Pokémon first.");
        return;
    }

    const overlay = tbCreaOverlay();
    overlay.classList.add('open');

    // Nasconde l'helper mentre il builder è aperto (riappare alla chiusura)
    const helper = document.getElementById('helper-modal-overlay');
    if (helper && helper.style.display !== 'none') {
        helper.dataset.nascostoDaBuilder = '1';
        helper.style.display = 'none';
    }

    document.getElementById('tb-slots').innerHTML = '';
    document.getElementById('tb-body').innerHTML = `
        <div class="tb-loading">
            <div class="tb-loading-ball"></div>
            <span>Loading moves, abilities and items...</span>
        </div>`;

    try {
        const [regSnap] = await Promise.all([
            db.ref(`regolamenti/${formatId}`).once('value'),
            tbCaricaTuttiDati()
        ]);
        const regolamento = regSnap.val();
        if (!regolamento) throw new Error('Format not found.');

        const firma = `${formatId}|${lista.length}|${lista.map(p => p.id).join(',')}`;
        if (tbStato.firma !== firma) {
            tbInizializzaStato(firma, regolamento, lista);
        } else {
            tbStato.regolamento = regolamento;
        }

        tbRender();
    } catch (err) {
        console.error('[Team Builder]', err);
        document.getElementById('tb-body').innerHTML = `
            <div class="tb-loading">
                <span>❌ Could not load Pokémon data (${tbEsc(err.message)}).</span>
                <button type="button" class="tb-btn-small" onclick="apriTeamBuilder()">Try again</button>
            </div>`;
    }
}

function chiudiTeamBuilder() {
    const overlay = document.getElementById('tb-overlay');
    if (overlay) overlay.classList.remove('open');

    const helper = document.getElementById('helper-modal-overlay');
    if (helper && helper.dataset.nascostoDaBuilder === '1') {
        helper.style.display = 'flex';
        delete helper.dataset.nascostoDaBuilder;
    }
}

// Il builder è aperto e nel team c'è almeno un Pokémon
function tbCiSonoModifiche() {
    const overlay = document.getElementById('tb-overlay');
    return !!(overlay && overlay.classList.contains('open') && tbStato.slot.some(Boolean));
}

// X, clic fuori dal builder o Esc: chiede conferma se il team non è vuoto
function tbChiediChiusura() {
    if (tbCiSonoModifiche() &&
        !confirm("Are you sure you want to close the Team Builder? Your changes to the team will not be saved.")) {
        return;
    }
    tbStato.firma = ''; // alla prossima apertura il team riparte da zero
    chiudiTeamBuilder();
}

// Ricarica, chiusura della scheda, frecce avanti/indietro del browser
window.addEventListener('beforeunload', (e) => {
    if (!tbCiSonoModifiche()) return;
    e.preventDefault();
    e.returnValue = '';
});

function tbInizializzaStato(firma, regolamento, lista) {
    const struttura = String(regolamento.strutturaSito || 'custom').toLowerCase().trim();
    const gen = parseInt(regolamento.genRuleValue, 10) ||
                parseInt(String(regolamento.vgcGen || '').replace(/\D/g, ''), 10) || 9;

    tbStato.firma = firma;
    tbStato.regolamento = regolamento;
    tbStato.gen = gen;
    tbStato.within = regolamento.genRuleType === 'within' || struttura === 'vgc';
    tbStato.struttura = struttura;
    tbStato.clausole = ['custom', 'vgc', 'vcg'].includes(struttura);
    tbStato.livello = struttura === 'vgc' ? 50 : (String(regolamento.baseTier || '').toUpperCase() === 'LC' ? 5 : 100);
    tbStato.slot = [null, null, null, null, null, null];
    tbStato.attivo = 0;
    tbStato.cacheMosse = {};
    tbStato.oggetti = null;

    const visti = new Set();
    tbStato.pool = lista.map(pkm => {
        const candidati = [pkm.id, pkm.name, pkm.spriteId].map(tbToID).filter(Boolean);
        const specieId = candidati.find(c => tbSpecie(c)) || candidati[0];
        const sp = tbSpecie(specieId);
        return {
            specieId,
            sp,
            nome: tbNomeBello(sp, pkm.name || pkm.id),
            bst: tbBST(sp),
            spriteId: pkm.spriteId || (sp ? tbSpriteId(sp) : specieId)
        };
    }).filter(v => {
        if (!v.specieId || visti.has(v.specieId)) return false;
        visti.add(v.specieId);
        return true;
    }).sort((a, b) => (b.bst - a.bst) || a.nome.localeCompare(b.nome)); // dal BST più alto
}

const TB_MAPPA_STATS = {
    'hp': 'HP', 'attack': 'ATK', 'defense': 'DEF',
    'sp. attack': 'SPA', 'sp. defense': 'SPD', 'speed': 'SPE'
};

let tbTooltipTimer = null;

function tbGetTooltip() {
    let tooltip = document.getElementById('global-neubrutalist-tooltip');
    if (!tooltip) {
        tooltip = document.createElement('div');
        tooltip.id = 'global-neubrutalist-tooltip';
        tooltip.className = 'neubrutalist-tooltip';
        document.body.appendChild(tooltip);
    }
    return tooltip;
}

function tbPosizionaTooltip(cardElement, tooltipElement) {
    const rect = cardElement.getBoundingClientRect();
    const scrollY = window.scrollY;
    const scrollX = window.scrollX;

    const cardCenter = rect.left + scrollX + (rect.width / 2);
    const tooltipWidth = tooltipElement.offsetWidth || 245;
    let tooltipLeft = cardCenter - (tooltipWidth / 2);

    if (tooltipLeft < 10) tooltipLeft = 10;
    if (tooltipLeft + tooltipWidth > window.innerWidth - 10) {
        tooltipLeft = window.innerWidth - tooltipWidth - 10;
    }
    tooltipElement.style.left = `${tooltipLeft}px`;

    const tooltipHeight = tooltipElement.offsetHeight;
    const spazioSotto = window.innerHeight - rect.bottom;
    const spazioSopra = rect.top;

    const rotazioneCorrente = tooltipElement.dataset.rotation || '0deg';
    tooltipElement.style.transform = `rotate(${rotazioneCorrente})`;

    if (spazioSotto >= tooltipHeight) {
        tooltipElement.style.top = `${rect.bottom + scrollY + 8}px`;
    } else if (spazioSopra >= tooltipHeight) {
        tooltipElement.style.top = `${rect.top + scrollY - 8 - tooltipHeight}px`;
    } else if (spazioSotto > spazioSopra) {
        tooltipElement.style.top = `${rect.bottom + scrollY + 8}px`;
    } else {
        tooltipElement.style.top = `${rect.top + scrollY - 8 - tooltipHeight}px`;
    }
}

// Riempie e mostra il tooltip. pkm = { id, name }
function tbMostraTooltip(pkm, card, infoPkm) {
    const tooltip = tbGetTooltip();

    tooltip.dataset.currentId = pkm.id;
    tooltip.dataset.rotation = `${(Math.random() * 8 - 4).toFixed(2)}deg`;
    tooltip.style.display = 'block';
    tooltip.style.opacity = '1';

    if (!infoPkm || !infoPkm.stats) {
        tooltip.innerHTML = `<div class="neubrutalist-loading" style="color:red; font-weight:bold; padding:10px;">DATA NOT FOUND</div>`;
        tbPosizionaTooltip(card, tooltip);
        return;
    }

    const arrayTipi = tbTipiSincroni(pkm, infoPkm);
    const htmlTipi = arrayTipi.map(t => {
        const tipoLower = t.toLowerCase().trim();
        const colore = TB_COLORI_TIPI[tipoLower] || '#777';
        return `<span class="neubrutalist-type-badge" style="background-color: ${colore};">${tipoLower.toUpperCase()}</span>`;
    }).join('');

    const nomePlayerAttivo = (typeof currentPlayer !== 'undefined') ? currentPlayer.toLowerCase() : '';
    const coloreBarraPlayer = (typeof playerColors !== 'undefined' && playerColors[nomePlayerAttivo])
        ? playerColors[nomePlayerAttivo]
        : '#00FF66';

    const htmlStats = Object.keys(TB_MAPPA_STATS).map(chiaveStat => {
        const valore = infoPkm.stats[chiaveStat] || 0;
        const percentualeBarra = Math.min(100, (valore / 160) * 100);
        return `
            <div class="neubrutalist-stat-row">
                <span class="neubrutalist-stat-label">${TB_MAPPA_STATS[chiaveStat]}</span>
                <div class="neubrutalist-stat-bar-bg">
                    <div class="neubrutalist-stat-bar-fill" style="width: ${percentualeBarra}%; background-color: var(--accent-color, ${coloreBarraPlayer});"></div>
                </div>
                <span class="neubrutalist-stat-value">${valore}</span>
            </div>`;
    }).join('');

    let arrayAbilita = [];
    if (Array.isArray(infoPkm.abilities)) {
        arrayAbilita = infoPkm.abilities;
    } else if (infoPkm.abilities && typeof infoPkm.abilities === 'object') {
        arrayAbilita = Object.values(infoPkm.abilities);
    }

    const htmlAbilita = arrayAbilita
        .map(abi => `<span class="neubrutalist-ability-tag">${String(abi).toUpperCase()}</span>`)
        .join('');

    tooltip.innerHTML = `
        <div class="neubrutalist-tooltip-header">
            <div class="neubrutalist-tooltip-title">${tbEsc(String(pkm.name).toUpperCase())}</div>
            <div class="neubrutalist-tooltip-types">${htmlTipi}</div>
        </div>
        <div class="neubrutalist-tooltip-body">
            <div class="neubrutalist-stats-container">${htmlStats}</div>
            <div class="neubrutalist-abilities-title">ABILITIES</div>
            <div class="neubrutalist-abilities-container">${htmlAbilita || '<span class="neubrutalist-ability-tag" style="opacity:0.4;">UNKNOWN</span>'}</div>
        </div>`;

    tbPosizionaTooltip(card, tooltip);

    // Se i tipi non sono nei dati locali, li recupera dal Pokédex di Showdown
    if (arrayTipi.length === 0) tbCompletaTipiTooltip(pkm, tooltip);
}

// Mostra il tooltip dopo 1 secondo di hover (come nell'Helper).
// leggiInfo viene chiamata solo allo scadere del timer, non a ogni passaggio del mouse.
function tbProgrammaTooltip(pkm, card, leggiInfo) {
    clearTimeout(tbTooltipTimer);
    tbTooltipTimer = setTimeout(() => {
        if (!card.isConnected) return; // la griglia è stata ri-renderizzata nel frattempo
        tbMostraTooltip(pkm, card, leggiInfo());
    }, 1000);
}

// Senza id: chiude sempre. Con id: chiude solo se il tooltip è di quel Pokémon.
function tbNascondiTooltip(id) {
    clearTimeout(tbTooltipTimer);
    const tooltip = document.getElementById('global-neubrutalist-tooltip');
    if (!tooltip) return;
    if (id !== undefined && tooltip.dataset.currentId !== String(id)) return;

    tooltip.style.display = 'none';
    tooltip.style.opacity = '0';
    tooltip.dataset.currentId = '';
    tooltip.dataset.rotation = '0deg';
}

// Dati per il tooltip di una voce del picker: prima la stessa fonte dell'Helper,
// poi, se manca, i dati della specie già presenti nella voce (v.sp).
function tbInfoPicker(v, pkm) {
    let info = null;
    try {
        info = getInfoPkm(pkm); // se getInfoPkm non è raggiungibile da qui, si passa al fallback
    } catch {
        info = null;
    }

    if ((!info || !info.stats) && v.sp && v.sp.baseStats) {
        const bs = v.sp.baseStats;
        info = {
            stats: {
                'hp': bs.hp, 'attack': bs.atk, 'defense': bs.def,
                'sp. attack': bs.spa, 'sp. defense': bs.spd, 'speed': bs.spe
            },
            types: v.sp.types || [],
            abilities: v.sp.abilities || []
        };
    }
    return info;
}

// Aggiunge marquee-bounce solo ai nomi che sbordano
function tbApplicaMarquee(griglia) {
    const boxes = [...griglia.querySelectorAll('.tb-pick-name')];

    // 1) reset (utile quando viene richiamata dopo un resize)
    boxes.forEach(b => b.classList.remove('marquee-bounce'));

    // 2) prima tutte le letture...
    const overflow = boxes.map(b => {
        const larghezzaBox = b.clientWidth;
        if (!larghezzaBox || !b.firstElementChild) return 0; // griglia nascosta: non misurare
        return Math.ceil(b.firstElementChild.getBoundingClientRect().width - larghezzaBox);
    });

    // 3) ...poi tutte le scritture
    boxes.forEach((b, i) => {
        if (overflow[i] > 0) {
            b.style.setProperty('--distanza-scorrimento', `-${overflow[i] + 8}px`);
            b.classList.add('marquee-bounce');
        }
    });
}

function tbFiltraPicker(testo) {
    const griglia = document.getElementById('tb-picker-grid');
    if (!griglia) return;

    // Il contenuto sta per essere sostituito: chiude il tooltip e annulla quelli in attesa
    tbNascondiTooltip();

    const numeriUsati = tbStato.clausole ? tbNumeriUsati(tbStato.attivo) : new Set();
const criterio = tbStato.ordinamento || 'bst-desc';
const voci = tbStato.pool
    .filter(v => pokemonCorrispondeRicerca(v, testo))
    .sort((a, b) => tbConfrontaVoci(a, b, criterio));
    griglia.innerHTML = voci.map((v, i) => {
        const base = v.sp ? tbSpecieBase(v.sp) : null;
        const bloccato = !v.sp || (base && numeriUsati.has(base.num));

        // Il title resta solo sulle card bloccate, per spiegarne il motivo.
        // Sulle altre c'è il tooltip personalizzato: con entrambi si sovrapporrebbero.
        const motivo = !v.sp
            ? 'No data available for this Pokémon'
            : (bloccato ? 'Species Clause: already in your team' : '');

        return `
            <button type="button" class="tb-pick ${bloccato ? 'disabled' : ''}" ${bloccato ? 'disabled' : ''}
                    ${motivo ? `title="${tbEsc(motivo)}"` : ''}
                    data-idx="${i}" data-nome="${tbEsc(v.nome)}"
                    onclick="tbScegliPokemon('${v.specieId}')">
                <img loading="lazy" alt="" src="https://play.pokemonshowdown.com/sprites/ani/${v.spriteId}.gif"
                     onerror="gestisciErroreSprite(this, '${v.spriteId}')">
                <span class="tb-pick-name"><span>${tbEsc(v.nome)}</span></span>
            </button>`;
    }).join('') || `<div class="tb-empty">No Pokémon found.</div>`;

    // Tooltip con delega: un solo gestore sulla griglia invece di uno per card.
    // Le assegnazioni "on..." sostituiscono quelle del render precedente, quindi non si accumulano.
    griglia.onmouseover = e => {
        const card = e.target.closest('.tb-pick');
        // contains(relatedTarget): il mouse si sta muovendo dentro la stessa card (img → nome)
        if (!card || card.disabled || card.contains(e.relatedTarget)) return;

        const v = voci[card.dataset.idx];
        const pkm = { id: v.specieId, name: v.nome };
        tbProgrammaTooltip(pkm, card, () => tbInfoPicker(v, pkm));
    };

    griglia.onmouseout = e => {
        const card = e.target.closest('.tb-pick');
        if (!card || card.contains(e.relatedTarget)) return;
        tbNascondiTooltip(voci[card.dataset.idx]?.specieId);
    };

    // Dopo la scelta di un Pokémon il tooltip non deve restare aperto
    griglia.onclick = () => tbNascondiTooltip();

    // Marquee: misura quando font e layout sono pronti
    document.fonts.ready.then(() => requestAnimationFrame(() => tbApplicaMarquee(griglia)));
}

// Mette la descrizione subito dopo il nome della mossa, dentro il rettangolo colorato.
// Il nome viene misurato con un canvas usando il font reale dell'input,
// così la posizione è giusta qualunque sia lo stile in style-box.css.
let tbCanvasMisura = null;

function tbPosizionaDescMosse() {
    if (!tbCanvasMisura) tbCanvasMisura = document.createElement('canvas');
    const ctx = tbCanvasMisura.getContext('2d');

    document.querySelectorAll('.tb-moves .tb-combo').forEach(campo => {
        const input = campo.querySelector('.tb-move');
        const desc = campo.querySelector('.tb-move-desc');
        if (!input || !desc || !input.offsetWidth) return; // campo non visibile: niente da misurare

        const cs = getComputedStyle(input);
        ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        if ('letterSpacing' in ctx) ctx.letterSpacing = cs.letterSpacing === 'normal' ? '0px' : cs.letterSpacing;

        let nome = input.value;
        if (cs.textTransform === 'uppercase') nome = nome.toUpperCase();

        const sinistra = input.offsetLeft + parseFloat(cs.borderLeftWidth) + parseFloat(cs.paddingLeft)
                       + ctx.measureText(nome).width + 10;
        let destra = campo.clientWidth - (input.offsetLeft + input.offsetWidth)
                   + parseFloat(cs.borderRightWidth) + parseFloat(cs.paddingRight);

        // Se l'icona della categoria sta sulla destra, la descrizione si ferma prima
        const icona = campo.querySelector('.tb-combo-cat');
        if (icona && icona.offsetWidth && icona.offsetLeft > input.offsetLeft + input.offsetWidth / 2) {
            destra = Math.max(destra, campo.clientWidth - icona.offsetLeft + 6);
        }

        desc.style.left = `${sinistra}px`;
        desc.style.right = `${destra}px`;
        desc.style.display = campo.clientWidth - sinistra - destra < 40 ? 'none' : ''; // troppo poco spazio: nascosta
    });
}

window.addEventListener('resize', () => requestAnimationFrame(tbPosizionaDescMosse));

                                   data-tipo="oggetto" ${oggettoFisso || tbStato.gen < 2 ? 'disabled' : ''}
                                   onfocus="tbApriCombo(this)" oninput="tbFiltraCombo(this)" onkeydown="tbTastoCombo(event, this)" onblur="tbBlurCombo(this)">
                            <div class="tb-combo-list"></div>
                        </div>
                        <p class="tb-desc" id="tb-desc-oggetto"></p>
                        <div id="tb-msg-oggetto" class="tb-msg"></div>
                    </div>
                    <div class="tb-field">
                        <span class="tb-label">Ability</span>
                        ${campoAbilita}
                        <p class="tb-desc" id="tb-desc-abilita"></p>
                    </div>
                    ${campoTera}
                </div>
                <div class="tb-field">
                    <span class="tb-label">Moves · ${mosseLegali.length} learnable in this format</span>
                    <div class="tb-moves">${s.mosse.map((m, j) => tbHtmlCampoMossa(s, j)).join('')}</div>
                    ${mosseLegali.length === 0 ? `<div class="tb-msg">No moves found for this Pokémon in Gen ${tbStato.gen}: it may not be available in this generation.</div>` : ''}
                    <div id="tb-msg-mosse" class="tb-msg"></div>
                </div>

                <div class="tb-field">
                    <span class="tb-label">EVs, IVs &amp; Nature</span>
                    <div class="tb-evs" id="tb-ev-panel">${tbHtmlPannelloEV(s)}</div>
                </div>
            </div>
        </div>`;
}

let tbTimerFumetto = null;

// Aggiorna descrizioni, tag delle debolezze e stato del salvataggio senza ricreare i bottoni
function tbRenderRiepilogo() {
    const s = tbStato.slot[tbStato.attivo];

    const descAbilita = document.getElementById('tb-desc-abilita');
    if (descAbilita) {
        const ab = s && s.abilita ? tbDex.abilities[tbToID(s.abilita)] : null;
        descAbilita.textContent = ab ? (ab.shortDesc || ab.desc || '') : '';
    }
    const descOggetto = document.getElementById('tb-desc-oggetto');
    if (descOggetto) {
        const it = s && s.oggetto ? tbDex.items[s.oggetto] : null;
        descOggetto.textContent = it ? (it.shortDesc || it.desc || '') : '';
    }

    const copertura = tbCalcolaCopertura();
    const tag = document.getElementById('tb-cov-tag');
    if (tag) {
        tag.className = `tb-cov-tag ${copertura.critici.length ? 'bad' : (copertura.pieni ? 'good' : '')}`;
        tag.textContent = copertura.critici.length
            ? `⚠ Team weaknesses · ${copertura.critici.length}`
            : (copertura.pieni ? '✔ Team weaknesses' : 'Team weaknesses');
    }
    const boxCopertura = document.getElementById('tb-cov-box');
    if (boxCopertura) boxCopertura.innerHTML = copertura.html;

    const errori = tbControllaTeam();
    const wrap = document.getElementById('tb-save-wrap');
    const btnSalva = document.getElementById('tb-btn-save');
    const fumetto = document.getElementById('tb-save-bubble');
    if (wrap) wrap.classList.toggle('blocked', errori.length > 0);
    if (btnSalva) {
        btnSalva.classList.toggle('blocked', errori.length > 0);
        btnSalva.setAttribute('aria-disabled', errori.length > 0 ? 'true' : 'false');
    }
    if (fumetto) {
        fumetto.innerHTML = errori.length
            ? `<b>Can't save to the box yet:</b><ul>${errori.map(e => `<li>${tbEsc(e)}</li>`).join('')}</ul>`
            : '';
    }

    const btnCopia = document.getElementById('tb-btn-copy');
    if (btnCopia) btnCopia.disabled = !tbStato.slot.some(Boolean);
}

// --- MENÙ A TENDINA DI MOSSE E STRUMENTI -----------------------------
function tbVociCombo(tipo, indice) {
    const s = tbStato.slot[tbStato.attivo];
    if (!s) return [];

    if (tipo === 'mossa') {
        const altre = new Set(s.mosse.filter((m, k) => m && k !== indice));
        return tbMosseLegali(s.specieId)
            .filter(m => !altre.has(m.id))
            .map(m => ({ id: m.id, nome: m.dati.name, dati: m.dati }));
    }

    const usati = tbStato.clausole ? tbOggettiUsati(tbStato.attivo) : new Set();
    return tbOggettiLegali()
        .filter(o => !usati.has(o.id))
        .map(o => ({ id: o.id, nome: o.nome, dati: tbDex.items[o.id] }));
}

function tbApriCombo(input) {
    tbCombo.input = input;
    tbCombo.tipo = input.dataset.tipo;
    tbCombo.indice = parseInt(input.dataset.indice || '0', 10);
    tbCombo.digitato = false;
    input.select();
    tbAggiornaCombo();
}

function tbFiltraCombo(input) {
    if (tbCombo.input !== input) tbApriCombo(input);
    tbCombo.digitato = true;
    tbCombo.evidenziata = 0;
    tbAggiornaCombo();
}

function tbAggiornaCombo() {
    const input = tbCombo.input;
    if (!input) return;
    const lista = input.parentElement.querySelector('.tb-combo-list');
    if (!lista) return;

    const query = tbCombo.digitato ? tbToID(input.value) : '';
    let voci = tbVociCombo(tbCombo.tipo, tbCombo.indice);
    if (tbCombo.tipo === 'mossa') {
        voci = voci.filter(v => tbCombo.categorie[v.dati.category]); // filtro Physical / Special / Status
    }
    if (query) {        const inizio = voci.filter(v => v.id.startsWith(query));
        const dentro = voci.filter(v => !v.id.startsWith(query) && v.id.includes(query));
        voci = [...inizio, ...dentro];
    }
    tbCombo.voci = voci.slice(0, 120);
    if (tbCombo.evidenziata >= tbCombo.voci.length) tbCombo.evidenziata = 0;

    const filtro = tbCombo.tipo === 'mossa' ? tbHtmlFiltroCategorie() : '';

    if (!tbCombo.voci.length) {
        let vuoto = 'No item matches.';
        if (tbCombo.tipo === 'mossa') {
            vuoto = Object.values(tbCombo.categorie).some(Boolean) ? 'No learnable move matches.' : 'Select at least one category.';
        }
        lista.innerHTML = `${filtro}<div class="tb-opt-empty">${vuoto}</div>`;
    } else if (tbCombo.tipo === 'mossa') {
        lista.innerHTML = filtro + tbCombo.voci.map((v, i) => {
            const d = v.dati;
            const potenza = d.basePower ? `${d.basePower} BP` : '— BP';
            const precisione = d.accuracy === true ? '—' : `${d.accuracy}%`;
            const descrizione = d.shortDesc || d.desc || '';
            return `
                <div class="tb-opt tb-opt-move ${i === tbCombo.evidenziata ? 'hl' : ''}" style="background: ${tbColoreTipo(d.type)};"
                     title="${tbEsc(descrizione)}" onmousedown="event.preventDefault(); tbScegliDaCombo(${i})">
                    <img class="tb-opt-cat" alt="${d.category}" src="immagini/move-${d.category.toLowerCase()}.png"
                         onerror="this.onerror=null; this.src='https://play.pokemonshowdown.com/sprites/categories/${d.category}.png';">
                    <span class="tb-opt-name">${tbEsc(d.name)}</span>
                    <span class="tb-opt-meta">${d.type} · ${potenza} · ${precisione}</span>
                    <span class="tb-opt-desc">${tbEsc(descrizione)}</span>
                </div>`;
        }).join('');    } else {
        lista.innerHTML = tbCombo.voci.map((v, i) => `
            <div class="tb-opt tb-opt-item ${i === tbCombo.evidenziata ? 'hl' : ''}"
                 title="${tbEsc(v.dati?.shortDesc || v.dati?.desc || '')}" onmousedown="event.preventDefault(); tbScegliDaCombo(${i})">
                <img class="tb-opt-icon" alt="" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${tbSlugOggetto(v.nome)}.png"
                     onerror="this.style.visibility='hidden'">
                <span class="tb-opt-name">${tbEsc(v.nome)}</span>
            </div>`).join('');
    }

    lista.classList.add('open');
    const evidenziata = lista.querySelector('.tb-opt.hl');
    if (evidenziata) evidenziata.scrollIntoView({ block: 'nearest' });
}

// Barra bianca in cima alla lista mosse con le tre spunte di categoria.
// Il click è gestito sul mousedown (con preventDefault) come le voci della lista,
// così l'input non perde il focus e la tendina resta aperta.
function tbHtmlFiltroCategorie() {
    return `
        <div class="tb-cat-filter" onmousedown="event.preventDefault()">
            ${['Physical', 'Special', 'Status'].map(c => `
                <span class="tb-cat-check ${tbCombo.categorie[c] ? 'on' : ''}"
                      onmousedown="event.preventDefault(); tbCambiaCategoria('${c}')">
                    <input type="checkbox" tabindex="-1" ${tbCombo.categorie[c] ? 'checked' : ''}>
                    <img alt="" src="immagini/move-${c.toLowerCase()}.png"
                         onerror="this.onerror=null; this.src='https://play.pokemonshowdown.com/sprites/categories/${c}.png';">
                    ${c}
                </span>`).join('')}
        </div>`;
}

function tbCambiaCategoria(categoria) {
    tbCombo.categorie[categoria] = !tbCombo.categorie[categoria];
    tbCombo.evidenziata = 0;
    tbAggiornaCombo();
    const lista = tbCombo.input?.parentElement.querySelector('.tb-combo-list');
    if (lista) lista.scrollTop = 0;
}

function tbTastoCombo(event, input) {
    if (tbCombo.input !== input) return;
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const passo = event.key === 'ArrowDown' ? 1 : -1;
        const n = tbCombo.voci.length;
        if (n) tbCombo.evidenziata = (tbCombo.evidenziata + passo + n) % n;
        tbAggiornaCombo();
    } else if (event.key === 'Enter') {
        event.preventDefault();
        if (tbCombo.voci.length) tbScegliDaCombo(tbCombo.evidenziata); // la prima (o l'unica) della lista
    } else if (event.key === 'Escape') {
        event.preventDefault();
        input.blur();
    }
}

function tbScegliDaCombo(i) {
    const voce = tbCombo.voci[i];
    const input = tbCombo.input;
    if (!voce || !input) return;

    const tipo = tbCombo.tipo;
    const indice = tbCombo.indice;
    tbChiudiCombo();

    if (tipo === 'mossa') tbImpostaMossa(indice, voce.id);
    else tbImpostaOggetto(voce.id);
}

function tbBlurCombo(input) {
    setTimeout(() => {
        if (tbCombo.input !== input) return;
        const tipo = tbCombo.tipo;
        const indice = tbCombo.indice;
        const testo = input.value.trim();
        tbChiudiCombo();

        const s = tbStato.slot[tbStato.attivo];
        if (!s) return;
        const attuale = tipo === 'mossa' ? s.mosse[indice] : s.oggetto;

        if (!testo) {
            if (tipo === 'mossa') tbImpostaMossa(indice, '');
            else tbImpostaOggetto('');
            return;
        }
        if (tbToID(testo) === attuale) {
            tbAggiornaCampoCombo(tipo, indice); // ripristina il nome corretto
            return;
        }
        if (tipo === 'mossa') tbImpostaMossa(indice, tbToID(testo));
        else tbImpostaOggetto(tbToID(testo));
    }, 150);
}

function tbChiudiCombo() {
    if (tbCombo.input) {
        const lista = tbCombo.input.parentElement?.querySelector('.tb-combo-list');
        if (lista) {
            lista.classList.remove('open');
            lista.innerHTML = '';
        }
    }
    tbCombo.input = null;
    tbCombo.voci = [];
    tbCombo.evidenziata = 0;
}

// Ridisegna il singolo campo (colore e icona della mossa) senza rifare tutto l'editor
function tbAggiornaCampoCombo(tipo, indice) {
    const s = tbStato.slot[tbStato.attivo];
    if (!s) return;

    if (tipo === 'mossa') {
        const campi = document.querySelectorAll('.tb-moves .tb-combo');
        const vecchio = campi[indice];
        if (!vecchio) return;
        const temp = document.createElement('div');
        temp.innerHTML = tbHtmlCampoMossa(s, indice).trim();
        vecchio.replaceWith(temp.firstElementChild);
        tbPosizionaDescMosse();
    } else {
        const input = document.querySelector('.tb-fields input[data-tipo="oggetto"]');
        if (input) input.value = s.oggetto ? (tbDex.items[s.oggetto]?.name || s.oggetto) : '';
    }
}

// --- AZIONI ----------------------------------------------------------
function tbSelezionaSlot(i) {
    tbStato.attivo = i;
    tbRenderSlot();
    tbRenderCorpo();
    tbRenderRiepilogo();
}

function tbScegliPokemon(specieId) {
    const sp = tbSpecie(specieId);
    if (!sp) return;
    const abilita = tbAbilitaLegali(tbSpecieBase(sp));
    const naturaFissa = tbNaturaImposta();
    const effetto = naturaFissa ? TB_NATURE[naturaFissa] : null;

    tbStato.slot[tbStato.attivo] = {
        specieId,
        oggetto: tbOggettoObbligatorio(sp),
        abilita: abilita[0] || '',
        natura: naturaFissa || 'Serious',
        natPlus: effetto ? effetto[0] : '',
        natMinus: effetto ? effetto[1] : '',
        tera: (sp.types && sp.types[0]) || 'Normal',
        mosse: ['', '', '', ''],
        evs: { hp: 0, atk: 0, def: 0, spa: 0, spd: 0, spe: 0 },
        ivs: { hp: 31, atk: 31, def: 31, spa: 31, spd: 31, spe: 31 }
    };
    tbRender();
}

function tbRimuoviPokemon() {
    tbStato.slot[tbStato.attivo] = null;
    tbRender();
}

function tbImpostaCampo(campo, valore) {
    const s = tbStato.slot[tbStato.attivo];
    if (!s) return;
    s[campo] = valore;
    tbRenderLeggero();
}

function tbImpostaOggetto(id) {
    const s = tbStato.slot[tbStato.attivo];
    const msg = document.getElementById('tb-msg-oggetto');
    if (!s) return;

    if (!id) {
        s.oggetto = '';
        if (msg) msg.textContent = '';
        tbAggiornaCampoCombo('oggetto');
        tbRenderLeggero();
        return;
    }

    const legale = tbOggettiLegali().find(o => o.id === id);
    let errore = '';
    if (!legale) errore = 'This item is not available in this format.';
    else if (tbStato.clausole && tbOggettiUsati(tbStato.attivo).has(id)) errore = `Item Clause: ${legale.nome} is already used by another Pokémon.`;

    if (msg) msg.textContent = errore;
    if (!errore) s.oggetto = id;
    tbAggiornaCampoCombo('oggetto');
    tbRenderLeggero();
}

function tbImpostaMossa(indice, id) {
    const s = tbStato.slot[tbStato.attivo];
    const msg = document.getElementById('tb-msg-mosse');
    if (!s) return;

    if (!id) {
        s.mosse[indice] = '';
        if (msg) msg.textContent = '';
        tbAggiornaCampoCombo('mossa', indice);
        tbRenderLeggero();
        return;
    }

    const trovata = tbMosseLegali(s.specieId).find(m => m.id === id);
    let errore = '';
    if (!trovata) errore = "That move can't be learned in this format.";
    else if (s.mosse.some((m, k) => k !== indice && m === id)) errore = `${trovata.dati.name} is already in the moveset.`;

    if (msg) msg.textContent = errore;
    if (!errore) s.mosse[indice] = id;
    tbAggiornaCampoCombo('mossa', indice);
    tbRenderLeggero();
}

function tbAggiornaRigaStat(chiave) {
    const s = tbStato.slot[tbStato.attivo];
    const sp = tbSpecie(s.specieId);
    const range = document.getElementById(`tb-ev-range-${chiave}`);
    const numero = document.getElementById(`tb-ev-num-${chiave}`);
    const stat = document.getElementById(`tb-stat-${chiave}`);
    if (range) range.value = s.evs[chiave];
    if (numero) numero.value = s.evs[chiave];
    if (stat) stat.textContent = tbCalcolaStat(chiave, sp.baseStats[chiave], s.evs[chiave], s.ivs[chiave], s.natura);

    const totale = TB_STAT.reduce((t, st) => t + s.evs[st.key], 0);
    const rimanenti = document.getElementById('tb-ev-remaining');
    if (rimanenti && tbStato.gen >= 3) {
        rimanenti.textContent = `EVs left: ${510 - totale} / 510`;
        rimanenti.classList.toggle('full', totale >= 508);
    }
}

function tbImpostaEV(chiave, valore) {
    const s = tbStato.slot[tbStato.attivo];
    if (!s) return;

    let v = Math.max(0, Math.min(252, parseInt(valore, 10) || 0));
    if (tbStato.gen >= 3) {
        const altri = TB_STAT.reduce((t, st) => t + (st.key === chiave ? 0 : s.evs[st.key]), 0);
        v = Math.max(0, Math.min(v, 510 - altri));
    }
    s.evs[chiave] = v;
    tbAggiornaRigaStat(chiave);
    tbRenderLeggero();
}

function tbImpostaIV(chiave, valore) {
    const s = tbStato.slot[tbStato.attivo];
    if (!s) return;
    s.ivs[chiave] = Math.max(0, Math.min(31, parseInt(valore, 10) || 0));
    const input = document.getElementById(`tb-iv-num-${chiave}`);
    if (input) input.value = s.ivs[chiave];
    tbAggiornaRigaStat(chiave);
    tbRenderLeggero();
}

// --- EXPORT E CONTROLLI ----------------------------------------------
function tbTestoSlot(s) {
    const sp = tbSpecie(s.specieId);
    const righe = [];

    const oggetto = s.oggetto ? (tbDex.items[s.oggetto]?.name || s.oggetto) : '';
    righe.push(oggetto ? `${sp.name} @ ${oggetto}` : sp.name); // es. "Zacian-Crowned @ Rusted Sword"
    if (s.abilita) righe.push(`Ability: ${s.abilita}`);
    if (tbStato.livello !== 100) righe.push(`Level: ${tbStato.livello}`);
    if (tbStato.gen === 9 && s.tera) righe.push(`Tera Type: ${s.tera}`);

    const evs = TB_STAT.filter(st => s.evs[st.key] > 0).map(st => `${s.evs[st.key]} ${st.label}`);
    if (evs.length) righe.push(`EVs: ${evs.join(' / ')}`);
    if (tbStato.gen >= 3 && s.natura) righe.push(`${s.natura} Nature`);

    const ivs = TB_STAT.filter(st => s.ivs[st.key] !== 31).map(st => `${s.ivs[st.key]} ${st.label}`);
    if (ivs.length) righe.push(`IVs: ${ivs.join(' / ')}`);

    s.mosse.filter(Boolean).forEach(id => righe.push(`- ${tbDex.moves[id]?.name || id}`));
    return righe.join('\n');
}

function tbTestoShowdown() {
    return tbStato.slot.filter(Boolean).map(tbTestoSlot).join('\n\n');
}

// Motivi per cui il team non si può ancora salvare nel box
function tbControllaTeam() {
    const errori = [];
    const pieni = tbStato.slot.filter(Boolean);

    if (pieni.length < 6) errori.push(`The team has ${pieni.length}/6 Pokémon.`);

    if (tbStato.clausole) {
        const numeri = new Set();
        const oggetti = new Set();
        pieni.forEach(s => {
            const base = tbSpecieBase(tbSpecie(s.specieId));
            if (numeri.has(base.num)) errori.push(`Species Clause: ${tbNomeBello(base)} is in the team twice.`);
            numeri.add(base.num);
            if (s.oggetto) {
                if (oggetti.has(s.oggetto)) errori.push(`Item Clause: ${tbDex.items[s.oggetto]?.name || s.oggetto} is used twice.`);
                oggetti.add(s.oggetto);
            }
        });
    }

    pieni.forEach(s => {
        const nome = tbNomeBello(tbSpecie(s.specieId));
        if (!s.mosse.some(Boolean)) errori.push(`${nome}: choose at least one move.`);
        const totale = TB_STAT.reduce((t, st) => t + s.evs[st.key], 0);
        if (tbStato.gen >= 3 && totale > 510) errori.push(`${nome}: more than 510 EVs.`);
    });

    const regolaNatura = tbStato.regolamento?.restrizioni?.pokemon?.nature;
    if (regolaNatura && (regolaNatura.mode === 'SAME_ACROSS_TEAM' || regolaNatura.value === 'SAME_ACROSS_TEAM')) {
        const nature = new Set(pieni.map(s => s.natura));
        if (nature.size > 1) errori.push('This format requires the same Nature on every Pokémon.');
    }

    return errori;
}

async function tbCopiaShowdown() {
    const testo = tbTestoShowdown();
    if (!testo) return;

    try {
        await navigator.clipboard.writeText(testo);
    } catch (e) {
        const area = document.createElement('textarea');
        area.value = testo;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
    }

    const btn = document.getElementById('tb-btn-copy');
    if (btn) {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy Showdown'; }, 1500);
    }
}

function tbSalvaNelBox() {
    if (tbControllaTeam().length) {
        // Team non valido: il bottone resta grigio e il fumetto spiega perché
        const wrap = document.getElementById('tb-save-wrap');
        if (wrap) {
            wrap.classList.add('show');
            clearTimeout(tbTimerFumetto);
            tbTimerFumetto = setTimeout(() => wrap.classList.remove('show'), 2500);
        }
        return;
    }

    const testo = tbTestoShowdown();
    const categoria = tbStato.regolamento.categoria || '';

    chiudiTeamBuilder();
    if (typeof chiudiTuttoHelper === 'function') chiudiTuttoHelper();

    apriNuovoTeam();

    const selectFormato = document.getElementById('admin-team-cat');
    const textarea = document.getElementById('showdown-input');
    const inputNome = document.getElementById('admin-team-name');

    if (selectFormato) selectFormato.value = categoria;
    if (textarea) textarea.value = testo;
    if (inputNome) setTimeout(() => inputNome.focus(), 50);
}

function normalizzaRicerca(testo) {
    return String(testo || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
}

// Estrae i nomi delle abilità da qualsiasi formato: array, oggetto {0, 1, H} o array di oggetti {name}
function estraiNomiAbilita(abilities) {
    if (!abilities) return [];
    const lista = Array.isArray(abilities) ? abilities : Object.values(abilities);
    return lista
        .map(a => (a && typeof a === 'object') ? (a.name || a.nome || '') : a)
        .filter(Boolean)
        .map(String);
}

// Raccoglie le abilità da tutte le fonti: l'oggetto stesso, i dati specie (sp) e il pokedexBase
function abilitaDiPokemon(pkm) {
    if (!pkm) return [];
    const fonti = [pkm.abilities, pkm.sp && pkm.sp.abilities];

    if (window.pokedexBase) {
        const chiavi = [pkm.id, pkm.specieId, pkm.name, pkm.nome].filter(Boolean);
        for (const k of chiavi) {
            const voce = window.pokedexBase[String(k).toLowerCase().trim()];
            if (voce) { fonti.push(voce.abilities); break; }
        }
    }

    return [...new Set(fonti.flatMap(estraiNomiAbilita))];
}

// true se la query compare nel nome del Pokémon o in una delle sue abilità
function pokemonCorrispondeRicerca(pkm, query) {
    const q = normalizzaRicerca(query);
    if (!q) return true;
    const nome = pkm.name || pkm.nome || pkm.id || pkm.specieId;
    if (normalizzaRicerca(nome).includes(q)) return true;
    return abilitaDiPokemon(pkm).some(abi => normalizzaRicerca(abi).includes(q));
}
// Chiavi stat del pokedexBase → chiavi di Showdown (baseStats)
const TB_MAPPA_STAT = {
    'hp': 'hp', 'attack': 'atk', 'defense': 'def',
    'sp. attack': 'spa', 'sp. defense': 'spd', 'speed': 'spe'
};

// Voce del pokedexBase di una voce del picker (prova specieId, id, nome)
function tbVoceDexBase(v) {
    if (!v || !window.pokedexBase) return null;
    for (const k of [v.specieId, v.id, v.nome, v.name]) {
        if (!k) continue;
        const voce = window.pokedexBase[String(k).toLowerCase().trim()];
        if (voce) return voce;
    }
    return null;
}

function tbStatVoce(v, chiave) {
    const chiaveSd = TB_MAPPA_STAT[chiave];
    const dex = tbVoceDexBase(v);
    const fonti = [v.stats, v.baseStats, v.sp && v.sp.baseStats, v.sp && v.sp.stats, dex && dex.stats];
    for (const f of fonti) {
        if (!f) continue;
        const val = f[chiave] ?? f[chiaveSd];
        if (typeof val === 'number') return val;
    }
    return 0;
}

function tbBstVoce(v) {
    return Object.keys(TB_MAPPA_STAT).reduce((tot, k) => tot + tbStatVoce(v, k), 0);
}

function tbNumDexVoce(v) {
    const dex = tbVoceDexBase(v);
    const n = [v.num, v.sp && v.sp.num, dex && dex.num].find(x => typeof x === 'number');
    return n !== undefined ? n : 9999;
}

// Stessi criteri della select di renderizzaListaPiatta.
// A parità si restituisce 0: il sort è stabile, quindi resta l'ordine del pool (già per BST).
function tbConfrontaVoci(a, b, criterio) {
    if (criterio.startsWith('stat|')) {
        const [, chiave, direzione] = criterio.split('|');
        const diff = tbStatVoce(a, chiave) - tbStatVoce(b, chiave);
        return direzione === 'asc' ? diff : -diff;
    }
    switch (criterio) {
        case 'num-asc':    return tbNumDexVoce(a) - tbNumDexVoce(b);
        case 'alpha-asc':  return String(a.nome).localeCompare(String(b.nome));
        case 'alpha-desc': return String(b.nome).localeCompare(String(a.nome));
        case 'bst-desc':   return tbBstVoce(b) - tbBstVoce(a);
        case 'bst-asc':    return tbBstVoce(a) - tbBstVoce(b);
        default:           return 0;
    }
}

// Cambio ordinamento: lo memorizza nello stato e ridisegna mantenendo la ricerca corrente
function tbCambiaOrdinamento(criterio) {
    tbStato.ordinamento = criterio;
    const campo = document.getElementById('tb-picker-search');
    tbFiltraPicker(campo ? campo.value : '');
}

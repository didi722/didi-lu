// --- CONTROLLI DI SUPPORTO -------------------------------------------
function tbNumeriUsati(escludiIndice) {
    const numeri = new Set();
    tbStato.slot.forEach((s, i) => {
        if (!s || i === escludiIndice) return;
        const base = tbSpecieBase(tbSpecie(s.specieId));
        if (base) numeri.add(base.num);
    });
    return numeri;
}

function tbOggettiUsati(escludiIndice) {
    const usati = new Set();
    tbStato.slot.forEach((s, i) => {
        if (s && i !== escludiIndice && s.oggetto) usati.add(s.oggetto);
    });
    return usati;
}

function tbCalcolaStat(chiave, base, ev, iv, natura) {
    const L = tbStato.livello;
    if (chiave === 'hp') {
        if (base === 1) return 1; // Shedinja
        return Math.floor((2 * base + iv + Math.floor(ev / 4)) * L / 100) + L + 10;
    }
    const effetto = TB_NATURE[natura];
    let mod = 1;
    if (effetto && effetto[0] === chiave) mod = 1.1;
    if (effetto && effetto[1] === chiave) mod = 0.9;
    return Math.floor((Math.floor((2 * base + iv + Math.floor(ev / 4)) * L / 100) + 5) * mod);
}

// =====================================================================
// 🧢 TOOLTIP "COACH": base comune per Speed tier, Team weaknesses e Team coverage
// Usa il tooltip globale del picker, ma resta aperto quando il mouse ci passa sopra:
// così le righe si possono cliccare (speed creep, aggiunta dei Pokémon suggeriti)
// =====================================================================
let tbCoachTimer = null;
let tbCoachAncora = null;

function tbApriCoach(el, id, costruisci) {
    clearTimeout(tbCoachTimer);
    const html = costruisci();
    if (!html) return;

    const tooltip = tbGetTooltip();
    const giaAperto = tooltip.dataset.currentId === id && tooltip.style.display === 'block';
    if (!giaAperto) {
                tooltip.dataset.rotation = `${(Math.random() * 3 - 1.5).toFixed(2)}deg`;
    }
    tooltip.dataset.currentId = id;
    tooltip.classList.add('tb-coach');
    tooltip.style.display = 'block';
    tooltip.style.opacity = '1';
    tooltip.innerHTML = html;
    tooltip.onmouseenter = () => clearTimeout(tbCoachTimer);
    tooltip.onmouseleave = () => tbChiudiCoachPresto(id);
    tbCoachAncora = { el, id, costruisci };
    tbPosizionaCoach(el, tooltip, giaAperto);
}

// Piccolo ritardo: dà il tempo di passare dal testo al tooltip senza che si chiuda
function tbChiudiCoachPresto(id) {
    clearTimeout(tbCoachTimer);
    tbCoachTimer = setTimeout(() => tbNascondiTooltip(id), 200);
}

// Dopo un click dentro il tooltip: ricalcola il contenuto senza chiuderlo.
// Se il pannello è stato ricreato, si riaggancia al nuovo elemento con quell'id
function tbAggiornaCoach(idNuovaAncora) {
    if (!tbCoachAncora) return;
    const el = (idNuovaAncora && document.getElementById(idNuovaAncora)) || tbCoachAncora.el;
    if (!el || !el.isConnected) {
        tbNascondiTooltip(tbCoachAncora.id);
        return;
    }
    tbApriCoach(el, tbCoachAncora.id, tbCoachAncora.costruisci);
}

// Percentuale che dà 0% e 100% solo se davvero nessuno / tutti
function tbPerc(n, totale) {
    if (!totale || n === 0) return 0;
    if (n === totale) return 100;
    return Math.min(99, Math.max(1, Math.round(100 * n / totale)));
}

function tbEtichettaStat(chiave) {
    return (TB_STAT.find(st => st.key === chiave) || {}).label || chiave;
}

function tbBadgeTipoMini(tipo) {
    return `<span class="mini-type-badge ${String(tipo).toLowerCase()}">${String(tipo).toLowerCase()}</span>`;
}

function tbTestataCoach(titolo) {
    return `<div class="neubrutalist-tooltip-header"><div class="neubrutalist-tooltip-title">${titolo}</div></div>`;
}

// =====================================================================
// ⚡ SPEED TIER + SPEED CREEP (tooltip sulla velocità nel pannello EV)
// Confronta la velocità attuale con quella massima (252 EV, 31 IV, natura +Spe)
// di tutti i Pokémon del formato; cliccando una riga applica il creep
// =====================================================================
const TB_ABILITA_VELOCITA_X2 = {
    swiftswim: 'Swift Swim', chlorophyll: 'Chlorophyll', sandrush: 'Sand Rush',
    slushrush: 'Slush Rush', surgesurfer: 'Surge Surfer', unburden: 'Unburden'
};

// Nature di riferimento per gli avversari: +Spe per la velocità massima, −Spe per la minima (Trick Room)
function tbNatureVelocita() {
    const fissa = tbNaturaImposta();
    if (fissa) return { max: fissa, min: fissa, conNatura: false };
    if (tbStato.gen < 3) return { max: 'Serious', min: 'Serious', conNatura: false };
    return { max: 'Jolly', min: 'Brave', conNatura: true };
}

// Quante mosse fisiche e speciali ha il set: serve a capire quale stat d'attacco è sacrificabile
function tbCategoriaPrevalente(s) {
    let fisiche = 0, speciali = 0;
    s.mosse.forEach(id => {
        const m = id && tbDex.moves[id];
        if (m && m.category === 'Physical') fisiche++;
        if (m && m.category === 'Special') speciali++;
    });
    return { fisiche, speciali };
}

// EV minimi che danno la stessa statistica: quelli oltre sono "sprecati"
function tbEvUtili(chiave, base, ev, iv, natura) {
    const valore = tbCalcolaStat(chiave, base, ev, iv, natura);
    for (let e = 0; e < ev; e += 4) {
        if (tbCalcolaStat(chiave, base, e, iv, natura) === valore) return e;
    }
    return ev;
}

// Piano per superare "bersaglio" in Velocità.
// Nature provate in ordine: quella attuale → se ha −Spe, stesso + ma il − sull'attacco che non usa
// → natura +Spe (tiene il − attuale, altrimenti l'attacco che non usa).
// Gli EV mancanti si prendono prima da quelli sprecati, poi dall'attacco che non usa,
// poi da HP/Def/SpD (dal più investito), per ultimo dall'attacco.
// Ritorna { ev, natura, natPlus, natMinus, tolti } oppure null se irraggiungibile.
function tbPianoCreep(s, sp, bersaglio) {
    const base = sp.baseStats.spe;
    const minimoEv = natura => {
        for (let ev = 0; ev <= 252; ev += 4) {
            if (tbCalcolaStat('spe', base, ev, s.ivs.spe, natura) > bersaglio) return ev;
        }
        return null;
    };

    const cat = tbCategoriaPrevalente(s);
    const attaccoInutile = cat.speciali > cat.fisiche ? 'atk' : 'spa';
    const effetto = TB_NATURE[s.natura] || null;
    const candidate = [s.natura];

    if (tbNatureVelocita().conNatura) {
        if (effetto && effetto[1] === 'spe') candidate.push(tbTrovaNatura(effetto[0], attaccoInutile));
        if (!effetto || effetto[0] !== 'spe') {
            const meno = effetto && effetto[1] !== 'spe' ? effetto[1] : attaccoInutile;
            candidate.push(tbTrovaNatura('spe', meno));
        }
    }

    let natura = null, ev = null;
    for (const n of candidate) {
        if (!n) continue;
        const e = minimoEv(n);
        if (e !== null) { natura = n; ev = e; break; }
    }
    if (natura === null) return null;

    const tolti = {};
    if (tbStato.gen >= 3) {
        const spesiAltri = TB_STAT.reduce((t, st) => t + (st.key === 'spe' ? 0 : s.evs[st.key]), 0);
        let mancano = spesiAltri + ev - 510;
        if (mancano > 0) {
            mancano = Math.ceil(mancano / 4) * 4;
            const prendi = (k, quanto) => {
                const q = Math.min(quanto, s.evs[k] - (tolti[k] || 0), mancano);
                if (q > 0) { tolti[k] = (tolti[k] || 0) + q; mancano -= q; }
            };
            TB_STAT.forEach(st => {
                if (st.key === 'spe') return;
                prendi(st.key, s.evs[st.key] - tbEvUtili(st.key, sp.baseStats[st.key], s.evs[st.key], s.ivs[st.key], natura));
            });
            if (cat.fisiche + cat.speciali > 0 && (cat.fisiche === 0 || cat.speciali === 0)) prendi(attaccoInutile, Infinity);
            ['hp', 'def', 'spd']
                .sort((a, b) => (s.evs[b] - (tolti[b] || 0)) - (s.evs[a] - (tolti[a] || 0)))
                .forEach(k => prendi(k, Infinity));
            ['atk', 'spa'].forEach(k => prendi(k, Infinity));
            if (mancano > 0) return null;
        }
    }

    const nuovoEffetto = TB_NATURE[natura];
    return {
        ev,
        natura,
        natPlus: natura === s.natura ? s.natPlus : (nuovoEffetto ? nuovoEffetto[0] : ''),
        natMinus: natura === s.natura ? s.natMinus : (nuovoEffetto ? nuovoEffetto[1] : ''),
        tolti
    };
}

function tbApplicaCreep(bersaglio) {
    const s = tbStato.slot[tbStato.attivo];
    const sp = s && tbSpecie(s.specieId);
    const piano = sp && tbPianoCreep(s, sp, bersaglio);
    if (!piano) return;

    Object.entries(piano.tolti).forEach(([k, v]) => { s.evs[k] -= v; });
    s.evs.spe = piano.ev;
    s.natura = piano.natura;
    s.natPlus = piano.natPlus;
    s.natMinus = piano.natMinus;

    const pannello = document.getElementById('tb-ev-panel');
    if (pannello) pannello.innerHTML = tbHtmlPannelloEV(s);
    tbRenderLeggero();
    tbAggiornaCoach('tb-stat-spe');
}

function tbApplicaEVSpe(ev) {
    tbImpostaEV('spe', ev);
    tbAggiornaCoach('tb-stat-spe');
}

function tbHtmlSpeedTier() {
    const s = tbStato.slot[tbStato.attivo];
    const sp = s && tbSpecie(s.specieId);
    if (!sp) return '';

    const nat = tbNatureVelocita();
    const base = sp.baseStats.spe;
    const mia = tbCalcolaStat('spe', base, s.evs.spe, s.ivs.spe, s.natura);

    const altri = tbStato.pool.filter(v => v.sp && v.sp.baseStats).map(v => ({
        nome: v.nome,
        max: tbCalcolaStat('spe', v.sp.baseStats.spe, 252, 31, nat.max),
        min: tbCalcolaStat('spe', v.sp.baseStats.spe, 0, 0, nat.min)
    }));
    const totale = altri.length;
    if (!totale) return '';

    const superati = vel => altri.filter(a => a.max < vel).length;
    const piuLenti = superati(mia);
    const pari = altri.filter(a => a.max === mia);
    const piuVeloci = totale - piuLenti - pari.length;
    const elencoNomi = (nomi, quanti) =>
        nomi.slice(0, quanti).map(tbEsc).join(', ') + (nomi.length > quanti ? ` +${nomi.length - quanti}` : '');

    // Badge del piano di creep per superare una certa velocità (verde: solo EV,
    // arancione: EV tolti ad altre stat, giallo: cambia natura)
    const creep = bersaglio => {
        const p = tbPianoCreep(s, sp, bersaglio);
        if (!p) return { badge: `<span class="tb-tip-badge bad">✕</span>`, attr: '' };
        const parti = [];
        if (p.natura !== s.natura) parti.push(p.natura);
        parti.push(`${p.ev} EV`);
        Object.entries(p.tolti).forEach(([k, v]) => parti.push(`−${v} ${tbEtichettaStat(k)}`));
        const classe = p.natura !== s.natura ? 'nat' : (Object.keys(p.tolti).length ? 'warn' : 'ok');
        return {
            badge: `<span class="tb-tip-badge ${classe}">${parti.join(' · ')}</span>`,
            attr: `class="tb-tip-row tb-click" onclick="tbApplicaCreep(${bersaglio})"`
        };
    };

    // EV in Velocità che non aggiungono punti (es. 8 invece di 4 al livello 50)
    const utili = tbEvUtili('spe', base, s.evs.spe, s.ivs.spe, s.natura);
    const rigaSprechi = tbStato.gen >= 3 && utili < s.evs.spe
        ? `<div class="tb-tip-row tb-click" onclick="tbApplicaEVSpe(${utili})">
               <span>✂ ${s.evs.spe - utili} Spe EVs add no speed</span><span class="tb-tip-badge warn">set ${utili}</span>
           </div>`
        : '';

    // Moltiplicatori più comuni
    const abilitaX2 = TB_ABILITA_VELOCITA_X2[tbToID(s.abilita)];
    const htmlModificatori = [
        { etichetta: '+1 / Choice Scarf', vel: Math.floor(mia * 1.5), attivo: s.oggetto === 'choicescarf' },
        { etichetta: `Tailwind${abilitaX2 ? ` / ${abilitaX2}` : ''}`, vel: mia * 2, attivo: !!abilitaX2 }
    ].map(m => `
        <div class="tb-tip-row ${m.attivo ? 'on' : ''}">
            <span>${m.etichetta} → ${m.vel}</span><b>${tbPerc(superati(m.vel), totale)}%</b>
        </div>`).join('');

    // Chi resta più veloce, raggruppato per velocità (dal più vicino)
    const gruppi = new Map();
    altri.filter(a => a.max > mia).sort((a, b) => a.max - b.max).forEach(a => {
        if (!gruppi.has(a.max)) gruppi.set(a.max, []);
        gruppi.get(a.max).push(a.nome);
    });
    const MAX_GRUPPI = 6;
    const htmlVeloci = [...gruppi.entries()].slice(0, MAX_GRUPPI).map(([vel, nomi]) => {
        const c = creep(vel);
        return `
            <div ${c.attr || 'class="tb-tip-row"'}>
                <b>${vel}</b><span class="tb-tip-names">${elencoNomi(nomi, 3)}</span>${c.badge}
            </div>`;
    }).join('');

    const cPari = pari.length ? creep(mia) : null;
    const sezionePari = pari.length
        ? `<div ${cPari.attr || 'class="tb-tip-row"'}>
               <span>= Tie</span><span class="tb-tip-names">${elencoNomi(pari.map(a => a.nome), 3)}</span>${cPari.badge}
           </div>`
        : '';

    const sezioneVeloci = piuVeloci || pari.length
        ? `<div class="tb-tip-title">Still faster (or tied)</div>
           ${htmlVeloci}${sezionePari}
           ${gruppi.size > MAX_GRUPPI ? `<div class="tb-tip-note">…and ${gruppi.size - MAX_GRUPPI} more speed tiers</div>` : ''}
           <div class="tb-tip-note">Click a row to creep · green: EVs only · orange: EVs moved from other stats · yellow: nature change · ✕ out of reach</div>`
        : `<div class="tb-tip-sub">🏁 Nothing in the format is faster</div>`;

    // Trick Room: se la velocità è "minimizzata", conta chi ti resta sopra anche al minimo
    // (in quel caso modificatori e lista dei più veloci non servono e vengono nascosti)
    const modoTR = s.ivs.spe === 0 || (s.natMinus === 'spe' && !s.evs.spe);
    const sezioneTR = modoTR
        ? `<div class="tb-tip-section">
               <div class="tb-tip-row"><span>🔄 Trick Room: slower than</span><b>${tbPerc(altri.filter(a => a.min > mia).length, totale)}%</b></div>
               <div class="tb-tip-note">opponents at 0 EV / 0 IV${nat.conNatura ? ' / −Spe' : ''}</div>
           </div>`
        : '';

    return `
        ${tbTestataCoach(`SPEED TIER · ${mia}`)}
        <div class="neubrutalist-tooltip-body">
            <div class="tb-tip-big">${tbPerc(piuLenti, totale)}%</div>
            <div class="tb-tip-sub">of the format outsped</div>
            <div class="tb-tip-bar"><div style="width: ${(100 * piuLenti / totale).toFixed(1)}%;"></div></div>
            <div class="tb-tip-sub">${piuLenti} slower · ${pari.length} ties · ${piuVeloci} faster</div>
            ${rigaSprechi}
            ${modoTR ? '' : `
                <div class="tb-tip-section">${htmlModificatori}</div>
                <div class="tb-tip-section">${sezioneVeloci}</div>`}
            ${sezioneTR}
            <div class="tb-tip-note">${totale} Pokémon · Lv. ${tbStato.livello} · opponents at 252 EV / 31 IV${nat.conNatura ? ' / +Spe' : ''}</div>
        </div>`;
}

// =====================================================================
// 🧮 SPREAD SUGGERITO: porting di "BattleStatGuesser" di Pokémon Showdown
// Originale: github.com/smogon/pokemon-showdown-client
//            → play.pokemonshowdown.com/src/battle-tooltips.ts
// Dalle 4 mosse (+ strumento, abilità e statistiche base) indovina un "ruolo";
// dal ruolo ricava la statistica principale e quella secondaria da maxare,
// distribuisce gli EV rimasti e sceglie la natura. È l'euristica che Showdown
// usa per il singolo: in VGC va presa come punto di partenza, non come calc.
// =====================================================================

// Ruolo → [statistica principale (di norma anche il "+" della natura), statistica secondaria]
const TB_RUOLI_SPREAD = {
    'Bulky Band':                  ['atk', 'hp'],
    'Fast Band':                   ['spe', 'atk'],
    'Bulky Specs':                 ['spa', 'hp'],
    'Fast Specs':                  ['spe', 'spa'],
    'Physical Scarf':              ['spe', 'atk'],
    'Special Scarf':               ['spe', 'spa'],
    'Physical Biased Mixed Scarf': ['spe', 'atk'],
    'Special Biased Mixed Scarf':  ['spe', 'spa'],
    'Fast Physical Sweeper':       ['spe', 'atk'],
    'Fast Special Sweeper':        ['spe', 'spa'],
    'Bulky Physical Sweeper':      ['atk', 'hp'],
    'Bulky Special Sweeper':       ['spa', 'hp'],
    'Fast Bulky Support':          ['spe', 'hp'],
    'Physically Defensive':        ['def', 'hp'],
    'Specially Defensive':         ['spd', 'hp']
};

// Statistica calcolata come fa il guesser di Showdown.
// "mod" forza il moltiplicatore di natura (1.1 o 1.0); se manca usa la natura attuale dello slot.
function tbStatPerGuess(s, sp, chiave, ev, mod) {
    const L = tbStato.livello;
    const base = sp.baseStats[chiave];
    let iv = typeof s.ivs?.[chiave] === 'number' ? s.ivs[chiave] : 31;
    if (chiave === 'atk' && iv === 0) iv = 31; // se servono EV in Atk, l'applica rimette l'IV a 31: calcoliamo già così
    if (chiave === 'hp') {
        if (base === 1) return 1; // Shedinja
        return Math.floor((2 * base + iv + Math.floor(ev / 4) + 100) * L / 100 + 10);
    }
    let val = Math.floor((2 * base + iv + Math.floor(ev / 4)) * L / 100 + 5);
    const effetto = TB_NATURE[s.natura];
    if (mod) val *= mod;
    else if (effetto && effetto[0] === chiave) val *= 1.1;
    else if (effetto && effetto[1] === chiave) val *= 0.9;
    return Math.floor(val);
}

// 1ª FASE: dal moveset al ruolo (BattleStatGuesser.guessRole)
function tbIndovinaRuolo(s) {
    let sp = tbSpecie(s.specieId);
    if (!sp || !sp.baseStats) return { ruolo: '?' };

    const itemId = s.oggetto || '';
    const item = itemId ? tbDex.items[itemId] : null;
    const abilityId = tbToID(s.abilita);

    // Megapietra data alla forma base: il ruolo si calcola sulla Mega, come fa Showdown
    const mega = item && item.megaStone;
    if (mega && typeof mega === 'object' && mega[sp.name]) {
        const spMega = tbSpecie(tbToID(mega[sp.name]));
        if (spMega && spMega.baseStats) sp = spMega;
    }
    const stats = sp.baseStats;

    const mosse = s.mosse.filter(Boolean);
    if (!mosse.length) return { ruolo: '?' };
    let servonoQuattro = !['Unown', 'Ditto'].includes(sp.baseSpecies || sp.name);
    if (mosse.includes('lastresort')) servonoQuattro = false;
    if (mosse.length < 4 && servonoQuattro) return { ruolo: '?' };

    // Contatori (stessi nomi di Showdown, così è facile confrontare con l'originale)
    const mc = {
        Physical: 0, Special: 0, PhysicalAttack: 0, SpecialAttack: 0, PhysicalSetup: 0, SpecialSetup: 0,
        Support: 0, Setup: 0, Restoration: 0, Offense: 0, Stall: 0, SpecialStall: 0, PhysicalStall: 0,
        Fast: 0, Ultrafast: 0, bulk: 0, specialBulk: 0, physicalBulk: 0
    };
    const ha = {}; // id mossa → true

    for (const id of mosse) {
        const m = tbDex.moves[id];
        if (!m) continue;
        ha[id] = true;

        if (m.category === 'Status') {
            if (['batonpass', 'healingwish', 'lunardance'].includes(id)) {
                mc.Support++;
            } else if (['metronome', 'assist', 'copycat', 'mefirst', 'photongeyser', 'shellsidearm'].includes(id)) {
                mc.Physical += 0.5;
                mc.Special += 0.5;
            } else if (id === 'naturepower') {
                mc.Special++;
            } else if (['protect', 'detect', 'spikyshield', 'kingsshield'].includes(id)) {
                mc.Stall++;
            } else if (id === 'wish') {
                mc.Restoration++;
                mc.Stall++;
                mc.Support++;
            } else if (m.heal) {
                mc.Restoration++;
                mc.Stall++;
            } else if (m.target === 'self') {
                if (['agility', 'rockpolish', 'shellsmash', 'growth', 'workup'].includes(id)) {
                    mc.PhysicalSetup++;
                    mc.SpecialSetup++;
                } else if (['dragondance', 'swordsdance', 'coil', 'bulkup', 'curse', 'bellydrum'].includes(id)) {
                    mc.PhysicalSetup++;
                } else if (['nastyplot', 'tailglow', 'quiverdance', 'calmmind', 'geomancy'].includes(id)) {
                    mc.SpecialSetup++;
                }
                if (id === 'substitute') mc.Stall++;
                mc.Setup++;
            } else {
                if (['toxic', 'leechseed', 'willowisp'].includes(id)) mc.Stall++;
                mc.Support++;
            }
        } else if (['counter', 'endeavor', 'metalburst', 'mirrorcoat', 'rapidspin'].includes(id)) {
            mc.Support++;
        } else if (['nightshade', 'seismictoss', 'psywave', 'superfang', 'naturesmadness',
                    'foulplay', 'endeavor', 'finalgambit', 'bodypress'].includes(id)) {
            mc.Offense++;
        } else if (id === 'fellstinger') {
            mc.PhysicalSetup++;
            mc.Setup++;
        } else {
            mc[m.category]++;
            mc.Offense++;
            if (id === 'knockoff') mc.Support++;
            if (['scald', 'voltswitch', 'uturn', 'flipturn'].includes(id)) mc[m.category] -= 0.2;
        }
    }

    if (ha.batonpass) mc.Support += mc.Setup;
    mc.PhysicalAttack = mc.Physical;
    mc.Physical += mc.PhysicalSetup;
    mc.SpecialAttack = mc.Special;
    mc.Special += mc.SpecialSetup;
    if (ha.dragondance || ha.quiverdance) mc.Ultrafast = 1;

    // Stima della resistenza fisica / speciale
    let veloce = stats.spe >= 80;
    let bulkFis = (stats.hp + 75) * (stats.def + 87);
    let bulkSpe = (stats.hp + 75) * (stats.spd + 87);

    if (ha.willowisp || ha.acidarmor || ha.irondefense || ha.cottonguard) {
        bulkFis *= 1.6;
        mc.PhysicalStall++;
    } else if (ha.scald || ha.bulkup || ha.coil || ha.cosmicpower) {
        bulkFis *= 1.3;
        if (ha.scald) mc.SpecialStall++; // lo stall "parziale" va al contrario
        else mc.PhysicalStall++;
    }
    if (abilityId === 'flamebody') bulkFis *= 1.1;

    if (ha.calmmind || ha.quiverdance || ha.geomancy) {
        bulkSpe *= 1.3;
        mc.SpecialStall++;
    }
    if (abilityId === 'sandstream' && (sp.types || []).includes('Rock')) bulkSpe *= 1.5;

    if (ha.bellydrum) {
        bulkFis *= 0.6;
        bulkSpe *= 0.6;
    }
    if (mc.Restoration) {
        bulkFis *= 1.5;
        bulkSpe *= 1.5;
    } else if (ha.painsplit && ha.substitute) {
        mc.Stall--; // SubSplit di solito non è un set da stall
    } else if (ha.painsplit || ha.rest) {
        bulkFis *= 1.4;
        bulkSpe *= 1.4;
    }
    if ((ha.bodyslam || ha.thunder) && abilityId === 'serenegrace' || ha.thunderwave) {
        bulkFis *= 1.1;
        bulkSpe *= 1.1;
    }
    if ((ha.ironhead || ha.airslash) && abilityId === 'serenegrace') {
        bulkFis *= 1.1;
        bulkSpe *= 1.1;
    }
    if (ha.gigadrain || ha.drainpunch || ha.hornleech) {
        bulkFis *= 1.15;
        bulkSpe *= 1.15;
    }
    if (itemId === 'leftovers' || itemId === 'blacksludge') {
        bulkFis *= 1 + 0.1 * (1 + mc.Stall / 1.5);
        bulkSpe *= 1 + 0.1 * (1 + mc.Stall / 1.5);
    }
    if (ha.leechseed) {
        bulkFis *= 1 + 0.1 * (1 + mc.Stall / 1.5);
        bulkSpe *= 1 + 0.1 * (1 + mc.Stall / 1.5);
    }
    if ((itemId === 'flameorb' || itemId === 'toxicorb') && abilityId !== 'magicguard') {
        if (itemId === 'toxicorb' && abilityId === 'poisonheal') {
            bulkFis *= 1 + 0.1 * (2 + mc.Stall);
            bulkSpe *= 1 + 0.1 * (2 + mc.Stall);
        } else {
            bulkFis *= 0.8;
            bulkSpe *= 0.8;
        }
    }
    if (itemId === 'lifeorb') {
        bulkFis *= 0.7;
        bulkSpe *= 0.7;
    }
    if (['multiscale', 'magicguard', 'regenerator'].includes(abilityId)) {
        bulkFis *= 1.4;
        bulkSpe *= 1.4;
    }
    if (itemId === 'eviolite') {
        bulkFis *= 1.5;
        bulkSpe *= 1.5;
    }
    if (itemId === 'assaultvest') bulkSpe *= 1.5;

    const bulk = bulkFis + bulkSpe;
    if (bulk < 46000 && stats.spe >= 70) veloce = true;
    if (ha.trickroom) veloce = false;
    mc.bulk = bulk;
    mc.physicalBulk = bulkFis;
    mc.specialBulk = bulkSpe;

    if (ha.agility || ha.dragondance || ha.quiverdance || ha.rockpolish || ha.shellsmash || ha.flamecharge) {
        veloce = true;
    } else if (['unburden', 'speedboost', 'motordrive'].includes(abilityId)) {
        veloce = true;
        mc.Ultrafast = 1;
    } else if (['chlorophyll', 'swiftswim', 'sandrush'].includes(abilityId)) {
        veloce = true;
        mc.Ultrafast = 2;
    } else if (itemId === 'salacberry') {
        veloce = true;
    }
    if (ha.agility || ha.shellsmash || ha.autotomize || ha.shiftgear || ha.rockpolish) mc.Ultrafast = 2;
    mc.Fast = veloce ? 1 : 0;

    // Decisione del ruolo
    const esito = ruolo => ({ ruolo, mc, ha });
    const idSp = tbToID(sp.name);

    if (idSp === 'ditto') return esito(abilityId === 'imposter' ? 'Physically Defensive' : 'Fast Bulky Support');
    if (idSp === 'shedinja') return esito('Fast Physical Sweeper');

    if (itemId === 'choiceband' && mc.PhysicalAttack >= 2) return esito(veloce ? 'Fast Band' : 'Bulky Band');
    if (itemId === 'choicespecs' && mc.SpecialAttack >= 2) return esito(veloce ? 'Fast Specs' : 'Bulky Specs');
    if (itemId === 'choicescarf') {
        if (mc.PhysicalAttack === 0) return esito('Special Scarf');
        if (mc.SpecialAttack === 0) return esito('Physical Scarf');
        if (mc.PhysicalAttack > mc.SpecialAttack) return esito('Physical Biased Mixed Scarf');
        if (mc.PhysicalAttack < mc.SpecialAttack) return esito('Special Biased Mixed Scarf');
        if (stats.atk < stats.spa) return esito('Special Biased Mixed Scarf');
        return esito('Physical Biased Mixed Scarf');
    }

    if (idSp === 'unown') return esito('Fast Special Sweeper');

    if (mc.PhysicalStall && mc.Restoration) {
        if (stats.spe > 110 && abilityId !== 'prankster') return esito('Fast Bulky Support');
        return esito('Specially Defensive');
    }
    if (mc.SpecialStall && mc.Restoration && itemId !== 'lifeorb') {
        if (stats.spe > 110 && abilityId !== 'prankster') return esito('Fast Bulky Support');
        return esito('Physically Defensive');
    }

    let bias = 'Physical';
    if (stats.spa > stats.atk && mc.Special > 1) bias = 'Special';
    else if (stats.atk > stats.spa && mc.Physical > 1) bias = 'Physical';
    else if (mc.Special > mc.Physical) bias = 'Special';

    if (mc.Stall + mc.Support / 2 <= 2 && bulk < 135000 && mc[bias] >= 1.5) {
        if (veloce) {
            if (bulk > 80000 && !mc.Ultrafast) return esito('Bulky ' + bias + ' Sweeper');
            return esito('Fast ' + bias + ' Sweeper');
        } else if (mc[bias] >= 3 || mc.Stall <= 0) {
            return esito('Bulky ' + bias + ' Sweeper');
        }
    }

    if (veloce && abilityId !== 'prankster') {
        if (stats.spe > 100 || bulk < 55000 || mc.Ultrafast) return esito('Fast Bulky Support');
    }
    if (mc.SpecialStall) return esito('Physically Defensive');
    if (mc.PhysicalStall) return esito('Specially Defensive');
    if (idSp === 'blissey' || idSp === 'chansey') return esito('Physically Defensive');
    if (bulkSpe >= bulkFis) return esito('Specially Defensive');
    return esito('Physically Defensive');
}

// 2ª FASE: dal ruolo a EV, natura e IV minime (BattleStatGuesser.guessEVs + prefersMinStats)
// Restituisce null se non si può suggerire nulla, { ruolo: '?' } se mancano mosse.
function tbIndovinaSpread(s) {
    const sp = s ? tbSpecie(s.specieId) : null;
    if (!sp || !sp.baseStats || tbStato.gen < 3) return null; // come Showdown: niente spread suggerito in Gen 1-2

    const { ruolo, mc, ha } = tbIndovinaRuolo(s);
    if (!TB_RUOLI_SPREAD[ruolo]) return { ruolo: '?' };

    const stats = sp.baseStats;
    const itemId = s.oggetto || '';
    const abilityId = tbToID(s.abilita);
    const mosse = s.mosse.filter(Boolean);
    const evs = { hp: 0, atk: 0, def: 0, spa: 0, spd: 0, spe: 0 };
    const stat = (chiave, ev, mod) => tbStatPerGuess(s, sp, chiave, ev, mod);
    const MAX = 252, TOTALE = 508, PASSO = 4;

    let [primaria, secondaria] = TB_RUOLI_SPREAD[ruolo];
    let plus = primaria;
    if (ruolo === 'Fast Bulky Support') mc.Ultrafast = 0;
    if (plus === 'spe' && mc.Ultrafast) {
        // Con setup di velocità (o abilità meteo) il "+" va sull'attacco o sulla difesa
        if (secondaria === 'atk' || secondaria === 'spa') plus = secondaria;
        else if (mc.Physical >= 3) plus = 'atk';
        else if (stats.spd > stats.def) plus = 'spd';
        else plus = 'def';
    }

    // Toglie EV finché la statistica non scende (evita EV sprecati, conta molto al Lv. 50)
    const evUtili = (chiave, ev, mod) => {
        const valore = stat(chiave, ev, mod);
        while (ev > 0 && valore <= stat(chiave, ev - PASSO, mod)) ev -= PASSO;
        return ev;
    };

    let totale = 0;
    evs[primaria] = evUtili(primaria, MAX, plus === primaria ? 1.1 : 1.0);
    totale += evs[primaria];

    if (secondaria === 'hp' && tbStato.livello < 20) secondaria = 'spd';
    evs[secondaria] = evUtili(secondaria, MAX, plus === secondaria ? 1.1 : 1.0);
    totale += evs[secondaria];

    // Soglie di Speed "storiche" di Showdown per alcune specie
    const minimiSpe = { tentacruel: 16, skarmory: 24, jirachi: 32, celebi: 36, volcarona: 52, gliscor: 72 };
    const idSp = tbToID(sp.name);
    if (minimiSpe[idSp]) {
        let diff = minimiSpe[idSp] - evs.spe;
        if (diff > 0 && totale <= 504) {
            const cambio = Math.min(508 - totale, diff);
            totale += cambio;
            evs.spe += cambio;
            diff -= cambio;
        }
        if (diff > 0) {
            const donatrice = ['def', 'spd', 'hp', 'atk', 'spa'].find(k => evs[k] > 128);
            if (donatrice) {
                evs[donatrice] -= diff;
                evs.spe += diff;
            }
        }
    } else if (idSp === 'dragonite' && evs.hp && evs.spe > 220) {
        totale -= evs.spe - 220;
        evs.spe = 220;
    }

    // PS "giusti": divisibili (o no) per 2/4/8 in base a Stealth Rock, Substitute, Belly Drum, bacche...
    let debolezzaSR = 0;
    if (abilityId !== 'magicguard' && abilityId !== 'mountaineer') {
        const tipi = sp.types || [];
        [tipi[0], tipi[1]].forEach(t => {
            if (['Fire', 'Flying', 'Bug', 'Ice'].includes(t)) debolezzaSR++;
            else if (['Ground', 'Steel', 'Fighting'].includes(t)) debolezzaSR--;
        });
    }
    const avanzi = itemId === 'leftovers' || itemId === 'blacksludge';
    const bacca = itemId.endsWith('berry');

    const sistemaPS = tot => {
        let divisore = 0;
        let divisibile = false;
        let hp = evs.hp || 0;
        let ps = stat('hp', hp, 1);
        if (avanzi && ha.substitute && ps !== 404) divisore = 4;
        else if (avanzi) divisore = 0;
        else if (ha.bellydrum && bacca) { divisore = 2; divisibile = true; }
        else if (ha.substitute && bacca) { divisore = 4; divisibile = true; }
        else if (debolezzaSR >= 2 || ha.bellydrum) divisore = 2;
        else if (debolezzaSR >= 1 || ha.substitute || ha.transform) divisore = 4;
        else if (abilityId !== 'magicguard') divisore = 8;

        if (divisore) {
            const ok = () => !(ps % divisore) === divisibile;
            while (hp < MAX && tot < TOTALE && !ok()) {
                hp += PASSO;
                ps = stat('hp', hp, 1);
                tot += PASSO;
            }
            while (hp > 0 && !ok()) {
                hp -= PASSO;
                ps = stat('hp', hp, 1);
                tot -= PASSO;
            }
            while (hp > 0 && ps === stat('hp', hp - PASSO, 1)) {
                hp -= PASSO;
                tot -= PASSO;
            }
            if (hp || evs.hp) evs.hp = hp;
        }
        return tot;
    };
    totale = sistemaPS(totale);

    // EV rimasti: attacco usato, poi PS, SpD, Def, Spe (la natura attuale conta, come in Showdown)
    let psScelti = false;
    while (totale < TOTALE) {
        const prima = totale;
        let extra = null;
        if (!evs.atk && mc.PhysicalAttack >= 1) extra = 'atk';
        else if (!evs.spa && mc.SpecialAttack >= 1) extra = 'spa';
        else if (!evs.hp && stats.hp > 1 && !psScelti) extra = 'hp';
        else if (!evs.spd && stats.hp > 1) extra = 'spd';
        else if (!evs.def && stats.hp > 1) extra = 'def';
        else if (!evs.spe) extra = 'spe';
        if (!extra) break;

        let ev = Math.min(TOTALE - totale, MAX);
        const valore = stat(extra, ev);
        while (ev > 0 && valore === stat(extra, ev - PASSO)) ev -= PASSO;
        if (ev) evs[extra] = ev;
        totale += ev;

        if (extra === 'hp') {
            psScelti = true;
            totale = sistemaPS(totale);
            continue;
        }
        if (totale === prima) break;
    }

    // Il "−" della natura
    let minus = '';
    if (ha.gyroball || ha.trickroom) {
        minus = 'spe';
    } else if (!mc.PhysicalAttack) {
        minus = 'atk';
    } else if (mc.SpecialAttack < 1 && !evs.spa) {
        if (mc.SpecialAttack < mc.PhysicalAttack) minus = 'spa';
        else if (!evs.atk) minus = 'atk';
    } else if (mc.PhysicalAttack < 1 && !evs.atk) {
        minus = 'atk';
    } else if (stats.def > stats.spe && stats.spd > stats.spe && !evs.spe) {
        minus = 'spe';
    } else if (plus === 'def' || plus === 'spd') {
        // set difensivo: non sacrificare l'altra difesa
        minus = evs.atk && !evs.spe ? 'spe' : 'atk';
    } else if (stats.def > stats.spd) {
        minus = 'spd';
    } else {
        minus = 'def';
    }
    if (!minus || plus === minus) minus = plus === 'spe' ? 'spd' : 'spe';

        // EV avanzati: al Lv. 5 (e in parte al 50) un punto costa fino a 80 EV, quindi dopo i tagli ne restano molti.
    // 1) Ritaglia ogni statistica con la natura finale: toglie gli EV che non danno punti
    const naturaFissa = tbNaturaImposta();
    const modFinale = k => naturaFissa ? undefined : (k === plus ? 1.1 : k === minus ? 0.9 : 1.0);
    for (const k of Object.keys(evs)) {
        const mod = modFinale(k);
        const valore = stat(k, evs[k], mod);
        while (evs[k] > 0 && stat(k, evs[k] - PASSO, mod) === valore) evs[k] -= PASSO;
    }
    totale = Object.values(evs).reduce((t, v) => t + v, 0);

    // 2) Ridistribuisce il resto: a ogni giro un punto in più alla statistica che costa meno EV
    //    (a parità vince l'ordine), finché nessuna statistica può più salire
    const bloccati = new Set();
    if (!mc.PhysicalAttack) bloccati.add('atk');
    if (!mc.SpecialAttack) bloccati.add('spa');
    if (stats.hp === 1) bloccati.add('hp'); // Shedinja
    if (ha.gyroball || ha.trickroom) bloccati.add('spe');
    if (minus === 'atk' || minus === 'spe') bloccati.add(minus);
    const ordine = [primaria, secondaria, 'atk', 'spa', 'hp', 'spd', 'def', 'spe'];

    while (totale < TOTALE) {
        let scelta = null, costo = Infinity;
        for (const k of ordine) {
            if (bloccati.has(k)) continue;
            const mod = modFinale(k);
            const attuale = stat(k, evs[k], mod);
            const limite = Math.min(MAX, evs[k] + TOTALE - totale);
            let ev = evs[k];
            while (ev < limite && stat(k, ev, mod) === attuale) ev += PASSO;
            if (stat(k, ev, mod) > attuale && ev - evs[k] < costo) {
                scelta = k;
                costo = ev - evs[k];
            }
        }
        if (!scelta) break;

        const hpPrima = evs.hp;
        evs[scelta] += costo;
        totale += costo;
        if (scelta === 'hp') {
            totale = sistemaPS(totale);                    // rispetta la regola dei PS (Stealth Rock, Sub...)
            if (evs.hp <= hpPrima) bloccati.add('hp');     // la regola non lo permette: niente altri PS
        }
    }

    // IV minime (dal team editor di Showdown: prefersMinStats)
    let minSpe = !evs.spe && !!(ha.gyroball || ha.trickroom); // Trick Room: aggiunta nostra, Showdown guarda solo Gyro Ball
    let minAtk = !evs.atk;
    if (sp.name.startsWith('Terapagos')) minSpe = false;
    if (abilityId === 'battlebond' || ['Koraidon', 'Miraidon', 'Gimmighoul-Roaming'].includes(sp.name)) {
        minAtk = false;
    } else {
        if (!mosse.length) minAtk = false;
        for (const id of mosse) {
            const m = tbDex.moves[id];
            if (!m) continue;
            if (id === 'transform') {
                if (mosse.length <= 1) minAtk = false;
            } else if (m.category === 'Physical' && !m.damage && !m.ohko &&
                       !['foulplay', 'endeavor', 'counter', 'bodypress', 'seismictoss', 'bide', 'metalburst', 'superfang'].includes(id) &&
                       !(tbStato.gen < 8 && id === 'rapidspin')) {
                minAtk = false;
            } else if (['metronome', 'assist', 'copycat', 'mefirst', 'photongeyser', 'shellsidearm', 'terablast'].includes(id) ||
                       (tbStato.gen === 5 && id === 'naturepower')) {
                minAtk = false;
            }
        }
    }

    return { ruolo, evs, plus, minus, minAtk, minSpe };
}

// Riga "Guessed spread" sotto la tabella EV
function tbHtmlSpreadSuggerito(s) {
    const g = tbIndovinaSpread(s);
    if (!g) return '';
    if (g.ruolo === '?') {
        return `<span class="tb-guess-title">Guessed spread</span>
                <span class="tb-guess-hint">Choose 4 moves to get a guessed spread</span>`;
    }

    const etichetta = k => TB_STAT.find(x => x.key === k).label;
    const evs = TB_STAT.filter(st => g.evs[st.key]).map(st => `${g.evs[st.key]} ${st.label}`).join(' / ');
    const naturaFissa = tbNaturaImposta();
    const natura = naturaFissa
        ? `${naturaFissa} (fixed by the format)`
        : `${tbTrovaNatura(g.plus, g.minus)} (+${etichetta(g.plus)}, −${etichetta(g.minus)})`;
    const ivs = [g.minAtk ? '0 Atk' : '', g.minSpe ? '0 Spe' : ''].filter(Boolean).join(' / ');

    return `<span class="tb-guess-title">Guessed spread</span>
            <button type="button" class="tb-guess-btn" onclick="tbApplicaSpreadSuggerito()" title="Apply this spread">
                <b>${tbEsc(g.ruolo)}</b>
                <span>${evs}</span>
                <span>${tbEsc(natura)}${ivs ? ` · IVs: ${ivs}` : ''}</span>
            </button>`;
}

// Clic sul bottone: applica EV, natura e IV suggerite allo slot attivo
function tbApplicaSpreadSuggerito() {
    const s = tbStato.slot[tbStato.attivo];
    const g = tbIndovinaSpread(s);
    if (!g || g.ruolo === '?') return;

    Object.assign(s.evs, g.evs);
    if (!tbNaturaImposta()) {
        s.natPlus = g.plus;
        s.natMinus = g.minus;
        s.natura = tbTrovaNatura(g.plus, g.minus) || 'Serious';
    }
    if (g.minAtk) s.ivs.atk = 0;
    else if (s.ivs.atk === 0) s.ivs.atk = 31; // c'è di nuovo una mossa fisica: l'Atk torna a 31
    if (g.minSpe) s.ivs.spe = 0;             // la Speed non viene mai rialzata da sola (team Trick Room)

    const pannello = document.getElementById('tb-ev-panel');
    if (pannello) pannello.innerHTML = tbHtmlPannelloEV(s);
    tbRenderLeggero();
}

// --- APERTURA / CHIUSURA ---------------------------------------------
function tbCreaOverlay() {
    let overlay = document.getElementById('tb-overlay');
    if (overlay) return overlay;

    overlay = document.createElement('div');
    overlay.id = 'tb-overlay';
    overlay.className = 'tb-overlay';
    overlay.innerHTML = `
        <div class="tb-wrapper" role="dialog" aria-modal="true" aria-label="Team Builder">
            <div class="tb-header">
                <input type="text" id="tb-title" class="tb-title" maxlength="40" autocomplete="off" spellcheck="false"
                       placeholder="Name your team" aria-label="Team name" title="Click to rename the team"
                       oninput="tbRenderRiepilogo()">
                <span id="tb-format-badge" class="tb-format-badge"></span>
                <button type="button" class="tb-close" onclick="tbChiediChiusura()" aria-label="Close">&times;</button>
            </div>
            <div class="tb-content-container">
                <div id="tb-slots" class="tb-slots"></div>
                <div id="tb-body" class="tb-body"></div>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) tbChiediChiusura();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('open') && !tbCombo.input) tbChiediChiusura();
    });

    return overlay;
}

// "Soprannome (Garchomp) (M)" → "garchomp": specie di un Pokémon salvato nel box
function tbSpecieDaNome(nome) {
    const pulito = String(nome || '').replace(/\s*\([MF]\)\s*$/i, '').trim();
    const conNick = pulito.match(/\(([^()]+)\)\s*$/);
    return tbToID(conNick ? conNick[1] : pulito);
}

// Specie del team del box aperto nel builder (vuoto se si sta creando un team nuovo)
function tbSpecieTeamInModifica() {
    if (!tbModifica) return [];
    return (tbModifica.pokemon || [])
        .filter(p => p && p.nome)
        .map(p => tbSpecieDaNome(p.nome))
        .filter(Boolean);
}

// Quante delle specie indicate sono presenti in una lista dell'helper
function tbQuantiNellaLista(lista, specie) {
    const ids = new Set();
    (lista || []).forEach(pkm => {
        [pkm.id, pkm.name, pkm.spriteId].forEach(v => {
            const id = tbToID(v);
            if (id) ids.add(id);
        });
    });
    return specie.filter(id => ids.has(id)).length;
}

// Il nome che si è dato al team (il titolo del Team Builder è un campo)
function tbNomeTeam() {
    const el = document.getElementById('tb-title');
    return el ? el.value.trim() : '';
}

// Apre il builder mostrando solo il caricamento (titolo e badge già ripuliti). `nome`: il nome del team (vuoto se è nuovo)
function tbApriOverlayCaricamento(nome, testo) {
    const overlay = tbCreaOverlay();
    overlay.classList.add('open');

    const elTitolo = document.getElementById('tb-title');
    if (elTitolo) elTitolo.value = nome || '';
    const badge = document.getElementById('tb-format-badge');
    if (badge) badge.textContent = '';

    document.getElementById('tb-slots').innerHTML = '';
    document.getElementById('tb-body').innerHTML = `
        <div class="tb-loading">
            <div class="pokeball-spinner"></div>
            <div class="loading-text">${tbEsc(testo)}</div>
        </div>`;
    return overlay;
}

// Aspetta che il builder sia disegnato davvero (font e sprite) prima di scoprirlo, al massimo 1,5 secondi
async function tbAttendiBuilderPronto() {
    const overlay = document.getElementById('tb-overlay');
    const immagini = overlay ? Array.from(overlay.querySelectorAll('img')) : [];
    const caricamenti = immagini
        .filter(img => !img.complete)
        .map(img => new Promise(resolve => {
            img.addEventListener('load', resolve, { once: true });
            img.addEventListener('error', resolve, { once: true });
        }));

    await Promise.race([
        Promise.all([document.fonts ? document.fonts.ready : null, ...caricamenti]),
        attendi(1500)
    ]);
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

// Apre nel Team Builder un team del Box. Il loader sfocato copre subito tutto; sotto si prepara il builder, invisibile
// (la lista del formato la calcola l'helper, anche lui nascosto) e il loader svanisce solo quando il team è pronto.
async function modificaTeamNelBuilder(teamId) {
    const team = teamId ? tuttiITeam.find(t => t.id === teamId) : null;
    if (!team) {
        alert("Error: Team not found.");
        return;
    }

    const helper = document.getElementById('helper-modal-overlay');
    const select = document.getElementById('helper-format-select');
    const grid = document.getElementById('helper-pkm-grid');
    if (!helper || !select || !grid) return;

    // I Pokémon sono quelli salvati nel team: si rileggono dal testo di Showdown (c'è tutto), se manca dall'elenco salvato nel box
    const testo = String(team.testoShowdown || '').trim();
    let pokemon = testo ? parseShowdown(testo) : [];
    if (!pokemon.length) {
        pokemon = Array.isArray(team.pokemon) ? team.pokemon : Object.values(team.pokemon || {});
    }
    const nome = team.nome || '';

    // Loader sfocato sopra la pagina finché il builder non è pronto
    mostraLoaderSalvataggio('Loading...');
    const sessione = tbModifica = { teamId, nome, pokemon };
    tbStato.firma = '';
    tbStato.slot = [null, null, null, null, null, null];
    helper.style.display = 'none';
    document.body.style.overflow = 'hidden';

    // Il builder si apre e si riempie senza farsi vedere
    const overlay = tbCreaOverlay();
    overlay.style.visibility = 'hidden';

    // I dati di Showdown intanto si scaricano in parallelo (apriTeamBuilder riusa la stessa richiesta)
    tbCaricaTuttiDati().catch(() => {});

    // Se qualcosa va storto si resta nel Box e compare l'avviso
    const annulla = async (messaggio) => {
        if (tbModifica !== sessione) return;
        tbModifica = null;
        document.body.style.overflow = '';
        await sfumaLoaderSalvataggio();
        alert(messaggio);
    };

    try {
        // Formato: quello salvato nel team (nome o id del regolamento)
        const candidati = [team.categoria, team.category]
            .map(v => String(v || '').toLowerCase().trim())
            .filter(Boolean);

        let formatId = null;
        try {
            const snap = await db.ref('regolamenti').once('value');
            const formati = [];
            snap.forEach(c => { formati.push({ id: c.key, categoria: String(c.val()?.categoria || '').toLowerCase().trim() }); });
            for (const cand of candidati) {
                const trovato = formati.find(f => f.categoria === cand) || formati.find(f => f.id.toLowerCase() === cand);
                if (trovato) { formatId = trovato.id; break; }
            }
        } catch (err) {
            await annulla("Error: Database error: " + err.message);
            return;
        }
        if (tbModifica !== sessione) return;
        if (!formatId) {
            await annulla("Error: The format of this team was not found.");
            return;
        }
        sessione.formatId = formatId;

        // L'helper calcola i Pokémon del formato restando invisibile.
        // Se il formato chiede una scelta (iniziale, "same across team"...) la deduce dal team stesso.
        await popolaSelettoreFormati();
        if (tbModifica !== sessione) return;
        select.value = formatId;
        grid.originalPokemonList = [];
        await gestisciCambioFormatoHelper();
        if (tbModifica !== sessione) return;

        if (grid.originalPokemonList.length > 0) {
            await apriTeamBuilder();
            await tbAttendiBuilderPronto();
        } else {
            // Scelta impossibile da dedurre: si passa all'helper, il team si carica con "Build Team"
            helper.style.display = 'flex';
        }

    } finally {
        overlay.style.visibility = '';
        await sfumaLoaderSalvataggio(); // svanisce e scopre il builder già completo
    }
}

async function apriTeamBuilder() {
    const grid = document.getElementById('helper-pkm-grid');
    const lista = grid && Array.isArray(grid.originalPokemonList) ? grid.originalPokemonList : [];
    const formatId = window.currentHelperFormatId;

    if (!formatId || lista.length === 0) {
        alert("Choose a format with at least one available Pokémon first.");
        return;
    }

    // Aperto dal pulsante "Build Team" dell'helper: stessa transizione di "Edit in team builder".
    // Il loader sfocato copre l'helper, il builder si prepara invisibile e si scopre solo quando è pronto.
    // Dal pannello di modifica (helper già nascosto) il loader lo gestisce modificaTeamNelBuilder;
    // "Try again" invece riprova dentro il builder già aperto.
    const helper = document.getElementById('helper-modal-overlay');
    const daHelper = !!helper && helper.style.display !== 'none';
    if (daHelper) mostraLoaderSalvataggio('Loading...');

    const overlay = tbApriOverlayCaricamento(
        tbModifica ? tbModifica.nome : '',
        tbModifica ? 'Loading team...' : 'Loading moves, abilities and items...'
    );
    if (daHelper) overlay.style.visibility = 'hidden';

    // Nasconde l'helper mentre il builder è aperto (riappare alla chiusura).
    // Con il loader resta sotto, sfocato, fino all'ultimo, come fa il pannello in modifica
    const nascondiHelper = () => {
        if (helper && helper.style.display !== 'none') {
            helper.dataset.nascostoDaBuilder = '1';
            helper.style.display = 'none';
        }
    };
    if (!daHelper) nascondiHelper();

    try {
        const [regSnap] = await Promise.all([
            db.ref(`regolamenti/${formatId}`).once('value'),
            tbCaricaTuttiDati()
        ]);
        const regolamento = regSnap.val();
        if (!regolamento) throw new Error('Format not found.');

        const firma = `${formatId}|${lista.length}|${lista.map(p => p.id).join(',')}`;
        if (tbModifica) {
            // Modifica di un team del box: si riparte sempre dal team salvato
            tbInizializzaStato(firma, regolamento, lista);
            tbCaricaTeamEsistente(tbModifica.pokemon);
            tbModifica.testoIniziale = tbTestoShowdown();
        } else if (tbStato.firma !== firma) {
            tbInizializzaStato(firma, regolamento, lista);
        } else {
            tbStato.regolamento = regolamento;
            tbStato.cacheMosse = {}; // le regole del formato potrebbero essere cambiate
        }

        tbRender();
                tbCaricaCalc().catch(() => {}); // precarica il damage calc in background
        if (daHelper) await tbAttendiBuilderPronto(); // font e sprite pronti prima di scoprirlo
    } catch (err) {
        console.error('[Team Builder]', err);
        document.getElementById('tb-body').innerHTML = `
            <div class="tb-loading">
                <span>❌ Could not load Pokémon data (${tbEsc(err.message)}).</span>
                <button type="button" class="tb-btn-small" onclick="apriTeamBuilder()">Try again</button>
            </div>`;
    } finally {
        if (daHelper) {
            nascondiHelper();
            overlay.style.visibility = '';
            await sfumaLoaderSalvataggio(); // svanisce e scopre il builder già completo
        }
    }
}

function chiudiTeamBuilder() {
    const overlay = document.getElementById('tb-overlay');
    if (overlay) overlay.classList.remove('open');

    const helper = document.getElementById('helper-modal-overlay');
        if (helper && helper.dataset.nascostoDaBuilder === '1') {
        helper.style.display = 'flex';
        delete helper.dataset.nascostoDaBuilder;
    } else {
        // Aperto direttamente dal box (modifica di un team): si torna al box e la pagina scorre di nuovo
        document.body.style.overflow = '';
    }
    // Nell'editor del simulatore, chiuso il Team Builder (X, fuori, Esc, dopo la conferma) l'editor è finito
    if (INCORPORATO && !tbModifica) notificaSimulatore('chiuso');
}

// Il builder è aperto e nel team c'è almeno un Pokémon
function tbCiSonoModifiche() {
    const overlay = document.getElementById('tb-overlay');
    if (!(overlay && overlay.classList.contains('open') && tbStato.slot.some(Boolean))) return false;
    // In modifica conta solo se il team è diverso da quello caricato dal box
    return !(tbModifica && tbTestoShowdown() === tbModifica.testoIniziale);
}

// X, clic fuori dal builder o Esc: chiede conferma se il team non è vuoto
function tbChiediChiusura() {
    if (tbCiSonoModifiche() &&
        !confirm("Are you sure you want to close the Team Builder? Your changes to the team will not be saved.")) {
        return;
    }
    tbStato.firma = ''; // alla prossima apertura il team riparte da zero
        tbModifica = null;  // ed esce dalla modifica del team del box
    chiudiTeamBuilder();
}

// Ricarica, chiusura della scheda, frecce avanti/indietro del browser
window.addEventListener('beforeunload', (e) => {
    if (!tbCiSonoModifiche()) return;
    e.preventDefault();
    e.returnValue = '';
});

function tbInizializzaStato(firma, regolamento, lista) {
    const struttura = String(regolamento.strutturaSito || 'custom').toLowerCase().trim();
    const gen = parseInt(regolamento.genRuleValue, 10) ||
                parseInt(String(regolamento.vgcGen || '').replace(/\D/g, ''), 10) || 9;

    tbStato.firma = firma;
    tbStato.regolamento = regolamento;
    tbStato.gen = gen;
    tbStato.within = regolamento.genRuleType === 'within' || struttura === 'vgc';
    tbStato.struttura = struttura;
    tbStato.clausole = ['custom', 'vgc', 'vcg'].includes(struttura);
    tbStato.livello = struttura === 'vgc' ? 50 : (String(regolamento.baseTier || '').toUpperCase() === 'LC' ? 5 : 100);
    tbStato.slot = [null, null, null, null, null, null];
    tbStato.attivo = 0;
    tbStato.cacheMosse = {};
    tbStato.oggetti = null;
        tbStato.filtroTipo = '';

    const visti = new Set();
    tbStato.pool = lista.map(pkm => {
        const candidati = [pkm.id, pkm.name, pkm.spriteId].map(tbToID).filter(Boolean);
        const specieId = candidati.find(c => tbSpecie(c)) || candidati[0];
        const sp = tbSpecie(specieId);
        return {
            specieId,
            sp,
            nome: tbNomeBello(sp, pkm.name || pkm.id),
            bst: tbBST(sp),
            spriteId: pkm.spriteId || (sp ? tbSpriteId(sp) : specieId)
        };
    }).filter(v => {
        if (!v.specieId || visti.has(v.specieId)) return false;
                // Tutte le sue abilità sono bannate (es. Shedinja con Wonder Guard): non selezionabile
        if (v.sp && tbAbilitaLegali(tbSpecieBase(v.sp), true).length && !tbAbilitaLegali(tbSpecieBase(v.sp)).length) return false;
        visti.add(v.specieId);
        return true;
    }).sort((a, b) => (b.bst - a.bst) || a.nome.localeCompare(b.nome)); // dal BST più alto
}

// Da un Pokémon "salvato" (il formato prodotto da parseShowdown) allo slot del Team Builder.
// Ritorna { slot } oppure, se non si può usare, { motivo }. Con `soloDelFormato` la specie deve essere tra quelle del formato.
function tbSlotDaSalvato(p, soloDelFormato) {
    // "252 Atk / 4 SpD / 252 Spe" → { hp: 0, atk: 252, def: 0, spa: 0, spd: 4, spe: 252 }
    const leggiStat = (testo, predefinito) => {
        const valori = {};
        TB_STAT.forEach(st => { valori[st.key] = predefinito; });
        String(testo || '').split('/').forEach(parte => {
            const m = parte.trim().match(/^(\d+)\s+(\S+)$/);
            const st = m && TB_STAT.find(x => x.label.toLowerCase() === m[2].toLowerCase());
            if (st) valori[st.key] = parseInt(m[1], 10);
        });
        return valori;
    };
    const intero = (v, predefinito) => Number.isInteger(v) ? v : predefinito;

    // "Soprannome (Garchomp) (M)" → "garchomp"; se la forma non esiste si ripiega sulla specie base
    let specieId = tbSpecieDaNome(p.nome);
    if (!tbSpecie(specieId)) {
        const pulito = String(p.nome).replace(/\s*\([MF]\)\s*$/i, '').replace(/^.*\(([^()]+)\)\s*$/, '$1');
        const parti = pulito.split('-');
        while (parti.length > 1 && !tbSpecie(specieId)) {
            parti.pop();
            specieId = tbToID(parti.join('-'));
        }
    }
    const sp = tbSpecie(specieId);
    if (!sp) {
        console.warn('[Team Builder] Species not found:', p.nome);
        return { motivo: `${p.nome} was not recognized.` };
    }
    if (soloDelFormato && !tbStato.pool.some(v => v.specieId === specieId)) {
        return { motivo: `${tbNomeBello(sp)} is not allowed in this format.` };
    }

    const natura = Object.prototype.hasOwnProperty.call(TB_NATURE, p.natura) ? p.natura : 'Serious';
    const effetto = TB_NATURE[natura];
    const oggetto = p.strumento && p.strumento !== 'None' ? tbToID(p.strumento) : '';
    const mosseSalvate = Array.isArray(p.mosse) ? p.mosse : Object.values(p.mosse || {});
    const mosse = mosseSalvate.map(m => tbToID(m))
        .filter(id => id && tbDex.moves[id] && !voceBannata(tbStato.regolamento?.restrizioni, 'mosse', tbDex.moves[id].name))
        .slice(0, 4);
    while (mosse.length < 4) mosse.push('');

    return { slot: {
        specieId,
        oggetto: tbDex.items[oggetto] ? oggetto : '',
        abilita: (p.abilita && !voceBannata(tbStato.regolamento?.restrizioni, 'abilita', p.abilita))
            ? p.abilita
            : (tbAbilitaLegali(tbSpecieBase(sp))[0] || ''),
        natura,
        natPlus: effetto ? effetto[0] : '',
        natMinus: effetto ? effetto[1] : '',
        tera: p.tera || (sp.types && sp.types[0]) || 'Normal',
        mosse,
        evs: leggiStat(p.evs, 0),
        ivs: leggiStat(p.ivs, 31),
        sesso: p.sesso === 'M' || p.sesso === 'F' ? p.sesso : '',
        felicita: intero(p.felicita, 255),
        shiny: !!p.shiny,
        gigantamax: !!p.gigantamax,
        livelloDynamax: intero(p.livelloDynamax, 10)
    } };
}

// Riempie gli slot con un team salvato nel box (stesso formato prodotto da parseShowdown)
function tbCaricaTeamEsistente(pokemonSalvati) {
    const lista = (Array.isArray(pokemonSalvati) ? pokemonSalvati : Object.values(pokemonSalvati || {}))
        .filter(p => p && p.nome);

    tbStato.slot = [null, null, null, null, null, null];
    lista.slice(0, 6).forEach((p, i) => {
        const r = tbSlotDaSalvato(p, false);
        if (r.slot) tbStato.slot[i] = r.slot;
    });
    tbStato.attivo = 0;
}

// --- IMPORT ED EXPORT DI SHOWDOWN ------------------------------------
// Il testo di un team intero (si sostituisce il team) o di un solo Pokémon (va nello slot scelto, o nel primo vuoto)
function tbImportaTesto(testo) {
    // le righe "=== [gen9ou] Cartella/Nome ===" dell'esportazione di Showdown non sono Pokémon
    const pulito = String(testo || '').split(/\r?\n/).filter(r => !/^\s*===.*===\s*$/.test(r)).join('\n');
    const lista = parseShowdown(pulito);
    if (!lista.length) {
        return { ok: false, messaggio: 'No Pokémon found. Each Pokémon needs its name line and at least one more line (ability, moves...).' };
    }

    const nuovi = [], saltati = [];
    lista.forEach(p => {
        const r = tbSlotDaSalvato(p, true);
        if (r.slot) nuovi.push(r.slot);
        else saltati.push(r.motivo);
    });
    if (!nuovi.length) return { ok: false, messaggio: saltati.join(' ') };

    let esito;
    if (lista.length === 1) {
        const vuoto = tbStato.slot.findIndex(x => !x);
        const dove = !tbStato.slot[tbStato.attivo] ? tbStato.attivo : (vuoto >= 0 ? vuoto : tbStato.attivo);
        tbStato.slot[dove] = nuovi[0];
        tbStato.attivo = dove;
        esito = `Imported ${tbNomeBello(tbSpecie(nuovi[0].specieId))} in slot ${dove + 1}.`;
    } else {
        const primi = nuovi.slice(0, 6);
        tbStato.slot = primi.concat(Array(6 - primi.length).fill(null));
        tbStato.attivo = 0;
        esito = `Imported ${primi.length} Pokémon.`;
        if (nuovi.length > 6) saltati.push('A team has at most 6 Pokémon: the others were left out.');
    }
    tbRender();
    return { ok: true, messaggio: [esito, ...saltati].join(' '), parziale: saltati.length > 0 };
}

function tbApriShowdown(modo) {
    const overlay = document.getElementById('tb-overlay');
    if (!overlay) return;
    tbChiudiShowdown();
    const esporta = modo === 'export';
    const dialogo = document.createElement('div');
    dialogo.id = 'tb-sd';
    dialogo.className = 'tb-sd';
    dialogo.setAttribute('role', 'dialog');
    dialogo.setAttribute('aria-modal', 'true');
    dialogo.setAttribute('aria-labelledby', 'tb-sd-titolo');
    dialogo.innerHTML = `
        <div class="tb-sd-scheda">
            <div class="tb-sd-testa">
                <h3 id="tb-sd-titolo">${esporta ? 'Export to Showdown' : 'Import from Showdown'}</h3>
                <button type="button" class="tb-sd-x" aria-label="Close" onclick="tbChiudiShowdown()">&times;</button>
            </div>
            <p class="tb-sd-aiuto">${esporta
                ? 'Your team in Showdown format: paste it in the Showdown teambuilder or in a battle.'
                : 'Paste a whole team, or a single Pokémon, in Showdown format. A whole team replaces the current one; a single Pokémon goes in the selected slot (or in the first empty one).'}</p>
            <textarea id="tb-sd-testo" class="tb-sd-testo" rows="12" spellcheck="false" autocomplete="off"
                      ${esporta ? 'readonly' : 'placeholder="Garchomp @ Rocky Helmet&#10;Ability: Rough Skin&#10;EVs: 252 HP / 252 Atk / 4 Spe&#10;Jolly Nature&#10;- Earthquake&#10;- Dragon Claw&#10;..."'}></textarea>
            <p id="tb-sd-esito" class="tb-sd-esito" role="status" aria-live="polite"></p>
            <div class="tb-sd-azioni">
                ${esporta ? `
                <button type="button" class="tb-btn" onclick="tbCopiaDaDialogo('team')">Copy team</button>
                <button type="button" class="tb-btn" id="tb-sd-copia-uno" onclick="tbCopiaDaDialogo('uno')">Copy selected Pokémon</button>
                <button type="button" class="tb-btn tb-btn-secondario" onclick="tbChiudiShowdown()">Close</button>` : `
                <button type="button" class="tb-btn tb-btn-save" onclick="tbEseguiImport()">Import</button>
                <button type="button" class="tb-btn tb-btn-secondario" onclick="tbChiudiShowdown()">Cancel</button>`}
            </div>
        </div>`;
    overlay.appendChild(dialogo);
    dialogo.addEventListener('mousedown', e => { if (e.target === dialogo) tbChiudiShowdown(); });
    dialogo.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); tbChiudiShowdown(); } });
    const area = document.getElementById('tb-sd-testo');
    if (esporta) {
        area.value = tbTestoShowdown();
        const uno = document.getElementById('tb-sd-copia-uno');
        if (uno) uno.disabled = !tbStato.slot[tbStato.attivo];
        document.querySelector('#tb-sd .tb-sd-azioni .tb-btn').disabled = !area.value;
    }
    area.focus();
    if (esporta) area.select();
}

function tbChiudiShowdown() {
    const d = document.getElementById('tb-sd');
    if (d) d.remove();
}

function tbEseguiImport() {
    const area = document.getElementById('tb-sd-testo');
    const esito = document.getElementById('tb-sd-esito');
    if (!area || !esito) return;
    const r = tbImportaTesto(area.value);
    esito.textContent = r.messaggio;
    esito.classList.toggle('tb-sd-errore', !r.ok);
    // tutto importato: si torna al Team Builder; con qualcosa lasciato fuori resta aperto, così si legge cosa
    if (r.ok && !r.parziale) tbChiudiShowdown();
}

async function tbCopiaDaDialogo(cosa) {
    const s = tbStato.slot[tbStato.attivo];
    const testo = cosa === 'uno' ? (s ? tbTestoSlot(s) : '') : tbTestoShowdown();
    if (!testo) return;
    const ok = await tbCopiaNegliAppunti(testo);
    const esito = document.getElementById('tb-sd-esito');
    if (esito) {
        esito.textContent = ok ? (cosa === 'uno' ? 'Pokémon copied!' : 'Team copied!') : 'Could not copy: select the text and copy it by hand.';
        esito.classList.toggle('tb-sd-errore', !ok);
    }
}

// --- RENDER ----------------------------------------------------------
function tbRender() {
    const badge = document.getElementById('tb-format-badge');
    if (badge) {
        const tipoGen = tbStato.within ? 'Within' : 'Up to';
        const clausole = tbStato.clausole ? 'Species & Item Clause' : 'Duplicates allowed';
        badge.textContent = `${tbStato.regolamento.categoria || 'Format'} · ${tipoGen} Gen ${tbStato.gen} · Lv. ${tbStato.livello} · ${clausole}`;
    }
    tbRenderSlot();
    tbRenderCorpo();
    tbRenderRiepilogo();
}

// Aggiorna solo il testo dello slot attivo: ricreare i bottoni farebbe perdere il click
// quando un campo perde il focus (es. scrivo un EV e clicco subito un altro slot)
function tbRenderLeggero() {
    const bottone = document.querySelectorAll('#tb-slots .tb-slot')[tbStato.attivo];
    const s = tbStato.slot[tbStato.attivo];
    const etichetta = bottone && bottone.querySelector('.tb-slot-item');
    if (s && etichetta) {
        etichetta.textContent = s.oggetto;

const TB_MAPPA_STATS = {
    'hp': 'HP', 'attack': 'ATK', 'defense': 'DEF',
    'sp. attack': 'SPA', 'sp. defense': 'SPD', 'speed': 'SPE'
};

let tbTooltipTimer = null;

function tbGetTooltip() {
    let tooltip = document.getElementById('global-neubrutalist-tooltip');
    if (!tooltip) {
        tooltip = document.createElement('div');
        tooltip.id = 'global-neubrutalist-tooltip';
        tooltip.className = 'neubrutalist-tooltip';
        document.body.appendChild(tooltip);
    }
    return tooltip;
}

function tbPosizionaTooltip(cardElement, tooltipElement) {
    const rect = cardElement.getBoundingClientRect();
    const scrollY = window.scrollY;
    const scrollX = window.scrollX;

    const cardCenter = rect.left + scrollX + (rect.width / 2);
    const tooltipWidth = tooltipElement.offsetWidth || 245;
    let tooltipLeft = cardCenter - (tooltipWidth / 2);

    if (tooltipLeft < 10) tooltipLeft = 10;
    if (tooltipLeft + tooltipWidth > window.innerWidth - 10) {
        tooltipLeft = window.innerWidth - tooltipWidth - 10;
    }
    tooltipElement.style.left = `${tooltipLeft}px`;

    const tooltipHeight = tooltipElement.offsetHeight;
    const spazioSotto = window.innerHeight - rect.bottom;
    const spazioSopra = rect.top;

    const rotazioneCorrente = tooltipElement.dataset.rotation || '0deg';
    tooltipElement.style.transform = `rotate(${rotazioneCorrente})`;

    if (spazioSotto >= tooltipHeight) {
        tooltipElement.style.top = `${rect.bottom + scrollY + 8}px`;
    } else if (spazioSopra >= tooltipHeight) {
        tooltipElement.style.top = `${rect.top + scrollY - 8 - tooltipHeight}px`;
    } else if (spazioSotto > spazioSopra) {
        tooltipElement.style.top = `${rect.bottom + scrollY + 8}px`;
    } else {
        tooltipElement.style.top = `${rect.top + scrollY - 8 - tooltipHeight}px`;
    }
}

// Posiziona i tooltip "coach": di fianco al bottone, dal lato verso il centro dello schermo,
// centrati in verticale sul bottone e poi tenuti dentro lo schermo.
// Se ai lati non c'è spazio (schermi stretti) si aprono sopra o sotto, verso il centro.
function tbPosizionaCoach(el, tooltip, mantieniPosizione) {
    const rect = el.getBoundingClientRect();
    const margine = 10;  // distanza minima dai bordi dello schermo
    const stacco = 12;   // distanza dal bottone
    const w = tooltip.offsetWidth;
    const h = tooltip.offsetHeight;
    const vw = document.documentElement.clientWidth;
    const vh = window.innerHeight;
    const tra = (v, min, max) => Math.max(min, Math.min(v, max));

    tooltip.style.transform = `rotate(${tooltip.dataset.rotation || '0deg'})`;

    // Contenuto aggiornato da un click: resta dov'è, al massimo rientra nello schermo
    if (mantieniPosizione && tooltip.style.top) {
        const topAttuale = parseFloat(tooltip.style.top) - window.scrollY;
        tooltip.style.top = `${tra(topAttuale, margine, vh - h - margine) + window.scrollY}px`;
        return;
    }

    let left, top;
    const aDestra = rect.right + stacco;
    const aSinistra = rect.left - stacco - w;
    const entraDestra = aDestra + w <= vw - margine;
    const entraSinistra = aSinistra >= margine;
    const preferisciDestra = rect.left + rect.width / 2 < vw / 2;

    if (entraDestra && (preferisciDestra || !entraSinistra)) left = aDestra;
    else if (entraSinistra) left = aSinistra;

    if (left !== undefined) {
        // Di fianco al bottone: centrato in verticale, poi spinto dentro lo schermo
        top = tra(rect.top + rect.height / 2 - h / 2, margine, vh - h - margine);
    } else {
        // Niente spazio ai lati: sopra o sotto, dal lato del centro dello schermo
        left = tra(rect.left + rect.width / 2 - w / 2, margine, vw - w - margine);
        top = (rect.top + rect.height / 2 > vh / 2) ? rect.top - stacco - h : rect.bottom + stacco;
        top = tra(top, margine, vh - h - margine);
    }

    tooltip.style.left = `${left + window.scrollX}px`;
    tooltip.style.top = `${top + window.scrollY}px`;
}

// Riempie e mostra il tooltip. pkm = { id, name }
function tbMostraTooltip(pkm, card, infoPkm) {
    const tooltip = tbGetTooltip();
        tooltip.classList.remove('tb-coach');
    tooltip.onmouseenter = tooltip.onmouseleave = null;

    tooltip.dataset.currentId = pkm.id;
    tooltip.dataset.rotation = `${(Math.random() * 8 - 4).toFixed(2)}deg`;
    tooltip.style.display = 'block';
    tooltip.style.opacity = '1';

    if (!infoPkm || !infoPkm.stats) {
        tooltip.innerHTML = `<div class="neubrutalist-loading" style="color:red; font-weight:bold; padding:10px;">DATA NOT FOUND</div>`;
        tbPosizionaTooltip(card, tooltip);
        return;
    }

    const arrayTipi = tbTipiSincroni(pkm, infoPkm);
    const htmlTipi = arrayTipi.map(t => {
        const tipoLower = t.toLowerCase().trim();
        const colore = TB_COLORI_TIPI[tipoLower] || '#777';
        return `<span class="neubrutalist-type-badge" style="background-color: ${colore};">${tipoLower.toUpperCase()}</span>`;
    }).join('');

    const nomePlayerAttivo = (typeof currentPlayer !== 'undefined') ? currentPlayer.toLowerCase() : '';
    const coloreBarraPlayer = (typeof playerColors !== 'undefined' && playerColors[nomePlayerAttivo])
        ? playerColors[nomePlayerAttivo]
        : '#00FF66';

    const htmlStats = Object.keys(TB_MAPPA_STATS).map(chiaveStat => {
        const valore = infoPkm.stats[chiaveStat] || 0;
        const percentualeBarra = Math.min(100, (valore / 160) * 100);
        return `
            <div class="neubrutalist-stat-row">
                <span class="neubrutalist-stat-label">${TB_MAPPA_STATS[chiaveStat]}</span>
                <div class="neubrutalist-stat-bar-bg">
                    <div class="neubrutalist-stat-bar-fill" style="width: ${percentualeBarra}%; background-color: var(--accent-color, ${coloreBarraPlayer});"></div>
                </div>
                <span class="neubrutalist-stat-value">${valore}</span>
            </div>`;
    }).join('');

    let arrayAbilita = [];
    if (Array.isArray(infoPkm.abilities)) {
        arrayAbilita = infoPkm.abilities;
    } else if (infoPkm.abilities && typeof infoPkm.abilities === 'object') {
        arrayAbilita = Object.values(infoPkm.abilities);
    }

    const htmlAbilita = arrayAbilita
        .map(abi => `<span class="neubrutalist-ability-tag">${String(abi).toUpperCase()}</span>`)
        .join('');

    tooltip.innerHTML = `
        <div class="neubrutalist-tooltip-header">
            <div class="neubrutalist-tooltip-title">${tbEsc(String(pkm.name).toUpperCase())}</div>
            <div class="neubrutalist-tooltip-types">${htmlTipi}</div>
        </div>
        <div class="neubrutalist-tooltip-body">
            <div class="neubrutalist-stats-container">${htmlStats}</div>
            <div class="neubrutalist-abilities-title">ABILITIES</div>
            <div class="neubrutalist-abilities-container">${htmlAbilita || '<span class="neubrutalist-ability-tag" style="opacity:0.4;">UNKNOWN</span>'}</div>
        </div>`;

    tbPosizionaTooltip(card, tooltip);

    // Se i tipi non sono nei dati locali, li recupera dal Pokédex di Showdown
    if (arrayTipi.length === 0) tbCompletaTipiTooltip(pkm, tooltip);
}

// Mostra il tooltip dopo 1 secondo di hover (come nell'Helper).
// leggiInfo viene chiamata solo allo scadere del timer, non a ogni passaggio del mouse.
function tbProgrammaTooltip(pkm, card, leggiInfo) {
    clearTimeout(tbTooltipTimer);
    tbTooltipTimer = setTimeout(() => {
        if (!card.isConnected) return; // la griglia è stata ri-renderizzata nel frattempo
        tbMostraTooltip(pkm, card, leggiInfo());
    }, 1000);
}

// Senza id: chiude sempre. Con id: chiude solo se il tooltip è di quel Pokémon.
function tbNascondiTooltip(id) {
    clearTimeout(tbTooltipTimer);
    const tooltip = document.getElementById('global-neubrutalist-tooltip');
    if (!tooltip) return;
    if (id !== undefined && tooltip.dataset.currentId !== String(id)) return;
    tooltip.classList.remove('tb-coach');
    tooltip.onmouseenter = tooltip.onmouseleave = null;

    tooltip.style.display = 'none';
    tooltip.style.opacity = '0';
    tooltip.dataset.currentId = '';
    tooltip.dataset.rotation = '0deg';
}

// Dati per il tooltip di una voce del picker: prima la stessa fonte dell'Helper,
// poi, se manca, i dati della specie già presenti nella voce (v.sp).
function tbInfoPicker(v, pkm) {
    let info = null;
    try {
        info = getInfoPkm(pkm); // se getInfoPkm non è raggiungibile da qui, si passa al fallback
    } catch {
        info = null;
    }

    if ((!info || !info.stats) && v.sp && v.sp.baseStats) {
        const bs = v.sp.baseStats;
        info = {
            stats: {
                'hp': bs.hp, 'attack': bs.atk, 'defense': bs.def,
                'sp. attack': bs.spa, 'sp. defense': bs.spd, 'speed': bs.spe
            },
            types: v.sp.types || [],
            abilities: v.sp.abilities || []
        };
    }
    return info;
}

// Aggiunge marquee-bounce solo ai nomi che sbordano
function tbApplicaMarquee(griglia) {
    const boxes = [...griglia.querySelectorAll('.tb-pick-name')];

    // 1) reset (utile quando viene richiamata dopo un resize)
    boxes.forEach(b => b.classList.remove('marquee-bounce'));

    // 2) prima tutte le letture...
    const overflow = boxes.map(b => {
        const larghezzaBox = b.clientWidth;
        if (!larghezzaBox || !b.firstElementChild) return 0; // griglia nascosta: non misurare
        return Math.ceil(b.firstElementChild.getBoundingClientRect().width - larghezzaBox);
    });

    // 3) ...poi tutte le scritture
    boxes.forEach((b, i) => {
        if (overflow[i] > 0) {
            b.style.setProperty('--distanza-scorrimento', `-${overflow[i] + 8}px`);
            b.classList.add('marquee-bounce');
        }
    });
}

function tbFiltraPicker(testo) {
    const griglia = document.getElementById('tb-picker-grid');
    if (!griglia) return;

    // Il contenuto sta per essere sostituito: chiude il tooltip e annulla quelli in attesa
    tbNascondiTooltip();

    const numeriUsati = tbStato.clausole ? tbNumeriUsati(tbStato.attivo) : new Set();
    const criterio = tbStato.ordinamento || 'bst-desc';
    const tipo = tbStato.filtroTipo || '';
    const voci = tbStato.pool
        .filter(v => pokemonCorrispondeRicerca(v, testo))
        .filter(v => !tipo || (v.sp && (v.sp.types || []).includes(tipo)))
        .sort((a, b) => tbConfrontaVoci(a, b, criterio));

    const conta = document.querySelector('.tb-picker-count');
    if (conta) {
        conta.textContent = voci.length === tbStato.pool.length
            ? `${voci.length} available`
            : `${voci.length} / ${tbStato.pool.length} available`;
    }
    griglia.innerHTML = voci.map((v, i) => {
        const base = v.sp ? tbSpecieBase(v.sp) : null;
        const bloccato = !v.sp || (base && numeriUsati.has(base.num));

        // Il title resta solo sulle card bloccate, per spiegarne il motivo.
        // Sulle altre c'è il tooltip personalizzato: con entrambi si sovrapporrebbero.
        const motivo = !v.sp
            ? 'No data available for this Pokémon'
            : (bloccato ? 'Species Clause: already in your team' : '');

        return `
            <button type="button" class="tb-pick ${bloccato ? 'disabled' : ''}" ${bloccato ? 'disabled' : ''}
                    ${motivo ? `title="${tbEsc(motivo)}"` : ''}
                    data-idx="${i}" data-nome="${tbEsc(v.nome)}"
                    onclick="tbScegliPokemon('${v.specieId}')">
                <img loading="lazy" alt="" src="https://play.pokemonshowdown.com/sprites/ani/${v.spriteId}.gif"
                     onerror="gestisciErroreSprite(this, '${v.spriteId}')">
                <span class="tb-pick-name"><span>${tbEsc(v.nome)}</span></span>
            </button>`;
    }).join('') || `<div class="tb-empty">No Pokémon found.</div>`;

    // Tooltip con delega: un solo gestore sulla griglia invece di uno per card.
    // Le assegnazioni "on..." sostituiscono quelle del render precedente, quindi non si accumulano.
    griglia.onmouseover = e => {
        const card = e.target.closest('.tb-pick');
        // contains(relatedTarget): il mouse si sta muovendo dentro la stessa card (img → nome)
        if (!card || card.disabled || card.contains(e.relatedTarget)) return;

        const v = voci[card.dataset.idx];
        const pkm = { id: v.specieId, name: v.nome };
        tbProgrammaTooltip(pkm, card, () => tbInfoPicker(v, pkm));
    };

    griglia.onmouseout = e => {
        const card = e.target.closest('.tb-pick');
        if (!card || card.contains(e.relatedTarget)) return;
        tbNascondiTooltip(voci[card.dataset.idx]?.specieId);
    };

    // Dopo la scelta di un Pokémon il tooltip non deve restare aperto
    griglia.onclick = () => tbNascondiTooltip();

    // Marquee: misura quando font e layout sono pronti
    document.fonts.ready.then(() => requestAnimationFrame(() => tbApplicaMarquee(griglia)));
}

// Mette la descrizione subito dopo il nome della mossa, dentro il rettangolo colorato.
// Il nome viene misurato con un canvas usando il font reale dell'input,
// così la posizione è giusta qualunque sia lo stile in style-box.css.
let tbCanvasMisura = null;

function tbPosizionaDescMosse() {
    if (!tbCanvasMisura) tbCanvasMisura = document.createElement('canvas');
    const ctx = tbCanvasMisura.getContext('2d');

    document.querySelectorAll('.tb-moves .tb-combo').forEach(campo => {
        const input = campo.querySelector('.tb-move');
        const desc = campo.querySelector('.tb-move-desc');
        if (!input || !desc || !input.offsetWidth) return; // campo non visibile: niente da misurare

        const cs = getComputedStyle(input);
        ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        if ('letterSpacing' in ctx) ctx.letterSpacing = cs.letterSpacing === 'normal' ? '0px' : cs.letterSpacing;

        let nome = input.value;
        if (cs.textTransform === 'uppercase') nome = nome.toUpperCase();

        const sinistra = input.offsetLeft + parseFloat(cs.borderLeftWidth) + parseFloat(cs.paddingLeft)
                       + ctx.measureText(nome).width + 10;
        let destra = campo.clientWidth - (input.offsetLeft + input.offsetWidth)
                   + parseFloat(cs.borderRightWidth) + parseFloat(cs.paddingRight);

        // Se l'icona della categoria sta sulla destra, la descrizione si ferma prima
        const icona = campo.querySelector('.tb-combo-cat');
        if (icona && icona.offsetWidth && icona.offsetLeft > input.offsetLeft + input.offsetWidth / 2) {
            destra = Math.max(destra, campo.clientWidth - icona.offsetLeft + 6);
        }

        desc.style.left = `${sinistra}px`;
        desc.style.right = `${destra}px`;
        desc.style.display = campo.clientWidth - sinistra - destra < 40 ? 'none' : ''; // troppo poco spazio: nascosta
    });
}

window.addEventListener('resize', () => requestAnimationFrame(tbPosizionaDescMosse));

function tbHtmlPannelloEV(s) {
    const sp = tbSpecie(s.specieId);

    const totaleEV = TB_STAT.reduce((t, st) => t + s.evs[st.key], 0);

    const righe = TB_STAT.map(st => {
        const base = sp.baseStats[st.key];
        let classe = '';
        if (s.natPlus === st.key) classe = 'plus';
        if (s.natMinus === st.key) classe = 'minus';

        const bottoniNatura = st.key === 'hp' || tbStato.gen < 3
            ? '<span></span>'
            : `<span class="tb-nat">

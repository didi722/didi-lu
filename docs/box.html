async function gestisciCambioFormatoHelper() {
    const select = document.getElementById('helper-format-select');
    if (!select) return;

        aggiornaBottoneBuildTeam([]); // riappare quando la nuova lista è pronta

    const selectedFormatId = select.value;
    window.currentHelperFormatId = selectedFormatId;

    const grid = document.getElementById('helper-pkm-grid');
    const countSpan = document.getElementById('helper-count');
    const infoFilters = document.getElementById('helper-dynamic-filters');

    if (infoFilters) infoFilters.innerHTML = '';

    if (!selectedFormatId) {
        if (grid) grid.innerHTML = ''; 
        if (countSpan) countSpan.textContent = '0'; 
        if (infoFilters) {
            infoFilters.innerHTML = `<div style="font-size: 0.9rem; font-weight: 700; color: #555; padding-top: 5px;">Choose a format to see available Pokémons.</div>`;
        }
        return; 
    }

    try {
        // Caricamento database base globale in cache se assente
        if (!window.pokedexBase) {
            console.log("[Helper Cache] Caricamento iniziale di pokedex_base.json...");
            const resBase = await fetch('pkm-gens/pokedex_base.json');
            if (selectedFormatId !== window.currentHelperFormatId) return;

            if (!resBase.ok) {
                if (grid) grid.innerHTML = `<div class="helper-placeholder-row" style="color: #d9534f;">❌ Critical Error: Unable to load base database.</div>`;
                throw new Error(`Missing pkm-gens/pokedex_base.json!`);
            }
            
            const pokedexBaseRaw = await resBase.json();
            window.pokedexBase = {};
            Object.keys(pokedexBaseRaw).forEach(key => {
                window.pokedexBase[key.toLowerCase().trim()] = pokedexBaseRaw[key];
            });
            console.log("[Helper Cache] Database caricato in memoria globale con successo!");
        }

        const snapshot = await db.ref(`regolamenti/${selectedFormatId}`).once('value');
        if (selectedFormatId !== window.currentHelperFormatId) return;

        const regolamento = snapshot.val();
        if (!regolamento) return;

        if (infoFilters) {
            if (regolamento.baseTier && regolamento.baseTier.toUpperCase() === "STANDARD") {
                infoFilters.innerHTML = `<div style="font-size: 0.9rem; font-weight: 700; color: #d9534f; padding-top: 5px;">⚠️ Max 2 Uber!</div>`;
            } else {
                infoFilters.innerHTML = `<div style="font-size: 0.9rem; font-weight: 700; color: #28a745; padding-top: 5px;">Format Tier: ${regolamento.baseTier ? regolamento.baseTier.toUpperCase() : 'Custom'}</div>`;
            }
        }

        const genLimite = parseInt(regolamento.genRuleValue);
        let percorsoFile = regolamento.genRuleType === "within" ? `pkm-gens/gen${genLimite}.json` : `pkm-gens/natdex-tiers.json`;

        const res = await fetch(percorsoFile);
        if (selectedFormatId !== window.currentHelperFormatId) return;
        if (!res.ok) throw new Error(`Format file not found (${percorsoFile})`);
        
        const jsonDati = await res.json(); 

        // ----------------------------------------------------
        // 🎯 GESTIONE PLAYER_INITIAL (Nome vs Cognome)
        // ----------------------------------------------------
        const restrizioneNameStarts = regolamento.restrizioni?.pokemon?.name_starts;
        
        if (restrizioneNameStarts && restrizioneNameStarts.mode === "PLAYER_INITIAL") {
            const currentUser = firebase.auth().currentUser;
            let realName = "";
            let lastName = "";

            if (currentUser) {
                const userSnap = await db.ref(`users/${currentUser.uid}`).once('value');
                if (selectedFormatId !== window.currentHelperFormatId) return;
                
                if (userSnap.exists()) {
                    const uData = userSnap.val();
                    realName = uData.real_name || "";
                    lastName = uData.last_name || "";
                }
            }

            const initNome = realName ? realName.trim().charAt(0).toUpperCase() : "";
            const initCognome = lastName ? lastName.trim().charAt(0).toUpperCase() : "";

            const inizialiUniche = new Set();
            if (initNome) inizialiUniche.add(initNome);
            if (initCognome) inizialiUniche.add(initCognome);

            const arrayIniziali = Array.from(inizialiUniche);

            // Funzione helper per applicare il filtro per lettera
            const applicaFiltroIniziale = async (lettera) => {
                const regolamentoModificato = JSON.parse(JSON.stringify(regolamento));
                regolamentoModificato.restrizioni.pokemon.name_starts = {
                    mode: "VALUE",
                    operator: "STARTS_WITH",
                    value: lettera
                };

                const risultatoFiltro = await generaListaPokémonPerFormato(regolamentoModificato, jsonDati);
                if (selectedFormatId !== window.currentHelperFormatId) return;

                if (risultatoFiltro.tipoLayout === "FLAT") {
                    renderizzaListaPiatta(risultatoFiltro.pokemon);
                    if (countSpan) countSpan.textContent = risultatoFiltro.pokemon.length;
                }
            };

            // CASO 1: Una sola iniziale disponibile
            if (arrayIniziali.length <= 1) {
                const letteraUnica = arrayIniziali[0] || "";
                if (letteraUnica) {
                    await applicaFiltroIniziale(letteraUnica);
                } else {
                    if (grid) grid.innerHTML = `<div class="helper-placeholder-row">No initial letter found for user.</div>`;
                    if (countSpan) countSpan.textContent = '0';
                }
                return;
            }

            // CASO 2: Iniziali DIVERSE - Creazione del menù a tendina
            if (arrayIniziali.length > 1) {
                // Calcolo preventivo dei Pokémon disponibili per ogni iniziale
                const conteggiIniziali = {};
                for (const lettera of arrayIniziali) {
                    const regolamentoModificato = JSON.parse(JSON.stringify(regolamento));
                    regolamentoModificato.restrizioni.pokemon.name_starts = {
                        mode: "VALUE",
                        operator: "STARTS_WITH",
                        value: lettera
                    };
                    const risultatoTemp = await generaListaPokémonPerFormato(regolamentoModificato, jsonDati);
                    if (selectedFormatId !== window.currentHelperFormatId) return;
                    conteggiIniziali[lettera] = risultatoTemp.pokemon ? risultatoTemp.pokemon.length : 0;
                }

                // Pulizia del DOM eseguita IMMEDIATAMENTE PRIMA di creare e appendere il nuovo elemento
                const oldContainer = document.getElementById('helper-player-initial-container');
                if (oldContainer) oldContainer.remove();

                const containerInitial = document.createElement('div');
                containerInitial.id = "helper-player-initial-container";
                containerInitial.style.cssText = "margin-top: 10px; display: flex; flex-direction: column; gap: 4px;";

                const labelInitial = document.createElement('label');
                labelInitial.style.cssText = "font-size: 0.85rem; font-weight: 700; color: #444;";
                labelInitial.textContent = "Select Player Initial for Pokémon names:";

                const selectInitial = document.createElement('select');
                selectInitial.id = "helper-player-initial-select";
                selectInitial.style.cssText = "padding: 6px; border: 3px solid black; box-shadow: 4px 4px 0 solid black; font-size: 0.9rem; background: #fff;";

                selectInitial.innerHTML = `<option value="">-- Choose Initial --</option>`;

                arrayIniziali.forEach(lettera => {
                    const opt = document.createElement('option');
                    opt.value = lettera;
                    opt.textContent = `${lettera}   •   ${conteggiIniziali[lettera]}`;
                    selectInitial.appendChild(opt);
                });

                containerInitial.appendChild(labelInitial);
                containerInitial.appendChild(selectInitial);
                if (infoFilters) infoFilters.appendChild(containerInitial);

                selectInitial.addEventListener('change', async () => {
                    const letteraScelta = selectInitial.value;
                    if (!letteraScelta) {
                        if (grid) grid.innerHTML = `<div class="helper-placeholder-row">Please select an initial letter above.</div>`;
                        if (countSpan) countSpan.textContent = '0';
                        return;
                    }
                    await applicaFiltroIniziale(letteraScelta);
                });

                if (grid) grid.innerHTML = `<div class="helper-placeholder-row">Please select an initial letter above.</div>`;
                if (countSpan) countSpan.textContent = '0';
                return;
            }
        }

        // ----------------------------------------------------
        // GESTIONE RESTRIZIONI SAME_ACROSS_TEAM
        // ----------------------------------------------------
        const CHIAVI_BIOLOGICHE_VALIDE = [
            'is_legendary', 'is_mythical', 'height', 'weight', 'bst', 
            'types', 'highest_stat', 'num', 'type', 'color', 'egg_group',
            'hp', 'attack', 'defense', 'sp. attack', 'sp. defense', 'speed', 'shape',
            'base_friendship', 'habitat', 'name_length', 'name_starts', 
            'evolutions_count', 'evolution_stage'
        ];

        const restrizioniPokemon = regolamento.restrizioni?.pokemon;
        const chiaviSameAcross = [];

        if (restrizioniPokemon) {
            for (const chiave in restrizioniPokemon) {
                if (Object.prototype.hasOwnProperty.call(restrizioniPokemon, chiave)) {
                    if (!CHIAVI_BIOLOGICHE_VALIDE.includes(chiave)) continue;

                    const restrizione = restrizioniPokemon[chiave];
                    if (
                        restrizione?.mode === "SAME_ACROSS_TEAM" || 
                        restrizione?.value === "SAME_ACROSS_TEAM" || 
                        restrizione?.operator === "SAME_ACROSS_TEAM"
                    ) {
                        chiaviSameAcross.push(chiave);
                    }
                }
            }
        }

        if (chiaviSameAcross.length > 0) {
            const pokedexBase = window.pokedexBase;

            const regolamentoTemporaneo = JSON.parse(JSON.stringify(regolamento));
            chiaviSameAcross.forEach(chiave => {
                delete regolamentoTemporaneo.restrizioni.pokemon[chiave];
            });

            const risultatoFiltroBase = await generaListaPokémonPerFormato(regolamentoTemporaneo, jsonDati);
            if (selectedFormatId !== window.currentHelperFormatId) return;
            const poolPokemonBase = risultatoFiltroBase.pokemon;

            const vecchioContainer = infoFilters.querySelector('#helper-same-across-container');
            if (vecchioContainer) vecchioContainer.remove();

            const containerSelettori = document.createElement('div');
            containerSelettori.id = "helper-same-across-container";
            containerSelettori.style.cssText = "margin-top: 10px; display: flex; flex-direction: column; gap: 8px;";

            const scelteUtente = {};

            chiaviSameAcross.forEach(chiave => {
                scelteUtente[chiave] = "";
                const conteggioValori = {};
                const chiaveProprietareale = (typeof normalizzaChiaveDatabase === 'function' ? normalizzaChiaveDatabase(chiave) : null) || chiave;

                poolPokemonBase.forEach(pkm => {
                    const dettagliBiologici = pokedexBase[pkm.id.toLowerCase().trim()];
                    if (dettagliBiologici) {
                        let val = dettagliBiologici[chiaveProprietareale];
                        if (val === undefined && dettagliBiologici.stats) {
                            val = dettagliBiologici.stats[chiaveProprietareale];
                        }

                        if (val !== undefined) {
                            if (chiaveProprietareale === 'height') {
                                val = Math.round(val * 100);
                            }

                            if (Array.isArray(val)) {
                                val.forEach(item => {
                                    const itemStr = String(item).trim();
                                    conteggioValori[itemStr] = (conteggioValori[itemStr] || 0) + 1;
                                });
                            } else {
                                const valStr = String(val).trim();
                                conteggioValori[valStr] = (conteggioValori[valStr] || 0) + 1;
                            }
                        }
                    }
                });

                const valoriOrdinati = Object.keys(conteggioValori).sort((a, b) => {
                    if (!isNaN(a) && !isNaN(b)) return Number(a) - Number(b);
                    return a.localeCompare(b);
                });

                const wrapperFiltro = document.createElement('div');
                wrapperFiltro.style.cssText = "display: flex; flex-direction: column; gap: 3px;";

                const configConfigurata = CONFIG_CHIAVI_HELPER[chiave] || { label: chiave.toUpperCase(), unit: "" };

                const label = document.createElement('label');
                label.style.cssText = "font-size: 0.85rem; font-weight: 700; color: #444;";
                label.textContent = `Each Pokémon in the Team must have the same ${configConfigurata.label}:`;

                const customSelect = document.createElement('select');
                customSelect.style.cssText = "padding: 6px; border: 3px solid black; box-shadow: 5px 5px 0 solid black; font-size: 0.9rem; background: #fff;";
                customSelect.innerHTML = `<option value="">Select ${configConfigurata.label}...</option>`;

                valoriOrdinati.forEach(val => {
                    const opt = document.createElement('option');
                    opt.value = val;
                    
                    const unit = configConfigurata.unit;
                    const quantita = conteggioValori[val];
                    opt.textContent = `${val}${unit}   •   ${quantita}`;
                    
                    customSelect.appendChild(opt);
                });

                customSelect.addEventListener('change', () => {
                    scelteUtente[chiave] = customSelect.value;
                    aggiornaListaPokémonSameAcross();
                });

                wrapperFiltro.appendChild(label);
                wrapperFiltro.appendChild(customSelect);
                containerSelettori.appendChild(wrapperFiltro);
            });

            if (infoFilters) infoFilters.appendChild(containerSelettori);

            function aggiornaListaPokémonSameAcross() {
                const tuttiSelezionati = chiaviSameAcross.every(chiave => scelteUtente[chiave] !== "");

                if (!tuttiSelezionati) {
                    if (grid) grid.innerHTML = `<div class="helper-placeholder-row"></div>`;
                    if (countSpan) countSpan.textContent = '0';
                    return;
                }

                const poolFiltratoFinale = poolPokemonBase.filter(pkm => {
                    const dettagliBiologici = pokedexBase[pkm.id.toLowerCase().trim()];
                    if (!dettagliBiologici) return false;

                    return chiaviSameAcross.every(chiave => {
                        const chiaveProprietareale = (typeof normalizzaChiaveDatabase === 'function' ? normalizzaChiaveDatabase(chiave) : null) || chiave;
                        
                        let valPkm = dettagliBiologici[chiaveProprietareale];
                        if (valPkm === undefined && dettagliBiologici.stats) {
                            valPkm = dettagliBiologici.stats[chiaveProprietareale];
                        }
                        
                        const sceltaUtente = scelteUtente[chiave];
                        if (valPkm === undefined) return false;

                        if (chiaveProprietareale === 'height') {
                            valPkm = Math.round(valPkm * 100);
                        }

                        if (Array.isArray(valPkm)) {
                            return valPkm.map(v => String(v).toLowerCase().trim()).includes(String(sceltaUtente).toLowerCase().trim());
                        } else {
                            if (typeof valPkm === 'number') {
                                return Math.abs(parseFloat(valPkm) - parseFloat(sceltaUtente)) < 0.001;
                            }
                            return String(valPkm).toLowerCase().trim() === String(sceltaUtente).toLowerCase().trim();
                        }
                    });
                });

                renderizzaListaPiatta(poolFiltratoFinale);
                if (countSpan) countSpan.textContent = poolFiltratoFinale.length; 
            }

            aggiornaListaPokémonSameAcross();
        } else {
            const risultatoFiltro = await generaListaPokémonPerFormato(regolamento, jsonDati);
            if (selectedFormatId !== window.currentHelperFormatId) return;

            if (risultatoFiltro.tipoLayout === "FLAT") {
                renderizzaListaPiatta(risultatoFiltro.pokemon);
                if (countSpan) countSpan.textContent = risultatoFiltro.pokemon.length;
            }
        }

    } catch (error) {
        console.error("Error running Format Helper:", error);
    }
}

async function generaListaPokémonPerFormato(regolamento, jsonDati) {
    // 🌀 1. GESTIONE DIRETTA DEL CARICAMENTO (LOADER)
    const grid = document.getElementById('helper-pkm-grid');
    const countSpan = document.getElementById('helper-count');
    
    if (grid) {
        if (countSpan) countSpan.textContent = "...";
        
        // Inseriamo la Pokéball rotante Neubrutalist nella griglia
        grid.innerHTML = `
            <div class="pokeball-loader-container">
                <div class="pokeball-spinner-builder"></div>
                <div class="loading-text-builder">Loading Pokédex...</div>
            </div>
        `;

        // Se lo stile CSS del loader non esiste ancora nella pagina, lo iniettiamo dinamicamente
        if (!document.getElementById('neubrutalist-loader-styles')) {
            const style = document.createElement('style');
            style.id = 'neubrutalist-loader-styles';
            style.innerHTML = `
                .pokeball-loader-container {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    padding: 80px 20px;
                    grid-column: 1 / -1;
                    width: 100%;
                }
                .pokeball-spinner-builder {
                    width: 60px;
                    height: 60px;
                    background: linear-gradient(to bottom, #ff3e3e 50%, #ffffff 50%);
                    border: 5px solid #000000;
                    border-radius: 50%;
                    position: relative;
                    animation: spinPokeball 1.1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
                }
                .pokeball-spinner-builder::before {
                    content: "";
                    position: absolute;
                    height: 6px;
                    width: 100%;
                    background: #000000;
                    top: 50%;
                    left: 0;
                    transform: translateY(-50%);
                }
                .pokeball-spinner-builder::after {
                    content: "";
                    position: absolute;
                    width: 16px;
                    height: 16px;
                    background: #ffffff;
                    border: 5px solid #000000;
                    border-radius: 50%;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                }
                .loading-text-builder {
                    margin-top: 20px;
                    font-size: 1.1rem;
                    font-weight: 900;
                    text-transform: uppercase;
                    letter-spacing: 2px;
                    color: #000000;
                }
                @keyframes spinPokeball {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
            `;
            document.head.appendChild(style);
        }
    }

    if (!jsonDati) {
        return { tipoLayout: "FLAT", pokemon: [] };
    }

    const genLimite = parseInt(regolamento.genRuleValue);
    const poolFiltrato = [];
    let contatoreOrdine = 0;

    const restrizioniPokemon = regolamento.restrizioni?.pokemon;
    let pokedexBase = window.pokedexBase || null;

    // 👤 RECUPERO DEL VERO NOME (real_name) DAL NODO PLAYERS/{PLAYERKEY}/INFO/REAL_NAME
    let inizialeNomeUtente = "";
    const regolaNameStarts = restrizioniPokemon?.name_starts;

    if (regolaNameStarts) {
        if (regolaNameStarts.mode === "PLAYER_INITIAL") {
            try {
                const authObj = typeof firebase !== 'undefined' && firebase.auth ? firebase.auth() : (typeof auth !== 'undefined' ? auth : null);
                const currentUser = authObj?.currentUser;
                let realNameEstratto = "";

                if (currentUser && typeof db !== 'undefined') {
                    const userSnap = await db.ref(`users/${currentUser.uid}`).once('value');
                    const userData = userSnap.val() || {};

                    const playerKey = userData.name || currentUser.displayName || currentUser.uid;

                    if (playerKey) {
                        let playerSnap = await db.ref(`players/${playerKey}/info/real_name`).once('value');
                        
                        if (!playerSnap.exists() || !playerSnap.val()) {
                            playerSnap = await db.ref(`players/${playerKey.toLowerCase()}/info/real_name`).once('value');
                        }

                        if (playerSnap.exists() && playerSnap.val()) {
                            realNameEstratto = playerSnap.val();
                        }
                    }

                    if (!realNameEstratto && userData.real_name) {
                        realNameEstratto = userData.real_name;
                    }
                }

                if (!realNameEstratto) {
                    realNameEstratto = window.currentUserRealName || 
                                       window.currentPlayer?.info?.real_name || 
                                       window.currentUser?.real_name || "";
                }

                if (realNameEstratto && typeof realNameEstratto === 'string') {
                    inizialeNomeUtente = realNameEstratto.trim().charAt(0).toLowerCase();
                } else {
                    console.warn("[Helper] Attenzione: 'real_name' non trovato per l'utente loggato.");
                }

            } catch (errUser) {
                console.error("[Helper] Errore durante il recupero di 'real_name':", errUser);
            }
        } else if (regolaNameStarts.value) {
            inizialeNomeUtente = String(regolaNameStarts.value).trim().charAt(0).toLowerCase();
        }
    }

    // 🛠️ DETERMINAZIONE PROPRIETÀ DINAMICA TIER
    const proprietaTierDinamica = regolamento.battleStyle === "doubles" ? "doubles_tier" : "single_tier";

    const deveCaricarePokedexBase = (restrizioniPokemon && Object.keys(restrizioniPokemon).length > 0) || (regolamento.strutturaSito === "custom");

    if (deveCaricarePokedexBase && !pokedexBase) {
        try {
            const resBase = await fetch('pkm-gens/pokedex_base.json');
            const pokedexBaseRaw = await resBase.json();
            pokedexBase = {};
            Object.keys(pokedexBaseRaw).forEach(key => {
                pokedexBase[key.toLowerCase().trim()] = pokedexBaseRaw[key];
            });
            window.pokedexBase = pokedexBase;
        } catch (e) {
            console.error("[Helper] Error loading pkm-gens/pokedex_base.json:", e);
        }
    }

    function valutaOperatore(valoreJson, operatore, regola) {
        const op = operatore.toLowerCase().trim();

        if (Array.isArray(valoreJson)) {
            const arrLower = valoreJson.map(v => String(v).toLowerCase().trim());
            const target = String(regola.value || '').toLowerCase().trim();
            switch (op) {
                case 'equals':
                case 'contains':
                    return arrLower.includes(target);
                case 'neq':
                    return !arrLower.includes(target);
                default:
                    return true;
            }
        }

        if (op === 'between') {
            const vMin = parseFloat(regola.min);
            const vMax = parseFloat(regola.max);
            if (isNaN(vMin) || isNaN(vMax)) return true;
            return parseFloat(valoreJson) >= vMin && parseFloat(valoreJson) <= vMax;
        }

        if (['lt', 'gt', 'lte', 'gte'].includes(op)) {
            const vFire = parseFloat(regola.value);
            const vJson = parseFloat(valoreJson);
            if (isNaN(vFire) || isNaN(vJson)) return true;
            switch (op) {
                case 'lt':  return vJson < vFire;
                case 'gt':  return vJson > vFire;
                case 'lte': return vJson <= vFire;
                case 'gte': return vJson >= vFire;
            }
        }

        const strJson = String(valoreJson).toLowerCase().trim();
        const strFire = String(regola.value || '').toLowerCase().trim();
        switch (op) {
            case 'equals':      return strJson === strFire;
            case 'neq':         return strJson !== strFire;
            case 'prefix':
            case 'starts_with': return strJson.startsWith(strFire);
            default:            return true;
        }
    }

    function controllaRestrizioniBiologiche(nomeChiave) {
        if (!pokedexBase) return true;

        const CHIAVI_BIOLOGICHE_VALIDE = [
            'is_legendary', 'is_mythical', 'height', 'weight', 'bst', 
            'types', 'highest_stat', 'num', 'type', 'color', 'egg_group',
            'hp', 'attack', 'defense', 'sp. attack', 'sp. defense', 'speed', 'shape',
            'base_friendship', 'habitat', 'name_length', 'name_starts', 
            'evolutions_count', 'evolution_stage'
        ];

        const ruleLegendary = restrizioniPokemon?.is_legendary;
        const ruleMythical = restrizioniPokemon?.is_mythical;
        
        const valLegendary = ruleLegendary?.value ? String(ruleLegendary.value).toLowerCase().trim() : '';
        const valMythical = ruleMythical?.value ? String(ruleMythical.value).toLowerCase().trim() : '';

        const onlyLegendaryActive = valLegendary === "only" || valLegendary === "only legendary";
        const onlyMythicalActive = valMythical === "only" || valMythical === "only mythical";

        let haFiltriAttivi = onlyLegendaryActive || onlyMythicalActive || (regolamento.strutturaSito === "custom");
        const operatoriValidi = ['lt', 'gt', 'lte', 'gte', 'equals', 'neq', 'between', 'starts_with', 'prefix'];
        
        if (restrizioniPokemon) {
            for (const chiave in restrizioniPokemon) {
                if (!CHIAVI_BIOLOGICHE_VALIDE.includes(chiave)) continue;
                const r = restrizioniPokemon[chiave];
                if (r) {
                    if (r.mode === "PLAYER_INITIAL" || r.value || r.operator || chiave === 'name_starts') haFiltriAttivi = true;
                    if (r.operator && r.mode !== "SAME_ACROSS_TEAM") {
                        const op = r.operator.toLowerCase().trim();
                        if (operatoriValidi.includes(op)) haFiltriAttivi = true;
                    }
                }
            }
        }

        if (!haFiltriAttivi) return true;

        let pkmDettaglio = pokedexBase[nomeChiave.toLowerCase().trim()];
        if (!pkmDettaglio) {
            const spriteId = calcolaSpriteId(nomeChiave);
            const radice = determinaRadice(nomeChiave, spriteId);
            pkmDettaglio = pokedexBase[radice.toLowerCase().trim()];
        }

        if (!pkmDettaglio) return false; 

        const isPkmLegendary = pkmDettaglio.is_legendary === true || pkmDettaglio.is_legendary === 1 || String(pkmDettaglio.is_legendary).trim() === "true";
        const isPkmMythical = pkmDettaglio.is_mythical === true || pkmDettaglio.is_mythical === 1 || String(pkmDettaglio.is_mythical).trim() === "true";

        if (regolamento.strutturaSito === "custom") {
            const ammessoLegendary = valLegendary === "allowed" || valLegendary === "only" || valLegendary === "only legendary";
            const ammessoMythical = valMythical === "allowed" || valMythical === "only" || valMythical === "only mythical";

            if (isPkmLegendary && !ammessoLegendary) return false;
            if (isPkmMythical && !ammessoMythical) return false;
        }

        if (onlyLegendaryActive || onlyMythicalActive) {
            if (onlyLegendaryActive && onlyMythicalActive) {
                if (!isPkmLegendary && !isPkmMythical) return false;
            } else if (onlyLegendaryActive) {
                if (!isPkmLegendary) return false;
            } else if (onlyMythicalActive) {
                if (!isPkmMythical) return false;
            }
        }

        if (restrizioniPokemon) {
            for (const chiaveRestrizione in restrizioniPokemon) {
                if (!CHIAVI_BIOLOGICHE_VALIDE.includes(chiaveRestrizione)) continue;
                if (chiaveRestrizione === 'is_legendary' || chiaveRestrizione === 'is_mythical') continue;

                const regola = restrizioniPokemon[chiaveRestrizione];
                if (!regola) continue;

                // 🔤 FILTRO SUPPORTO INIZIALE NOME POKÉMON (VALORE SINGOLO O PLAYER_INITIAL)
                if (chiaveRestrizione === 'name_starts') {
                    let letteraTarget = "";
                    if (regola.mode === "PLAYER_INITIAL") {
                        letteraTarget = inizialeNomeUtente;
                    } else if (regola.value) {
                        letteraTarget = String(regola.value).toLowerCase().trim();
                    }

                    if (!letteraTarget) return false; 
                    
                    const nomePkm = (pkmDettaglio.name || nomeChiave).toLowerCase().trim();
                    if (!nomePkm.startsWith(letteraTarget)) {
                        return false;
                    }
                    continue; 
                }

                if (!regola.operator || regola.mode === "SAME_ACROSS_TEAM") continue;

                const op = regola.operator.toLowerCase().trim();
                if (!operatoriValidi.includes(op)) continue;

                if (chiaveRestrizione === 'evolution_stage' && String(regola.value).toLowerCase().trim() === 'only') {
                    let evCount = pkmDettaglio['evolutions_count'];
                    if (evCount === undefined && pkmDettaglio.stats) evCount = pkmDettaglio.stats['evolutions_count'];
                    
                    let evStage = pkmDettaglio['evolution_stage'];
                    if (evStage === undefined && pkmDettaglio.stats) evStage = pkmDettaglio.stats['evolution_stage'];

                    if (Number(evCount) !== 1 || Number(evStage) !== 1) {
                        return false;
                    }
                    continue; 
                }

                const chiaveProprietareale = (typeof normalizzaChiaveDatabase === 'function' ? normalizzaChiaveDatabase(chiaveRestrizione) : null) || chiaveRestrizione;
                
                let valoreJson = pkmDettaglio[chiaveProprietareale];
                if (valoreJson === undefined && pkmDettaglio.stats) {
                    valoreJson = pkmDettaglio.stats[chiaveProprietareale];
                }
                
                if (valoreJson === undefined && chiaveProprietareale.includes('.')) {
                    valoreJson = chiaveProprietareale.split('.').reduce((obj, key) => obj?.[key], pkmDettaglio);
                }

                if (valoreJson === undefined || valoreJson === null) continue;

                if (chiaveProprietareale === 'height') {
                    valoreJson = valoreJson * 100; 
                }

                if (!valutaOperatore(valoreJson, op, regola)) return false;
            }
        }

        return true;
    }

    function escludeFormeInvalide(id) {
        const idLower = id.toLowerCase().trim();
        
        if (idLower.includes('gmax') || idLower === 'pichuspikyeared' || idLower.includes('-partner')) return false;
        if (idLower.includes('-cap-') || (idLower.startsWith('cap-') && idLower !== 'capsakid')) return false;

        const isMega = idLower.endsWith('-mega') || idLower.endsWith('-megax') || idLower.endsWith('-megay');
        const isFalsoMega = idLower === 'meganium' || idLower === 'yanmega';
        if (isMega && !isFalsoMega) {
            const rawValue = regolamento.restrizioni?.pokemon?.is_mega?.value;
            const megaAllowed = [
                true,
                "true",
                "yes",
                "allowed"
            ].includes(String(rawValue).toLowerCase().trim());

            return megaAllowed;
        }

        return true; 
    }

    function calcolaSpriteId(id) {
        const idLower = id.toLowerCase().trim();
        if (idLower.includes('-')) return idLower;
        const prefissiConTrattino = ['rotom', 'shaymin', 'kyurem', 'lycanroc', 'necrozma'];
        for (const pref of prefissiConTrattino) {
            if (idLower.startsWith(pref) && idLower !== pref) return pref + '-' + idLower.substring(pref.length);
        }
        const suffissiRegionali = ['alola', 'galar', 'hisui', 'paldea'];
        for (const suf of suffissiRegionali) {
            if (idLower.endsWith(suf) && idLower !== suf) return idLower.slice(0, -suf.length) + '-' + suf;
        }
        return idLower;
    }

    function determinaRadice(id, spriteId) {
        const idLower = id.toLowerCase().trim();
        const spriteLower = spriteId.toLowerCase().trim();
        if (idLower.includes('-')) return idLower.split('-')[0];
        if (spriteLower.includes('-')) return spriteLower.split('-')[0];
        return idLower;
    }

    function ottieniTierDaOggetto(dato, proprietaDinamica, baseTier) {
        if (!dato) return "";
        if (typeof dato === 'string') return dato.toUpperCase().trim();

        const isTargetLC = baseTier && baseTier.toUpperCase().trim() === "LC";

        if (isTargetLC) {
            const singleTier = dato.single_tier ? String(dato.single_tier).toUpperCase().trim() : "";
            const doublesTier = dato.doubles_tier ? String(dato.doubles_tier).toUpperCase().trim() : "";
            if (singleTier === "LC" || doublesTier === "LC") {
                return "LC";
            }
        }

        const tier = dato[proprietaDinamica] || "";
        return String(tier).toUpperCase().trim();
    }

    function ottieniTierMaggiore(tierA, tierB) {
        const gerarchia = {
            "": 0, "ILLEGAL": 0, "PAST": 0, "UNTIERED": 1, "LC": 2, "NFE": 3,
            "ZU": 4, "ZUBL": 5, "PU": 6, "PUBL": 7, "NU": 8, "NUBL": 9,
            "RU": 10, "RUBL": 11, "UU": 12, "UUBL": 13, "OU": 14,
            "STANDARD": 15, "UBER": 15, "UBERS": 15, "AG": 16
        };
        const tA = tierA ? tierA.toUpperCase().trim() : "";
        const tB = tierB ? tierB.toUpperCase().trim() : "";
        return (gerarchia[tA] || 0) >= (gerarchia[tB] || 0) ? tA : tB;
    }

    function controllaTierAmmessa(pkmTier, baseTier) {
        if (!baseTier) return true;
        const target = baseTier.toUpperCase().trim();
        const current = pkmTier ? pkmTier.toUpperCase().trim() : "";
        const blacklistPerTier = {
            "AG": [],
            "STANDARD": ["AG"],
            "UBER": ["AG"],
            "UBERS": ["AG"],
            "OU": ["AG", "UBER", "UBERS"],
            "UU": ["AG", "UBER", "UBERS", "OU", "UUBL"],
            "RU": ["AG", "UBER", "UBERS", "OU", "UUBL", "UU", "RUBL"],
            "NU": ["AG", "UBER", "UBERS", "OU", "UUBL", "UU", "RUBL", "RU", "NUBL"],
            "PU": ["AG", "UBER", "UBERS", "OU", "UUBL", "UU", "RUBL", "RU", "NUBL", "NU", "PUBL"],
            "ZU": ["AG", "UBER", "UBERS", "OU", "UUBL", "UU", "RUBL", "RU", "NUBL", "NU", "PUBL", "PU", "ZUBL"]
        };
        if (target === "LC") return current === "LC";
        if (target === "NFE") return current === "NFE";
        if (blacklistPerTier[target] !== undefined) return !blacklistPerTier[target].includes(current);
        return true;
    }

    if (regolamento.genRuleType === "up_to") {
        try {
            let natdexTiers = {};
            try {
                const resNatDex = await fetch('pkm-gens/natdex-tiers.json');
                natdexTiers = await resNatDex.json();
            } catch (e) {
                console.error("[Helper] Error loading pkm-gens/natdex-tiers.json:", e);
            }

            let tuttiIKnots = {};
            let genLimiteJson = {};

            for (let i = 1; i <= genLimite; i++) {
                try {
                    const resGen = await fetch(`pkm-gens/gen${i}.json`);
                    const jsonGen = await resGen.json();
                    Object.keys(jsonGen).forEach(key => {
                        const lowKey = key.toLowerCase().trim();
                        if (!tuttiIKnots[lowKey]) {
                            tuttiIKnots[lowKey] = { originalKey: key, ...jsonGen[key] };
                        } else {
                            tuttiIKnots[lowKey] = { ...tuttiIKnots[lowKey], ...jsonGen[key] };
                        }
                        
                        if (i === genLimite) {
                            genLimiteJson[lowKey] = jsonGen[key];
                        }
                    });
                } catch (errFetch) {
                    console.error(`[Helper] Impossible to load gen${i}.json:`, errFetch);
                }
            }

            Object.keys(tuttiIKnots).forEach(lowKey => {
                const nomeChiave = tuttiIKnots[lowKey].originalKey;
                if (!escludeFormeInvalide(nomeChiave)) return;

                const datoGenX = genLimiteJson[lowKey];
                let tierGenX = ottieniTierDaOggetto(datoGenX, proprietaTierDinamica, regolamento.baseTier);

                let tierFinale = tierGenX;

                if (!tierFinale || tierFinale === "PAST" || tierFinale === "ILLEGAL") {
                    const datoNatDex = natdexTiers[lowKey];
                    let tierNatDex = ottieniTierDaOggetto(datoNatDex, proprietaTierDinamica, regolamento.baseTier);

                    const isMegaReale = (nomeChiave.toLowerCase().endsWith('-mega') || 
                                         nomeChiave.toLowerCase().endsWith('-megax') || 
                                         nomeChiave.toLowerCase().endsWith('-megay'));

                    if (isMegaReale && (tierNatDex === "ILLEGAL" || !tierNatDex)) {
                        const baseKey = nomeChiave.toLowerCase().replace(/-mega[xy]?$/, '').trim();
                        const datoBaseNatDex = natdexTiers[baseKey];
                        tierNatDex = ottieniTierDaOggetto(datoBaseNatDex, proprietaTierDinamica, regolamento.baseTier);
                    }

                    tierFinale = tierNatDex;
                }

                if (!tierFinale || tierFinale === "ILLEGAL" || tierFinale === "PAST") return;
                
                if (!controllaTierAmmessa(tierFinale, regolamento.baseTier)) return;
                if (!controllaRestrizioniBiologiche(nomeChiave)) return;

                const datoGrezzo = { ...tuttiIKnots[lowKey], tier: tierFinale };
                const nomeVisualizzato = datoGrezzo.name || (nomeChiave.charAt(0).toUpperCase() + nomeChiave.slice(1));
                const spriteId = calcolaSpriteId(nomeChiave);
                const radice = determinaRadice(nomeChiave, spriteId);
                
                poolFiltrato.push({ 
                    id: nomeChiave, 
                    name: nomeVisualizzato, 
                    spriteId: spriteId, 
                    radice: radice, 
                    num: datoGrezzo.num || null, 
                    ordineIniziale: contatoreOrdine++,
                    stats: datoGrezzo.stats || null,
                    type: datoGrezzo.type || datoGrezzo.types || [],
                    abilities: datoGrezzo.abilities || []
                });
            });
        } catch (err) {
            console.error("General error in aggregating UP_TO lists:", err);
        }
    } 
    else if (regolamento.genRuleType === "within") {
        Object.keys(jsonDati).forEach(nomeChiave => {
            if (!escludeFormeInvalide(nomeChiave)) return;
            const datoGrezzo = jsonDati[nomeChiave];
            if (!datoGrezzo) return;

            let tierUpper = ottieniTierDaOggetto(datoGrezzo, proprietaTierDinamica, regolamento.baseTier);

            if (nomeChiave.toLowerCase().includes('-mega')) {
                const baseKey = nomeChiave.toLowerCase().split('-mega')[0];
                const datoBase = jsonDati[baseKey];
                const tierBase = ottieniTierDaOggetto(datoBase, proprietaTierDinamica, regolamento.baseTier);
                tierUpper = ottieniTierMaggiore(tierUpper, tierBase);
            }

            if (tierUpper === "ILLEGAL" || tierUpper === "PAST") return;
            if (!controllaTierAmmessa(tierUpper, regolamento.baseTier)) return;
            if (!controllaRestrizioniBiologiche(nomeChiave)) return;

            const nomeVisualizzato = datoGrezzo.name || (nomeChiave.charAt(0).toUpperCase() + nomeChiave.slice(1));
            const spriteId = calcolaSpriteId(nomeChiave);
            const radice = determinaRadice(nomeChiave, spriteId);

            poolFiltrato.push({ 
                id: nomeChiave, 
                name: nomeVisualizzato, 
                spriteId: spriteId, 
                radice: radice, 
                num: datoGrezzo.num || null, 
                ordineIniziale: contatoreOrdine++,
                stats: datoGrezzo.stats || null,
                type: datoGrezzo.type || datoGrezzo.types || [],
                abilities: datoGrezzo.abilities || []
            });
        });
    }

    const mappaAncoraggioRadici = {};
    poolFiltrato.forEach(pkm => {
        if (!mappaAncoraggioRadici[pkm.radice]) {
            mappaAncoraggioRadici[pkm.radice] = { num: pkm.num, ordineIniziale: pkm.ordineIniziale };
        } else {
            if (!mappaAncoraggioRadici[pkm.radice].num && pkm.num) mappaAncoraggioRadici[pkm.radice].num = pkm.num;
            if (pkm.ordineIniziale < mappaAncoraggioRadici[pkm.radice].ordineIniziale) mappaAncoraggioRadici[pkm.radice].ordineIniziale = pkm.ordineIniziale;
        }
    });

    poolFiltrato.sort((a, b) => {
        if (a.radice === b.radice) return a.ordineIniziale - b.ordineIniziale;
        const ancoraA = mappaAncoraggioRadici[a.radice];
        const ancoraB = mappaAncoraggioRadici[b.radice];
        if (ancoraA.num && ancoraB.num) return ancoraA.num - ancoraB.num;
        return ancoraA.ordineIniziale - ancoraB.ordineIniziale;
    });

    return { tipoLayout: "FLAT", pokemon: poolFiltrato };
}

        document.getElementById('helper-search-bar').value = '';

    }

    // --- FUNZIONI UTILITY DI SUPPORTO PER L'ORDINAMENTO ---
    const CHIAVI_STATS = ['hp', 'attack', 'defense', 'sp. attack', 'sp. defense', 'speed'];

    // Unico punto di lookup nel pokedexBase (usato da sort e tooltip)
    function getInfoPkm(pkm) {
        if (pkm && pkm.stats) return pkm;
        if (!window.pokedexBase) return null;
        return window.pokedexBase[String(pkm.id).toLowerCase().trim()]
            || window.pokedexBase[String(pkm.name).toLowerCase().trim()]
            || null;
    }

    function getStat(pkm, chiave) {
        const info = getInfoPkm(pkm);
        return (info && info.stats && info.stats[chiave]) || 0;
    }

    function calcolaBST(pkm) {
        return CHIAVI_STATS.reduce((tot, chiave) => tot + getStat(pkm, chiave), 0);
    }

    function getPokedexNum(pkm) {
        if (pkm.num !== undefined) return pkm.num;
        const info = getInfoPkm(pkm);
        return info && info.num !== undefined ? info.num : 9999;
    }

    // --- LOGICA CORE DI FILTRAGGIO, ORDINAMENTO E RENDERING ---
    function applicaFiltriEOrdinamento() {

        // A. FILTRAGGIO SU LISTA ORIGINALE (nome o abilità)
let listaFiltrata = grid.originalPokemonList.filter(pkm => pokemonCorrispondeRicerca(pkm, query));

        // B. ORDINAMENTO DINAMICO
        listaFiltrata.sort((a, b) => {
            // Ordinamento per singola stat (formato: "stat|chiave|direzione")
            if (criterioSort.startsWith('stat|')) {
                const [, chiave, direzione] = criterioSort.split('|');
                const diff = getStat(a, chiave) - getStat(b, chiave);
                const risultato = direzione === 'asc' ? diff : -diff;
                // A parità di stat, ordine di Pokédex
                return risultato || getPokedexNum(a) - getPokedexNum(b);
            }

            switch (criterioSort) {
                case 'num-asc':
                    return getPokedexNum(a) - getPokedexNum(b);
                case 'alpha-asc':
                    return a.name.localeCompare(b.name);
                case 'alpha-desc':
                    return b.name.localeCompare(a.name);
                case 'bst-desc':
                    return calcolaBST(b) - calcolaBST(a);
                case 'bst-asc':
                    return calcolaBST(a) - calcolaBST(b);
                default:
                    return 0;
            }
        });

        // Aggiorna il contatore in tempo reale basandosi sui risultati visibili
        if (countSpan) {
            countSpan.textContent = listaFiltrata.length;
        }

        grid.innerHTML = '';

        if (listaFiltrata.length === 0) {
            grid.innerHTML = `<div class="helper-placeholder-row">No matching Pokémon found.</div>`;
            return;
        }

        // Configurato costanti globali per il Tooltip (Invariate)
        const COLORI_TIPI = {
            normal: '#aaaa99', fire: '#ff4422', water: '#3399ff', electric: '#ffcc33',
            grass: '#77cc55', ice: '#66ccff', fighting: '#bb5544', poison: '#aa5599',
            ground: '#ddbb55', flying: '#8899ff', psychic: '#ff5599', bug: '#aabb22',
            rock: '#bbaa66', ghost: '#6666bb', dragon: '#7766ee', dark: '#775544',
            steel: '#aaaabb', fairy: '#ee99ee'
        };

        const MAPPA_STATS = {
            'hp': 'HP', 'attack': 'ATK', 'defense': 'DEF',
            'sp. attack': 'SPA', 'sp. defense': 'SPD', 'speed': 'SPE'
        };

        let tooltip = document.getElementById('global-neubrutalist-tooltip');
        if (!tooltip) {
            tooltip = document.createElement('div');
            tooltip.id = 'global-neubrutalist-tooltip';
            tooltip.className = 'neubrutalist-tooltip';
            document.body.appendChild(tooltip);
        }

        function aggiustaPosizioneTooltip(cardElement, tooltipElement) {
            const rect = cardElement.getBoundingClientRect();
            const scrollY = window.scrollY;
            const scrollX = window.scrollX;

            const cardCenter = rect.left + scrollX + (rect.width / 2);
            const tooltipWidth = tooltipElement.offsetWidth || 245;
            let tooltipLeft = cardCenter - (tooltipWidth / 2);

            if (tooltipLeft < 10) tooltipLeft = 10;
            if (tooltipLeft + tooltipWidth > window.innerWidth - 10) {
                tooltipLeft = window.innerWidth - tooltipWidth - 10;
            }
            tooltipElement.style.left = `${tooltipLeft}px`;

            const tooltipHeight = tooltipElement.offsetHeight;
            const spazioSotto = window.innerHeight - rect.bottom;
            const spazioSopra = rect.top;

            const rotazioneCorrente = tooltipElement.dataset.rotation || '0deg';
            tooltipElement.style.transform = `rotate(${rotazioneCorrente})`;

            if (spazioSotto >= tooltipHeight) {
                tooltipElement.style.top = `${rect.bottom + scrollY + 8}px`;
            } else if (spazioSopra >= tooltipHeight) {
                tooltipElement.style.top = `${rect.top + scrollY - 8 - tooltipHeight}px`;
            } else if (spazioSotto > spazioSopra) {
                tooltipElement.style.top = `${rect.bottom + scrollY + 8}px`;
            } else {
                tooltipElement.style.top = `${rect.top + scrollY - 8 - tooltipHeight}px`;
            }
        }

        // C. RENDER DELLE CARD (Ciclato esclusivamente sulla lista filtrata e ordinata)
        listaFiltrata.forEach(pkm => {
            const card = document.createElement('div');
            card.className = 'helper-pkm-card';
            card.dataset.id = pkm.id;

            let timerCaricamento;

            // Stessa normalizzazione e stesso fallback usati in renderizza()
            const pkmNameUrl = String(pkm.name || pkm.id).toLowerCase().replace(/ /g, '-').replace(/[.'é]/g, '');
            const gifUrl = `https://play.pokemonshowdown.com/sprites/ani/${pkmNameUrl}.gif`;

            card.innerHTML = `

                         onerror="gestisciErroreSprite(this, '${pkmNameUrl}')">
                </div>
                <div class="helper-pkm-name"><span>${pkm.name}</span></div>
            `;

            // MouseEnter, MouseLeave, Click ed effetti Marquee (Logiche invariate)
            card.addEventListener('mouseenter', () => {
                clearTimeout(timerCaricamento);

                timerCaricamento = setTimeout(() => {
                    tooltip.dataset.currentId = pkm.id;

                    const angoloCasuale = (Math.random() * 8 - 4).toFixed(2);
                    tooltip.dataset.rotation = `${angoloCasuale}deg`;

                    tooltip.style.display = 'block';
                    tooltip.style.opacity = '1';

                    const infoPkm = getInfoPkm(pkm);

                    if (!infoPkm || !infoPkm.stats) {
                        tooltip.innerHTML = `<div class="neubrutalist-loading" style="color:red; font-weight:bold; padding:10px;">DATA NOT FOUND</div>`;
                        aggiustaPosizioneTooltip(card, tooltip);
                        return;
                    }

                    const arrayTipi = tbTipiSincroni(pkm, infoPkm);                    const htmlTipi = arrayTipi.map(t => {
                        const tipoLower = t.toLowerCase().trim();
                        const colore = COLORI_TIPI[tipoLower] || '#777';
                        return `<span class="neubrutalist-type-badge" style="background-color: ${colore};">${tipoLower.toUpperCase()}</span>`;
                    }).join('');

                    const nomePlayerAttivo = (typeof currentPlayer !== 'undefined') ? currentPlayer.toLowerCase() : '';
                    const coloreBarraPlayer = (typeof playerColors !== 'undefined' && playerColors[nomePlayerAttivo]) ? playerColors[nomePlayerAttivo] : '#00FF66';

                    const htmlStats = Object.keys(MAPPA_STATS).map(chiaveStat => {
                        const nomeStatVisualizzato = MAPPA_STATS[chiaveStat];
                        const valore = infoPkm.stats[chiaveStat] || 0;

                        return `
                            <div class="neubrutalist-stat-row">
                                <span class="neubrutalist-stat-label">${nomeStatVisualizzato}</span>
                                <div class="neubrutalist-stat-bar-bg">
                                    <div class="neubrutalist-stat-bar-fill" style="width: ${percentualeBarra}%; background-color: var(--accent-color, ${coloreBarraPlayer});"></div>
                                </div>
                                <span class="neubrutalist-stat-value">${valore}</span>
                            </div>
                        `;
                    }).join('');

                    let arrayAbilita = [];
                    if (Array.isArray(infoPkm.abilities)) {
                        arrayAbilita = infoPkm.abilities;
                    } else if (infoPkm.abilities && typeof infoPkm.abilities === 'object') {
                        arrayAbilita = Object.values(infoPkm.abilities);
                    }

                    const htmlAbilita = arrayAbilita.map(abi => {
                        return `<span class="neubrutalist-ability-tag">${String(abi).toUpperCase()}</span>`;

                    tooltip.innerHTML = `

                            <div class="neubrutalist-tooltip-types">${htmlTipi}</div>

                            <div class="neubrutalist-abilities-container">${htmlAbilita || '<span class="neubrutalist-ability-tag" style="opacity:0.4;">UNKNOWN</span>'}</div>
                        </div>
                    `;

                                        aggiustaPosizioneTooltip(card, tooltip);

                    // Se i tipi non sono nei dati locali, li recupera dal Pokédex di Showdown
                    if (arrayTipi.length === 0) tbCompletaTipiTooltip(pkm, tooltip);
                }, 1000);
            });

            card.addEventListener('mouseleave', () => {
                clearTimeout(timerCaricamento);

                if (tooltip.dataset.currentId === pkm.id) {
                    tooltip.style.display = 'none';
                    tooltip.style.opacity = '0';
                    tooltip.dataset.currentId = '';
                    tooltip.dataset.rotation = '0deg';
                }
            });

            card.addEventListener('click', () => {
                console.log(`Selezionato dall'helper: ${pkm.name} (${pkm.id})`);
            });

            const nameContainer = card.querySelector('.helper-pkm-name');
            const nameSpan = nameContainer.querySelector('span');

                nameContainer.style.setProperty('--distanza-scorrimento', `-${overflowPixels + 8}px`);
                nameContainer.classList.add('marquee-bounce');
            }
        });
    }

    applicaFiltriEOrdinamento();

function tbToID(testo) {

        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

// "Zoroark-Hisui" → "Zoroark Hisui" (il nome di Showdown resta per l'export)
function tbNomeBello(sp, nomeRiserva = '') {
    if (!sp) {
        return String(nomeRiserva).replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }
    if (sp.baseSpecies && sp.forme) return `${sp.baseSpecies} ${sp.forme.replace(/-/g, ' ')}`;
    return sp.name;
}

function tbBST(sp) {
    if (!sp || !sp.baseStats) return 0;
    return Object.values(sp.baseStats).reduce((t, v) => t + v, 0);

// --- CARICAMENTO DATI SHOWDOWN (script caricati uno alla volta) ------
let tbCodaScript = Promise.resolve();
const tbPromesseDati = {};

function tbCaricaDatoShowdown(file, nomeGlobale) {
    if (tbPromesseDati[nomeGlobale]) return tbPromesseDati[nomeGlobale];

    const promessa = tbCodaScript.then(() => new Promise((resolve, reject) => {
        const exportsPrecedente = window.exports;
        const contenitore = {};
        window.exports = contenitore; // i file di Showdown scrivono in "exports.BattleXxx"

        const ripristina = () => {
            if (exportsPrecedente === undefined) {
                try { delete window.exports; } catch (e) { window.exports = undefined; }
            } else {
                window.exports = exportsPrecedente;
            }
        };

        const script = document.createElement('script');
        script.src = TB_URL_DATI_SHOWDOWN + file;
        script.onload = () => {
            ripristina();
            const dati = contenitore[nomeGlobale];
            dati ? resolve(dati) : reject(new Error(`${file}: data not found`));
        };
        script.onerror = () => {
            ripristina();
            reject(new Error(`Unable to load ${file}`));
        };
        document.head.appendChild(script);
    }));

    tbCodaScript = promessa.catch(() => {});
    tbPromesseDati[nomeGlobale] = promessa.catch(err => {
        delete tbPromesseDati[nomeGlobale]; // riprova al prossimo tentativo
        throw err;
    });
    return tbPromesseDati[nomeGlobale];
}

async function tbCaricaPokedex() {
    if (!tbDex.pokedex) tbDex.pokedex = await tbCaricaDatoShowdown('pokedex.js', 'BattlePokedex');
    return tbDex.pokedex;
}

async function tbCaricaTuttiDati() {
    const [pokedex, moves, items, abilities, learnsets] = await Promise.all([
        tbCaricaDatoShowdown('pokedex.js', 'BattlePokedex'),
        tbCaricaDatoShowdown('moves.js', 'BattleMovedex'),
        tbCaricaDatoShowdown('items.js', 'BattleItems'),
        tbCaricaDatoShowdown('abilities.js', 'BattleAbilities'),
        tbCaricaDatoShowdown('learnsets.js', 'BattleLearnsets')
    ]);
    Object.assign(tbDex, { pokedex, moves, items, abilities, learnsets });
}

// --- TIPI NEL TOOLTIP DELLA LISTA -----------------------------------
function tbNormalizzaTipi(valore) {
    if (!valore) return [];
    if (typeof valore === 'string') return valore.split(/[\/,]/).map(t => t.trim()).filter(Boolean);
    if (Array.isArray(valore)) return valore.map(t => String(t).trim()).filter(Boolean);
    return [];
}

function tbTipiSincroni(pkm, infoPkm) {
    const candidati = [];
    if (infoPkm) candidati.push(infoPkm.type || infoPkm.types);
    if (pkm) candidati.push(pkm.type || pkm.types);

    if (window.pokedexBase && pkm) {
        const base = window.pokedexBase[String(pkm.id).toLowerCase().trim()] ||
                     window.pokedexBase[String(pkm.name).toLowerCase().trim()];
        if (base) candidati.push(base.type || base.types);
    }

    if (tbDex.pokedex && pkm) {
        const sp = tbDex.pokedex[tbToID(pkm.id)] || tbDex.pokedex[tbToID(pkm.name)];
        if (sp) candidati.push(sp.types);
    }

    for (const c of candidati) {
        const tipi = tbNormalizzaTipi(c);
        if (tipi.length) return tipi;
    }
    return [];
}

// Se nei dati locali mancano i tipi, li prende dal Pokédex di Showdown e aggiorna il tooltip
async function tbCompletaTipiTooltip(pkm, tooltip) {
    try {
        await tbCaricaPokedex();
    } catch (err) {
        return;
    }
    if (tooltip.dataset.currentId !== String(pkm.id)) return;

    const tipi = tbTipiSincroni(pkm, null);
    const contenitore = tooltip.querySelector('.neubrutalist-tooltip-types');
    if (!tipi.length || !contenitore) return;

    contenitore.innerHTML = tipi.map(t =>
        `<span class="neubrutalist-type-badge" style="background-color: ${tbColoreTipo(t)};">${t.toUpperCase()}</span>`
    ).join('');
}

// --- SPECIE, LEARNSET, ABILITÀ, STRUMENTI ---------------------------
function tbSpecie(id) {
    return (tbDex.pokedex && tbDex.pokedex[id]) || null;
}

function tbSpriteId(sp) {
    if (!sp) return '';
    const base = tbToID(sp.baseSpecies || sp.name);
    return sp.forme && sp.baseSpecies ? `${base}-${tbToID(sp.forme)}` : tbToID(sp.name);
}

// Specie "fuori dalla lotta" (per abilità e Species Clause): Zacian-Crowned → Zacian
function tbSpecieBase(sp) {
    if (!sp) return null;
    if (sp.battleOnly) {
        const base = Array.isArray(sp.battleOnly) ? sp.battleOnly[0] : sp.battleOnly;
        return tbSpecie(tbToID(base)) || sp;
    }
    if (/^(Mega|Primal)/.test(sp.forme || '') && sp.baseSpecies) {
        return tbSpecie(tbToID(sp.baseSpecies)) || sp;
    }
    return sp;
}

// Strumento obbligatorio per alcune forme (Rusted Sword, Megapietre, Tavole di Arceus...)
function tbOggettoObbligatorio(sp) {
    if (!sp) return '';
    const lista = sp.requiredItem ? [sp.requiredItem] : (sp.requiredItems || []);
    for (const nome of lista) {
        const item = tbDex.items[tbToID(nome)];
        if (item && (item.gen || 0) <= tbStato.gen) return tbToID(nome);
    }
    return lista.length ? tbToID(lista[0]) : '';
}

// Generazione di debutto della specie (stessa logica di Showdown: le forme di Hisui sono Gen 8)
function tbGenSpecie(sp) {
    if (!sp) return 0;
    if (sp.gen) return sp.gen;
    const forme = sp.forme || '';
    const n = sp.num || 0;
    if (n < 1) {
        // forme cosmetiche senza numero (Gastrodon-East...): conta la specie base
        const base = sp.baseSpecies && tbSpecie(tbToID(sp.baseSpecies));
        return base && base !== sp ? tbGenSpecie(base) : 99;
    }
    if (n >= 906 || forme.includes('Paldea')) return 9;
    if (n >= 810 || ['Gmax', 'Galar', 'Galar-Zen', 'Hisui'].includes(forme)) return 8;
    if (n >= 722 || forme.startsWith('Alola') || forme === 'Starter') return 7;
    if (n >= 650 || /^(Mega|Primal)/.test(forme)) return 6;
    if (n >= 494) return 5;
    if (n >= 387) return 4;
    if (n >= 252) return 3;
    if (n >= 152) return 2;
    return 1;
}

// Specie che esistono già nella gen del formato ma di cui Showdown ha solo il learnset
// di una gen successiva (forme di Hisui, Wyrdeer, Kleavor, Ursaluna, Basculegion,
// Sneasler, Overqwil, Enamorus): si usa la gen più vicina con dati
function tbGenRipiegoLearnset(sp, learnset) {
    if (!sp || !learnset || tbGenSpecie(sp) > tbStato.gen) return 0;

    const genDati = Object.values(learnset)
        .flatMap(fonti => [].concat(fonti))
        .map(f => parseInt(String(f).charAt(0), 10))
        .filter(g => !isNaN(g));

    if (!genDati.length || genDati.some(g => g <= tbStato.gen)) return 0;
    return Math.min(...genDati);
}

function tbRaccogliLearnset(specieId) {
    const risultato = {};
    const visti = new Set();
    const coda = [specieId];

    while (coda.length) {
        const id = coda.shift();
        if (!id || visti.has(id)) continue;
        visti.add(id);

        const sp = tbSpecie(id);
        const voce = tbDex.learnsets[id];
        const learnset = voce && voce.learnset;
        const genRipiego = tbGenRipiegoLearnset(sp, learnset);
        let haMosse = false;

        if (learnset) {
            Object.entries(learnset).forEach(([mossa, fonti]) => {
                let lista = [].concat(fonti);
                if (genRipiego) {
                    lista = lista
                        .filter(f => parseInt(String(f).charAt(0), 10) === genRipiego)
                        .map(f => tbStato.gen + String(f).slice(1));
                    if (!lista.length) return;
                }
                haMosse = true;
                if (!risultato[mossa]) risultato[mossa] = [];
                risultato[mossa].push(...lista);
            });
        }

        if (!sp) continue;        if (sp.prevo) coda.push(tbToID(sp.prevo));
        if (sp.changesFrom) coda.push(tbToID(sp.changesFrom));
        if (sp.battleOnly) [].concat(sp.battleOnly).forEach(b => coda.push(tbToID(b)));
        if (!haMosse && sp.baseSpecies && tbToID(sp.baseSpecies) !== id) coda.push(tbToID(sp.baseSpecies));
    }

    return risultato;
}

// "9M", "8L20", "7E"... → la prima cifra è la generazione
function tbFonteValida(fonte) {
    const s = String(fonte);
    const generazioni = /^\d+$/.test(s) ? s.split('').map(Number) : [parseInt(s.charAt(0), 10)];
    return generazioni.some(g => !isNaN(g) && (tbStato.within ? g === tbStato.gen : g <= tbStato.gen));
}

function tbGenMossa(m) {
    const n = m.num || 0;
    // Mosse di Leggende Arceus (Dire Claw → Take Heart): Showdown le conta di Gen 9,
    // qui valgono come Gen 8, coerentemente con le forme di Hisui
    if (n >= 827 && n <= 850 && !m.isMax && !m.isZ) return 8;
    if (m.gen) return m.gen;if (n >= 827) return 9;
    if (n >= 743) return 8;
    if (n >= 622) return 7;
    if (n >= 560) return 6;
    if (n >= 468) return 5;
    if (n >= 355) return 4;
    if (n >= 252) return 3;
    if (n >= 166) return 2;
    return 1;
}

function tbGenAbilita(nome) {
    const a = tbDex.abilities[tbToID(nome)];
    if (!a) return 3;
    if (a.gen) return a.gen;
    const n = a.num || 0;
    if (n >= 268) return 9;
    if (n >= 234) return 8;
    if (n >= 192) return 7;
    if (n >= 165) return 6;
    if (n >= 124) return 5;
    if (n >= 77) return 4;
    return 3;
}

// Valori della mossa con gli stessi nomi usati dal validatore del sito
function tbValoriMossa(m) {
    return {
        power: m.basePower || 0,
        category: m.category,
        type: m.type,
        max_pp: m.pp || 0,
        accuracy: m.accuracy === true ? 100 : (m.accuracy || 100),
        priority: m.priority || 0,
        is_protect: TB_MOSSE_PROTECT.includes(tbToID(m.name)),
        is_contact: !!(m.flags && m.flags.contact),
        sound_based: !!(m.flags && m.flags.sound),
        punch: !!(m.flags && m.flags.punch),
        healing: !!(m.flags && m.flags.heal) && m.category === 'Status'
    };
}

function tbMossaAmmessaDalFormato(m) {
    if (!m || !m.name) return false;
    if (m.isZ || m.isMax) return false;
    if (['CAP', 'LGPE', 'Custom', 'Unobtainable', 'Future', 'Gigantamax'].includes(m.isNonstandard)) return false;
    if (tbStato.within && tbStato.gen === 9 && m.isNonstandard === 'Past') return false;

    const regole = tbStato.regolamento?.restrizioni?.mosse;
    if (!regole) return true;

    const valori = tbValoriMossa(m);
    return Object.entries(regole).every(([campo, regola]) => {
        if (!regola || !(campo in valori)) return true;
        if (regola.mode === 'SPECIFIC' && typeof validaSingoloOperatore === 'function') {
            return validaSingoloOperatore(valori[campo], regola);
        }
        if (regola.mode === 'BANNED') return valori[campo] !== true;
        return true;
    });
}

function tbMosseLegali(specieId) {
    if (tbStato.cacheMosse[specieId]) return tbStato.cacheMosse[specieId];

    const learnset = tbRaccogliLearnset(specieId);
    let ids;

    if (learnset.sketch && learnset.sketch.some(tbFonteValida)) {
        // Smeargle: Sketch permette qualsiasi mossa esistente nella generazione
        ids = Object.keys(tbDex.moves).filter(id => tbGenMossa(tbDex.moves[id]) <= tbStato.gen && id !== 'struggle' && id !== 'chatter');
    } else {
        ids = Object.keys(learnset).filter(id =>
            learnset[id].some(tbFonteValida) &&
            (!tbDex.moves[id] || tbGenMossa(tbDex.moves[id]) <= tbStato.gen)
        );    }

    const legali = ids
        .map(id => tbDex.moves[id] ? { id, dati: tbDex.moves[id] } : null)
        .filter(m => m && tbMossaAmmessaDalFormato(m.dati))
        .sort((a, b) => a.dati.name.localeCompare(b.dati.name));

    tbStato.cacheMosse[specieId] = legali;
    return legali;
}

function tbAbilitaLegali(spBase) {
    if (!spBase || tbStato.gen < 3) return [];
    const abilita = spBase.abilities || {};
    const nomi = ['0', '1', 'H', 'S']
        .filter(k => abilita[k])
        .filter(k => !(k === 'H' && tbStato.gen < 5))
        .map(k => abilita[k])
        .filter(nome => tbGenAbilita(nome) <= tbStato.gen);
    return [...new Set(nomi)];
}

function tbOggettiLegali() {
    if (tbStato.oggetti) return tbStato.oggetti;
    if (tbStato.gen < 2) return (tbStato.oggetti = []);

    const valoreMega = tbStato.regolamento?.restrizioni?.pokemon?.is_mega?.value;
    const megaAmmesse = ['true', 'yes', 'allowed'].includes(String(valoreMega).toLowerCase().trim());
    const regoleStrumenti = tbStato.regolamento?.restrizioni?.strumenti || {};
    const regolaBacche = regoleStrumenti.is_berry;

    tbStato.oggetti = Object.entries(tbDex.items)
        .filter(([id, it]) => {
            if (!it || !it.name) return false;
            if ((it.gen || 0) > tbStato.gen) return false;
            if (['CAP', 'LGPE', 'Custom', 'Unobtainable', 'Future'].includes(it.isNonstandard)) return false;
            if (it.isPokeball) return false;
            if (it.zMove && tbStato.gen !== 7) return false;
            if (it.megaStone && (!megaAmmesse || tbStato.gen < 6)) return false;
            if (tbStato.within && tbStato.gen === 9 && it.isNonstandard === 'Past') return false;

            if (regolaBacche) {
                if (regolaBacche.mode === 'BANNED' && it.isBerry) return false;
                if (regolaBacche.mode === 'SPECIFIC' && typeof validaSingoloOperatore === 'function' &&
                    !validaSingoloOperatore(!!it.isBerry, regolaBacche)) return false;
            }
            return true;
        })
        .map(([id, it]) => ({ id, nome: it.name }))
        .sort((a, b) => a.nome.localeCompare(b.nome));

    return tbStato.oggetti;
}

// --- NATURA (stile Showdown: + e − sulle statistiche) ----------------
function tbNatureAmmesse() {
    const regola = tbStato.regolamento?.restrizioni?.pokemon?.nature;
    const tutte = Object.keys(TB_NATURE);
    if (regola && regola.mode === 'SPECIFIC' && regola.value && (!regola.operator || regola.operator === 'equals')) {
        const filtrate = tutte.filter(n => n.toLowerCase() === String(regola.value).toLowerCase().trim());
        if (filtrate.length) return filtrate;
    }
    return tutte;
}

function tbNaturaImposta() {
    const ammesse = tbNatureAmmesse();
    return ammesse.length === 1 ? ammesse[0] : '';
}

function tbTrovaNatura(plus, minus) {
    if (!plus || !minus || plus === minus) return '';
    return Object.keys(TB_NATURE).find(n => TB_NATURE[n] && TB_NATURE[n][0] === plus && TB_NATURE[n][1] === minus) || '';
}

function tbEtichettaNatura(s) {
    const eff = TB_NATURE[s.natura];
    if (!eff) return `${s.natura} (neutral)`;
    const lab = k => TB_STAT.find(x => x.key === k).label;
    return `${s.natura} (+${lab(eff[0])}, −${lab(eff[1])})`;
}

function tbImpostaNatura(tipo, chiave) {
    const s = tbStato.slot[tbStato.attivo];
    if (!s || tbNaturaImposta()) return;

    if (tipo === 'plus') {
        s.natPlus = s.natPlus === chiave ? '' : chiave;
        if (s.natMinus === s.natPlus) s.natMinus = '';
    } else {
        s.natMinus = s.natMinus === chiave ? '' : chiave;
        if (s.natPlus === s.natMinus) s.natPlus = '';
    }
    s.natura = tbTrovaNatura(s.natPlus, s.natMinus) || 'Serious';

    const pannello = document.getElementById('tb-ev-panel');
    if (pannello) pannello.innerHTML = tbHtmlPannelloEV(s);
    tbRenderLeggero();
}

// --- DEBOLEZZE E RESISTENZE ------------------------------------------
function tbTipiAttaccanti() {
    return tbStato.gen >= 6 ? TB_TIPI : TB_TIPI.filter(t => t !== 'Fairy');
}

function tbMoltiplicatore(attacco, tipiDifesa, abilita) {
    let mult = 1;
    tipiDifesa.forEach(dif => {
        const tabella = TB_DIFESE[dif];
        if (!tabella) return;
        let [deboli, resiste, immune] = tabella;
        if (tbStato.gen < 6 && dif === 'Steel') resiste = [...resiste, 'Ghost', 'Dark'];
        if (immune.includes(attacco)) mult *= 0;
        else if (deboli.includes(attacco)) mult *= 2;
        else if (resiste.includes(attacco)) mult *= 0.5;
    });
    const mod = TB_ABILITA_DIFENSIVE[tbToID(abilita)];
    if (mod && mod[attacco] !== undefined && mult !== 0) mult *= mod[attacco];
    return mult;
}

function tbHtmlEfficacia(tipiDifesa, abilita) {
    const gruppi = { 4: [], 2: [], 0.5: [], 0.25: [], 0: [] };
    tbTipiAttaccanti().forEach(t => {
        const m = tbMoltiplicatore(t, tipiDifesa, abilita);
        if (m >= 4) gruppi[4].push(t);
        else if (m >= 2) gruppi[2].push(t);
        else if (m === 0) gruppi[0].push(t);
        else if (m <= 0.25) gruppi[0.25].push(t);
        else if (m < 1) gruppi[0.5].push(t);
    });

    const badge = lista => `<div class="eff-badge-container">${lista.map(t =>
        `<span class="mini-type-badge ${t.toLowerCase()}">${t.toLowerCase()}</span>`).join('')}</div>`;

    let html = '';
    if (gruppi[4].length)    html += `<div class="eff-section"><span class="eff-title v-4">4x</span>${badge(gruppi[4])}</div>`;
    if (gruppi[2].length)    html += `<div class="eff-section"><span class="eff-title v-2">2x</span>${badge(gruppi[2])}</div>`;
    if (gruppi[0.5].length)  html += `<div class="eff-section"><span class="eff-title v-05">0.5x</span>${badge(gruppi[0.5])}</div>`;
    if (gruppi[0.25].length) html += `<div class="eff-section"><span class="eff-title v-025">0.25x</span>${badge(gruppi[0.25])}</div>`;
    if (gruppi[0].length)    html += `<div class="eff-section"><span class="eff-title v-0">0x</span>${badge(gruppi[0])}</div>`;
    if (TB_ABILITA_DIFENSIVE[tbToID(abilita)]) html += `<div class="tb-eff-note">Includes ${tbEsc(abilita)}</div>`;
    return html;
}

function tbCalcolaCopertura() {
    const pieni = tbStato.slot.filter(Boolean);
    if (!pieni.length) {
        return { pieni: 0, critici: [], html: `<div class="tb-placeholder">Add Pokémon to see the team's weaknesses and resistances.</div>` };
    }

    const critici = [];
    const celle = tbTipiAttaccanti().map(t => {
        let deboli = 0, x4 = 0, resiste = 0, immune = 0;
        pieni.forEach(s => {
            const sp = tbSpecie(s.specieId);
            const m = tbMoltiplicatore(t, sp.types || [], s.abilita);
            if (m === 0) immune++;
            else if (m > 1) { deboli++; if (m >= 4) x4++; }
            else if (m < 1) resiste++;
        });

        const coperti = resiste + immune;
        let stato = '';
        if (deboli >= 3 || (deboli >= 2 && deboli - coperti >= 2)) stato = 'critical';
        else if (deboli >= 2 && coperti === 0) stato = 'warning';
        else if (deboli === 0 && coperti >= 2) stato = 'strong';
        if (stato === 'critical') critici.push(t);

        return `
            <div class="tb-cov-cell ${stato}">
                <span class="mini-type-badge ${t.toLowerCase()}">${t.toLowerCase()}</span>
                <div class="tb-cov-nums">
                    <span class="tb-cov-w ${deboli ? '' : 'zero'}" title="Weak">▼ ${deboli}${x4 ? `<small> (${x4}×4)</small>` : ''}</span>
                    <span class="tb-cov-r ${resiste ? '' : 'zero'}" title="Resists">▲ ${resiste}</span>
                    <span class="tb-cov-i ${immune ? '' : 'zero'}" title="Immune">✕ ${immune}</span>
                </div>
            </div>`;
    }).join('');

    const sintesi = critici.length
        ? `<div class="tb-cov-summary bad">⚠ Critical weaknesses: ${critici.join(', ')}</div>`
        : `<div class="tb-cov-summary good">✔ No critical weaknesses</div>`;

    return {
        pieni: pieni.length,
        critici,
        html: `
            ${sintesi}
            <div class="tb-cov-grid">${celle}</div>
            <div class="tb-cov-legend">▼ weak · ▲ resists · ✕ immune — red: too many weaknesses · orange: weak with no answers · green: well covered</div>`
    };
}

// Bottoni Copy / Save e tag delle debolezze (in colonna nell'editor, in riga nella scelta Pokémon)
function tbHtmlAzioni(variante) {
    return `
        <div class="tb-actions ${variante === 'riga' ? 'tb-actions-row' : ''}">
            <button type="button" id="tb-btn-copy" class="tb-btn tb-btn-copy" onclick="tbCopiaShowdown()">Copy Showdown</button>
            <div class="tb-save-wrap" id="tb-save-wrap">
